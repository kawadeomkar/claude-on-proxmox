---
# After converge and idempotence, which left Claude Code and gh both signed out:
# the two sign-ins just deploy and just login --only claude / just login --only github run,
# against the container, with stand-ins for the two vendors.
#
# Claude first. The converge prepared Remote Control and left it stopped, with
# the path unit waiting for a login. The real claude would need claude.ai and a
# browser, so tests/molecule/fake_claude.sh takes its place on dev's PATH, and
# claude_login.yml signs in with the code given instead of the prompt. Its role
# then starts Remote Control for real under systemd, waits out the stay-up
# check, and retires the path unit; verify.yml asserts what that leaves.
- name: Assert the converge left Claude signed out, with the path unit waiting
  hosts: claude_vms
  become: true
  tasks:
    - name: Read the state of the service and of the path unit
      ansible.builtin.command:
        argv: [systemctl, "{{ item.0 }}", "{{ item.1 }}"]
      loop:
        - [is-active, claude-remote-control.service]
        - [is-enabled, claude-remote-control.service]
        - [is-active, claude-remote-control.path]
        - [is-enabled, claude-remote-control.path]
      register: side_effect_units
      changed_when: false
      failed_when: false

    - name: Stat the login
      ansible.builtin.stat:
        path: /home/dev/.claude/.credentials.json
      register: side_effect_login

    - name: Assert the service waits, stopped, for the login the path unit watches for
      ansible.builtin.assert:
        that:
          - side_effect_units.results | map(attribute='stdout') | map('trim') | list
            == ['inactive', 'disabled', 'active', 'enabled']
          - not side_effect_login.stat.exists
        fail_msg: "{{ side_effect_units.results | map(attribute='stdout') | list }}"
        quiet: true

# just code's session handoff against the Claude Code the converge installed,
# since verify.yml only meets the stand-in: a release that files, records or
# resumes sessions otherwise fails here first (docs/architecture/lifecycle.md
# §4.9). One Claude configuration directory stands for the laptop, another for
# the VM. The real claude makes two sessions in a checkout of the laptop's, one
# of them in a Claude worktree and bound to it, against a stand-in Messages API
# on 127.0.0.1 that answers and records what it is sent; claude_sessions_copy
# writes the VM's copies, under the laptop's folder name; then claude in the
# VM's checkout resumes each. The laptop's checkout and worktree are still
# there, the hardest case: a copy left bound refuses to resume into them.
# Last, the copy continued there, saved as just destroy saves one, resumes by
# its path from the laptop's checkout, as the save's sessions.json says.
# just status inside the VM, as the converge left it: the real claude of the native installer, no login, Remote
# Control waiting for one, gh signed out, Tailscale joined with the stand-in. With discovery off it reads the
# container as configure reached it - no Proxmox here - and only the sections that read the VM.
- name: Report on the container the way just status does
  ansible.builtin.import_playbook: ../../playbooks/status.yml
  vars:
    status_report_file: ""
    status_only: access,sign-ins,system

- name: Assert what just status read inside the container
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert the report is what the converge left
      vars:
        side_effect_status_vm: "{{ status_report.vms | selectattr('name', 'equalto', 'claude-dev') | first }}"
        side_effect_status_ssh: "{{ side_effect_status_vm.ssh }}"
        side_effect_status_items: >-
          {{ status_report.attention | selectattr('vm', 'equalto', 'claude-dev') | map(attribute='source') | list }}
      ansible.builtin.assert:
        that:
          - side_effect_status_ssh.reached
          # The version from where the native installer's link points: status never runs claude.
          - side_effect_status_ssh.claude.installed
          - side_effect_status_ssh.claude.version is match('^[0-9]+[.][0-9]+[.][0-9]+')
          - not side_effect_status_ssh.claude.login_stored
          - side_effect_status_ssh.claude.service.LoadState == 'loaded'
          - side_effect_status_ssh.claude.path_unit.ActiveState == 'active'
          - not side_effect_status_ssh.github.signed_in
          - not side_effect_status_ssh.github.unchecked
          - side_effect_status_ssh.tailscale.case == 'Running'
          - side_effect_status_ssh.system.os is match('^Ubuntu 24[.]04')
          - side_effect_status_ssh.system.upgrades is number
          - side_effect_status_ssh.unread.values() | select | list == []
          # The two sign-ins to make, in the roles' own words, and nothing else wrong.
          - "'claude_code' in side_effect_status_items and 'github_projects' in side_effect_status_items"
          - status_report.counts.unread == 0 and status_report.counts.problem == 0
        fail_msg: "just status inside the container produced {{ status_report | to_json }}"
        quiet: true

- name: Resume a session copied as just code copies one, with the real claude
  hosts: claude_vms
  become: true
  become_user: dev
  vars:
    side_effect_handoff_dir: /home/dev/handoff
    side_effect_handoff_laptop: /home/dev/handoff/laptop/demo
    side_effect_handoff_worktree: /home/dev/handoff/laptop/demo/.claude/worktrees/fix
    side_effect_handoff_checkout: /home/dev/handoff/vm/demo
    side_effect_handoff_api: /home/dev/handoff/requests.jsonl
    # Where just destroy would save it on the laptop: <destroy_sessions_dir>/<vm>-<time>/projects/<folder>/<id>.jsonl.
    side_effect_handoff_saved: >-
      /home/dev/handoff/saved/claude-dev-20261023-150000/projects/{{ side_effect_handoff_folder }}/{{ side_effect_handoff_ids[0] }}.jsonl
    # The folder Claude Code files each directory's sessions under.
    side_effect_handoff_folder: "{{ side_effect_handoff_laptop | claude_project_folder }}"
    side_effect_handoff_wt_folder: "{{ side_effect_handoff_worktree | claude_project_folder }}"
    side_effect_handoff_memory: >-
      {{ side_effect_handoff_dir }}/vm-claude/projects/{{ side_effect_handoff_checkout | claude_project_folder }}/memory/
    # A claude of its own: the stand-in API, a fake key, and nothing reaching the network.
    side_effect_handoff_env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:18431
      ANTHROPIC_API_KEY: sk-ant-stand-in
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    side_effect_handoff_claude: /home/dev/.local/bin/claude
  tasks:
    # With pipelining (.config/molecule/config.yml) the lineinfile below is the
    # first module run as dev that needs dev's remote_tmp, and warned that it
    # made it: made first, as configure.yml makes root's.
    - name: Make dev's Ansible temporary directory
      ansible.builtin.import_tasks: ../../playbooks/tasks/remote_tmp.yml

    - name: Make the laptop's checkout with a worktree folder, and the VM's
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ side_effect_handoff_worktree }}"
        - "{{ side_effect_handoff_checkout }}"

    - name: Make both git checkouts
      ansible.builtin.command:
        argv: [git, -C, "{{ item }}", init, --quiet, --initial-branch, main]
        creates: "{{ item }}/.git"
      environment: "{{ side_effect_handoff_env }}"
      loop:
        - "{{ side_effect_handoff_laptop }}"
        - "{{ side_effect_handoff_checkout }}"

    - name: Give the laptop's checkout a commit
      ansible.builtin.command:
        argv: [git, -C, "{{ side_effect_handoff_laptop }}", -c, user.name=Dev, -c, user.email=dev@example.com,
               commit, --quiet, --allow-empty, -m, first]
      environment: "{{ side_effect_handoff_env }}"
      changed_when: true

    - name: Put the stand-in Messages API in place
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tests/molecule/fake_anthropic_api.py"
        dest: "{{ side_effect_handoff_dir }}/fake_anthropic_api.py"
        mode: "0755"

    - name: Start the stand-in Messages API
      ansible.builtin.command:
        argv: [python3, "{{ side_effect_handoff_dir }}/fake_anthropic_api.py", "18431", "{{ side_effect_handoff_api }}"]
      async: 600
      poll: 0
      register: side_effect_handoff_server
      changed_when: false

    - name: Wait for the stand-in Messages API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 18431
        timeout: 30

    # One in the checkout, one in the worktree folder, as a laptop's are.
    - name: Make two sessions on the laptop
      ansible.builtin.command:
        argv: ["{{ side_effect_handoff_claude }}", -p, --output-format, json, "Remember the word HANDOFF-ONE."]
        chdir: "{{ item }}"
      environment: "{{ side_effect_handoff_env | combine({'CLAUDE_CONFIG_DIR': side_effect_handoff_dir ~ '/laptop-claude'}) }}"
      register: side_effect_handoff_made
      changed_when: false
      loop:
        - "{{ side_effect_handoff_laptop }}"
        - "{{ side_effect_handoff_worktree }}"

    - name: Keep the sessions' IDs
      ansible.builtin.set_fact:
        side_effect_handoff_ids: "{{ side_effect_handoff_made.results | map(attribute='stdout') | map('from_json') | map(attribute='session_id') | list }}"

    # The binding a session made in a worktree ends with, as Claude Code 2.1.308 writes it.
    - name: Bind the worktree session to its worktree
      ansible.builtin.lineinfile:
        path: "{{ side_effect_handoff_dir }}/laptop-claude/projects/{{ side_effect_handoff_wt_folder }}/{{ side_effect_handoff_ids[1] }}.jsonl"
        insertafter: EOF
        line: >-
          {{ {'type': 'worktree-state', 'sessionId': side_effect_handoff_ids[1],
              'worktreeSession': {'originalCwd': side_effect_handoff_laptop, 'preEnterOriginalCwd': side_effect_handoff_laptop,
                                  'worktreePath': side_effect_handoff_worktree, 'worktreeName': 'fix',
                                  'worktreeBranch': 'worktree-fix', 'originalBranch': 'main',
                                  'originalHeadCommit': '0000000000000000000000000000000000000000',
                                  'sessionId': side_effect_handoff_ids[1]}} | to_json(separators=[',', ':']) }}

    - name: Read the sessions as just code reads them on the laptop
      claude_sessions_info:
        path: "{{ side_effect_handoff_dir }}/laptop-claude"
        days: 30
      register: side_effect_handoff_found

    - name: Assert each records where it ran
      ansible.builtin.assert:
        that:
          - side_effect_handoff_found.sessions | map(attribute='cwd') | sort
            == [side_effect_handoff_laptop, side_effect_handoff_worktree] | sort
          - side_effect_handoff_found.sessions | map(attribute='conversation') | unique == [true]
        fail_msg: "{{ side_effect_handoff_found.sessions | to_json }}"
        quiet: true

    - name: Keep an unedited copy of the bound session
      ansible.builtin.copy:
        src: "{{ side_effect_handoff_dir }}/laptop-claude/projects/{{ side_effect_handoff_wt_folder }}/{{ side_effect_handoff_ids[1] }}.jsonl"
        dest: "{{ side_effect_handoff_dir }}/raw-claude/projects/{{ side_effect_handoff_wt_folder }}/"
        remote_src: true
        mode: "0600"
        directory_mode: "0700"

    - name: Write the VM's copies
      claude_sessions_copy:
        mirror: "{{ side_effect_handoff_dir }}/laptop-claude/projects"
        dest: "{{ side_effect_handoff_dir }}/vm-claude"
        manifest: "{{ side_effect_handoff_dir }}/manifest.json"
        here: "{{ side_effect_handoff_dir }}/laptop-claude"
        prune: false
        sessions:
          - {id: "{{ side_effect_handoff_ids[0] }}", folder: "{{ side_effect_handoff_folder }}",
             checkout: "{{ side_effect_handoff_checkout }}", memory: "{{ side_effect_handoff_memory }}"}
          - {id: "{{ side_effect_handoff_ids[1] }}", folder: "{{ side_effect_handoff_wt_folder }}",
             checkout: "{{ side_effect_handoff_checkout }}", memory: "{{ side_effect_handoff_memory }}"}
      register: side_effect_handoff_copied

    - name: Read the copy of the session made in the checkout
      ansible.builtin.slurp:
        src: "{{ side_effect_handoff_dir }}/vm-claude/projects/{{ side_effect_handoff_folder }}/{{ side_effect_handoff_ids[0] }}.jsonl"
      register: side_effect_handoff_copy

    - name: Count what the stand-in has been sent
      ansible.builtin.command:
        argv: [wc, -l, "{{ side_effect_handoff_api }}"]
      register: side_effect_handoff_before
      changed_when: false

    # Each from the VM's checkout: the session, then --continue there, the bound
    # copy, and the bound one left unedited.
    - name: Resume the copies in the VM's checkout
      ansible.builtin.command:
        argv: "{{ [side_effect_handoff_claude, '-p', '--output-format', 'json'] + item.args + ['And now, HANDOFF-TWO?'] }}"
        chdir: "{{ side_effect_handoff_checkout }}"
      environment: "{{ side_effect_handoff_env | combine({'CLAUDE_CONFIG_DIR': side_effect_handoff_dir ~ '/' ~ item.dir}) }}"
      register: side_effect_handoff_resumed
      changed_when: false
      failed_when: false
      loop:
        - {dir: vm-claude, args: [--resume, "{{ side_effect_handoff_ids[0] }}"]}
        - {dir: vm-claude, args: [--continue]}
        - {dir: vm-claude, args: [--resume, "{{ side_effect_handoff_ids[1] }}"]}
        - {dir: raw-claude, args: [--resume, "{{ side_effect_handoff_ids[1] }}"]}

    - name: Read what the stand-in was sent
      ansible.builtin.slurp:
        src: "{{ side_effect_handoff_api }}"
      register: side_effect_handoff_sent

    - name: Assert the copy resumed as the VM's own, and nothing else picked it up
      vars:
        # The requests that carry each run's question, in the order the runs went.
        side_effect_handoff_asked: >-
          {{ (side_effect_handoff_sent.content | b64decode).splitlines()[side_effect_handoff_before.stdout.split()[0] | int:]
             | select('search', 'HANDOFF-TWO') | map('from_json') | list }}
        side_effect_handoff_runs: "{{ side_effect_handoff_resumed.results }}"
        # Claude Code's records of the requests the laptop sent, kept in the copy as they are.
        side_effect_handoff_records: >-
          {{ (side_effect_handoff_copy.content | b64decode).splitlines() | select('search', '"type":"api-request-shape"') | list }}
      ansible.builtin.assert:
        that:
          - side_effect_handoff_copied.written | sort == side_effect_handoff_ids | sort
          # They still name the laptop's memory folder, and the resume below sends the VM's: it sends the
          # recorded prompt, never them.
          - side_effect_handoff_records | select('search', '/laptop-claude/projects/') | list | length > 0
          # The session, under its own ID, its history and the VM's memory folder sent, never the laptop's.
          - side_effect_handoff_runs[0].rc == 0
          - (side_effect_handoff_runs[0].stdout | from_json).session_id == side_effect_handoff_ids[0]
          - side_effect_handoff_asked[0].messages | string is search('HANDOFF-ONE')
          - side_effect_handoff_asked[0].system | string is search(side_effect_handoff_memory | regex_escape)
          - not (side_effect_handoff_asked[0].system | string is search('/laptop-claude/'))
          # --continue in the checkout starts afresh: the copy is filed under the laptop's folder.
          - side_effect_handoff_runs[1].rc == 0
          - (side_effect_handoff_runs[1].stdout | from_json).session_id not in side_effect_handoff_ids
          - not (side_effect_handoff_asked[1].messages | string is search('HANDOFF-ONE'))
          # The bound session resumes once its binding is cleared, and refuses without that.
          - side_effect_handoff_runs[2].rc == 0
          - (side_effect_handoff_runs[2].stdout | from_json).session_id == side_effect_handoff_ids[1]
          - side_effect_handoff_runs[3].rc != 0
          - (side_effect_handoff_runs[3].stdout ~ side_effect_handoff_runs[3].stderr) is search('worktree')
        fail_msg: >-
          {{ side_effect_handoff_runs | map(attribute='rc') | list }}
          {{ side_effect_handoff_runs | map(attribute='stderr') | map('truncate', 300) | list }}
        quiet: true

    # Then back, as just destroy saves a session continued on the VM: the
    # transcript where it lies, outside any Claude configuration directory, and
    # resumed by its path from the laptop's checkout, as its sessions.json says.
    - name: Make a folder for the saved session, as just destroy does
      ansible.builtin.file:
        path: "{{ side_effect_handoff_saved | dirname }}"
        state: directory
        mode: "0700"

    - name: Save the copy continued on the VM
      ansible.builtin.copy:
        src: "{{ side_effect_handoff_dir }}/vm-claude/projects/{{ side_effect_handoff_folder }}/{{ side_effect_handoff_ids[0] }}.jsonl"
        dest: "{{ side_effect_handoff_saved }}"
        remote_src: true
        mode: "0600"

    - name: Resume the saved session by its path
      ansible.builtin.command:
        argv:
          - "{{ side_effect_handoff_claude }}"
          - -p
          - --output-format
          - json
          - --resume
          - "{{ side_effect_handoff_saved }}"
          - And last, HANDOFF-THREE?
        chdir: "{{ side_effect_handoff_laptop }}"
      environment: "{{ side_effect_handoff_env | combine({'CLAUDE_CONFIG_DIR': side_effect_handoff_dir ~ '/after-claude'}) }}"
      register: side_effect_handoff_by_path
      changed_when: false
      failed_when: false

    - name: Read what the stand-in was sent, and the saved transcript
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ side_effect_handoff_api }}"
        - "{{ side_effect_handoff_saved }}"
      register: side_effect_handoff_after

    - name: Look for a transcript of the session in the configuration directory it resumed with
      ansible.builtin.find:
        paths: "{{ side_effect_handoff_dir }}/after-claude/projects"
        patterns: "{{ side_effect_handoff_ids[0] }}.jsonl"
        recurse: true
      register: side_effect_handoff_elsewhere

    - name: Assert the saved session resumed where it lies, with all it was told on both machines
      vars:
        side_effect_handoff_last: >-
          {{ (side_effect_handoff_after.results[0].content | b64decode).splitlines()
             | select('search', 'HANDOFF-THREE') | map('from_json') | list }}
      ansible.builtin.assert:
        that:
          - side_effect_handoff_by_path.rc == 0
          - (side_effect_handoff_by_path.stdout | from_json).session_id == side_effect_handoff_ids[0]
          - side_effect_handoff_last | length > 0
          - side_effect_handoff_last[0].messages | string is search('HANDOFF-ONE')
          - side_effect_handoff_last[0].messages | string is search('HANDOFF-TWO')
          # Written where it lies, and nowhere else.
          - side_effect_handoff_after.results[1].content | b64decode is search('HANDOFF-THREE')
          - side_effect_handoff_elsewhere.matched == 0
        fail_msg: "{{ side_effect_handoff_by_path.rc }} {{ side_effect_handoff_by_path.stderr | truncate(300) }}"
        quiet: true

    - name: Stop the stand-in Messages API
      ansible.builtin.command:
        argv: [pkill, -f, fake_anthropic_api.py]
      changed_when: false
      failed_when: false

    # verify.yml holds that no async job of a run is left behind: the job's
    # last status is written once the server has gone, and only then removed.
    - name: Wait for the stand-in's job to end
      ansible.builtin.async_status:
        jid: "{{ side_effect_handoff_server.ansible_job_id }}"
      register: side_effect_handoff_ended
      until: side_effect_handoff_ended.finished
      retries: 30
      delay: 1
      failed_when: false

    - name: Forget the stand-in's job
      ansible.builtin.async_status:
        jid: "{{ side_effect_handoff_server.ansible_job_id }}"
        mode: cleanup

    - name: Remove the handoff's directories
      ansible.builtin.file:
        path: "{{ side_effect_handoff_dir }}"
        state: absent

- name: Put the stand-in claude in place of the real one
  hosts: claude_vms
  become: true
  tasks:
    # Before the swap, while it is the Claude Code the converge installed:
    # verify.yml, which runs after this, only meets the stand-in.
    - name: Run the installed claude once more
      ansible.builtin.command:
        argv: [bash, -lc, "claude --version"]
      become: true
      become_user: dev
      register: side_effect_claude_version
      changed_when: false

    - name: Assert the installed claude reports a version
      ansible.builtin.assert:
        that: side_effect_claude_version.stdout is search('[0-9]+\.[0-9]+\.[0-9]+')
        fail_msg: "claude --version printed {{ side_effect_claude_version.stdout }}"
        quiet: true

    - name: Replace the claude on dev's PATH with the stand-in
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../tests/molecule/fake_claude.sh"
        dest: /home/dev/.local/bin/claude
        owner: dev
        group: dev
        mode: "0755"

- name: Sign Claude Code in as just login --only claude does, for this one VM
  ansible.builtin.import_playbook: ../../playbooks/claude_login.yml
  vars:
    vm_name: claude-dev
    claude_code_login_code: fake-code#fake-state

# just destroy's pause around its save of the VM's sessions, against the real
# systemd and the Remote Control the sign-in just started: stopped while the
# sessions are read, then started again as for a VM the save failed on and
# destroy keeps. verify.yml then finds it running, as the sign-in left it.
- name: Pause Remote Control as just destroy's save does, and start it again
  hosts: claude_vms
  become: true
  tasks:
    - name: Stop it as the save does
      ansible.builtin.include_role:
        name: claude_code
        tasks_from: release_pause

    - name: Read the service once paused
      ansible.builtin.command:
        argv: [systemctl, is-active, claude-remote-control.service]
      register: side_effect_paused
      changed_when: false
      failed_when: false

    - name: Start it again as for a VM destroy keeps
      ansible.builtin.include_role:
        name: claude_code
        tasks_from: release_resume

    - name: Read the service once started again
      ansible.builtin.command:
        argv: [systemctl, is-active, claude-remote-control.service]
      register: side_effect_resumed
      changed_when: false
      failed_when: false

    - name: Assert the pause stopped it and the resume started it
      ansible.builtin.assert:
        that:
          - claude_code_release_paused.results | selectattr('changed') | map(attribute='item.item') | list == ['service']
          - side_effect_paused.stdout | trim == 'inactive'
          - side_effect_resumed.stdout | trim == 'active'
        fail_msg: "{{ side_effect_paused.stdout }} then {{ side_effect_resumed.stdout }}"
        quiet: true

# Then gh, which has no token in this scenario: what just login --only github does for
# one VM, against the container.
# The stand-in gh prints the code and the page, then approves itself after two
# seconds, so the device flow runs end to end offline: the role waits on gh's
# output, collects the job, runs the whole role, and the private repository
# arrives. login_desktop is off in host_vars, so nothing opens on the
# developer's machine; tests/unit/test_github_auth.py checks that it is.
- name: Assert the converge left gh signed out
  hosts: claude_vms
  become: true
  tasks:
    - name: Stat the stand-in gh's login and the private repository
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/home/dev/.config/gh/fake-token, /home/dev/projects/secret]
      register: side_effect_before

    - name: Assert neither exists yet
      ansible.builtin.assert:
        that: side_effect_before.results | map(attribute='stat.exists') | list == [false, false]
        quiet: true

- name: Run the device flow as just login --only github does, for this one VM
  ansible.builtin.import_playbook: ../../playbooks/github_login.yml
  vars:
    vm_name: claude-dev
