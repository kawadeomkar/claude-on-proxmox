---
# Test overrides for the integration scenario. Host vars beat the project
# defaults linked in from inventory/group_vars/all/defaults.yml.
configure_wait_for_cloud_init: false
vm_user: dev
vm_ssh_public_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMoleculeTestKeyDoNotUse0000000000000000000 molecule@test
github_username: molecule
github_token: ""
# The sign-ins' browser and clipboard steps run on the controller, which here
# is the developer's own machine: never in a test.
login_desktop: false
# Empty = clone everything (the fork "beta" is still filtered out).
github_projects: []
# No API key here: Remote Control below is mutually exclusive with one, and
# this scenario covers the Remote Control path. The api-key path - the key
# reaching settings.json and being removed once cleared - is covered by the
# claude_code role's own scenario, which sets claude_code_anthropic_api_key
# directly. So the anthropic_api_key -> claude_code_anthropic_api_key wiring in
# defaults.yml is exercised here only with its empty default.
anthropic_api_key: ""
# claude_remote_control is deliberately not set: an empty API key is what the
# role derives Remote Control from, and this scenario proves that default.
github_projects_api_url: http://127.0.0.1:8000
dev_tools_install_docker: false
# The dev_tools scenario installs and checks the toolchain; here it would only
# download it.
dev_tools_install_rust: false
claude_code_settings:
  permissions:
    defaultMode: acceptEdits
# Tailscale: the real package and daemon, which contacts nothing - log upload
# off from its first start, and every `tailscale` the role runs is the stand-in
# prepare.yml installs. The key goes through the vault variable, as a user's
# would, so the wiring in defaults.yml is what reaches the role; the stand-in
# accepts it. Userspace networking: no TUN device needed in the container.
tailscale_upload_logs: false
vault_tailscale_auth_key: tskey-auth-kGood0CNTRL-TestOnly0000000000000000000000
tailscale_daemon_flags: [--tun=userspace-networking]
