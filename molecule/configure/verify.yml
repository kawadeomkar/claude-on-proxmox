---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Run the tools the VM user would use
      ansible.builtin.command:
        argv: "{{ item }}"
      become: true
      become_user: dev
      loop:
        - [bash, -lc, "claude --version"]
        - [node, --version]
        - [uv, --version]
        # By path: prepare puts the stand-in gh ahead of the real one on PATH.
        - [/usr/bin/gh, --version]
        - [git, -C, /home/dev/projects/alpha, status]
      register: verify_cmds
      changed_when: false
      loop_control:
        label: "{{ item | join(' ') }}"

    - name: Stat the fork that must not be cloned, and the private repository the device flow brought
      ansible.builtin.stat:
        path: "/home/dev/projects/{{ item }}"
      loop: [beta, secret]
      register: verify_cloned

    # No token in this scenario, so the converge left gh signed out and the
    # side effect signed it in by the device flow (side_effect.yml): the
    # stand-in holds the device-flow token, git has gh as its credential
    # helper, the identity is the fake account's, and gh's output file and
    # job are gone. As dev under sudo -H, so --global is /home/dev/.gitconfig.
    - name: Read what github_projects left for dev
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [git, config, --global, user.name]
        - [git, config, --global, user.email]
        - [git, config, --global, --get-all, credential.https://github.com.helper]
        - [cat, /home/dev/.config/gh/fake-token]
        - [grep, -c, "^auth login --hostname github.com --git-protocol https --web", /home/dev/.config/gh/calls.log]
      become: true
      become_user: dev
      register: verify_git_config
      changed_when: false
      failed_when: verify_git_config.rc not in [0, 1]
      loop_control:
        label: "{{ item | join(' ') }}"

    - name: Stat what the device flow must have removed, and the marker that must not exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/dev/.config/claude-on-proxmox/gh-login.out
        - /home/dev/.config/claude-on-proxmox/gh-login
        - /home/dev/.ansible_async
        - /home/dev/.config/claude-on-proxmox/gh-login.pid
      register: verify_gh_leftovers

    - name: Read settings.json
      ansible.builtin.slurp:
        src: /home/dev/.claude/settings.json
      register: verify_settings_raw

    - name: Assert the VM is ready for use
      vars:
        verify_settings: "{{ verify_settings_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          # The stand-in's version by now: side_effect.yml checks the
          # installed claude before it swaps the stand-in in.
          - verify_cmds.results[0].stdout is search('[0-9]+\.[0-9]+\.[0-9]+')
          - not verify_cloned.results[0].stat.exists
          - verify_cloned.results[1].stat.exists
          - verify_git_config.results[0].stdout == 'Molecule Tester'
          - verify_git_config.results[1].stdout == '4242+molecule@users.noreply.github.com'
          - verify_git_config.results[2].stdout_lines == ['', '!/usr/local/bin/gh auth git-credential']
          - verify_git_config.results[3].stdout == 'gho_device0000000000'
          - verify_git_config.results[4].stdout == '1'
          # The output file, the marker and gh's pidfile: none; the async
          # directory may exist but holds no job of ours.
          - not verify_gh_leftovers.results[0].stat.exists
          - not verify_gh_leftovers.results[1].stat.exists
          - not verify_gh_leftovers.results[3].stat.exists
          # No API key in this scenario: it is mutually exclusive with Remote
          # Control, and an env block would have overridden the login. The
          # one prepare.yml left behind must be gone, and nothing else with it.
          - "'ANTHROPIC_API_KEY' not in (verify_settings.env | default({}))"
          - verify_settings.env.KEEP_ME == '1'
          - verify_settings.permissions.defaultMode == 'acceptEdits'
        quiet: true

    # The converge left Remote Control prepared and stopped, waiting for a login
    # (side_effect.yml asserts that before signing in); the side effect signed
    # in through claude_login.yml with the stand-in claude, whose role started
    # the service and retired the path unit. The unit, the pre-answered prompts
    # and the restart policy are the converge's, and the running server and its
    # enablement for boot are the sign-in's.
    - name: Stat what the sign-in leaves behind, and what it must not
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/dev/.claude/.credentials.json
        - /etc/systemd/system/claude-remote-control.path
        - /home/dev/.config/claude-on-proxmox/claude-login.out
        - /home/dev/.config/claude-on-proxmox/claude-login.in
        - /home/dev/.config/claude-on-proxmox/claude-login.pid
      register: verify_sign_in

    # Gone means unloaded, not only a missing file: a unit deleted without
    # being stopped keeps watching until systemd is told.
    - name: Read what systemd makes of the path unit
      ansible.builtin.command:
        argv: [systemctl, show, claude-remote-control.path, -p, LoadState, -p, ActiveState]
      register: verify_path_unit
      changed_when: false

    # Each sign-in collects and cleans up its own background job, as dev.
    - name: Find any background job left in dev's async directory
      ansible.builtin.find:
        paths: /home/dev/.ansible_async
        file_type: any
      register: verify_async_jobs

    - name: Read what the stand-in claude was asked
      ansible.builtin.slurp:
        src: /home/dev/.claude/fake/calls.log
      register: verify_claude_calls

    - name: Read the installed Remote Control unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/claude-remote-control.service
      register: verify_rc_unit

    - name: Read the seeded Claude Code config
      ansible.builtin.slurp:
        src: /home/dev/.claude.json
      register: verify_rc_cfg

    - name: Check whether the Remote Control service is running
      ansible.builtin.command:
        argv: [systemctl, is-active, claude-remote-control]
      register: verify_rc_active
      failed_when: false
      changed_when: false

    - name: Check whether the Remote Control service is enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, claude-remote-control]
      register: verify_rc_enabled
      failed_when: false
      changed_when: false

    # Read back from systemd rather than the file, so a directive this systemd
    # does not understand - and would ignore with only a warning - fails here.
    - name: Read the restart policy systemd loaded for the unit
      ansible.builtin.systemd_service:
        name: claude-remote-control
      register: verify_rc_service

    - name: Assert Remote Control runs after the sign-in, and nothing of the sign-in is left
      vars:
        verify_rc_text: "{{ verify_rc_unit.content | b64decode }}"
        verify_rc_json: "{{ verify_rc_cfg.content | b64decode | from_json }}"
        verify_calls: "{{ (verify_claude_calls.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          # Signed in, by the code the side effect gave, with nothing to end
          - verify_sign_in.results[0].stat.exists
          - "'accepted' in verify_calls"
          - "'TERM' not in verify_calls"
          # The path unit was only for the wait, and the sign-in's files went
          - not verify_sign_in.results[1].stat.exists
          - "'LoadState=not-found' in verify_path_unit.stdout_lines"
          - "'ActiveState=inactive' in verify_path_unit.stdout_lines"
          - verify_async_jobs.matched == 0
          - verify_sign_in.results[2:] | map(attribute='stat.exists') | select | list | length == 0
          # Runs as the VM user, from the projects directory, not as root
          - "'User=dev' in verify_rc_text"
          - "'WorkingDirectory=/home/dev/projects' in verify_rc_text"
          # Server mode, named after the host, so it is identifiable in the app
          - "'remote-control --name' in verify_rc_text"
          - "'claude-dev' in verify_rc_text"
          # An API key must never reach the unit's environment: it would
          # override the subscription login Remote Control requires. Matched on
          # the Environment= line, not the bare word, which also appears in the
          # comment above it explaining exactly this.
          - verify_rc_text.split('\n')
            | select('match', '^Environment=.*ANTHROPIC_API_KEY') | list | length == 0
          # The prompts that would otherwise stall a headless server. Without
          # remoteDialogSeen the server asks "Enable Remote Control? (y/n)",
          # reads /dev/null under systemd and exits 0 without starting.
          - verify_rc_json.hasCompletedOnboarding
          - verify_rc_json.remoteDialogSeen | default(false)
          - verify_rc_json.projects['/home/dev/projects'].hasTrustDialogAccepted
          # Signed in, so started, and enabled for boot
          - verify_rc_active.stdout | trim == 'active'
          - verify_rc_enabled.stdout | trim == 'enabled'
          # Restarted whatever the exit status, so server mode giving up on the
          # network comes back too; backing off to five minutes rather than
          # hitting a start limit that would leave it failed for good
          - verify_rc_service.status.Restart == 'always'
          - verify_rc_service.status.RestartUSec == '10s'
          - verify_rc_service.status.RestartSteps == '5'
          - verify_rc_service.status.RestartMaxDelayUSec == '5min'
          - verify_rc_service.status.StartLimitIntervalUSec == '0'
        fail_msg: >-
          Remote Control after the sign-in is wrong. active={{ verify_rc_active.stdout | trim }}
          sign-in files={{ verify_sign_in.results | map(attribute='stat.exists') | list }}
          calls={{ (verify_claude_calls.content | b64decode).splitlines() }}
          enabled={{ verify_rc_enabled.stdout | trim }}
          Restart={{ verify_rc_service.status.Restart | default('?') }}
          RestartUSec={{ verify_rc_service.status.RestartUSec | default('?') }}
          RestartSteps={{ verify_rc_service.status.RestartSteps | default('?') }}
          RestartMaxDelayUSec={{ verify_rc_service.status.RestartMaxDelayUSec | default('?') }}
          StartLimitIntervalUSec={{ verify_rc_service.status.StartLimitIntervalUSec | default('?') }}
        quiet: true

# The alias configure.yml left on the controller, in the ephemeral directory
# host_vars/localhost.yml points it at. Resolved with the real ssh client, as
# VS Code's Remote - SSH would.
- name: Verify the SSH alias written on the controller
  hosts: localhost
  gather_facts: false
  vars:
    verify_ssh_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
  tasks:
    - name: Read the managed ssh config
      ansible.builtin.slurp:
        src: "{{ verify_ssh_dir }}/claude-on-proxmox.conf"
      register: verify_ssh_managed

    - name: Stat the managed file and the user config that must not exist
      ansible.builtin.stat:
        path: "{{ verify_ssh_dir }}/{{ item }}"
      register: verify_ssh_stats
      loop: [claude-on-proxmox.conf, ssh_config]

    - name: Resolve the alias with the real ssh client
      ansible.builtin.command:
        argv: [ssh, -G, -F, "{{ verify_ssh_dir }}/claude-on-proxmox.conf", claude-dev]
      register: verify_ssh_resolved
      changed_when: false

    - name: Assert the alias is what VS Code would use
      vars:
        verify_ssh_text: "{{ verify_ssh_managed.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'# BEGIN claude-on-proxmox: claude-dev' in verify_ssh_text"
          - "'# END claude-on-proxmox: claude-dev' in verify_ssh_text"
          # What ssh reads, and no state of this project's
          - "'# workspace' not in verify_ssh_text"
          - "'# vmid' not in verify_ssh_text"
          - "'Host claude-dev' in verify_ssh_text"
          - "'HostName claude-dev' in verify_ssh_text"
          - "'User dev' in verify_ssh_text"
          - "'ServerAliveInterval 30' in verify_ssh_text"
          - "'ForwardAgent' not in verify_ssh_text"
          - verify_ssh_stats.results[0].stat.mode == '0600'
          - not verify_ssh_stats.results[1].stat.exists
          - "'hostname claude-dev' in verify_ssh_resolved.stdout_lines"
          - "'user dev' in verify_ssh_resolved.stdout_lines"
        fail_msg: "Unexpected managed ssh config:\n{{ verify_ssh_text }}"
        quiet: true
