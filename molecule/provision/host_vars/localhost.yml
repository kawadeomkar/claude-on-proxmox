---
# Everything the API needs lives in group_vars/all/fake_api.yml, so that the
# hosts provision.yml creates per VM get it too. Only the controller's own
# connection details belong here.
ansible_connection: local
ansible_python_interpreter: "{{ ansible_playbook_python }}"
# No GitHub device flow runs here, but the switch that keeps it off the
# developer's browser and clipboard is set in every scenario regardless
# (tests/unit/test_github_auth.py).
github_login_desktop: false
