---
# Point the committed wiring at the fake Proxmox API instead of a real host.
#
# These live in group_vars/all rather than host_vars/localhost because
# provision.yml runs the role against one host per VM, not against localhost,
# exactly as it does in production where this configuration comes from
# inventory/group_vars/all. Loads after defaults.yml, so it wins.
proxmox_api_host: 127.0.0.1
proxmox_api_port: 18007
vault_proxmox_api_token_secret: molecule-test-secret

# vm_name is deliberately not set here. converge.yml passes it to provisioning,
# the way `make provision VM_NAME=alpha,beta` does, and verify.yml runs
# discovery and the listing both with and without it. A group var cannot be
# unset, so defining it here would make the fleet-wide path - the one that
# relies on the ownership filter alone - impossible to test.

vm_user: dev
vm_ssh_public_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMoleculeTestKeyDoNotUse0000000000000000000 molecule@test

# The fake refuses the first polls on purpose; keep the retries quick.
proxmox_vm_agent_delay: 1

# destroy.yml and ssh_config.yml write the SSH aliases on the controller,
# which here is the developer's own machine. Into Molecule's ephemeral
# directory, never ~/.ssh, with the Include line off.
# tests/unit/test_ssh_config.py checks every scenario does this.
claude_ssh_config_file: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/claude-on-proxmox.conf"
claude_ssh_user_config: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ssh_config"
claude_ssh_config_include: false
