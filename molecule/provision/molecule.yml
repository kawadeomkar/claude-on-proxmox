---
# End-to-end test of the user-facing flow: `make provision VM_NAME=alpha,beta`
# against a fake Proxmox API, followed by tag-based discovery. The container
# only hosts the API; the playbooks run on the controller.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yml
platforms:
  - name: claude-on-proxmox-provision
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:18bf80157ea24b3210eb25ca89a5460912271b0ee61f238f36d2b115c89e39e6}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    published_ports:
      - 127.0.0.1:18007:8006/tcp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/filter_plugins
  inventory:
    # The committed group_vars are symlinked in, so the real variable wiring
    # is exercised; only the endpoint and secrets are overridden per host.
    links:
      group_vars: group_vars
      host_vars: host_vars
