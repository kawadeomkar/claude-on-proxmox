---
# Sign gh in to GitHub on the VMs, or say how each one is signed in.
#
#   just login alpha --only github        -> signs alpha in, then runs the role (signed in or not)
#   just login alpha,beta --only github   -> the same, one VM after the other
#   just login --only github                      -> reports every VM's state
#
# With vault_github_token set, just deploy --only configure signs gh in by itself. Without
# one the login is GitHub's device flow, which no run can finish alone: a
# one-time code has to be entered on a page and authorised. This runs it as
# far as it goes - gh in the background on the VM, the code read from its
# output, the page opened and the code copied on this machine (login_desktop),
# the approval waited for - and then runs the whole github_projects role, so
# the private repositories arrive in the same run. just deploy imports this
# playbook for the VMs it configured and asks VM by VM first: a VM whose Claude
# code was entered signs in on Enter, one that showed no Claude prompt on a "y",
# and one whose Claude prompt got Enter is left - this flow waits up to fifteen
# minutes for a browser.
- name: Discover VMs on Proxmox
  ansible.builtin.import_playbook: discover.yml
  when: claude_vm_discovery | default(true) | bool

# Every VM at once, before any prompt: rescue never sees an unreachable host,
# and under serial an unreachable VM is a whole batch failed, which ends the
# run. One that does not answer is said, skipped below, and failed at the end.
- name: Reach each VM before its sign-in
  hosts: claude_vms
  gather_facts: false

  tasks:
    # Renamed when the switch came to cover Claude's sign-in too. A local.yml
    # still setting either would be ignored, and the page and the clipboard
    # used after all.
    - name: Refuse the switches this sign-in no longer reads
      ansible.builtin.assert:
        that:
          - github_login_desktop is not defined
          - github_login_prompt is not defined
        fail_msg: >-
          github_login_desktop and github_login_prompt are gone: set login_desktop instead (false keeps the
          sign-ins off this machine's browser and clipboard), and drop github_login_prompt.
        quiet: true
      run_once: true

    - name: Reach the VM
      ansible.builtin.ping:
      ignore_unreachable: true
      register: claude_vm_reach

    # The command that retries it ends the line, with no full stop after it:
    # one would be pasted along with it.
    - name: Remember that the VM could not be reached
      vars:
        claude_vm_failed_why: "{{ claude_vm_reach.msg | default('no answer', true) | regex_replace('\\s+', ' ') | trim }}"
      ansible.builtin.set_fact:
        claude_vm_github_login_failure: >-
          {{ inventory_hostname }} could not be reached, so gh was not signed in there:
          {{ claude_vm_failed_why ~ ('' if claude_vm_failed_why is search('[.!?]$') else '.') }}
          Retry it with: just login {{ inventory_hostname }} --only github
      when: claude_vm_reach is unreachable

    - name: Say which VM could not be reached
      ansible.builtin.debug:
        msg: "{{ claude_vm_github_login_failure }}"
      when: claude_vm_reach is unreachable

    # NEXT STEPS (callback_plugins/claude_on_proxmox.py): the line above, under
    # the sign-in's own matter, which a later record of the VM would replace.
    - name: Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          github_projects_next: "{{ {inventory_hostname: {'github': claude_vm_github_login_failure}} }}"
        aggregate: true
        per_host: false
      when: claude_vm_reach is unreachable

# One VM at a time where a sign-in can prompt - names given, or just deploy -
# since each opens its own page and waits for its own approval; a report reads
# the fleet at once. A failure is caught here, said, and raised by the last
# play, unless it is the person aborting at a prompt.
- name: Sign gh in to GitHub, or say how each VM is signed in
  hosts: claude_vms
  become: true
  gather_facts: false
  vars:
    claude_vm_login_named: >-
      {{ (vm_name | default('', true) | split(',') | map('trim') | select | list | length) > 0 }}
    # just login x --only github runs the whole role after this play for each
    # VM named, signed in now or before, so the command that signs gh in is
    # also the one that clones; just deploy's configure has just run it.
    claude_vm_login_role_follows: >-
      {{ claude_vm_login_named | bool and not (claude_vm_login_in_deploy | default(false) | bool) }}
    # A VM just deploy, or just login with names, leaves out of this sign-in
    # because nobody answered its Claude sign-in (claude_vm_login_interactive
    # and claude_vm_login_ask, as deploy.yml and login.yml decide them): told
    # so below. Never in a report, which starts nothing for any VM.
    claude_vm_login_held: >-
      {{ (claude_vm_login_in_deploy | default(false) | bool or claude_vm_login_named | bool)
         and claude_code_login_skipped | default(false) | bool
         and not (claude_vm_login_interactive | default(claude_vm_login_named) | bool)
         and not (claude_vm_login_ask | default(false) | bool) }}
  serial: "{{ 1 if (claude_vm_login_in_deploy | default(false) | bool or claude_vm_login_named | bool) else '100%' }}"

  tasks:
    - name: Sign this VM in
      block:
        # The decision is the github_projects role's, so this and `just deploy
        # --only configure` cannot disagree about whether a VM is signed in, or how.
        # tests/unit/test_github_auth.py runs this playbook against canned logins.
        - name: Report the login state, and sign the VM in when asked to
          ansible.builtin.include_role:
            name: github_projects
            tasks_from: login
          vars:
            # Names given (any number), or just deploy for a VM whose Claude
            # code was entered: sign in. just deploy asks first.
            github_projects_login_interactive: "{{ claude_vm_login_interactive | default(claude_vm_login_named) }}"
            github_projects_login_ask: "{{ claude_vm_login_ask | default(false) }}"
            github_projects_login_role_follows: "{{ claude_vm_login_role_follows }}"
          # On the task, not the block: a block's condition is its rescue's
          # too, read again for each task, and the rescue sets this fact, so
          # the message after it was skipped.
          when: claude_vm_github_login_failure is not defined

        # The role's report says gh is signed out; this says why nothing
        # signed it in - only where the device flow would have run
        # (github_projects_login_due, which the role's question and flow go
        # on too), so a VM signed in already, or by the vault token, hears
        # nothing of it.
        - name: Say why GitHub's sign-in was not started
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: GitHub's sign-in was not started, since its Claude sign-in was skipped:
              just login {{ inventory_hostname }} --only github starts it.
          register: claude_vm_github_held_reported
          when:
            - claude_vm_github_login_failure is not defined
            - claude_vm_login_held | bool
            - github_projects_login_due | default(false) | bool

        # NEXT STEPS: the line above, in place of the role's own report of the
        # same sign-out, just before it - one line, and the one that says why.
        - name: Keep what is left to do for the end of the run
          ansible.builtin.set_stats:
            data:
              github_projects_next: "{{ {inventory_hostname: {'github': claude_vm_github_held_reported.msg}} }}"
            aggregate: true
            per_host: false
          when:
            - claude_vm_github_login_failure is not defined
            - claude_vm_login_held | bool
            - github_projects_login_due | default(false) | bool
      rescue:
        - name: Stop the run when the person aborted at the prompt
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg }}"
          when: ansible_failed_result.msg | default('') is search('user requested abort')

        # The role's own failures name the command that retries them; any
        # other gets it added, so the line NEXT STEPS keeps names it too.
        - name: Remember why this VM's sign-in failed
          vars:
            claude_vm_failed_why: "{{ ansible_failed_result.msg | default('the sign-in failed', true) | string | trim }}"
            claude_vm_retry: just login {{ inventory_hostname }} --only github
          ansible.builtin.set_fact:
            claude_vm_github_login_failure: >-
              {{ claude_vm_failed_why if claude_vm_retry in claude_vm_failed_why
                 else claude_vm_failed_why ~ ('' if claude_vm_failed_why is search('[.!?]$') else '.')
                      ~ ' Retry it with: ' ~ claude_vm_retry }}

        - name: Say why, and go on with the next VM
          ansible.builtin.debug:
            msg: "{{ claude_vm_github_login_failure }}"

        # NEXT STEPS: the line above, which replaces whatever an earlier report
        # of the run left for this VM's sign-in.
        - name: Keep what is left to do for the end of the run
          ansible.builtin.set_stats:
            data:
              github_projects_next: "{{ {inventory_hostname: {'github': claude_vm_github_login_failure}} }}"
            aggregate: true
            per_host: false

# The rest of the role, after the last approval, for every VM signed in just
# now, and under just login x --only github for every VM named: the credential
# helper, the listing with the token gh holds, the private repositories - and,
# with vault_github_token set, the token sign-in itself. A failure here is not
# a failed sign-in, and is raised even under just deploy, at its end.
- name: Configure the repositories of each VM signed in
  hosts: claude_vms
  become: true
  gather_facts: false
  vars:
    claude_vm_login_named: >-
      {{ (vm_name | default('', true) | split(',') | map('trim') | select | list | length) > 0 }}

  tasks:
    - name: Configure the repositories now that gh is signed in
      when:
        - claude_vm_github_login_failure is not defined
        - >-
          github_projects_login_done | default(false) | bool
          or (claude_vm_login_named | bool and not (claude_vm_login_in_deploy | default(false) | bool))
      block:
        - name: Run the role now that gh is signed in
          ansible.builtin.include_role:
            name: github_projects
      rescue:
        - name: Remember that the work after the sign-in failed
          vars:
            claude_vm_failed_items: >-
              {{ ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='item.full_name', default='?') | list }}
            # A loop's own message is only "One or more items failed": the
            # first failed item's says why, on one line.
            claude_vm_failed_why: >-
              {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed')
                  | map(attribute='msg', default='') | select | first
                  | default(ansible_failed_result.msg | default('no message', true), true))
                 | regex_replace('\s+', ' ') | trim }}
          ansible.builtin.set_fact:
            claude_vm_configure_failures: >-
              {{ claude_vm_configure_failures | default([])
                 + [inventory_hostname ~ ': configuring its GitHub repositories failed at "'
                    ~ (ansible_failed_task.name | default('a task')) ~ '"'
                    ~ (' (' ~ claude_vm_failed_items | join(', ') ~ ')' if claude_vm_failed_items | length > 0 else '')
                    ~ ': ' ~ claude_vm_failed_why ~ ('' if claude_vm_failed_why is search('[.!?]$') else '.')
                    ~ ' Retry it with: just deploy ' ~ inventory_hostname ~ ' --tags github_projects'] }}

        - name: Say why
          ansible.builtin.debug:
            msg: "{{ claude_vm_configure_failures | last }}"

        # NEXT STEPS: the line above, which replaces what the role's own
        # reports of this VM's GitHub left.
        - name: Keep what is left to do for the end of the run
          ansible.builtin.set_stats:
            data:
              github_projects_next: "{{ {inventory_hostname: {'github': claude_vm_configure_failures | last}} }}"
            aggregate: true
            per_host: false

# just deploy carries on past a sign-in that failed, and raises the work after
# a sign-in at its own end; just login --only github exists to sign in, so here the
# run fails, VM by VM - unless just login runs the three sign-ins
# (claude_vm_login_raised_later), whose own last play raises it.
- name: Fail each VM whose sign-in, or the work after it, failed
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Fail where the sign-in failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_github_login_failure }}"
      when:
        - claude_vm_github_login_failure is defined
        - not (claude_vm_login_in_deploy | default(false) | bool)
        - not (claude_vm_login_raised_later | default(false) | bool)

    - name: Fail where the work after the sign-in failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_configure_failures | join(' ') }}"
      when:
        - claude_vm_configure_failures | default([]) | length > 0
        - not (claude_vm_login_in_deploy | default(false) | bool)
        - not (claude_vm_login_raised_later | default(false) | bool)
