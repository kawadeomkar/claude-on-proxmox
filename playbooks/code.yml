---
# Open one VM in VS Code, over SSH: its whole projects directory, or one
# project in it.
#
#   make code VM_NAME=alpha                              -> ~/projects
#   make code VM_NAME=alpha PROJECT=discord-music-bot    -> ~/projects/discord-music-bot
#
# The quick way to an existing VM: the alias step of `make configure` and
# `make ssh-config` for this one VM - its address is read from Proxmox again,
# so a lease that moved since the last run is corrected before connecting -
# followed by the one step those never do, launching the editor. The folder is
# looked for on the VM first, read-only and over SSH as the VM user, so a
# PROJECT that is mistyped, or a VM never configured and so without a projects
# directory yet, is said here, with what is there, rather than in a VS Code
# window opened on a folder that does not exist. The Remote - SSH extension is
# installed first if VS Code does not have it. Not a subset of `make deploy`,
# which creates and configures and only prints the command; this runs it.
#
# With vscode_claude_terminal (the default), VS Code is handed a workspace
# file rather than the folder. It names the folder and holds one task, run when
# the window opens: a terminal named Claude that starts claude there, signing
# in first on a VM that has not been. That file is the one thing written on the
# VM, in a directory of its own beside the projects
# (<projects>/.claude-on-proxmox/), never in a repository; cloud-init placed
# the key at provisioning, so nothing else needs changing. VS Code runs the
# task only in a window the user has trusted, and only once they have allowed
# automatic tasks; this playbook reads their VS Code settings to say which of
# those to expect, and never writes them (README, "A Claude session in the
# window").
#
# vm_project (PROJECT) is one folder name, as a GitHub repository is named,
# and is checked again here so that a direct ansible-playbook run cannot point
# VS Code outside the projects directory either.
- name: Open a VM in VS Code
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"
  vars:
    # claude_code_ssh is the result of whichever task connected.
    claude_code_ssh_failed: >-
      {{ claude_vm_names[0] }} is running at {{ claude_code_reach }}, but SSH to it as {{ vm_user }}
      failed, so VS Code could not connect either: {{ claude_code_ssh.msg | default('no reason given') | trim }}
      A VM that has just booted can need another minute; `ssh {{ claude_vm_names[0] }}` shows why.
    claude_code_terminal: "{{ vscode_claude_terminal | default(true) | bool }}"

    # The workspace file, built as data and written with to_nice_json so no
    # path or message can break its JSON. Absolute paths throughout:
    # ${workspaceFolder} is ambiguous in a task that belongs to a workspace
    # file rather than to a folder. The workspace files' own directory is hidden
    # from the explorer in the window that shows it, the whole directory's.
    claude_code_workspace_file:
      folders:
        - path: "{{ claude_code_target }}"
      settings: >-
        {{ {'files.exclude': {claude_code_ws_dir | basename: true}}
           if claude_code_ws_dir | dirname == claude_code_target else {} }}
      tasks:
        version: "2.0.0"
        tasks:
          - label: Claude
            type: process
            command: /bin/bash
            args: [-lc, "{{ claude_code_session }}", make-code, "{{ claude_code_not_installed }}", "{{ claude_code_signed_in }}"]
            options:
              cwd: "{{ claude_code_target }}"
            runOptions:
              runOn: folderOpen
            presentation:
              reveal: always
              focus: true
              panel: dedicated
              clear: true
              showReuseMessage: false
            problemMatcher: []

    # What the task runs, as `bash -lc <this> make-code <$1> <$2>`. A login
    # shell, because tasks start non-login shells and claude is on the login
    # PATH only. `claude auth status` exits non-zero until the VM is signed in,
    # by claude.ai or by an API key; `claude auth login` is the browser flow,
    # and the browser is the one on this machine, through the BROWSER helper
    # VS Code Server sets in every terminal it starts. The messages are
    # arguments, never script text.
    claude_code_session: |-
      if ! command -v claude >/dev/null 2>&1; then
        printf '%s\n' "$1"
        exit 1
      fi
      if ! claude auth status >/dev/null 2>&1; then
        printf '%s\n' "Signing in to Claude first. Your browser opens the sign-in page; if it shows a code, paste it here."
        claude auth login || exit 1
        [ -z "$2" ] || printf '%s\n' "$2"
      fi
      exec claude
    claude_code_not_installed: >-
      Claude Code is not installed on {{ claude_vm_names[0] }} yet. On your machine, run
      make configure VM_NAME={{ claude_vm_names[0] }}, then "Tasks: Run Task", Claude here.
    # Remote Control needs that claude.ai login, which is why it was waiting;
    # the role's own checks decide whether to start it, so it is not started
    # from the terminal.
    claude_code_signed_in: >-
      {{ ('Signed in. To reach this VM from the Claude apps too, start Remote Control from your machine: '
          ~ 'make configure VM_NAME=' ~ claude_vm_names[0] ~ ' TAGS=claude_code')
         if claude_remote_control | default(true) | bool else '' }}

    # Read on this machine, never written. task.allowAutomaticTasks is an
    # application setting, so the default profile's settings.json holds it
    # whichever profile is in use.
    claude_code_settings_file: >-
      {{ vscode_user_settings_file | default('', true)
         or query('ansible.builtin.first_found', claude_code_settings_places, skip=true) | first | default('') }}
    claude_code_settings_places:
      - "{{ lookup('ansible.builtin.env', 'HOME') }}/Library/Application Support/Code/User/settings.json"
      - "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/Code/User/settings.json"
    claude_code_auto_tasks: >-
      {{ (lookup('ansible.builtin.file', claude_code_settings_file, errors='ignore')
          if claude_code_settings_file | length > 0 else '') | vscode_setting('task.allowAutomaticTasks', '') }}

  tasks:
    - name: Refuse anything but one VM
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - claude_vm_names | length == 1
        fail_msg: "VS Code opens one VM at a time: make code VM_NAME=<name>."
        quiet: true

    # A GitHub repository name: ASCII letters, digits, ".", "-" and "_", at
    # most 100 of them. No "/", so nothing outside the projects directory or
    # nested in it, and not "." or "..", which name the directory or its parent.
    - name: Refuse a project that is not one folder name
      vars:
        claude_code_asked: "{{ vm_project | default('', true) | string }}"
      ansible.builtin.assert:
        that:
          - claude_code_asked is match('^[A-Za-z0-9._-]{1,100}$')
          - claude_code_asked not in ['.', '..']
        fail_msg: >-
          PROJECT names one project folder on the VM, the way a GitHub repository is named: up to 100
          letters, digits, ".", "-" and "_". "{{ claude_code_asked }}" is not one.
        quiet: true
      when: vm_project | default('', true) | string | length > 0

    - name: Refuse to run with the managed file switched off
      ansible.builtin.assert:
        that: claude_ssh_config | default(true) | bool
        fail_msg: >-
          claude_ssh_config is false, so this project keeps no SSH alias for the VM and has nothing
          to hand VS Code. Set it true, or open the VM by address yourself.
        quiet: true

    - name: List every VM in the cluster
      ansible.builtin.import_tasks: tasks/cluster_vms.yml

    # Tagged VMs only, as everywhere: a VM of this name without the tag is
    # not this project's, and is named as such rather than opened. With no
    # tagged VM of that name, any VM that has the name is an untagged one.
    - name: Find the VM
      vars:
        claude_code_same_name: >-
          {{ claude_vm_all.json.data | selectattr('type', 'equalto', 'qemu')
             | selectattr('name', 'defined') | selectattr('name', 'equalto', claude_vm_names[0]) | list }}
      ansible.builtin.assert:
        that: claude_vm_requested | length == 1
        fail_msg: >-
          {{ 'No VM named ' ~ claude_vm_names[0] ~ ' is tagged "' ~ claude_vm_tag ~ '".'
             ~ (' A VM of that name exists but is not tagged, so it is not this project\'s to open.'
                if claude_code_same_name | length > 0 else ' `make list` shows what this project created.')
             if claude_vm_requested | length == 0
             else 'More than one VM tagged "' ~ claude_vm_tag ~ '" is named ' ~ claude_vm_names[0]
                  ~ '; rename or remove the duplicates first.' }}
        quiet: true

    - name: Ask the VM's guest agent for its address
      ansible.builtin.import_tasks: tasks/vm_addresses.yml
      vars:
        claude_vm_query: "{{ claude_vm_requested }}"

    # What VS Code will connect to is the alias's HostName - the address, or
    # <name>.<domain> - and this run connects to the same, so the two cannot
    # disagree about whether the VM is reachable.
    - name: Settle where the VM is reached
      ansible.builtin.set_fact:
        claude_code_reach: >-
          {{ claude_vm_names[0] ~ '.' ~ claude_ssh_host_domain
             if claude_ssh_host_domain | default('') | length > 0 else claude_vm_addressed[0].address }}

    # A stopped VM is refused even when its name still resolves.
    - name: Fail when the VM cannot be reached
      vars:
        claude_code_status: "{{ claude_vm_addressed[0].status | default('unknown') }}"
      ansible.builtin.assert:
        that:
          - claude_code_status == 'running'
          - claude_code_reach | length > 0
        fail_msg: >-
          {{ claude_vm_names[0] }} is {{ claude_code_status }}{{ ' and reported no address'
             if claude_code_status == 'running' else '' }}, so there is nothing to connect to.
          `make list` shows the fleet; start the VM, or wait for its agent, and run this again.
        quiet: true

    # The connection Ansible makes to configure the VM: its own ssh settings
    # and accept-new, not the user's ssh config, which is VS Code's business.
    # In claude_vms, so connection variables set on that group in the
    # inventory - a key, a port - apply here as they do to make configure.
    - name: Reach the VM the way make configure does
      ansible.builtin.add_host:
        name: "{{ claude_vm_names[0] }}"
        groups: claude_vms
        ansible_host: "{{ claude_code_reach }}"
        ansible_user: "{{ vm_user }}"
      changed_when: false

    # Where the code lives, read on the VM as configure reads it: the VM
    # user's home, so nothing is guessed from this machine. Not needed when
    # vm_projects_dir says it outright.
    - name: Look up the VM user's home on the VM
      ansible.builtin.getent:
        database: passwd
        key: "{{ vm_user }}"
      delegate_to: "{{ claude_vm_names[0] }}"
      register: claude_code_home
      ignore_unreachable: true
      when: vm_projects_dir | default('', true) | length == 0

    - name: Fail when SSH to the VM does not work
      vars:
        claude_code_ssh: "{{ claude_code_home }}"
      ansible.builtin.assert:
        that: not (claude_code_ssh.unreachable | default(false))
        fail_msg: "{{ claude_code_ssh_failed }}"
        quiet: true

    # The workspace, or one project in it. A trailing "/" on vm_projects_dir
    # is dropped so the path VS Code is given is the one listed below.
    - name: Settle the folder to open
      vars:
        claude_code_workspace: >-
          {{ vm_projects_dir | default('', true)
             or claude_code_home.ansible_facts.getent_passwd[vm_user][4] ~ '/projects' }}
        claude_code_root: "{{ claude_code_workspace | regex_replace('(.)/+$', '\\1') }}"
        claude_code_ws_dir: >-
          {{ (vscode_workspaces_dir | default('', true) or claude_code_root ~ '/.claude-on-proxmox')
             | regex_replace('(.)/+$', '\\1') }}
      ansible.builtin.set_fact:
        claude_code_project: "{{ vm_project | default('', true) | string }}"
        claude_code_root: "{{ claude_code_root }}"
        claude_code_target: >-
          {{ claude_code_root ~ ('/' ~ vm_project if vm_project | default('', true) | string | length > 0 else '') }}
        claude_code_ws_dir: "{{ claude_code_ws_dir }}"
        # One project's file in project/, so a repository that shares the
        # projects directory's name cannot collide with the whole directory's.
        claude_code_ws_file: >-
          {{ claude_code_ws_dir
             ~ ('/project/' ~ vm_project if vm_project | default('', true) | string | length > 0
                else '/' ~ (claude_code_root | basename or 'projects'))
             ~ '.code-workspace' }}

    # The workspace files' directory is not a project, though a PROJECT can
    # name it. VS Code is handed absolute paths only, and a relative
    # vscode_workspaces_dir would be written somewhere VS Code cannot find.
    - name: Refuse the folder that holds the workspace files
      ansible.builtin.assert:
        that:
          - claude_code_target != claude_code_ws_dir
          - claude_code_ws_dir is match('/') or not claude_code_terminal
        fail_msg: >-
          {{ claude_code_ws_dir ~ ' on ' ~ claude_vm_names[0] ~ ' is where make code keeps its VS Code workspace files, not a project.'
             if claude_code_target == claude_code_ws_dir
             else 'vscode_workspaces_dir is a path on the VM, and must be an absolute one, not "' ~ claude_code_ws_dir ~ '".' }}
        quiet: true

    - name: Refresh the alias
      ansible.builtin.import_tasks: tasks/ssh_config.yml
      vars:
        claude_ssh_state: present
        claude_ssh_vms:
          - name: "{{ claude_vm_addressed[0].name }}"
            address: "{{ claude_vm_addressed[0].address }}"
            user: "{{ vm_user }}"
            workspace: "{{ claude_code_root }}"

    - name: Look for the folder on the VM
      ansible.builtin.stat:
        path: "{{ claude_code_target }}"
        follow: true
        get_checksum: false
      delegate_to: "{{ claude_vm_names[0] }}"
      register: claude_code_found
      ignore_unreachable: true

    # The first connection of this run when vm_projects_dir is set.
    - name: Fail when SSH to the VM does not work for the folder
      vars:
        claude_code_ssh: "{{ claude_code_found }}"
      ansible.builtin.assert:
        that: not (claude_code_ssh.unreachable | default(false))
        fail_msg: "{{ claude_code_ssh_failed }}"
        quiet: true

    # Only to explain a miss: what the projects directory does hold, and a
    # name that differs from the one asked for only in case - Linux paths are
    # case-sensitive, and ParkBnb is not parkbnb.
    - name: List the projects on the VM
      ansible.builtin.find:
        paths: "{{ claude_code_root }}"
        file_type: directory
        recurse: false
      delegate_to: "{{ claude_vm_names[0] }}"
      register: claude_code_listing
      when:
        - claude_code_project | length > 0
        - not (claude_code_found.stat.isdir | default(false))

    - name: Fail when the folder is not there
      vars:
        claude_code_names: >-
          {{ claude_code_listing.files | default([]) | map(attribute='path') | map('basename') | sort | list }}
        claude_code_close: >-
          {{ claude_code_names | select('match', '(?i)^' ~ (claude_code_project | regex_escape) ~ '$') | list }}
        # find lists a path that does not exist under skipped_paths.
        claude_code_root_there: >-
          {{ claude_code_listing is not skipped
             and claude_code_listing.skipped_paths | default({}) | length == 0 }}
      ansible.builtin.assert:
        that: claude_code_found.stat.isdir | default(false)
        fail_msg: >-
          {%- if claude_code_project and claude_code_found.stat.exists | default(false) -%}
          {{ claude_code_target }} on {{ claude_vm_names[0] }} is a file, not a project folder.
          {%- elif claude_code_project and claude_code_names -%}
          There is no project named {{ claude_code_project }} in {{ claude_code_root }} on {{ claude_vm_names[0] }}.
          {{ 'Did you mean ' ~ claude_code_close | join(' or ') ~ '? Folder names are case-sensitive.'
             if claude_code_close else 'The projects there are: ' ~ claude_code_names | join(', ') ~ '.' }}
          {%- elif claude_code_project and claude_code_root_there | bool -%}
          {{ claude_code_root }} on {{ claude_vm_names[0] }} holds no projects yet.
          `make configure VM_NAME={{ claude_vm_names[0] }}` clones your repositories into it.
          {%- else -%}
          {{ claude_code_root }} does not exist on {{ claude_vm_names[0] }} yet: the VM has not been configured,
          or vm_projects_dir points somewhere else. `make configure VM_NAME={{ claude_vm_names[0] }}` creates it and
          clones your repositories into it.
          {%- endif -%}
        quiet: true

    - name: Look for VS Code on this machine
      ansible.builtin.command:
        argv: [which, code]
      register: claude_code_which
      changed_when: false
      failed_when: false

    - name: Fail when VS Code's command is not on PATH
      ansible.builtin.assert:
        that: claude_code_which.rc == 0
        fail_msg: >-
          `code` is not on this machine's PATH. In VS Code, run "Shell Command: Install 'code' command
          in PATH" from the Command Palette (macOS), or install VS Code; then run this again. The alias
          is in place either way: ssh {{ claude_vm_names[0] }}.
        quiet: true

    - name: List VS Code's extensions
      ansible.builtin.command:
        argv: [code, --list-extensions]
      register: claude_code_extensions
      changed_when: false

    - name: Install the Remote - SSH extension when VS Code lacks it
      ansible.builtin.command:
        argv: [code, --install-extension, ms-vscode-remote.remote-ssh]
      when: "'ms-vscode-remote.remote-ssh' not in (claude_code_extensions.stdout_lines | map('lower') | list)"
      changed_when: true

    # The one write on the VM, as the VM user, last: every refusal above
    # leaves the VM as it was. An unchanged file is not rewritten, so a run
    # that only reopens a window reports no change there.
    - name: Make the directory for VS Code workspace files on the VM
      ansible.builtin.file:
        path: "{{ claude_code_ws_file | dirname }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ claude_vm_names[0] }}"
      when: claude_code_terminal

    - name: Write the VS Code workspace on the VM
      ansible.builtin.copy:
        dest: "{{ claude_code_ws_file }}"
        content: "{{ claude_code_workspace_file | to_nice_json(indent=2) }}\n"
        mode: "0644"
      delegate_to: "{{ claude_vm_names[0] }}"
      when: claude_code_terminal

    # VS Code opens a path ending in .code-workspace as a workspace, not as a
    # file to edit; the same workspace already open is focused, and its task
    # is not run a second time.
    - name: Open the folder in VS Code
      ansible.builtin.command:
        argv:
          - code
          - --remote
          - ssh-remote+{{ claude_vm_names[0] }}
          - "{{ claude_code_ws_file if claude_code_terminal else claude_code_target }}"
      changed_when: true

    # What VS Code will ask, from what the user's own settings say. "off" set
    # by the user is the one value that silences both the question and the
    # task; unset, VS Code asks once and Allow writes "on".
    - name: Say what was opened
      vars:
        # Trust covers a folder's children, and a workspace is trusted when its
        # folder and its file both are: with the files beside the projects,
        # trusting the whole directory's window once covers every project.
        claude_code_trust_once: >-
          {{ '' if not claude_code_ws_dir.startswith(claude_code_root ~ '/')
             else 'Trusting this window trusts every project in ' ~ claude_code_root ~ '.'
                  if claude_code_project | length == 0
             else 'Trusting the window of make code VM_NAME=' ~ claude_vm_names[0] ~ ' instead trusts every project in '
                  ~ claude_code_root ~ ' at once.' }}
        claude_code_first_time: >-
          {{ 'It will not start on its own: task.allowAutomaticTasks is "off" in ' ~ claude_code_settings_file
             ~ '. Choose Allow under "Tasks: Manage Automatic Tasks" to change that, or start it each time with'
             ~ ' "Tasks: Run Task", Claude.'
             if claude_code_auto_tasks == 'off'
             else 'The first time, it waits for you: trust the window (the Restricted Mode banner, Manage, Trust)'
                  ~ (', then choose Allow when VS Code asks about automatic tasks' if claude_code_auto_tasks != 'on' else '')
                  ~ '. ' ~ claude_code_trust_once }}
        claude_code_said:
          - VS Code is opening {{ claude_code_target }} on {{ claude_vm_names[0] }} ({{ claude_code_reach }}).
          - The first connection installs VS Code Server on the VM and takes a minute.
          - >-
            {{ 'A terminal named Claude then starts claude in it, signing in to Claude first if '
               ~ claude_vm_names[0] ~ ' has not been. ' ~ claude_code_first_time if claude_code_terminal else '' }}
      ansible.builtin.debug:
        msg: "{{ claude_code_said | select | join(' ') | trim }}"
