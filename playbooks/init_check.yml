---
# just init's second step: check, read-only, what just deploy will need of
# Proxmox, with the settings exactly as just deploy will read them - this run
# loads the project's inventory and the vault, where init_settings.yml could
# not.
#
#   just init            after its questions, when the vault can be opened
#
# Configured yet? With the host's address or the token's secret still the
# example's, nothing is checked, and the run says what is missing. Then: the
# vault is encrypted; the API answers and takes the token; the token holds
# every privilege the project uses on /vms; the template exists, and while it
# does not, root SSH to the Proxmox host works (the template is built over it),
# which also says the host's node name. Then what the defaults leave to the
# host: the node, worked out - the template's, the only one, or the one SSH
# reached - and never chosen; and the storage for VM disks and the template's
# bridge, each listed with what the token can use. Last, the VMs will get an SSH
# key. Each check reports ok, a problem, or why it was skipped, and the run
# fails when any found a problem - a scripted just init then exits non-zero -
# though "not configured yet" is none. NEXT STEPS then gives each problem with
# its fix, or, once there is none, just deploy.
#
# It writes only local.yml, through tasks/init_local_setting.yml, and only at
# a terminal (init_ask) or for a value given on the command line (--storage,
# --bridge): the node when the default is not it, the storage or bridge chosen.
# Everything else is a read (tests/unit/test_init_check.py holds both), and
# root SSH may add the host's key to ~/.ssh/known_hosts, as the template build
# would, one of the two files the project writes there. Every name it sets
# starts with init_, like init_settings.yml's.
- name: Check what just deploy will need of Proxmox
  hosts: localhost
  gather_facts: false
  vars:
    # As in init_settings.yml: true only when just init sees a terminal, and
    # the values given on the command line - here storage and bridge.
    init_ask: false
    init_given: {}
    init_vault_file: "{{ playbook_dir | dirname }}/inventory/group_vars/all/vault.yml"
    init_local_file: "{{ playbook_dir | dirname }}/inventory/group_vars/all/local.yml"
    # Where to look for a public key when the VMs would get none.
    init_ssh_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
    init_secret_placeholder: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    init_host_placeholder: 192.0.2.10
    # The privileges the token needs on /vms, as the pveum role in
    # docs/getting-started/proxmox-access.md grants them; the guest agent's
    # depends on the version (init_agent_privilege). The storage's and the
    # bridge's are checked where each is settled on, on its own path.
    init_token_privileges:
      vms:
        - VM.Allocate
        - VM.Clone
        - VM.Config.CPU
        - VM.Config.Cloudinit
        - VM.Config.Disk
        - VM.Config.Memory
        - VM.Config.Network
        - VM.Config.Options
        - VM.PowerMgmt
        - VM.Audit
      storage: [Datastore.AllocateSpace, Datastore.Audit]
      bridge: [SDN.Use]
    init_endpoint: >-
      {{ '[' ~ proxmox_api_host ~ ']' if proxmox_api_host is search(':.*:') and proxmox_api_host is not match('[[]')
         else proxmox_api_host }}:{{ proxmox_api_port }}
    init_token: "{{ proxmox_api_user }}!{{ proxmox_api_token_id }}"
    init_proxmox_host: "{{ groups['proxmox'][0] if groups['proxmox'] | default([]) else '' }}"
    init_missing: >-
      {{ (['the Proxmox host address (inventory/hosts.yml)']
          if proxmox_api_host | default('') in ['', init_host_placeholder] else [])
         + (['the API token secret (the vault)']
            if vault_proxmox_api_token_secret | default('', true) in ['', init_secret_placeholder] else []) }}
    init_api_ok: "{{ init_version.status | default(0) == 200 }}"
    init_major: "{{ (init_version.json.data.version | default('0')).split('.')[0] | int }}"
    init_agent_privilege: "{{ 'VM.GuestAgent.Audit' if init_major | int >= 9 else 'VM.Monitor' }}"
    # Listed with 1: granted on /vms and, propagated, on each VM under it,
    # where Proxmox checks them; 0 is granted on /vms alone.
    init_vms_privileges: "{{ (init_permissions.json.data | default({}, true))['/vms'] | default({}, true) }}"
    init_privileges_wanted: "{{ init_token_privileges.vms + [init_agent_privilege] }}"
    init_privileges_missing: "{{ init_privileges_wanted | reject('in', init_vms_privileges) | list }}"
    init_privileges_unpropagated: >-
      {{ init_privileges_wanted | select('in', init_vms_privileges)
         | select('in', init_vms_privileges | dict2items | selectattr('value', 'equalto', 0) | map(attribute='key') | list)
         | list }}
    # The template as just deploy finds it: a VM of that name that is a
    # template. Without one, deploy builds it at proxmox_template_vmid, which
    # must then be free.
    init_listing: "{{ claude_vm_all.json.data | default([]) if init_listed | default(false) | bool else [] }}"
    init_template: >-
      {{ init_listing | selectattr('type', 'equalto', 'qemu') | selectattr('name', 'defined')
         | selectattr('name', 'equalto', proxmox_template_name) | selectattr('template', 'defined')
         | selectattr('template', 'truthy') | list | first | default({}) }}
    init_template_built: "{{ init_template | length > 0 }}"
    init_vmid_holder: >-
      {{ init_listing | selectattr('vmid', 'equalto', proxmox_template_vmid | int) | list | first | default({}) }}
    init_down_nodes: "{{ init_nodes.json.data | default([]) | rejectattr('status', 'equalto', 'online') | map(attribute='node') | list }}"
    # A template just deploy rebuilds, as it rebuilds one that differs from what its settings would build, unless
    # proxmox_template_rebuild is off; it needs root SSH as a missing one does.
    init_template_rebuilt: >-
      {{ init_template_built | bool and proxmox_template_drift | default([]) | length > 0
         and proxmox_template_rebuild | default(true) | bool }}
    init_ssh_wanted: >-
      {{ init_proxmox_host | length > 0 and (not init_template_built | bool or init_template_rebuilt | bool) }}
    init_ssh_address: "{{ hostvars[init_proxmox_host].ansible_host | default(init_proxmox_host) }}"
    init_local_settings: "{{ (init_local_read.content | b64decode | from_yaml) or {} }}"

    # The node is worked out, never chosen: the clone is sent to proxmox_node,
    # which must hold the template, and the template is built on the host
    # hosts.yml reaches. So it is the template's node; without a template, the
    # only node there is, or the node the host SSH reached says it is.
    init_all_nodes: "{{ init_nodes.json.data | default([]) | map(attribute='node') | list }}"
    init_online_nodes: >-
      {{ init_nodes.json.data | default([]) | selectattr('status', 'equalto', 'online') | map(attribute='node') | list }}
    init_node_derived: >-
      {{ init_template.node if init_template_built | bool
         else init_online_nodes[0] if init_online_nodes | length == 1
         else init_ssh_node | default('') }}
    init_node_why: >-
      {{ 'the template is on ' ~ init_node_derived if init_template_built | bool
         else init_node_derived ~ ' is the only node' if init_online_nodes | length == 1
         else init_ssh_address ~ ' is node ' ~ init_node_derived }}
    init_node_set: "{{ 'proxmox_node' in init_local_settings }}"
    init_node_writes: >-
      {{ init_node_derived | length > 0 and init_node_derived in init_all_nodes and init_node_derived != proxmox_node
         and not init_node_set | bool }}
    # The node the storages and bridges are listed on: the one worked out, once
    # it is known and up. Before that, nothing is listed, asked or written for them.
    init_node: "{{ init_node_derived }}"
    init_node_known: >-
      {{ init_listed | default(false) | bool and init_nodes.status | default(0) == 200
         and init_node_derived | length > 0 and init_node_derived in init_all_nodes }}
    init_node_listable: "{{ init_node_known | bool and init_node in init_online_nodes }}"
    # Why the storage and the bridge could not be checked, when they could not.
    init_unchecked_why: >-
      {{ 'the API did not answer' if not init_api_ok | bool
         else 'Proxmox would not list the cluster' if not init_listed | default(false) | bool
         else 'Proxmox would not list its nodes' if init_nodes.status | default(0) != 200
         else 'the node is not known yet' if not init_node_known | bool
         else 'node ' ~ init_node ~ ' is not up' }}
    init_template_bridge: >-
      {{ (init_template_config.json.data.net0 | default('')) | regex_findall('bridge=([^,]+)') | first | default('') }}

    # What the checks found wrong, which fails the run; and what they could
    # not check, which is no problem of its own, its cause usually one.
    init_problems: "{{ init_results | default([]) | rejectattr('ok') | rejectattr('skipped', 'defined') | list }}"
    init_unchecked: "{{ init_results | default([]) | selectattr('skipped', 'defined') | list }}"
    # The one value init_settings.yml asks for that just deploy needs and no
    # check here reads: while it is the example's, init_settings.yml's NEXT
    # STEPS names it, and just deploy is not next.
    init_github_placeholder: your-github-username
    init_github_set: "{{ github_username | default('', true) | string not in ['', init_github_placeholder] }}"
    init_deploy_next: "Next: just deploy alpha, which creates a VM named alpha (any name will do)."
    # What is left to do, as the report and the failure say it, for NEXT
    # STEPS: each problem with its fix; what could not be checked, when
    # nothing is wrong; otherwise just deploy. A template that renders nothing
    # is none, hence the string beside it.
    init_left: "{{ init_left_lines | default('', true) | trim }}"
    init_left_lines: |-
      {% if init_problems | length > 0 %}
      {% set one = init_problems | length == 1 %}
      just init found {{ init_problems | length }} problem{{ '' if one else 's' }} for just deploy: fix {{ 'it' if one else 'them' }}, then run just init again.
      {% for result in init_problems %}
        !!   {{ result.text }}
      {% endfor %}
      {% elif init_unchecked | length > 0 %}
      just init could not check all that just deploy needs: run it again once it can.
      {% for result in init_unchecked %}
        --   {{ result.text }}
      {% endfor %}
      {% elif init_github_set | bool %}
      {{ init_deploy_next }}
      {% endif %}
  tasks:
    - name: Say what is not set yet
      ansible.builtin.debug:
        msg: >-
          Proxmox is not checked yet: {{ init_missing | join(' and ') }} {{ 'is' if init_missing | length == 1
          else 'are' }} still the example's. just init asks for {{ 'it' if init_missing | length == 1 else 'them' }}.
      when: init_missing | length > 0

    - name: Stop until there is something to check
      ansible.builtin.meta: end_play
      when: init_missing | length > 0

    - name: Read local.yml
      ansible.builtin.slurp:
        src: "{{ init_local_file }}"
      register: init_local_read

    # -------------------------------------------------------------- the vault ---
    # Plaintext, it holds the secret: only whether it starts as an encrypted
    # vault does is kept.
    - name: Read the vault's first line
      ansible.builtin.slurp:
        src: "{{ init_vault_file }}"
      register: init_vault_read
      no_log: true

    - name: Record whether the vault is encrypted
      ansible.builtin.set_fact:
        init_vault_encrypted: "{{ (init_vault_read.content | b64decode).startswith('$ANSIBLE_VAULT') }}"
      no_log: true

    - name: Record the vault's result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results | default([]) + [{'ok': init_vault_encrypted | bool, 'text':
             'vault.yml is encrypted' if init_vault_encrypted | bool
             else 'vault.yml is not encrypted, and every recipe refuses it: just vault encrypts it'}] }}

    # ---------------------------------------------------------------- the API ---
    # The request carries the token, so it is no_log; what is said comes from
    # its status and message alone.
    - name: Ask Proxmox for its version
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/version"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_version
      check_mode: false
      failed_when: false
      no_log: true

    - name: Record the API's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [{'ok': init_api_ok | bool, 'text': init_api_said}] }}"
      vars:
        init_api_message: "{{ init_version.msg | default('') | plain_text | trim }}"
        init_api_said: >-
          {{ 'Proxmox VE ' ~ init_version.json.data.version ~ ' at ' ~ init_endpoint ~ ' accepted ' ~ init_token
             if init_api_ok | bool else
             'Proxmox at ' ~ init_endpoint ~ ' refused the token ' ~ init_token ~ ' (' ~ init_version.status ~ '):'
             ~ ' a token named otherwise goes in local.yml as proxmox_api_user and proxmox_api_token_id, and'
             ~ ' just vault fixes a wrong secret'
             if init_version.status | default(0) in [401, 403] else
             "https://" ~ init_endpoint ~ "'s certificate names another host (" ~ init_api_message ~ '): reach'
             ~ ' Proxmox by a name or address its certificate holds, or leave proxmox_validate_certs off'
             if init_api_message is search('mismatch|match target host|not valid for') else
             "https://" ~ init_endpoint ~ "'s certificate is not trusted (" ~ init_api_message ~ '): trust the'
             ~ ' Proxmox CA as docs/getting-started/proxmox-access.md says, or leave proxmox_validate_certs off'
             if init_api_message is search('CERTIFICATE_VERIFY_FAILED|certificate verify failed') else
             'nothing answered at https://' ~ init_endpoint ~ ' (' ~ init_api_message ~ '): check the address in'
             ~ ' inventory/hosts.yml, and that this machine reaches it'
             if init_version.status | default(-1) == -1 else
             'Proxmox at ' ~ init_endpoint ~ ' answered ' ~ init_version.status ~ ': ' ~ init_api_message }}

    # ----------------------------------------------------------- privileges ---
    # The privileges in effect at /vms, inherited ones included. The 1 or 0 by
    # each is its propagate flag, not whether it is granted: being listed is.
    - name: Ask Proxmox what the token may do on /vms
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/access/permissions?path=/vms"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_permissions
      check_mode: false
      failed_when: false
      no_log: true
      when: init_api_ok | bool

    - name: Record the privileges' result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': init_permissions.status == 200 and init_privileges_missing | length == 0
                                     and init_privileges_unpropagated | length == 0, 'text': init_privileges_said}] }}
      vars:
        init_privileges_said: >-
          {{ ('Proxmox would not say what the token may do (' ~ init_permissions.status ~ ' '
              ~ init_permissions.msg | default('') | plain_text | trim ~ ')')
             if init_permissions.status != 200 else
             ('the token holds no privilege on /vms at all. A token made with privilege separation (the default,'
              ~ " --privsep 1) has none of its user's: make it with --privsep 0, or give the token itself the"
              ~ " role: pveum aclmod /vms -token '" ~ init_token ~ "' -role AnsibleVM"
              ~ ' (docs/getting-started/proxmox-access.md)')
             if init_privileges_missing | length == init_privileges_wanted | length else
             ('the token lacks ' ~ init_privileges_missing | join(', ') ~ ' on /vms: add '
              ~ ('them' if init_privileges_missing | length > 1 else 'it') ~ ' to its role, the one'
              ~ " docs/getting-started/proxmox-access.md calls AnsibleVM: pveum role modify AnsibleVM -append 1 -privs '"
              ~ init_privileges_missing | join(' ') ~ "'")
             if init_privileges_missing | length > 0 else
             ('the token holds ' ~ init_privileges_unpropagated | join(', ') ~ ' on /vms but not on the VMs under'
              ~ " it, where Proxmox checks them: its ACL on /vms has Propagate off. Turn it on: pveum aclmod /vms"
              ~ ' -user ' ~ proxmox_api_user ~ ' -role AnsibleVM -propagate 1')
             if init_privileges_unpropagated | length > 0 else
             'the token holds every privilege the project uses on /vms' }}
      when: init_api_ok | bool

    # ----------------------------------------------------------- the template ---
    # A listing that fails is a problem said with the rest, not the end of the run.
    - name: List the cluster
      when: init_api_ok | bool
      block:
        - name: List every VM in the cluster
          ansible.builtin.import_tasks: tasks/cluster_vms.yml

        - name: Note that the cluster was listed
          ansible.builtin.set_fact:
            init_listed: true
      rescue:
        - name: Record that the cluster could not be listed
          ansible.builtin.set_fact:
            init_results: >-
              {{ init_results + [{'ok': false, 'text': 'Proxmox would not list the VMs ('
                 ~ claude_vm_all.status | default('') ~ ' ' ~ claude_vm_all.msg | default('') | plain_text | trim
                 ~ ')'}] }}

    - name: Ask Proxmox for its nodes
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_nodes
      check_mode: false
      failed_when: false
      no_log: true
      when: init_api_ok | bool

    # Read here, before root SSH is checked: a template that differs from what its settings would build is rebuilt
    # by just deploy, over root SSH, as a missing one is built. Its bridge is checked from it below.
    - name: Read the template's configuration
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ init_template.node }}/qemu/{{ init_template.vmid }}/config"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_template_config
      check_mode: false
      failed_when: false
      no_log: true
      when: init_template_built | bool and init_template.node in init_online_nodes

    # roles/proxmox_template's drift entry point, which deploy.yml runs too: a set_fact, changing nothing.
    - name: Compare the template with what its settings would build
      ansible.builtin.include_role:
        name: proxmox_template
        tasks_from: drift
      vars:
        proxmox_template_drift_config: "{{ init_template_config.json.data | default({}) }}"
      when: init_template_built | bool and init_template_config.status | default(0) == 200

    - name: Record the template's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [init_template_result] }}"
      vars:
        init_holder_where: >-
          {{ init_vmid_holder.node | default('') ~ (', which is down' if init_vmid_holder.node | default('')
             in init_down_nodes else '') }}
        init_template_differences: "{{ proxmox_template_drift | default([]) | join('; ') }}"
        init_template_result: >-
          {{ {'ok': true,
              'text': 'the template ' ~ proxmox_template_name ~ ' on ' ~ init_template.node ~ ' differs from its'
                      ~ ' settings (' ~ init_template_differences ~ '): just deploy rebuilds it, over root SSH'}
             if init_template_rebuilt | bool else
             {'ok': true,
              'text': 'the template ' ~ proxmox_template_name ~ ' on ' ~ init_template.node ~ ' differs from its'
                      ~ ' settings (' ~ init_template_differences ~ '), and is kept as it is since'
                      ~ ' proxmox_template_rebuild is false, so just deploy needs no root SSH'}
             if init_template_built | bool and init_template_differences | length > 0 else
             {'ok': true,
              'text': 'the template ' ~ proxmox_template_name ~ ' is on ' ~ init_template.node
                      ~ ', so just deploy needs no root SSH'}
             if init_template_built | bool else
             {'ok': false,
              'text': 'there is no template ' ~ proxmox_template_name ~ ' yet, and VMID ' ~ proxmox_template_vmid
                      ~ ', where just deploy would build it, is taken by '
                      ~ (init_vmid_holder.name | default('a ' ~ init_vmid_holder.type | default('guest')))
                      ~ ' on ' ~ init_holder_where ~ ': set proxmox_template_vmid to a free VMID in local.yml, or'
                      ~ ' proxmox_template_name to the template there'}
             if init_vmid_holder | length > 0 else
             {'ok': true,
              'text': 'there is no template ' ~ proxmox_template_name ~ ' yet: just deploy builds it at VMID '
                      ~ proxmox_template_vmid ~ ', over root SSH'} }}
      when: init_listed | default(false) | bool

    - name: Record that no host can build the template
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': false, 'text': 'the template '
             ~ ('differs from its settings' if init_template_rebuilt | bool else 'is not built yet')
             ~ ', and just deploy builds it over SSH to the host of the proxmox group in inventory/hosts.yml, which'
             ~ ' has none'}] }}
      when: (not init_template_built | bool or init_template_rebuilt | bool) and init_proxmox_host | length == 0

    # -------------------------------------------------------------- root SSH ---
    # Only while the template is missing or is to be rebuilt, or Proxmox would not
    # say: the build is the one step that connects to the host, as root, with
    # these settings.
    # Its short host name is the host's Proxmox node name.
    - name: Run hostname on the Proxmox host over root SSH
      ansible.builtin.command:
        argv: [hostname, -s]
      # Rendered even when the task is skipped: never empty.
      delegate_to: "{{ init_proxmox_host | default('localhost', true) }}"
      register: init_ssh
      changed_when: false
      check_mode: false
      failed_when: false
      ignore_unreachable: true
      when: init_ssh_wanted | bool

    - name: Record root SSH's result
      ansible.builtin.set_fact:
        init_ssh_node: "{{ init_ssh.stdout | default('') | trim if init_ssh_ok | bool else '' }}"
        init_results: >-
          {{ init_results + [{'ok': init_ssh_ok | bool, 'text':
             ('root SSH to ' ~ init_ssh_address ~ ' works, and it is node ' ~ init_ssh.stdout | trim
              ~ (' (just deploy rebuilds the template)' if init_template_rebuilt | bool
                 else ' (the template is not built yet)' if init_listed | default(false) | bool
                 else ' (whether the template is built could not be checked)'))
             if init_ssh_ok | bool else
             ('root SSH to ' ~ init_ssh_address ~ ' failed (' ~ (init_ssh.msg | default(init_ssh.stderr | default('')))
              | plain_text | trim | truncate(300) ~ '): just deploy builds the template over it. Install your key'
              ~ ' with ssh-copy-id root@' ~ init_ssh_address)}] }}
      vars:
        init_ssh_ok: "{{ not (init_ssh.unreachable | default(false)) and init_ssh.rc | default(1) == 0 }}"
      when: init_ssh_wanted | bool

    # --------------------------------------------------------------- the node ---
    - name: Record the node's result
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [init_node_result] }}"
      vars:
        init_node_result: >-
          {{ {'ok': false, 'text': 'Proxmox would not list its nodes (' ~ init_nodes.status | default('')
              ~ ' ' ~ init_nodes.msg | default('') | plain_text | trim ~ ')'}
             if init_nodes.status | default(0) != 200 else
             {'ok': false, 'text': 'which node ' ~ init_ssh_address ~ ' is cannot be told until root SSH to it works,'
              ~ ' and the cluster has ' ~ init_all_nodes | join(', ') ~ ': just deploy builds the template there and'
              ~ ' clones it on proxmox_node (' ~ proxmox_node ~ ')'}
             if init_node_derived | length == 0 else
             {'ok': false, 'text': init_node_why ~ ', but the cluster has no node ' ~ init_node_derived ~ ' ('
              ~ init_all_nodes | join(', ') ~ '): set proxmox_node in local.yml to the node that host is'}
             if init_node_derived not in init_all_nodes else
             {'ok': true, 'text': 'node ' ~ proxmox_node ~ ': ' ~ ('it holds the template, and just deploy creates the'
              ~ ' VMs there' if init_template_built | bool else 'just deploy builds the template there, and creates'
              ~ ' the VMs there')}
             if init_node_derived == proxmox_node else
             {'ok': true, 'text': 'node ' ~ init_node_derived ~ ': written into local.yml as proxmox_node, since '
              ~ init_node_why}
             if init_node_writes | bool and init_ask | bool else
             {'ok': false, 'text': init_node_why ~ ', but proxmox_node is ' ~ proxmox_node ~ ', and VMs are cloned on'
              ~ ' the node that holds the template: set proxmox_node: ' ~ init_node_derived ~ ' in local.yml'
              ~ (', or build a template on ' ~ proxmox_node ~ ' with a proxmox_template_name of its own'
                 if init_node_set | bool else ' (just init at a terminal writes it)')} }}
      when: init_listed | default(false) | bool

    # ------------------------------------------------------------ the storage ---
    # What the node lists for VM disks is filtered by the token's own rights
    # (Datastore.Audit or AllocateSpace), so a storage another project grants
    # it - the homeserver's - is listed without being named here.
    - name: List the storages for VM disks on the node
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ init_node }}/storage?content=images&enabled=1"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_storages
      check_mode: false
      failed_when: false
      no_log: true
      when: init_node_listable | bool

    - name: Ask Proxmox what the token may do on each storage
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/access/permissions?path=/storage/{{ item.storage | urlencode }}"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_storage_privileges
      check_mode: false
      failed_when: false
      no_log: true
      loop: "{{ init_storages.json.data | default([]) if init_node_listable | bool else [] }}"

    # ------------------------------------------------------------- the bridge ---
    # Every clone inherits the template's NIC, so with a template the bridge is
    # its net0's, and only SDN.Use on it is checked; without one, proxmox_bridge
    # is the one the build will use, listed and suggested as the storage is.
    # Bridges of the local zone only: an SDN VNet is neither listed nor checked.
    - name: List the bridges on the node
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ init_node }}/network?type=any_local_bridge"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_bridges
      check_mode: false
      failed_when: false
      no_log: true
      when: init_node_listable | bool and not init_template_built | bool

    - name: Ask Proxmox what the token may do on each bridge
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/access/permissions?path=/sdn/zones/localnetwork/{{ item.iface | urlencode }}"
        headers: "{{ proxmox_api_headers }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        ca_path: "{{ proxmox_api_ca_path | default(omit, true) }}"
        timeout: 10
      register: init_bridge_privileges
      check_mode: false
      failed_when: false
      no_log: true
      loop: >-
        {{ ([{'iface': init_template_bridge}] if init_template_built | bool and init_template_bridge | length > 0
            else init_bridges.json.data | default([]) if init_node_listable | bool and not init_template_built | bool
            else []) }}

    # -------------------------------------------------------- the values given ---
    # Every value given is held to what the node lists before anything is
    # written, so a bridge that will not do leaves the storage unwritten too.
    # Where it cannot be held to anything yet - the node unknown, a listing
    # refused - it is refused, rather than written unchecked or dropped.
    - name: Refuse a value given that cannot be checked yet
      ansible.builtin.fail:
        msg: >-
          {{ init_given_unchecked | join(' and ') }} cannot be checked yet ({{ init_unchecked_why if not
          init_node_listable | bool else 'Proxmox would not list them' }}), so just init does not write
          {{ 'it' if init_given_unchecked | length == 1 else 'them' }}: fix what the lines above say, and run it again.
      vars:
        init_given_unchecked: >-
          {{ (['--storage ' ~ init_given.storage]
              if init_given.storage is defined
                 and (not init_node_listable | bool or init_storages.status | default(0) != 200) else [])
             + (['--bridge ' ~ init_given.bridge]
                if init_given.bridge is defined and not init_template_built | bool
                   and (not init_node_listable | bool or init_bridges.status | default(0) != 200) else []) }}
      when: init_given_unchecked | length > 0

    # A bridge given while the template exists: the template's own is nothing to
    # do, so a scripted just init runs again; another cannot apply, clones take
    # the template's NIC.
    - name: Refuse a bridge given that is not the template's
      ansible.builtin.fail:
        msg: >-
          --bridge {{ init_given.bridge }}: the template {{ proxmox_template_name }} is built, and every clone takes
          its NIC, on {{ init_template_bridge or 'its bridge' }}. --bridge matters only before the template is built.
      when: init_given.bridge is defined and init_template_built | bool and init_given.bridge != init_template_bridge

    - name: Check the storage given before anything is written
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars:
        <<: &init_storage
          init_choose_setting: proxmox_storage
          init_choose_what: storage
          init_choose_value: "{{ proxmox_storage }}"
          init_choose_set: "{{ 'proxmox_storage' in init_local_settings }}"
          init_choose_given: "{{ init_given.storage | default('') }}"
          init_choose_flag: --storage
          init_choose_candidates: >-
            {{ init_storage_privileges.results | default([])
               | init_candidates('storage', '/storage/', init_token_privileges.storage) }}
          init_choose_path: /storage/
          init_choose_node: "{{ init_node }}"
          init_choose_seen_by: [Datastore.Audit, Datastore.AllocateSpace]
        init_choose_only_check: true
      when: init_given.storage is defined and init_node_listable | bool and init_storages.status | default(0) == 200

    - name: Check the bridge given before anything is written
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars:
        <<: &init_bridge
          init_choose_setting: proxmox_bridge
          init_choose_what: bridge
          init_choose_value: "{{ proxmox_bridge }}"
          init_choose_set: "{{ 'proxmox_bridge' in init_local_settings }}"
          init_choose_given: "{{ init_given.bridge | default('') }}"
          init_choose_flag: --bridge
          init_choose_candidates: >-
            {{ init_bridge_privileges.results | default([])
               | init_candidates('iface', '/sdn/zones/localnetwork/', init_token_privileges.bridge) }}
          init_choose_path: /sdn/zones/localnetwork/
          init_choose_node: "{{ init_node }}"
          init_choose_seen_by: [SDN.Audit, SDN.Use]
          init_choose_unlisted_note: " (a bridge of the local zone: an SDN VNet is not checked here)"
        init_choose_only_check: true
      when: >-
        init_given.bridge is defined and not init_template_built | bool
        and init_node_listable | bool and init_bridges.status | default(0) == 200

    # ------------------------------------------------------------- the writes ---
    - name: Write proxmox_node into local.yml
      ansible.builtin.include_tasks: tasks/init_local_setting.yml
      vars:
        init_setting_key: proxmox_node
        init_setting_value: "{{ init_node_derived }}"
      when: (init_ask | bool) and init_node_known | bool and init_node_writes | bool

    - name: Settle the storage
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars: *init_storage
      when: init_node_listable | bool and init_storages.status | default(0) == 200

    - name: Settle the bridge
      ansible.builtin.include_tasks: tasks/init_choose.yml
      vars: *init_bridge
      when: init_node_listable | bool and not init_template_built | bool and init_bridges.status | default(0) == 200

    # The template's bridge: SDN.Use on it, nothing to choose; and a template
    # with none on net0 is no template a VM can be reached through.
    - name: Record the template's bridge's result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': init_template_bridge | length > 0 and init_lacks | length == 0, 'text':
             ("the template's net0 has no bridge, or its configuration could not be read: every clone inherits"
              ~ ' that NIC, so its VMs would be unreachable. Rebuild the template (just deploy --only template, after'
              ~ ' removing it), with proxmox_bridge set')
             if init_template_bridge | length == 0 else
             ('bridge ' ~ init_template_bridge ~ ", the template's: the token has SDN.Use on it")
             if init_lacks | length == 0 else
             ('bridge ' ~ init_template_bridge ~ ", the template's, which every clone inherits: the token lacks"
              ~ ' SDN.Use on /sdn/zones/localnetwork/' ~ init_template_bridge ~ ': pveum aclmod'
              ~ ' /sdn/zones/localnetwork/' ~ init_template_bridge ~ ' -user ' ~ proxmox_api_user ~ ' -role AnsibleVM')}] }}
      vars:
        init_lacks: >-
          {{ (init_bridge_privileges.results | default([])
              | init_candidates('iface', '/sdn/zones/localnetwork/', init_token_privileges.bridge)
              | first | default({'lacks': init_token_privileges.bridge})).lacks }}
      when: init_template_built | bool and init_template.node in init_online_nodes

    # What could not be listed is said, never passed over: the run ends on it.
    # A listing Proxmox refused is a problem; one that could not be made yet,
    # its cause already said, is noted.
    - name: Record what could not be checked
      ansible.builtin.set_fact:
        init_results: "{{ init_results + [item] }}"
      loop: >-
        {{ (([{'ok': false, 'skipped': true, 'text': 'the storage is not checked: ' ~ init_unchecked_why}]
             if not init_node_listable | bool else
             [{'ok': false, 'text': 'Proxmox would not list the storages on ' ~ init_node ~ ' ('
               ~ init_storages.status | default('') ~ ' ' ~ init_storages.msg | default('') | plain_text | trim ~ ')'}]
             if init_storages.status | default(0) != 200 else [])
            + ([{'ok': false, 'skipped': true, 'text': "the template's bridge is not checked: node "
                 ~ init_template.node ~ ' is not up'}]
               if init_template_built | bool and init_template.node not in init_online_nodes else
               [{'ok': false, 'skipped': true, 'text': 'the bridge is not checked: ' ~ init_unchecked_why}]
               if not init_template_built | bool and not init_node_listable | bool else
               [{'ok': false, 'text': 'Proxmox would not list the bridges on ' ~ init_node ~ ' ('
                 ~ init_bridges.status | default('') ~ ' ' ~ init_bridges.msg | default('') | plain_text | trim ~ ')'}]
               if not init_template_built | bool and init_bridges.status | default(0) != 200 else []))
           if init_api_ok | bool else [] }}
      loop_control:
        label: "{{ item.text }}"

    # ---------------------------------------------------- a renamed password ---
    # vault.yml's vm_password is vault_vm_password from 1.0; one still set would
    # give the VMs no password, so it is named here, before any deploy.
    - name: Record a console password under its old name
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': false, 'text': 'vault.yml sets vm_password, which is vault_vm_password from'
             ~ ' 1.0: rename it there, with just vault'}] }}
      when: vm_password | default('', true) | length > 0

    # ----------------------------------------------------------- the VM's key ---
    - name: Look for a public key, as the VMs would get none
      ansible.builtin.find:
        paths: "{{ init_ssh_dir }}"
        patterns: "*.pub"
      register: init_public_keys
      when: vm_ssh_public_keys | length == 0 and vault_vm_password | default('', true) | length == 0

    - name: Record the key's result
      ansible.builtin.set_fact:
        init_results: >-
          {{ init_results + [{'ok': vm_ssh_public_keys | length > 0, 'text':
             ('the VMs get ' ~ vm_ssh_public_keys | length ~ ' SSH key' ~ ('' if vm_ssh_public_keys | length == 1 else 's'))
             if vm_ssh_public_keys | length > 0 else
             ('the VMs get only vault_vm_password, which is for the Proxmox console: SSH to them takes a key, and just'
              ~ ' deploy configures them over SSH. Put yours in local.yml as vm_ssh_public_keys')
             if not init_keyless | bool else
             ('the VMs would get no SSH key, so just deploy refuses them: put yours in local.yml, as'
              ~ ' vm_ssh_public_keys: ["<the line in ' ~ (init_public_keys.files | map(attribute='path') | sort | first)
              ~ '>"]')
             if init_public_keys.files | default([]) | length > 0 else
             ('the VMs would get no SSH key, and ' ~ init_ssh_dir ~ ' has no public key: make one with ssh-keygen'
              ~ ' -t ed25519')}] }}
      vars:
        init_keyless: "{{ vm_ssh_public_keys | length == 0 and vault_vm_password | default('', true) | length == 0 }}"

    # ---------------------------------------------------------------- the end ---
    - name: Say what each check found
      ansible.builtin.debug:
        msg: |-
          {% for result in init_results %}
          {{ '  --   ' if result.skipped | default(false) else '  ok   ' if result.ok else '  !!   ' }}{{ result.text }}
          {% endfor %}
          {% if init_problems | length == 0 and init_unchecked | length == 0 and init_github_set | bool %}
          {{ init_deploy_next }}
          {% endif %}

    # NEXT STEPS (callback_plugins/claude_on_proxmox.py): each problem with its
    # fix, what could not be checked, or just deploy; nothing while only the
    # GitHub username is missing, which init_settings.yml's records. A run that
    # stopped at once, a value still the example's, records nothing.
    - name: Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          claude_vm_next: "{{ {'just init': {'init_check': init_left}} }}"
        aggregate: true
        per_host: false

    - name: Fail when a check found a problem
      ansible.builtin.fail:
        msg: >-
          just init found {{ init_problems | length }} problem{{ '' if init_problems | length == 1 else 's' }}
          (the lines marked !! above) for just deploy: fix {{ 'it' if init_problems | length == 1 else 'them' }},
          then run just init again.
      when: init_problems | length > 0
