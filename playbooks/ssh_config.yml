---
# Bring the SSH aliases on this machine back in step with the fleet.
#
#   just deploy --only ssh-config                   -> every VM tagged agent-warehouse
#   just deploy alpha --only ssh-config     -> only alpha, and nothing pruned
#
# `just deploy` and `just deploy --only configure` keep an alias for each VM they touch
# (playbooks/tasks/ssh_config.yml); this is for everything in between: a
# lease that moved, a VM deleted in the Proxmox UI, a second machine. It
# refreshes every tagged VM that has an address and, fleet-wide, prunes the
# aliases of VMs that are gone. Pruning only ever removes alias blocks from
# the managed file, never VMs, and a block is only ever written for a tagged
# VM, so a VM you run outside this project cannot be touched by it. What it
# will not prune: a name an untagged VM still carries (not this project's to
# reason about; reported), and anything while a tagged VM is listed without
# a name, which is what a node that is down looks like (held, and reported).
# What it always removes: an alias no VM may have - a name ssh reads as an
# address, or one the inventory reaches a host by - which an earlier version
# wrote. A block records the host its VM was found on (# origin), and the prune
# reads only this host's listing: a block of another host is never pruned here,
# and one with no record only while the checkout has this one host. Read-only
# against Proxmox.
- name: Refresh the SSH aliases from Proxmox
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Stop when the managed file is switched off
      ansible.builtin.debug:
        msg: claude_ssh_config is false, so this project keeps no SSH aliases on this machine. Nothing to do.
      when: not claude_ssh_config | default(true) | bool

    - name: End the play when the managed file is switched off
      ansible.builtin.meta: end_play
      when: not claude_ssh_config | default(true) | bool

    # Two VMs of one name are refused, as discovery refuses to configure them:
    # an alias is a name, and two tagged VMs called twin would leave `ssh
    # twin` pointing at whichever was written last.
    - name: Find the VMs asked for, and their addresses
      ansible.builtin.import_tasks: tasks/vms_requested.yml
      vars:
        claude_vm_dupes_tail: >-
          , so an alias of that name would point at one of them at random. Rename or remove the duplicates first.

    # What is kept already, for the prune below.
    - name: Read the aliases already kept
      ansible.builtin.set_fact:
        claude_ssh_existing: "{{ claude_ssh_blocks }}"

    # The workspace is only shown in the connect line, and this play never
    # connects to a VM to read its home: vm_projects_dir when it is set, and
    # otherwise the line says `just code`, which does. A tagged VM listed
    # without a name (a node that is down) cannot be an alias; it matters to
    # the prune alone.
    - name: Build an alias for each VM that can be reached
      ansible.builtin.set_fact:
        claude_ssh_refresh: >-
          {{ claude_ssh_refresh | default([]) + [{
               'name': claude_ssh_vm.name,
               'address': claude_ssh_vm.address,
               'user': vm_user,
               'workspace': vm_projects_dir | default('', true),
             }] }}
      loop: "{{ claude_vm_addressed | selectattr('name', 'defined') | list }}"
      loop_control:
        loop_var: claude_ssh_vm
        label: "{{ claude_ssh_vm.name }}"
      when: claude_ssh_vm.address | length > 0 or claude_ssh_host_domain | default('') | length > 0

    - name: Write the aliases
      ansible.builtin.import_tasks: tasks/ssh_config.yml
      vars:
        claude_ssh_state: present
        claude_ssh_vms: "{{ claude_ssh_refresh | default([]) }}"
      when: claude_ssh_refresh | default([]) | length > 0

    # What the write decided, which VMs got an alias, kept before the prune's
    # import of the same file sets its facts again for its own list.
    - name: Keep which aliases were refreshed
      ansible.builtin.set_fact:
        claude_ssh_refreshed: "{{ claude_ssh_written if claude_ssh_refresh | default([]) | length > 0 else [] }}"

    - name: Decide what to prune
      ansible.builtin.set_fact:
        claude_ssh_prune: >-
          {{ claude_ssh_existing
             | ssh_config_prune(claude_vm_all.json.data, claude_vm_tag_pattern, claude_vm_inventory_names,
                                claude_ssh_origin, claude_hosts_other | map(attribute='name') | list)
             if vm_name is not defined
             else {'prune': [], 'held': [], 'untagged': [], 'nameless': [], 'refused': [], 'elsewhere': [],
                   'unknown': []} }}

    - name: Remove the aliases of VMs that are gone, and those no VM may have
      ansible.builtin.import_tasks: tasks/ssh_config.yml
      vars:
        claude_ssh_state: absent
        claude_ssh_vms: >-
          {{ (claude_ssh_prune.prune + claude_ssh_prune.refused) | map('community.general.dict_kv', 'name') | list }}
      when: (claude_ssh_prune.prune + claude_ssh_prune.refused) | length > 0

    - name: Report what was kept, pruned and left alone
      vars:
        claude_ssh_elsewhere_said: >-
          {{ claude_ssh_prune.elsewhere | map(attribute='name')
             | zip(claude_ssh_prune.elsewhere | map(attribute='origin'))
             | map('join', ' (') | map('regex_replace', '$', ')') | join(', ') }}
        claude_ssh_unaddressed: >-
          {{ claude_vm_addressed | selectattr('name', 'defined') | selectattr('address', 'equalto', '')
             | map(attribute='name') | list
             if claude_ssh_host_domain | default('') | length == 0 else [] }}
      ansible.builtin.debug:
        msg: |-
          {% set claude_ssh_count = claude_ssh_refreshed | length %}
          {{ claude_ssh_count }} alias{{ 'es' if claude_ssh_count != 1 else '' }} refreshed in {{ claude_ssh_config_file }}.
          {% if claude_ssh_unaddressed | length > 0 %}
          Not refreshed, no address (stopped, booting, or without the agent): {{ claude_ssh_unaddressed | join(', ') }}.
          An alias they had is kept as it was.
          {% endif %}
          {% if claude_ssh_prune.prune | length > 0 %}
          Pruned, no VM of that name exists any more: {{ claude_ssh_prune.prune | join(', ') }}.
          {% endif %}
          {% if claude_ssh_prune.refused | length > 0 %}
          Removed, a name no alias may have - an address, or one this machine reaches a host of the inventory by -
          which an earlier version wrote: {{ claude_ssh_prune.refused | join(', ') }}. Rename the VM in Proxmox.
          {% endif %}
          {% if claude_ssh_prune.untagged | length > 0 %}
          Left alone: {{ claude_ssh_prune.untagged | join(', ') }}. A VM of that name exists but is not tagged
          "{{ claude_vm_tag }}", so it is not this project's. Remove the alias by hand if it is stale.
          {% endif %}
          {% if claude_ssh_prune.elsewhere | length > 0 %}
          Left alone, recorded for a host this checkout does not have: {{ claude_ssh_elsewhere_said }}.
          The prune reads only {{ claude_ssh_origin }}'s VMs: remove such a block from {{ claude_ssh_config_file }}
          by hand once its VM is gone.
          {% endif %}
          {% if claude_ssh_prune.unknown | length > 0 %}
          Left alone, no host recorded: {{ claude_ssh_prune.unknown | join(', ') }}. With more than one host, any of them
          could have that VM; the next write of its alias records its host, and a prune against that host removes it.
          {% endif %}
          {% if claude_ssh_prune.nameless | length > 0 %}
          Nothing pruned: VMID {{ claude_ssh_prune.nameless | join(', ') }} is tagged "{{ claude_vm_tag }}" but listed
          without a name, which is what a node that is down looks like, and
          {{ claude_ssh_prune.held | join(', ') if claude_ssh_prune.held else 'any alias' }} could be its.
          Run this again once every node reports.
          {% endif %}
          {% if vm_name is defined %}
          Only the VMs named were refreshed; a fleet-wide `just deploy --only ssh-config` also prunes.
          {% endif %}
