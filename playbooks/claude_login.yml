---
# Sign Claude Code in on the VMs, or say how each one is signed in.
#
#   just login alpha --only claude         -> signs alpha in, then starts Remote Control
#   just login alpha,beta --only claude    -> the same, one VM after the other
#   just login --only claude                       -> reports every VM's state
#
# Remote Control needs a claude.ai subscription login on the VM itself, and
# Anthropic supports no non-interactive way to create one: API keys are not
# accepted, and the long-lived token from `claude setup-token` can make model
# requests but cannot establish a Remote Control session. So the login is a
# browser flow, once per VM, and this runs it as far as it goes (the claude_code
# role's browser_login.yml): claude auth login on the VM, the sign-in page
# opened on this machine, the code the page shows pasted at a prompt here, and
# Remote Control started in the same run. just deploy imports this playbook for
# the VMs it configured.
- name: Discover VMs on Proxmox
  ansible.builtin.import_playbook: discover.yml
  when: claude_vm_discovery | default(true) | bool

# Every VM at once, before any prompt: rescue never sees an unreachable host,
# and under serial an unreachable VM is a whole batch failed, which ends the
# run. One that does not answer is said, skipped below, and failed at the end.
- name: Reach each VM before its sign-in
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Reach the VM
      ansible.builtin.ping:
      ignore_unreachable: true
      register: claude_vm_reach

    # Said, and kept for NEXT STEPS under the sign-in's own matter, which a
    # later record of the VM would replace.
    - name: Remember, say and record that the VM could not be reached
      ansible.builtin.import_tasks: tasks/sign_in_failed.yml
      vars:
        claude_vm_sign_in: claude
        claude_vm_sign_in_why: >-
          {{ inventory_hostname }} could not be reached, so it was not signed in:
          {{ claude_vm_reach.msg | default('no answer', true) | one_line(none) }}
      when: claude_vm_reach is unreachable

# One VM at a time when a sign-in can prompt, since the prompt reads one
# terminal; a report prompts for nothing and reads the fleet at once. Under
# serial a VM whose sign-in fails is a whole batch failed, which would end the
# run, so a failure is caught here, said, and raised by the last play once
# every VM has had its turn - unless it is the person aborting at the prompt.
- name: Sign Claude Code in, or say how each VM is signed in
  hosts: claude_vms
  gather_facts: false
  # Names given (claude_vm_login_named): a rule the sign-in plays share.
  vars_files:
    - vars/sign_in.yml
  vars:
    # Names given (any number), or just deploy: sign in. Bare: report.
    claude_vm_login_prompts: "{{ claude_vm_login_interactive | default(claude_vm_login_named) }}"
  serial: "{{ 1 if claude_vm_login_prompts | bool else '100%' }}"

  tasks:
    - name: Sign this VM in
      block:
        # The decision is the claude_code role's, so this and `just deploy --only configure`
        # cannot disagree about whether a VM is signed in the way Remote
        # Control needs. tests/unit/test_remote_control_playbooks.py and
        # tests/unit/test_claude_login.py run this playbook against stand-ins.
        - name: Report the login state, and sign the VM in when asked to
          ansible.builtin.include_role:
            name: claude_code
            tasks_from: login
          vars:
            claude_code_login_interactive: "{{ claude_vm_login_prompts }}"
          # On the task, not the block: a block's condition is its rescue's
          # too, read again for each task, and the rescue sets this fact, so
          # the message after it was skipped.
          when: claude_vm_claude_login_failure is not defined
      rescue:
        # Ctrl-C then A at the prompt is pause's abort: end the run, as asked,
        # rather than go on to the next VM's sign-in page.
        - name: Stop the run when the person aborted at the prompt
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg }}"
          when: ansible_failed_result.msg | default('') is search('user requested abort')

        # Said with the command that retries it, and kept for NEXT STEPS in
        # place of whatever an earlier report of the run left for this VM's
        # sign-in.
        - name: Remember, say and record why the sign-in failed
          ansible.builtin.import_tasks: tasks/sign_in_failed.yml
          vars:
            claude_vm_sign_in: claude
            claude_vm_sign_in_why: "{{ ansible_failed_result.msg | default('the sign-in failed', true) | string | trim }}"

# What a sign-in leads to, for every VM signed in just now, after the last
# prompt: Remote Control's start and its stay-up check. A failure here is not
# a failed sign-in - the login is made - and is raised even under just deploy,
# at its end, naming the command that retries it.
- name: Start Remote Control on each VM signed in just now
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Start Remote Control as just deploy --only configure would
      when:
        - claude_vm_claude_login_failure is not defined
        - claude_code_login_done | default(false) | bool
      block:
        - name: Start Remote Control now that the login exists
          ansible.builtin.include_role:
            name: claude_code
            tasks_from: after_login
      rescue:
        - name: Remember that the work after the sign-in failed
          vars:
            claude_vm_failed_why: "{{ ansible_failed_result.msg | default('no message', true) | trim }}"
          ansible.builtin.set_fact:
            claude_vm_configure_failures: >-
              {{ claude_vm_configure_failures | default([])
                 + [(inventory_hostname ~ ' is signed in to Claude, but starting Remote Control failed at "'
                     ~ (ansible_failed_task.name | default('a task')) ~ '": ' ~ claude_vm_failed_why)
                    | retry_line('just deploy ' ~ inventory_hostname ~ ' --tags claude_code' ~ claude_host_flag | default(''))] }}

        - name: Say why
          ansible.builtin.debug:
            msg: "{{ claude_vm_configure_failures | last }}"

        # NEXT STEPS: the line above, under Remote Control's matter: the
        # sign-in itself is done.
        - name: Keep what is left to do for the end of the run
          ansible.builtin.set_stats:
            data:
              claude_code_next: "{{ {inventory_hostname: {'remote_control': claude_vm_configure_failures | last}} }}"
            aggregate: true
            per_host: false

# just deploy carries on past a sign-in that failed - its VMs exist and are
# configured, and the message above says what is left - and raises the work
# after a sign-in at its own end; just login --only claude exists to sign in, so here
# the run fails, VM by VM - unless just login runs the three sign-ins
# (claude_vm_login_raised_later), whose own last play raises it once all three
# have had their turn.
- name: Fail each VM whose sign-in, or the work after it, failed
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Fail where the sign-in failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_claude_login_failure }}"
      when:
        - claude_vm_claude_login_failure is defined
        - not (claude_vm_login_in_deploy | default(false) | bool)
        - not (claude_vm_login_raised_later | default(false) | bool)

    - name: Fail where the work after the sign-in failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_configure_failures | join(' ') }}"
      when:
        - claude_vm_configure_failures | default([]) | length > 0
        - not (claude_vm_login_in_deploy | default(false) | bool)
        - not (claude_vm_login_raised_later | default(false) | bool)
