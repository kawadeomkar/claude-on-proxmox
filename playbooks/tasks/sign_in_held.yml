---
# A sign-in held back, said and recorded: GitHub's or Tailscale's, for a VM
# that just deploy, or just login with names, leaves out of it - nobody
# answered its Claude sign-in (claude_vm_login_held), or the run has no
# terminal to ask at (claude_vm_login_unasked), both the sign-in plays' own
# (playbooks/vars/sign_in.yml). The role's report says the VM is signed out;
# this says why nothing signed it in, and what does - only where the sign-in
# would have run, so a VM signed in already, or by the vault's credential,
# hears nothing of it. Imported by github_login.yml and
# tailscale_login.yml into the sign-in's block, after the role, its inputs vars
# on the import, never facts:
#
#   claude_vm_sign_in                  github or tailscale: the word just
#                                      login's --only takes, and the matter
#   claude_vm_sign_in_service          GitHub or Tailscale, as the line names it
#   claude_vm_sign_in_due              the role's own fact for a sign-in it would
#                                      have run, which its question and flow go
#                                      on too: github_projects_login_due,
#                                      tailscale_login_due
#   claude_vm_sign_in_replaces_report  whether the line takes the place of the
#                                      role's own report in NEXT STEPS

- name: sign_in_held | Say why the sign-in was not started
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ claude_vm_sign_in_service }}'s sign-in was not started, since
      {{ 'this run has no terminal to ask at' if claude_vm_login_unasked | bool else 'its Claude sign-in was skipped' }}:
      just login {{ inventory_hostname }} --only {{ claude_vm_sign_in }}{{ claude_host_flag | default('') }} starts it.
  register: claude_vm_sign_in_held_said
  when:
    - claude_vm_login_held | bool or claude_vm_login_unasked | bool
    - claude_vm_sign_in_due | bool

# NEXT STEPS (callback_plugins/agent_warehouse.py): the line above, in place
# of the role's own report of the same sign-out, just before it - one line, and
# the one that says why. set_stats templates its keys; each stat is written out
# here, and tests/unit/test_attention_callback.py holds every one to the five.
- name: sign_in_held | Keep what is left to do for the end of the run
  vars:
    claude_vm_sign_in_stats:
      github: github_projects_next
      tailscale: tailscale_next
  ansible.builtin.set_stats:
    data:
      "{{ claude_vm_sign_in_stats[claude_vm_sign_in] }}": "{{ {inventory_hostname: {claude_vm_sign_in: claude_vm_sign_in_held_said.msg}} }}"
    aggregate: true
    per_host: false
  when:
    - claude_vm_login_held | bool or claude_vm_login_unasked | bool
    - claude_vm_sign_in_due | bool
    - claude_vm_sign_in_replaces_report | bool
