---
# One SSH alias per VM, on this machine, so `ssh alpha` and the editor follow
# the address DHCP gave the VM (docs/guides/vscode.md).
#
# Inputs, always as `vars:` on the import:
#   claude_ssh_vms    a list of {name, address, user, workspace?, editor_flag?};
#                     workspace is only shown in the connect line, and only a
#                     caller that has read it on the VM (configure) passes it;
#                     editor_flag, only in the connect line too, is just code's
#                     code_editor_flag, put after the name as it is given
#   claude_ssh_state  present (the default) or absent
#
# And from the inventory: claude_ssh_origin, the host whose VMs these are, which
# each block records, and claude_hosts_other, the checkout's other hosts.
#
# Never set_fact either name in a calling play. A fact outranks task vars,
# so a play that builds its list as a claude_ssh_vms fact and later imports
# this file again with `claude_ssh_vms: <another list>` acts on the fact:
# ssh_config.yml once removed the aliases it had just refreshed instead of
# the vanished ones, this way. Build the list under another name and pass it.
#
# The aliases live in one managed file, claude_ssh_config_file, as one
# blockinfile block per VM, and the user's own ssh config gets exactly one
# line, an Include of that file at the top. Never anything else: the body of
# ~/.ssh/config is the user's, and the Include stays once added because
# removing it would mean editing that file on destroy, while an Include of a
# missing file is harmless. A block is written only for a VM this project
# owns - every caller lists the fleet by its tag - so the file never names a
# VM the user runs outside this project.
#
# Runs on the controller: every caller is a localhost play, so there is one
# writer per run and the loops below are sequential.
- name: ssh_config | Check the inputs
  ansible.builtin.assert:
    that:
      - claude_ssh_vms is sequence
      - claude_ssh_vms is not string
      - claude_ssh_state | default('present') in ['present', 'absent']
    quiet: true

# The managed file is included ahead of everything in the user's config, so an
# alias is taken for every connection to its name: a VM named github.com would
# get this machine's git pushes, and one named after an address, or the way
# this machine reaches the Proxmox host, its root SSH (ssh_alias_refusals). A
# VM's name is Proxmox's, and on a Proxmox others use too, anyone's to choose.
# An address or a host of the inventory is never written; a name with a dot
# only when the person chose it (claude_vm_names_chosen: the names given), as
# docs/guides/vms.md allows one. Fleet-wide (no vm_name), such a VM is left out
# and said, and the rest written: anyone's tagged VM named github.com would
# otherwise stop every alias refresh of the user's own fleet. With names given,
# it is refused below. Set again on every import, both states, so no earlier
# run's list is ever read: the rest of this file writes claude_ssh_written.
#
# A block already kept that records another of the checkout's hosts
# (claude_hosts_other) is the alias of that host's VM of the name, and a VM name
# is one host's: a run against this host never points it here. Named, that is
# refused below (and by tasks/vm_names.yml before anything is created);
# fleet-wide, the VM is left out and said. A block with no record, or one of a
# host the checkout no longer has, is nobody's, and the write records this host.
- name: ssh_config | Work out which VMs get an alias
  vars:
    claude_ssh_refusals: >-
      {{ claude_ssh_vms | ssh_alias_refusals(claude_vm_inventory_names | default(['localhost']),
                                             claude_vm_names_chosen | default([]))
         if claude_ssh_state | default('present') == 'present' else [] }}
    claude_ssh_strict: "{{ vm_name is defined }}"
    claude_ssh_kept_blocks: >-
      {{ ((lookup('ansible.builtin.file', claude_ssh_config_file, errors='ignore')
           or (lookup('ansible.builtin.file', claude_ssh_config_legacy_file, errors='ignore')
               if claude_ssh_config_legacy_file | default('') | length > 0 else '')
           or '') | ssh_config_blocks)
         if claude_ssh_state | default('present') == 'present' else [] }}
    claude_ssh_theirs_now: >-
      {{ claude_ssh_kept_blocks
         | ssh_config_elsewhere(claude_ssh_origin | default(''),
                                claude_hosts_other | default([]) | map(attribute='name') | list)
         | selectattr('name', 'in', claude_ssh_vms | map(attribute='name') | list) | list }}
  ansible.builtin.set_fact:
    claude_ssh_refused: "{{ claude_ssh_refusals if claude_ssh_strict | bool else [] }}"
    claude_ssh_left_out: "{{ [] if claude_ssh_strict | bool else claude_ssh_refusals }}"
    claude_ssh_theirs: "{{ claude_ssh_theirs_now }}"
    claude_ssh_written: >-
      {{ claude_ssh_vms if claude_ssh_strict | bool
         else claude_ssh_vms
              | rejectattr('name', 'in', (claude_ssh_refusals + claude_ssh_theirs_now) | map(attribute='name') | list)
              | list }}

# The managed file's name through 1.x (claude_ssh_config_legacy_file) is moved
# to its name from 2.0 once, with its blocks' markers, before anything is read
# or written. Left in place, its blocks would go on answering for aliases the new
# file no longer has, and its Include, first in the user's config, would answer
# the probe below with the old file's HostName, so the new file would never be
# included. The old Include line stays, as every Include this project added does:
# OpenSSH skips the Include of a file that is not there.
- name: ssh_config | Look for the managed file by its 1.x name
  ansible.builtin.stat:
    path: "{{ claude_ssh_config_legacy_file }}"
  register: claude_ssh_legacy
  when: claude_ssh_config_legacy_file | default('') | length > 0

- name: ssh_config | Look for it by its name from 2.0
  ansible.builtin.stat:
    path: "{{ claude_ssh_config_file }}"
  register: claude_ssh_new
  when: claude_ssh_legacy.stat.exists | default(false)

# The move and the markers under one condition, read before either: check mode
# runs neither, since it would rewrite a file the skipped move never made.
- name: ssh_config | Move the managed file to its name from 2.0
  ansible.builtin.command:
    argv: [mv, -n, "{{ claude_ssh_config_legacy_file }}", "{{ claude_ssh_config_file }}"]
    creates: "{{ claude_ssh_config_file }}"
  when:
    - claude_ssh_legacy.stat.exists | default(false)
    - not claude_ssh_new.stat.exists
    - not ansible_check_mode

- name: ssh_config | Give the moved blocks their markers from 2.0
  ansible.builtin.replace:
    path: "{{ claude_ssh_config_file }}"
    regexp: '^# (BEGIN|END) claude-on-proxmox: (\S+)$'
    replace: '# \1 agent-warehouse: \2'
    validate: ssh -G -F %s localhost
  when:
    - claude_ssh_legacy.stat.exists | default(false)
    - not claude_ssh_new.stat.exists
    - not ansible_check_mode

# Both there: the new file was made by hand or by a run of 2.0 that the old one
# predates. Said, and left: which aliases the old one still answers for is the
# user's to look at.
- name: ssh_config | Say that the managed file is there by both names
  ansible.builtin.debug:
    msg: >-
      Both {{ claude_ssh_config_legacy_file }} (the managed SSH config's name through 1.x) and
      {{ claude_ssh_config_file }} are there: the aliases are kept in the second. Delete the first once nothing you
      use needs it, and its Include line in {{ claude_ssh_user_config }} with it.
  when: claude_ssh_legacy.stat.exists | default(false) and claude_ssh_new.stat.exists

- name: ssh_config | Stat the managed file
  ansible.builtin.stat:
    path: "{{ claude_ssh_config_file }}"
  register: claude_ssh_managed

# Everything an alias is written by, each refusal first: nothing is written
# while any of them fails. No rescue, so the condition on the block is the
# condition of each task in it, and of nothing else.
- name: ssh_config | Write the aliases
  when: claude_ssh_state | default('present') == 'present'
  block:
    # Each name and address becomes one word on a line of an ssh config, so a
    # space or a newline in one would add options of its own - and ProxyCommand
    # runs on this machine. The address comes from the VM's guest agent, which the
    # guest_ipv4 filter already holds to one IPv4 address; this refuses anything
    # else that reaches here by another road. Without an address the name stands in
    # for it only when a domain is set, as the write below does.
    - name: ssh_config | Refuse a name or address that is not one plain word
      vars:
        claude_ssh_word: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        claude_ssh_unsafe: >-
          {{ (claude_ssh_vms | rejectattr('name', 'match', claude_ssh_word) | map(attribute='name') | list
              + (claude_ssh_vms | rejectattr('address', 'match', claude_ssh_word) | map(attribute='name') | list
                 if claude_ssh_host_domain | default('') | length == 0 else []))
             | unique | list }}
      ansible.builtin.assert:
        that: claude_ssh_unsafe | length == 0
        fail_msg: >-
          Not writing an alias for {{ claude_ssh_unsafe | map('to_json') | join(', ') }}: its name or address is not
          one plain word, and ssh would read the rest as options of its own. The address is what the VM's guest agent
          reported.
        quiet: true

    - name: ssh_config | Refuse a name ssh would take for another host
      ansible.builtin.assert:
        that: claude_ssh_refused | length == 0
        fail_msg: >-
          Not writing an alias for {{ claude_ssh_refused | map(attribute='name') | join(', ') }}: an alias is the VM's
          name, and ssh would take it for another host
          ({% for claude_ssh_why in claude_ssh_refused %}{{ claude_ssh_why.name }}: {{ claude_ssh_why.why
          }}{{ '; ' if not loop.last else '' }}{% endfor %}). Rename the VM in Proxmox.
        quiet: true

    - name: ssh_config | Refuse to point another host's alias at this host's VM
      ansible.builtin.assert:
        that: vm_name is not defined or claude_ssh_theirs | length == 0
        fail_msg: >-
          Not writing an alias for {{ claude_ssh_theirs | map(attribute='name') | join(', ') }}: the alias of
          {{ 'that name' if claude_ssh_theirs | length == 1 else 'those names' }} is the VM of
          {{ claude_ssh_theirs | map(attribute='origin') | unique | join(', ') }}, as its block in
          {{ claude_ssh_config_file }} records, and a VM name belongs to one host. Rename this host's VM in Proxmox.
        quiet: true

    - name: ssh_config | Say which VMs keep another host's alias
      ansible.builtin.debug:
        msg: >-
          No alias for {% for claude_ssh_why in claude_ssh_theirs %}{{ claude_ssh_why.name }} (the alias of that name
          is {{ claude_ssh_why.origin }}'s VM){{ '; ' if not loop.last else '' }}{% endfor %}: a VM name belongs to one
          host, and the alias stays with the host its block records. Rename this host's
          {{ 'VM' if claude_ssh_theirs | length == 1 else 'VMs' }} in Proxmox.
      when: claude_ssh_theirs | length > 0

    # A name with a dot is left out only because nobody named it: said apart, with
    # the run that writes its alias, and an alias it has already is left as it is.
    - name: ssh_config | Say which VMs get no alias
      vars:
        claude_ssh_renamed: "{{ claude_ssh_left_out | rejectattr('unnamed') | map(attribute='name') | list }}"
        claude_ssh_unnamed: "{{ claude_ssh_left_out | selectattr('unnamed') | map(attribute='name') | list }}"
      ansible.builtin.debug:
        msg: >-
          No alias for {% for claude_ssh_why in claude_ssh_left_out %}{{ claude_ssh_why.name }} ({{ claude_ssh_why.why
          }}){{ '; ' if not loop.last else '' }}{% endfor %}: an alias is the VM's name, and the file ssh reads first
          would send this machine's own connections there. The other VMs' aliases are written.
          {% if claude_ssh_unnamed | length > 0 %}A name with a dot gets its alias only from a run that names it, so
          that a VM someone else named github.com never gets one: just deploy {{ claude_ssh_unnamed | join(',') }}
          --only ssh-config, if {{ 'it is' if claude_ssh_unnamed | length == 1 else 'they are' }} yours. An alias
          {{ 'it has' if claude_ssh_unnamed | length == 1 else 'they have' }} already is left as it was.{% endif %}
          {% if claude_ssh_renamed | length > 0 %}Rename {{ claude_ssh_renamed | join(', ') }} in Proxmox, or ask whoever
          made {{ 'it' if claude_ssh_renamed | length == 1 else 'them' }}.{% endif %}
      when: claude_ssh_left_out | length > 0

    # The alias is the VM's name, and an entry the user wrote for that name wins
    # nothing: the managed file is included first, so writing it would make the
    # user's own entry stop working with no error anywhere. Refuse by name instead.
    # Every `Host` line is read, including ones that name several hosts.
    - name: ssh_config | Refuse an alias the user's own ssh config already defines
      vars:
        claude_ssh_user_hosts: >-
          {{ (lookup('ansible.builtin.file', claude_ssh_user_config, errors='ignore') or '')
             | regex_findall('^\s*Host\s+(.+?)\s*$', multiline=True, ignorecase=True)
             | map('split') | flatten | list }}
        claude_ssh_taken: "{{ claude_ssh_written | map(attribute='name') | intersect(claude_ssh_user_hosts) | list }}"
      ansible.builtin.assert:
        that: claude_ssh_taken | length == 0
        fail_msg: >-
          {{ claude_ssh_user_config }} already has a Host entry named {{ claude_ssh_taken | join(', ') }},
          and the alias this project keeps for a VM is the VM's name. The managed file is included
          ahead of your own entries, so writing it would silently override yours. Rename the VM, or
          rename that entry in your ssh config.
        quiet: true

    - name: ssh_config | Ensure the ssh directory exists
      ansible.builtin.file:
        path: "{{ claude_ssh_config_file | dirname }}"
        state: directory
        mode: "0700"

    # HostName is the address the guest agent reported, or <name>.<domain> when
    # the network resolves VM names (ssh_hostname). The block holds what ssh
    # reads, and one comment ssh skips: the host the VM was found on
    # (claude_ssh_origin), which the prune, destroy and the next write go by -
    # no other state of this project's. Each write is validated by the real ssh
    # client parsing the file, so a bad option fails this task instead of every
    # `ssh` on this machine.
    - name: ssh_config | Write the alias for each VM
      vars:
        claude_ssh_block: |-
          {% if claude_ssh_origin | default('') | length > 0 %}
          # origin: {{ claude_ssh_origin }}
          {% endif %}
          Host {{ claude_ssh_vm.name }}
              HostName {{ claude_ssh_vm | ssh_hostname(claude_ssh_host_domain | default('')) }}
              User {{ claude_ssh_vm.user }}
          {% if claude_ssh_identity_file | default('') | length > 0 %}
              IdentityFile {{ claude_ssh_identity_file }}
          {% endif %}
          {% if claude_ssh_forward_agent | default(false) | bool %}
              ForwardAgent yes
          {% endif %}
          {% for claude_ssh_key, claude_ssh_value in (claude_ssh_options | default({})).items() %}
              {{ claude_ssh_key }} {{ claude_ssh_value }}
          {% endfor %}
      ansible.builtin.blockinfile:
        path: "{{ claude_ssh_config_file }}"
        create: true
        mode: "0600"
        marker: "# {mark} agent-warehouse: {{ claude_ssh_vm.name }}"
        block: "{{ claude_ssh_block }}"
        validate: "ssh -G -F %s {{ claude_ssh_vm.name }}"
      loop: "{{ claude_ssh_written }}"
      loop_control:
        loop_var: claude_ssh_vm
        label: "{{ claude_ssh_vm.name }}"

    - name: ssh_config | Stat the user's ssh config
      ansible.builtin.stat:
        path: "{{ claude_ssh_user_config }}"
      register: claude_ssh_user
      when: claude_ssh_config_include | default(true) | bool

    # Whether a line already in the user's config reaches the managed file is
    # ssh's to say, not a regex's: ${HOME}/... is expanded only from OpenSSH 9.9
    # on (Ubuntu 24.04 ships 9.6, which reads it as a literal path and includes
    # nothing), and an Include below a Host block is scoped to that block. So the
    # user's config is handed to the real client, and the first VM's alias must
    # come back with the HostName the managed file just gave it.
    - name: ssh_config | Ask ssh whether the user's config reaches the managed file
      ansible.builtin.command:
        argv: [ssh, -G, -F, "{{ claude_ssh_user_config }}", "{{ claude_ssh_written[0].name }}"]
      register: claude_ssh_probe
      changed_when: false
      failed_when: false
      when:
        - claude_ssh_config_include | default(true) | bool
        - claude_ssh_written | length > 0
        - claude_ssh_user.stat.exists

    # At the top, because an Include below a Host block is scoped to that block.
    # Only when the managed file is not reached already: a line in a spelling
    # ssh accepts for the same file - the absolute path, ~/..., ${HOME}/... or,
    # for a file in ~/.ssh, the bare name ssh resolves against it - that ssh
    # itself, asked above, reads. Then the user's line is left exactly as it is,
    # not rewritten into this one. A spelling ssh does not read ($HOME/..., or
    # ${HOME}/... on an older ssh) includes nothing, and this line is added. A
    # file this task creates is 0600; the user's own keeps its mode, given back
    # explicitly: when the file's group is one the user is not in, Ansible's
    # atomic move cannot copy the old file's attributes and leaves it 0600.
    - name: ssh_config | Include the managed file from the user's ssh config
      vars:
        claude_ssh_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
        claude_ssh_rest: >-
          {{ claude_ssh_config_file[claude_ssh_home | length:]
             if claude_ssh_config_file.startswith(claude_ssh_home ~ '/') else '' }}
        claude_ssh_spellings: >-
          {{ [claude_ssh_config_file]
             + (['~' ~ claude_ssh_rest, '${HOME}' ~ claude_ssh_rest]
                if claude_ssh_rest | length > 0 else [])
             + ([claude_ssh_config_file | basename]
                if (claude_ssh_config_file | dirname) == (claude_ssh_user_config | dirname) else []) }}
        claude_ssh_included: >-
          {{ (lookup('ansible.builtin.file', claude_ssh_user_config, errors='ignore') or '')
             is search('^\s*include\s+(' ~ (claude_ssh_spellings | map('regex_escape') | join('|')) ~ ')\s*$',
                       multiline=True, ignorecase=True)
             and ('hostname ' ~ (claude_ssh_written[0] | ssh_hostname(claude_ssh_host_domain | default(''))))
                 in (claude_ssh_probe.stdout_lines | default([])) }}
      ansible.builtin.lineinfile:
        path: "{{ claude_ssh_user_config }}"
        create: true
        mode: "{{ claude_ssh_user.stat.mode if claude_ssh_user.stat.exists | default(false) else '0600' }}"
        line: "Include {{ claude_ssh_config_file }}"
        insertbefore: BOF
      when:
        - claude_ssh_config_include | default(true) | bool
        - claude_ssh_written | length > 0
        - not claude_ssh_included | bool

    - name: ssh_config | Show how to connect
      ansible.builtin.debug:
        msg: |-
          {% for claude_ssh_vm in claude_ssh_written %}
          {% set claude_ssh_code = 'just code ' ~ claude_ssh_vm.name ~ claude_ssh_vm.editor_flag | default('') %}
          {% if claude_ssh_vm.workspace | default('') | length > 0 %}
          {{ claude_ssh_vm.name }}: ssh {{ claude_ssh_vm.name }}   |   {{ claude_ssh_code }}   (opens {{ claude_ssh_vm.workspace }})
          {% else %}
          {{ claude_ssh_vm.name }}: ssh {{ claude_ssh_vm.name }}   |   {{ claude_ssh_code }}
          {% endif %}
          {% endfor %}
          {% if not claude_ssh_config_include | default(true) | bool %}
          Not added to {{ claude_ssh_user_config }} (claude_ssh_config_include is off).
          Put this line at its top: Include {{ claude_ssh_config_file }}
          {% endif %}
      when: claude_ssh_written | length > 0

# blockinfile refuses a path that does not exist unless it may create it, and
# a missing managed file has nothing to remove anyway.
- name: ssh_config | Remove the alias for each VM
  ansible.builtin.blockinfile:
    path: "{{ claude_ssh_config_file }}"
    marker: "# {mark} agent-warehouse: {{ claude_ssh_vm.name }}"
    state: absent
  loop: "{{ claude_ssh_vms }}"
  loop_control:
    loop_var: claude_ssh_vm
    label: "{{ claude_ssh_vm.name }}"
  when:
    - claude_ssh_state | default('present') == 'absent'
    - claude_ssh_managed.stat.exists
