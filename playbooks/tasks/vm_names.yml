---
# Refuses a VM name that is a host of the inventory (claude_vm_inventory_hosts,
# group_vars/all): add_host would merge the VM into that host, so the Proxmox
# host's address - and with it the API token - would become the VM's, or this
# machine would become a VM to configure. Every play that takes names imports
# it before anything is created, started or added.
#
# Input, as `vars:` on the import:
#   claude_vm_names_alias   true where the names are about to get an SSH alias
#                           (deploy, provision, code): also refuse a name that
#                           cannot be one, before the template is built or a VM
#                           created, rather than once the run has all but done.
- name: vm_names | Refuse a VM named after a host of the inventory
  vars:
    claude_vm_names_taken: "{{ claude_vm_names | select('in', claude_vm_inventory_hosts) | list }}"
  ansible.builtin.assert:
    that: claude_vm_names_taken | length == 0
    fail_msg: >-
      {{ claude_vm_names_taken | join(', ') }} {{ 'is the name' if claude_vm_names_taken | length == 1 else 'are
      names' }} of a host in the inventory ({{ claude_vm_inventory_hosts | join(', ') }}), which no VM may take:
      Ansible would take the VM for that host, and what is meant for the host - the Proxmox API token, or this
      machine's own configuration - would go to the VM. Give the VM another name.
    quiet: true

# A VM's name is its SSH alias, and tasks/ssh_config.yml writes none that ssh
# would take for another host. Every name here is one the person chose, so a
# dot is no reason.
- name: vm_names | Refuse a name that cannot be an SSH alias
  vars:
    claude_vm_alias_refused: >-
      {{ dict(claude_vm_names
              | zip(claude_vm_names | map('ssh_alias_refusal', claude_vm_inventory_names, claude_vm_names)))
         | dict2items | selectattr('value') | list }}
    claude_vm_alias_first: "{{ claude_vm_alias_refused | first | default({'key': '', 'value': ''}) }}"
  ansible.builtin.assert:
    that: claude_vm_alias_refused | length == 0
    fail_msg: >-
      {{ claude_vm_alias_refused | map(attribute='key') | join(', ') }} cannot be a VM's name while this
      project keeps an SSH alias for each VM, by its name: for {{ claude_vm_alias_first.key }},
      {{ claude_vm_alias_first.value }}. Choose another name, or set claude_ssh_config: false.
    quiet: true
  when:
    - claude_vm_names_alias | default(false) | bool
    - claude_ssh_config | default(true) | bool

# A VM name belongs to one host: where the alias of a name records another of
# the checkout's hosts (claude_hosts_other), that host has the VM of the name,
# and this run would point the alias here - or, creating one, make a second VM
# of it. Read from the managed file alone, so refused before Proxmox is asked.
- name: vm_names | Refuse a name another host's VM has
  vars:
    claude_vm_names_theirs: >-
      {{ claude_ssh_blocks | selectattr('name', 'in', claude_vm_names)
         | ssh_config_elsewhere(claude_ssh_origin, claude_hosts_other | map(attribute='name') | list) }}
  ansible.builtin.assert:
    that: claude_vm_names_theirs | length == 0
    fail_msg: >-
      {% for claude_vm_theirs in claude_vm_names_theirs %}{{ claude_vm_theirs.name }} is a VM of
      {{ claude_vm_theirs.origin }}{{ '; ' if not loop.last else '' }}{% endfor %}, as the SSH alias of the name
      records in {{ claude_ssh_config_file }}, and a VM name belongs to one host. Give this host's VM another name.
    quiet: true
  when:
    - claude_vm_names_alias | default(false) | bool
    - claude_ssh_config | default(true) | bool
