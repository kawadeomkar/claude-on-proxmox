---
# Stop and delete every VM in the claude_vms group. Destructive; requires
# confirmation unless run with `-e confirm_destroy=true`.
- name: Destroy VMs on Proxmox
  hosts: claude_vms
  gather_facts: false

  vars_prompt:
    - name: confirm_destroy
      prompt: "This deletes the VM(s) and their disks. Type 'yes' to continue"
      private: false

  pre_tasks:
    - name: Abort unless confirmed
      ansible.builtin.assert:
        that: confirm_destroy | lower in ['yes', 'true']
        fail_msg: "Destroy not confirmed."

  roles:
    - role: proxmox_vm
      proxmox_vm_state: absent

  post_tasks:
    - name: Forget the VM's SSH host key so a re-provisioned VM is trusted again
      ansible.builtin.known_hosts:
        name: "{{ ansible_host }}"
        state: absent
      delegate_to: localhost
