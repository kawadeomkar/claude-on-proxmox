---
# Stop and delete VMs by name. Destructive; requires confirmation.
#
#   make destroy VM_NAME=alpha
#   make destroy VM_NAME=alpha,beta
#
# Without VM_NAME this targets claude-on-proxmox-default, the same name
# `make provision` uses when none is given. The confirmation prompt runs first,
# since it is a play-level vars_prompt; the task right after it then checks that
# every VM asked for actually exists, so a wrong name fails loudly rather than
# being "deleted" silently once confirmed.
#
# Two plays, in provision.yml's shape and for the same reason: stopping a VM
# and removing its disks takes time on a real host, and none of it depends on
# another VM. The first play confirms, checks and turns each name into a host;
# the second runs the role across those hosts, so Ansible deletes them in
# parallel across `forks`. A loop over include_role deleted them one at a time.
- name: Confirm and check what to destroy
  hosts: localhost
  gather_facts: false

  vars_prompt:
    - name: confirm_destroy
      prompt: "This deletes the VM(s) and their disks. Type 'yes' to continue"
      private: false
      # A run with no terminal - CI, a cron job, a nested playbook - takes the
      # default rather than hanging, so it must be the safe answer.
      default: "no"

  tasks:
    - name: Abort unless confirmed
      ansible.builtin.assert:
        that: confirm_destroy | lower in ['yes', 'true']
        fail_msg: "Destroy not confirmed."
        quiet: true

    - name: List every VM in the cluster
      ansible.builtin.import_tasks: tasks/cluster_vms.yml

    # The role refuses a VM it does not own as well; checking here first names
    # the VMs that do exist, once, instead of one refusal per host.
    #
    # A guest on a node that is down is listed without a name (see
    # tasks/cluster_vms.yml). It cannot be what VM_NAME means, and it must not
    # take the check down for the VMs that can be: every `name` is read with
    # a default and the blanks dropped.
    #
    # proxmox_vm_allow_untagged_delete is the role's escape hatch for a VM
    # created before this project tagged its VMs, so it widens this check to
    # an untagged VM of that name too. Never to a template, tagged or not:
    # every VM is cloned from one.
    - name: Check that every VM asked for exists
      vars:
        claude_vm_untagged_ok: "{{ proxmox_vm_allow_untagged_delete | default(false) | bool }}"
        claude_vm_qemu: "{{ claude_vm_all.json.data | selectattr('type', 'equalto', 'qemu') | list }}"
        claude_vm_templates: >-
          {{ claude_vm_qemu | selectattr('template', 'defined') | selectattr('template', 'truthy')
             | map(attribute='name', default='') | select | list }}
        claude_vm_fleet: >-
          {{ claude_vm_tagged | map(attribute='name', default='') | select
             | difference(claude_vm_templates) | sort | list }}
        claude_vm_untagged: >-
          {{ claude_vm_qemu | map(attribute='name', default='') | select
             | difference(claude_vm_fleet + claude_vm_templates) | list }}
        claude_vm_deletable: "{{ claude_vm_fleet + (claude_vm_untagged if claude_vm_untagged_ok else []) }}"
        claude_vm_missing: "{{ claude_vm_names | difference(claude_vm_deletable) | list }}"
        claude_vm_created: >-
          {{ 'It created: ' ~ (claude_vm_fleet | join(', ')) ~ '. Name what to delete with VM_NAME=.'
             if claude_vm_fleet else 'It has not created any VMs on this host.' }}
        claude_vm_missing_untagged: "{{ claude_vm_missing | intersect(claude_vm_untagged) }}"
        claude_vm_untagged_hint: >-
          {{ claude_vm_missing_untagged | join(', ') }} does exist, but is not tagged "{{ claude_vm_tag }}".
          If this project created it before it tagged its VMs, add that tag in the Proxmox UI and run this
          again, or set proxmox_vm_allow_untagged_delete=true to delete it anyway.
        claude_vm_hints: >-
          {{ (['A template is never deleted.'] if claude_vm_missing | intersect(claude_vm_templates) else [])
             + ([claude_vm_untagged_hint] if claude_vm_missing_untagged else []) }}
      ansible.builtin.assert:
        that: claude_vm_missing | length == 0
        fail_msg: >-
          No VM named {{ claude_vm_missing | join(', ') }} was created by this project. {{ claude_vm_created }}
          {{ claude_vm_hints | join(' ') }}
        quiet: true

    - name: Add each VM as a host to delete
      ansible.builtin.add_host:
        name: "{{ claude_vm_name_item }}"
        groups: claude_vm_doomed
        # Every task in the proxmox_vm role is delegated to the controller and
        # talks to the Proxmox API, so nothing ever connects to this host.
        ansible_connection: local
      changed_when: false
      loop: "{{ claude_vm_names }}"
      loop_control:
        loop_var: claude_vm_name_item
        label: "{{ claude_vm_name_item }}"

# The role checks ownership again for each VM, against the VM it looks up by
# name at that moment, and refuses a template or an untagged VM without the
# escape hatch. proxmox_vm_name defaults to inventory_hostname, the VM name.
- name: Delete the VMs on Proxmox
  hosts: claude_vm_doomed
  gather_facts: false
  roles:
    - role: proxmox_vm
      proxmox_vm_state: absent

# The alias this project keeps for each VM on this machine goes with the VM,
# as its host key does (README, "Using VS Code on the VM"). After the
# deletions, so a run refused above leaves every alias in place; removing a
# block that is not there is a no-op.
- name: Forget the SSH alias of each deleted VM
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Remove the aliases
      ansible.builtin.import_tasks: tasks/ssh_config.yml
      vars:
        claude_ssh_state: absent
        claude_ssh_vms: >-
          {{ groups['claude_vm_doomed'] | default([]) | map('community.general.dict_kv', 'name') | list }}
      when: claude_ssh_config | default(true) | bool
