---
# Shared, non-secret defaults that are safe to commit.
# Override anything here in inventory/group_vars/all/local.yml (git-ignored).
# Files in this directory load alphabetically, so defaults.yml < local.yml < vault.yml.
# What each setting does is the comment above it in local.yml.example (or
# vault.yml.example), which docs/reference/settings.md renders; a comment here
# says only why a value or an expression is what it is, or describes a value
# that is no setting.

# ---------------------------------------------------------------- Proxmox ---
# Each setting's description: local.yml.example, under Proxmox.
# Defaults to the ansible_host (or name) of the first host in the proxmox group.
proxmox_api_host: >-
  {{ hostvars[groups['proxmox'][0]]['ansible_host'] | default(groups['proxmox'][0])
     if groups['proxmox'] | default([]) else '' }}
proxmox_api_port: 8006
proxmox_api_user: ansible@pve
proxmox_api_token_id: ansible
# Trimmed: a vault edited by hand can end the secret with a newline, which both
# HTTP clients refuse in a header with the whole header, secret included, in
# their error - escaped, so no_log's masking missed it.
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret | trim }}"
# Off by default because Proxmox ships a self-signed certificate.
proxmox_validate_certs: false
proxmox_node: pve
proxmox_storage: local-lvm
proxmox_bridge: vmbr0
# Here, not only in the role: provisioning, discovery and just status all read it.
proxmox_nic: net0

# The API connection, as one value for a play's module_defaults, so that the
# playbooks cannot drift apart on it:
#   module_defaults:
#     group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"
# The proxmox_vm role keeps its own, from the proxmox_vm_api_* wiring below.
proxmox_api_module_defaults:
  api_host: "{{ proxmox_api_host }}"
  api_port: "{{ proxmox_api_port }}"
  api_user: "{{ proxmox_api_user }}"
  api_token_id: "{{ proxmox_api_token_id }}"
  api_token_secret: "{{ proxmox_api_token_secret }}"
  validate_certs: "{{ proxmox_validate_certs }}"
# Base URL for the one request no community.proxmox module makes on its own
# (playbooks/tasks/cluster_vms.yml). A bare IPv6 address is bracketed, as
# proxmoxer does for the modules.
proxmox_api_url: >-
  https://{{ '[' ~ proxmox_api_host ~ ']' if proxmox_api_host is search(':.*:') and proxmox_api_host is not match('[[]')
  else proxmox_api_host }}:{{ proxmox_api_port }}/api2/json

# The pieces a raw request to the API needs, for the few reads that go through
# `uri` rather than a community.proxmox module (the cluster listing, the next
# free VMID, each VM's config and agent reply). One definition, so a change to
# how the token is sent or the CA is found cannot leave one caller behind.
# The header carries the token: every task that sends it is no_log.
proxmox_api_headers:
  Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
# The wiki trusts the Proxmox CA through REQUESTS_CA_BUNDLE, which the
# modules' HTTP client reads and `uri` does not, so it is passed on. Empty
# when certificates are not validated; callers `default(omit, true)` it.
proxmox_api_ca_path: "{{ lookup('ansible.builtin.env', 'REQUESTS_CA_BUNDLE') if proxmox_validate_certs | bool else '' }}"
# Seconds each of those reads waits for Proxmox: uri's own default, which
# playbooks/tasks/cluster_vms.yml and vm_addresses.yml keep. `just status` passes
# them 10, since a report that cannot reach the API should say so soon.
claude_vm_api_timeout: 30

# just status (tools/status): how long each of its reads of the API waits.
status_api_timeout: 10
# How just status reaches a VM over SSH: ansible.cfg's ssh_args, with the host key held to what this machine
# already knows (StrictHostKeyChecking=yes) and never updated (UpdateHostKeys=no, OpenSSH's default is yes):
# status adds and changes no host key, so a VM rebuilt or renamed is "not read", naming what takes its key. First on
# ssh's command line, since it keeps the first value it is given for an option.
status_ssh_args: >-
  {{ (lookup('ansible.builtin.config', 'ssh_args', plugin_type='connection', plugin_name='ssh')
      | regex_replace('-o\s*StrictHostKeyChecking=\S+', '') | regex_replace('-o\s*UpdateHostKeys=\S+', '')
      | regex_replace('\s+', ' ') | trim) ~ ' -o StrictHostKeyChecking=yes -o UpdateHostKeys=no' }}
# Whether just status asks apt what an upgrade would install: a simulation, which changes nothing. And where it reads
# a VM's /proc, /run, /boot and os-release from: the VM's own, but for the tests' fixture trees.
status_read_upgrades: true
status_system_root: /

# The proxmox_template role's defaults, repeated here because deploy.yml,
# init_check.yml and just status read them outside the role, where its defaults
# are not seen.
proxmox_template_vmid: 9000
proxmox_template_name: ubuntu-24.04-cloudinit
# A template you built, by its name, to clone in place of building one
# (docs/guides/base-image.md). Empty: this project builds its own.
proxmox_template_custom: ""
# The template new VMs are cloned from, whichever it is.
proxmox_template_base: "{{ proxmox_template_custom | default('', true) or proxmox_template_name }}"
proxmox_template_rebuild: true

# ------------------------------------------------------------------- VM -----
# Each setting's description: local.yml.example, under VMs.
# claude_vm_names falls back to this default name when vm_name is not given,
# which is what provision.yml, deploy.yml and destroy.yml act on. discover.yml
# and just status test `vm_name is defined` instead and, without it, cover every
# tagged VM - so just status, just login and just deploy --only configure,
# --check and --only ssh-config are fleet-wide. No VM is declared anywhere:
# Proxmox gives each its ID, and DHCP its address.
vm_default_name: agent-warehouse-default
# The default's name through 1.x and from 2.0: a bare deploy or destroy is
# refused while a VM of this project's has the first and none the second
# (tasks/default_name_1x.yml). Not settings.
claude_vm_default_name_1x: claude-on-proxmox-default
claude_vm_default_name_2_0: agent-warehouse-default
# Applied to every VM this project creates, and how they are found again.
claude_vm_tag: agent-warehouse
# The ownership tag through 1.x, while claude_vm_tag is the default: a VM 1.x
# made carries it, and its marks and unfinished tag under it, and is this
# project's through 2.x as if it carried the new one. Provisioning writes them
# under the new tag (proxmox_vm_tags_1x); everything else only reads. A tag
# set in local.yml has no 1.x name. Not a setting.
claude_vm_tag_1x: "{{ 'claude-on-proxmox' if claude_vm_tag | lower == 'agent-warehouse' else '' }}"
# Every tag a VM of this project's carries as its ownership tag, lowercased:
# claude_vm_tag first. What a mark or the unfinished tag is read under.
claude_vm_tags_owned: "{{ [claude_vm_tag | lower] + ([claude_vm_tag_1x] if claude_vm_tag_1x | length > 0 else []) }}"
# Matches an owned tag as a whole tag in Proxmox's ";"-joined tag string (or
# the ","-joined form proxmox_kvm sends), never as a substring of a longer one.
# Case-insensitive, because Proxmox stores tags lowercased by default: a
# claude_vm_tag of "Agent-Warehouse" is stamped on a VM as
# "agent-warehouse", and matched as typed it would never be found again.
# The proxmox_vm role lowercases both sides of its own comparison the same way.
claude_vm_tag_pattern: "(?i)(^|[;,])({{ claude_vm_tags_owned | map('regex_escape') | join('|') }})([;,]|$)"
# The tag a VM carries once it has held a Tailscale login of the tailscale
# role's own, written by configure.yml after the role and read back by
# discovery, provisioning and just status as tailscale_joined_before: kept in
# Proxmox, where the VM cannot change it, so that a VM logged out from inside is
# never handed vault_tailscale_auth_key again. Remove it in Proxmox to let the
# key join that VM once more. Like the ownership tag, matched whole.
# Written under claude_vm_tag, and read under either owned tag: a VM whose
# record 1.x wrote is never handed the key either.
claude_vm_tailscale_tag: "{{ claude_vm_tag | lower }}-tailscale"
claude_vm_tailscale_tag_pattern: >-
  (?i)(^|[;,])({{ claude_vm_tags_owned | map('regex_escape') | join('|') }})-tailscale([;,]|$)
# The VMs this project owns, filtered out of the cluster's VM list. Defined
# here, not in each playbook, so discover.yml, just status and destroy.yml cannot
# drift on what "ours" means. Evaluated lazily: any play that uses it must have
# run playbooks/tasks/cluster_vms.yml, which registers claude_vm_all, and is
# meant to fail loudly if it has not - an empty fleet and an unasked API are
# not the same thing. Proxmox leaves `tags` out altogether for a VM that has
# none, so the "defined" check is what lets such a VM through without an error.
# `name` can be missing too: Proxmox fills it from the node's statistics, which
# the cluster drops five minutes after a node stops reporting, so a tagged VM
# on a node that is down is listed with a VMID, a node and its tags but no
# name. It stays in this list - `just status` shows it - and every consumer
# reads `name` with a default rather than failing the whole fleet over it.
claude_vm_tagged: >-
  {{ claude_vm_all.json.data
     | selectattr('type', 'equalto', 'qemu')
     | selectattr('tags', 'defined')
     | selectattr('tags', 'regex', claude_vm_tag_pattern)
     | not_templates
     | list }}
claude_vm_names: >-
  {{ (vm_name | default(vm_default_name, true)) | split(',') | map('trim') | select | list }}
# The golden template a new VM is cloned from, chosen by playbooks/golden.yml in
# just deploy, by the number Proxmox knows it by; empty for the base template.
claude_vm_golden_template: "{{ (proxmox_template_golden_choice | default({})).golden | default('', true) }}"
# And by its name, which labels the clone; empty for the base template.
claude_vm_golden_template_name: "{{ (proxmox_template_golden_choice | default({})).golden_name | default('', true) }}"
# The hosts of the inventory itself - this machine (localhost) and the Proxmox
# host (pve, in hosts.yml.example) - whose names no VM may take. A VM's name
# from Proxmox becomes a host through add_host, which merges it into a host of
# that name: a VM named pve would give the Proxmox host the address that VM
# reports, and the API token would go there; one named localhost would make
# this machine a VM to configure. Every host but those the runs add VMs to, so
# it reads the same before and after they are added. playbooks/tasks/vm_names.yml
# refuses such a name given, and discovery and just status leave out such a VM.
claude_vm_inventory_hosts: >-
  {{ (groups['all'] + ['localhost'])
     | reject('in', (groups['claude_vms'] | default([])) + (groups['claude_vm_pending'] | default([]))
                    + (groups['status_vms'] | default([])) + (groups['claude_vm_doomed'] | default([]))
                    + (groups['claude_vm_golden_pending'] | default([])) + (groups['claude_vm_build'] | default([])))
     | unique | list }}
# The address each of those hosts is reached at, its ansible_host, where it has
# one. Deleting a VM never forgets the host key of one of them
# (proxmox_vm_known_hosts_kept), whatever address the VM reported last, and a
# VM's alias never takes one (below): one list for both.
claude_vm_inventory_addresses: >-
  {{ claude_vm_inventory_hosts | select('in', hostvars) | map('extract', hostvars)
     | map(attribute='ansible_host', default='') | select | list }}
# Every name this machine's ssh reaches a host of the inventory by: the host's
# own, its ansible_host, and the Proxmox API's address. The managed SSH config
# is included ahead of the user's own, so a VM's alias of one of them - a VM
# named pve.lan, where the Proxmox host is reached as pve.lan - would take this
# machine's root SSH to that host. tasks/ssh_config.yml never writes one.
claude_vm_inventory_names: >-
  {{ (claude_vm_inventory_hosts + claude_vm_inventory_addresses
      + ([proxmox_api_host] if proxmox_api_host | default('') | length > 0 else []))
     | map('string') | unique | list }}
# The VM names the person chose for this run: those given (vm_name), or the
# default one for a deploy, which provisions by name without discovery - never
# a fleet-wide run's, whose names are Proxmox's, and on a shared host anyone's.
# Only one of these gets an SSH alias with a dot (tasks/ssh_config.yml): a
# tagged VM someone else named github.com is never given one by a refresh.
claude_vm_names_chosen: >-
  {{ claude_vm_names if vm_name is defined or not claude_vm_discovery | bool else [] }}
# The tagged VMs a fleet-wide recipe acts on: the ones named (vm_name), or all of
# them without it. discover.yml narrows through this, and just status the same way, so
# `just deploy --only configure` and `just status` cannot disagree on what the names select.
claude_vm_requested: >-
  {{ claude_vm_tagged | selectattr('name', 'defined') | selectattr('name', 'in', claude_vm_names) | list
     if vm_name is defined else claude_vm_tagged }}

# configure.yml discovers VMs from Proxmox before configuring them. Set false
# to configure hosts that are already in a static inventory (Vagrant does this)
# and skip the Proxmox API entirely.
claude_vm_discovery: true

vm_user: dev
# The Python Ansible runs its modules with on each VM: the system's, which has
# python3-apt for the apt module. Never discovered: the PATH of the VM user's
# ssh sessions starts with ~/.local/bin (common_ssh_path_dirs), where
# `uv python install` puts a python3.13 that discovery would take - under
# become too, as root.
claude_vm_python: /usr/bin/python3
# How every play becomes root: sudo by its full path, never by name, for the
# same PATH - a `sudo` of the user's own in ~/.local/bin would be handed every
# module's arguments and the password below.
ansible_become_exe: /usr/bin/sudo
# The VM user's password, which the common role sets from vault_vm_password
# with common_user_passwordless_sudo false: sudo on a VM then asks for it, and
# the playbooks become root with it - on the run that turns the setting back on
# too, which meets the VM still without its passwordless rule. Ansible sends it
# only when sudo asks, which it never does with the rule in place.
ansible_become_password: "{{ common_user_password }}"
# configure.yml waits for cloud-init before configuring. Disable for hosts
# that were not built from a cloud image (Vagrant, containers).
configure_wait_for_cloud_init: true
# Read with errors='ignore' so that someone whose key is an RSA or ECDSA one
# gets the role's "set vm_ssh_public_keys" message rather than a bare
# "could not locate file" from the lookup, which Jinja evaluates first.
vm_ssh_public_keys: >-
  {{ [lookup('ansible.builtin.file',
             lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub',
             errors='ignore')]
     | select('string') | select | list }}

# --------------------------------------------------------------- GitHub -----
# Each setting's description: local.yml.example, under GitHub.
# default('', true) on each vault value: one left empty in the vault is None,
# which has no length.
github_username: "{{ vault_github_username | default('', true) }}"
github_token: "{{ vault_github_token | default('', true) }}"
github_projects: []
github_auth: true
github_auth_method: auto
github_login_auto_start: true
github_login_scopes: [workflow]
git_user_name: ""
git_user_email: ""

# ------------------------------------------------------------ Anthropic -----
# Each setting's description: local.yml.example, under Claude Code.
anthropic_api_key: "{{ vault_anthropic_api_key | default('', true) }}"

# On by default, and what happens is derived from the credentials on the VM
# rather than from this switch: an API key outranks the claude.ai login, the
# only one Remote Control can use (docs/architecture/roles.md §5.5).
claude_code_remote_control: true

# -------------------------------------------------------------- Sign-in -----
# Each setting's description: local.yml.example, under Sign-ins and teardown.
deploy_sign_in: true
deploy_code: true
destroy_release: true
destroy_save_sessions: true
destroy_sessions_dir: ""
# Every test turns this off, and tests/unit/test_github_auth.py,
# test_claude_login.py and test_tailscale.py fail if one does not.
login_desktop: true

# ---------------------------------------------------------------- VPN -----
# Each setting's description: local.yml.example, under VPN.
# Unset, it follows tailscale_enabled below, the setting it replaces, which is
# still read: tailscale while that is true, else none - and it is false unless
# set, so no VPN is chosen until one is (just init asks; tools/check warns).
vpn: "{{ 'tailscale' if tailscale_enabled | bool else 'none' }}"
# The VPNs a VM can be on, by the vpn setting's value: each one's name, the
# family of the core that plans its members (lib/claude_vm/vpn/), the role
# that runs it on each VM, and whether it has a sign-in of its own (a stage of
# just login and just deploy). Literal values only. Internal, not a setting:
# tests hold it to each role's static import in configure.yml and to the
# settings' checks (docs/architecture/custom-code.md §7.11).
claude_vpns:
  tailscale:
    name: Tailscale
    family: tailscale
    role: tailscale
    sign_in: true
# The vpn setting as every playbook reads it: an empty one is none. Internal,
# not a setting.
claude_vpn_key: "{{ vpn | default('none', true) | string }}"

# ------------------------------------------------------------ Tailscale -----
# Each setting's description: local.yml.example, under Tailscale.
tailscale_enabled: false
# Only ever used for a VM's first join, never sent to a node that has had a
# login (docs/architecture/roles.md §5.8).
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('', true) }}"
tailscale_auth_method: auto
tailscale_login_auto_start: true
tailscale_api_auth_method: auto
tailscale_api_token: "{{ vault_tailscale_api_token | default('', true) }}"
tailscale_oauth_client_id: "{{ vault_tailscale_oauth_client_id | default('', true) }}"
tailscale_oauth_client_secret: "{{ vault_tailscale_oauth_client_secret | default('', true) }}"
tailscale_ssh: false
tailscale_accept_routes: false
tailscale_accept_dns: false
tailscale_advertise_tags: []
tailscale_login_server: ""
# Tailscale's own default.
tailscale_upload_logs: true
tailscale_login_timeout: 300

# -------------------------------------------------------------- Editor -----
# Each setting's description: local.yml.example, under Editor and SSH.
editor: vscode
# The editors just code can open, by the editor setting's value, a check file
# each (playbooks/tasks/<editor>_check.yml) and the one apply every editor's
# plan goes through (playbooks/tasks/editor_open.yml). Each row says, in
# literal values only: name, how the editor is said; window_tasks, whether its
# window runs just code's tasks as it opens (the notes' refresh, the Claude
# terminal's start); claude_terminal, how its window gets a Claude terminal -
# started (a task the window runs as it opens), listed (a task the user picks
# from the editor's list of tasks) or none (neither, the default for a row
# without it). The last two mean different things, though with these two rows
# they always agree. family, the module of lib/claude_vm/editors/ that plans
# its window (a fork of an editor is a row of that editor's family, with a
# check file of its own and its key in just code's --editor);
# cli_candidates, the names its command goes by here, looked for in that
# order; version_re, what that command's --version must say where another
# program shares a name; server, how just status knows one of its windows on
# the VM - a process of the VM user's whose program's path contains
# argv0_contains, whose program's name starts with argv0_name_prefix, whose
# first argument is argv1 and which has every argument of argv_has, each given
# one holding: VS Code's extension host, one per window, and the daemon of
# Zed's remote server, one per project it opens
# (~/.zed_server/zed-remote-server-<channel>-<version> run ...; from Zed's
# source, and seen on Zed 1.26.2), its proxies beside it not counted.
# Internal, not a setting: tests hold it to those files, to just code's
# --editor and to the core's records (docs/architecture/custom-code.md §7.10).
claude_editors:
  vscode:
    name: VS Code
    family: vscode
    window_tasks: true
    claude_terminal: started
    cli_candidates: [code]
    server:
      argv0_contains: .vscode-server
      argv_has: [--type=extensionHost]
  zed:
    name: Zed
    family: zed
    window_tasks: false
    claude_terminal: listed
    cli_candidates: [zeditor, zed]
    version_re: "^Zed "
    server:
      argv0_name_prefix: zed-remote-server
      argv1: run
# The editor setting as every playbook reads it: an empty one is the
# default's. Internal, not a setting.
claude_editor_key: "{{ editor | default('vscode', true) | string }}"

vscode_remote: true

# One value, because three things read it - github_projects, Remote Control and
# the editor - and they must agree. Empty is resolved on the VM itself.
vm_projects_dir: ""

editor_claude_terminal: "{{ vscode_claude_terminal }}"
# Its name in 1.0, still read through 1.x: editor_claude_terminal is the one to set.
vscode_claude_terminal: true
editor_files_dir: "{{ vscode_workspaces_dir }}"
# Its name in 1.0, still read through 1.x: editor_files_dir is the one to set.
vscode_workspaces_dir: ""
editor_session_notes: "{{ vscode_session_notes }}"
# Its name in 1.0, still read through 1.x: editor_session_notes is the one to set.
vscode_session_notes: true
claude_sessions_sync: "{{ vscode_claude_sessions }}"
# Its name in 1.0, still read through 1.x: claude_sessions_sync is the one to set.
vscode_claude_sessions: true
vscode_user_settings_file: ""

# Nothing in ~/.ssh is edited but the managed file below, known_hosts, and one
# Include line at the top of ~/.ssh/config, added once and never removed
# (docs/architecture/lifecycle.md §4.8).
claude_ssh_config: true
claude_ssh_config_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/agent-warehouse.conf"
# The managed file's name through 1.x, beside it: the first alias write of 2.0
# moves it to claude_ssh_config_file (tasks/ssh_config.yml), and until then
# just status and the prune read it. Only the default name had one.
claude_ssh_config_legacy_file: >-
  {{ (claude_ssh_config_file | dirname) ~ '/claude-on-proxmox.conf'
     if claude_ssh_config_file | basename == 'agent-warehouse.conf' else '' }}
claude_ssh_user_config: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/config"
# The host whose VMs this run reaches, by its inventory name, as each alias
# block records it (# origin, tasks/ssh_config.yml): the prune, destroy and the
# next write go by it. Empty without a Proxmox host in the inventory (a static
# one, as Vagrant's), when a block records none. Not a setting.
claude_ssh_origin: "{{ groups['proxmox'][0] if groups['proxmox'] | default([]) else '' }}"
# The checkout's other hosts, as {name, address}: tools/check host hands them
# to every run against one host. Not a setting.
claude_hosts_other: []
# The managed file's alias blocks, each as {name, origin}, as the file is when a
# task asks - by its 1.x name while that is the one there. Not a setting.
claude_ssh_blocks: >-
  {{ (lookup('ansible.builtin.file', claude_ssh_config_file, errors='ignore')
      or (lookup('ansible.builtin.file', claude_ssh_config_legacy_file, errors='ignore')
          if claude_ssh_config_legacy_file | length > 0 else '')
      or '') | ssh_config_blocks }}
# The VMs whose alias records another host than this run's: theirs to keep,
# which destroy removes neither the alias nor the <name>.<domain> key of.
claude_ssh_names_elsewhere: "{{ claude_ssh_blocks | ssh_config_elsewhere(claude_ssh_origin) | map(attribute='name') | list }}"
claude_ssh_config_include: true
claude_ssh_host_domain: ""
claude_ssh_identity_file: ""
# Off on purpose: the VM user has passwordless sudo and runs Claude Code, and
# ForwardAgent hands every key in your agent to both for the life of the
# connection. Pushes go through gh, signed in on the VM itself (github_auth).
claude_ssh_forward_agent: false
claude_ssh_options:
  ServerAliveInterval: "30"

# --------------------------------------------------- role variable wiring ---
# Roles are self-contained and prefix their variables; wire them to the
# project-level values above so a single change flows everywhere.
proxmox_vm_api_host: "{{ proxmox_api_host }}"
proxmox_vm_api_port: "{{ proxmox_api_port }}"
proxmox_vm_api_user: "{{ proxmox_api_user }}"
proxmox_vm_api_token_id: "{{ proxmox_api_token_id }}"
proxmox_vm_api_token_secret: "{{ proxmox_api_token_secret }}"
proxmox_vm_validate_certs: "{{ proxmox_validate_certs }}"
proxmox_vm_node: "{{ proxmox_node }}"
proxmox_vm_storage: "{{ proxmox_storage }}"
# A golden is cloned by the number Proxmox knows it by (provision.yml), so its name only labels the clone.
proxmox_vm_template_name: "{{ claude_vm_golden_template_name or proxmox_template_base }}"
proxmox_vm_nic: "{{ proxmox_nic }}"
proxmox_vm_user: "{{ vm_user }}"
proxmox_vm_ssh_public_keys: "{{ vm_ssh_public_keys }}"
proxmox_vm_tags: ["{{ claude_vm_tag }}"]
proxmox_vm_tags_1x: "{{ claude_vm_tags_owned[1:] }}"
proxmox_vm_known_hosts_domain: "{{ claude_ssh_host_domain }}"
proxmox_vm_known_hosts_kept: "{{ claude_vm_inventory_addresses }}"

proxmox_template_bridge: "{{ proxmox_bridge }}"
proxmox_template_storage: "{{ proxmox_storage }}"

common_user: "{{ vm_user }}"
common_user_ssh_public_keys: "{{ vm_ssh_public_keys }}"
common_user_password: "{{ vault_vm_password | default('') }}"

vscode_server_enabled: "{{ vscode_remote }}"
vscode_server_user: "{{ vm_user }}"

dev_tools_user: "{{ vm_user }}"

claude_code_user: "{{ vm_user }}"
claude_code_anthropic_api_key: "{{ anthropic_api_key }}"
claude_code_remote_control_dir: "{{ vm_projects_dir }}"
claude_code_login_desktop: "{{ login_desktop }}"

github_projects_user: "{{ vm_user }}"
github_projects_username: "{{ github_username }}"
github_projects_token: "{{ github_token }}"
github_projects_include: "{{ github_projects }}"
# A VM's own list, published with it from its notes in Proxmox (discover.yml, provision.yml).
github_projects_vm_repos: "{{ claude_vm_repos | default({}) }}"
github_projects_dir: "{{ vm_projects_dir }}"
github_projects_auth: "{{ github_auth }}"
github_projects_auth_method: "{{ github_auth_method }}"
github_projects_login_scopes: "{{ github_login_scopes }}"
github_projects_login_desktop: "{{ login_desktop }}"
github_projects_git_user_name: "{{ git_user_name }}"
github_projects_git_user_email: "{{ git_user_email }}"

tailscale_login_desktop: "{{ login_desktop }}"
tailscale_joined_tag: "{{ claude_vm_tailscale_tag }}"
# Whether Tailscale is the VPN, from the vpn setting: the role's own input,
# since vpn's default reads tailscale_enabled, which the role cannot then be
# handed. And the setting that turned it off, as its messages name it: vpn,
# which tailscale_enabled only decides while vpn is unset, and which is none
# for a local.yml that sets neither.
tailscale_wanted: "{{ claude_vpn_key == 'tailscale' }}"
tailscale_off_setting:
  name: vpn
  value: "{{ claude_vpn_key }}"
