---
# Shared, non-secret defaults that are safe to commit.
# Override anything here in inventory/group_vars/all/local.yml (git-ignored).
# Files in this directory load alphabetically, so defaults.yml < local.yml < vault.yml.

# ---------------------------------------------------------------- Proxmox ---
# Defaults to the ansible_host (or name) of the first host in the proxmox group.
proxmox_api_host: >-
  {{ hostvars[groups['proxmox'][0]]['ansible_host'] | default(groups['proxmox'][0])
     if groups['proxmox'] | default([]) else '' }}
proxmox_api_port: 8006
# A dedicated, VM-scoped user is recommended over root@pam
# (docs/getting-started/proxmox-access.md).
proxmox_api_user: ansible@pve
proxmox_api_token_id: ansible
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"
# Proxmox ships a self-signed certificate. Set to true once the PVE CA is
# trusted on the controller (docs/getting-started/proxmox-access.md).
proxmox_validate_certs: false
proxmox_node: pve
proxmox_storage: local-lvm
proxmox_bridge: vmbr0
# Which NIC of the template carries the LAN address: its MAC is how a VM's own
# address is told apart from bridges the guest grows later. Provisioning,
# discovery and make list all read it from here. Only change it if the
# template was built with something other than a single net0.
proxmox_nic: net0

# The API connection, as one value for a play's module_defaults, so that the
# playbooks cannot drift apart on it:
#   module_defaults:
#     group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"
# The proxmox_vm role keeps its own, from the proxmox_vm_api_* wiring below.
proxmox_api_module_defaults:
  api_host: "{{ proxmox_api_host }}"
  api_port: "{{ proxmox_api_port }}"
  api_user: "{{ proxmox_api_user }}"
  api_token_id: "{{ proxmox_api_token_id }}"
  api_token_secret: "{{ proxmox_api_token_secret }}"
  validate_certs: "{{ proxmox_validate_certs }}"
# Base URL for the one request no community.proxmox module makes on its own
# (playbooks/tasks/cluster_vms.yml). A bare IPv6 address is bracketed, as
# proxmoxer does for the modules.
proxmox_api_url: >-
  https://{{ '[' ~ proxmox_api_host ~ ']' if proxmox_api_host is search(':.*:') and proxmox_api_host is not match('[[]')
  else proxmox_api_host }}:{{ proxmox_api_port }}/api2/json

# The pieces a raw request to the API needs, for the few reads that go through
# `uri` rather than a community.proxmox module (the cluster listing, the next
# free VMID, each VM's config and agent reply). One definition, so a change to
# how the token is sent or the CA is found cannot leave one caller behind.
# The header carries the token: every task that sends it is no_log.
proxmox_api_headers:
  Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
# The wiki trusts the Proxmox CA through REQUESTS_CA_BUNDLE, which the
# modules' HTTP client reads and `uri` does not, so it is passed on. Empty
# when certificates are not validated; callers `default(omit, true)` it.
proxmox_api_ca_path: "{{ lookup('ansible.builtin.env', 'REQUESTS_CA_BUNDLE') if proxmox_validate_certs | bool else '' }}"

# Cloud-init template that VMs are cloned from (built by playbooks/template.yml)
proxmox_template_vmid: 9000
proxmox_template_name: ubuntu-24.04-cloudinit

# ------------------------------------------------------------------- VM -----
# Name(s) of the VM(s) to create. Set on the command line, comma-separated:
#   make deploy VM_NAME=alpha,beta TYPE=provision
# The name is what appears in the Proxmox UI. VMIDs are assigned by Proxmox and
# addresses by your DHCP server, so neither has to be declared here.
#
# claude_vm_names falls back to this default name when vm_name is not given,
# which is what provision.yml, deploy.yml and destroy.yml act on. discover.yml
# and list.yml test `vm_name is defined` instead and, without it, cover every
# tagged VM - so make list, make login and make deploy TYPE=configure, check
# and ssh-config are fleet-wide.
claude_vm_default_name: claude-on-proxmox-default
# Applied to every VM this project creates, and how they are found again.
claude_vm_tag: claude-on-proxmox
# Matches claude_vm_tag as a whole tag in Proxmox's ";"-joined tag string (or
# the ","-joined form proxmox_kvm sends), never as a substring of a longer one.
# Case-insensitive, because Proxmox stores tags lowercased by default: a
# claude_vm_tag of "Claude-On-Proxmox" is stamped on a VM as
# "claude-on-proxmox", and matched as typed it would never be found again.
# The proxmox_vm role lowercases both sides of its own comparison the same way.
claude_vm_tag_pattern: "(?i)(^|[;,]){{ claude_vm_tag | lower | regex_escape }}([;,]|$)"
# The VMs this project owns, filtered out of the cluster's VM list. Defined
# here, not in each playbook, so discover.yml, list.yml and destroy.yml cannot
# drift on what "ours" means. Evaluated lazily: any play that uses it must have
# run playbooks/tasks/cluster_vms.yml, which registers claude_vm_all, and is
# meant to fail loudly if it has not - an empty fleet and an unasked API are
# not the same thing. Proxmox leaves `tags` out altogether for a VM that has
# none, so the "defined" check is what lets such a VM through without an error.
# `name` can be missing too: Proxmox fills it from the node's statistics, which
# the cluster drops five minutes after a node stops reporting, so a tagged VM
# on a node that is down is listed with a VMID, a node and its tags but no
# name. It stays in this list - `make list` shows it - and every consumer
# reads `name` with a default rather than failing the whole fleet over it.
claude_vm_tagged: >-
  {{ claude_vm_all.json.data
     | selectattr('type', 'equalto', 'qemu')
     | selectattr('tags', 'defined')
     | selectattr('tags', 'regex', claude_vm_tag_pattern)
     | list }}
claude_vm_names: >-
  {{ (vm_name | default(claude_vm_default_name, true)) | split(',') | map('trim') | select | list }}
# The tagged VMs a fleet-wide target acts on: the ones VM_NAME names, or all of
# them without it. discover.yml and list.yml both narrow through this, so
# `make deploy TYPE=configure` and `make list` cannot disagree on what VM_NAME selects.
claude_vm_requested: >-
  {{ claude_vm_tagged | selectattr('name', 'defined') | selectattr('name', 'in', claude_vm_names) | list
     if vm_name is defined else claude_vm_tagged }}

# configure.yml discovers VMs from Proxmox before configuring them. Set false
# to configure hosts that are already in a static inventory (Vagrant does this)
# and skip the Proxmox API entirely.
claude_vm_discovery: true

# Login user created by cloud-init and used for everything afterwards.
vm_user: dev
# configure.yml waits for cloud-init before configuring. Disable for hosts
# that were not built from a cloud image (Vagrant, containers).
configure_wait_for_cloud_init: true
# Public keys authorised for vm_user. Defaults to your local default key.
# Read with errors='ignore' so that someone whose key is an RSA or ECDSA one
# gets the role's "set vm_ssh_public_keys" message rather than a bare
# "could not locate file" from the lookup, which Jinja evaluates first.
vm_ssh_public_keys: >-
  {{ [lookup('ansible.builtin.file',
             lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub',
             errors='ignore')]
     | select('string') | select | list }}

# --------------------------------------------------------------- GitHub -----
# default('', true) on each vault value: one left empty in the vault is None,
# which has no length.
github_username: "{{ vault_github_username | default('', true) }}"
# Optional. With it, private repositories are listed and cloned, and gh on
# each VM is signed in with it, so `git push` and `gh pr create` work there
# (docs/guides/github.md, for the permissions it needs). Without it, gh is signed in once per VM by GitHub's
# device flow - `make login VM_NAME=<name> TYPE=github` runs it and then clones the
# private repositories, and the terminal `make code` opens runs it too - and
# every later `make deploy TYPE=configure` lists with the token gh stored. Either way the
# same token serves the listing, the clones and the pushes.
github_token: "{{ vault_github_token | default('', true) }}"
# Repository names to clone. Empty list = every repository of github_username
# (forks and archived repos excluded unless enabled below).
github_projects: []
# Sign gh in on each VM and make it git's credential helper, as above. false
# leaves gh, ~/.gitconfig and the identity below alone; a token then only
# lists, and a private repository it lists is skipped, not cloned.
github_auth: true
# How: auto signs in with github_token when there is one and by GitHub's
# device flow otherwise; web is the device flow always, and a token then only
# lists; token is the token only, and an empty one fails by name. The device
# flow runs in `make deploy` and in `make login VM_NAME=<name> TYPE=github`: a page
# opens in your browser, the code is on your clipboard, you paste it and
# approve, and the run then clones the private repositories too. Scopes it
# asks for on top of gh's own: workflow, so that pushes which change
# .github/workflows/ are not refused.
github_auth_method: auto
# make deploy starts GitHub's sign-in by itself for each VM gh is not signed in
# on: the page opens, the code is on your clipboard, and the run waits for your
# approval. false asks first at a prompt, so a VM can be left for later.
github_login_auto_start: true
github_login_scopes: [workflow]
# The git identity written on each VM. Empty: the GitHub account's display
# name (or its login) and GitHub's noreply address for it, so no private email
# lands in commits by default.
git_user_name: ""
git_user_email: ""

# ------------------------------------------------------------ Anthropic -----
# Optional API key, for billing Claude Code to Anthropic API credits. If empty,
# the VM signs in with your Claude account instead: make deploy and make
# login run that sign-in for you.
#
# Note this is not the credential Remote Control uses - see below.
anthropic_api_key: "{{ vault_anthropic_api_key | default('', true) }}"

# Run a Remote Control server on each VM, so its Claude Code session shows up
# at claude.ai/code and in the Claude mobile app while running on the VM.
#
# On by default, but what actually happens is derived from the credentials on
# the VM rather than from this switch, because the two Claude Code credentials
# are mutually exclusive: an API key outranks the claude.ai login, and only
# that login can establish a Remote Control session.
#
#   anthropic_api_key set  -> off; you are on the API path
#   no key, not logged in  -> prepared but not started; run make login TYPE=claude
#   no key, logged in      -> started, and reachable from the app
#
# So activating it is: leave the API key empty, and sign in once - `make
# deploy` asks for that itself, and `make login VM_NAME=<name> TYPE=claude` does it
# for a VM that exists. Either starts Remote Control in the same run, and a
# sign-in made any other way starts it by itself.
# Set this false to opt out. Off - by this switch or by a key - stops, disables
# and removes a server an earlier run installed.
claude_remote_control: true
# Extra arguments for the sign-in's `claude auth login`, such as [--sso], and
# how many seconds it may take to accept the code you paste.
claude_login_args: []
claude_login_timeout: 120
# How many seconds the sign-in waits for you to authorise in the browser, when
# the browser comes back to the VM by itself.
claude_login_approval_timeout: 300

# -------------------------------------------------------------- Sign-in -----
# make deploy ends with the VM signed in to Claude, GitHub and Tailscale and
# open in VS Code. The sign-ins are the steps only you can take: each opens a
# page in your browser, and the run waits for you there, one VM at a time.
#   Claude: authorise, and the browser comes back to the VM by itself (where
#           it cannot, paste the code the page shows at the prompt).
#   GitHub: paste the code that is already on your clipboard, and authorise.
#   Tailscale: sign in and connect the device (none with an auth key).
# GitHub's and Tailscale's start by themselves (github_login_auto_start,
# tailscale_login_auto_start), for every VM but one whose Claude sign-in nobody
# answered; none runs where a vault token or key signs the VM in. A run with
# no terminal skips them all; make login does them later. false leaves the
# sign-ins to that command.
deploy_sign_in: true
# Open the VM in VS Code at the end of make deploy, as make code does, when the
# run was for one VM; a deploy for several ends with each VM's make code line.
deploy_code: true
# Before make destroy deletes a VM, release it from what it signed in to: Claude
# signs out there and Remote Control stops, gh signs out (its token stays valid:
# revoking GitHub CLI at GitHub signs out every gh you have, so the report says
# where, and destroy does not), and it leaves your tailnet (its device deleted
# with tailscale_api_auth_method). A stopped VM is started for it. false deletes
# the VMs as they are.
destroy_release: true
# The browser and clipboard steps of both sign-ins happen on this machine.
# Off, the run only prints the page and the code (a headless controller).
# Every test turns this off; tests/unit/test_github_auth.py and
# test_claude_login.py check they do.
login_desktop: true

# ------------------------------------------------------------ Tailscale -----
# Each VM joins your tailnet, so you can reach it - ssh, VS Code, a dev server -
# from anywhere your other devices are, not only from this LAN
# (docs/guides/tailscale.md). Optional, and on by default. false turns it
# off again where this project installed it: logged out, stopped and removed.
# A Tailscale installed on a VM by hand is left alone either way.
tailscale_enabled: true
# Optional: an auth key (vault_tailscale_auth_key) joins each new VM during
# configuration, with nothing to click. Without one, make login TYPE=tailscale - and
# make deploy's step - signs a VM in by Tailscale's web login. Only ever used
# for a VM's first join. A reusable, pre-approved, tagged key is the kind to
# make.
tailscale_auth_key: "{{ vault_tailscale_auth_key | default('', true) }}"
# How a VM joins: auto uses the key above when there is one and the web login
# otherwise; key uses the key only, and an empty one fails by name; web uses the
# web login only, and a key in the vault is left unused.
tailscale_auth_method: auto
# make deploy starts Tailscale's web login by itself for each VM that is not
# signed in: the page opens and the run waits for your approval. false asks
# first at a prompt, so a VM can be left for later.
tailscale_login_auto_start: true
# How a VM's device is deleted from your tailnet when make destroy deletes the
# VM, or tailscale_enabled: false takes Tailscale off it - so it leaves the
# admin console and its name is free for a VM built again. auto deletes it with
# whichever credential below is in the vault, the API access token first, and
# with none there acts as none. none: the VM is only logged out, and the run
# names the device to delete in the admin console - a credential in the vault
# then stays unused. token: an API access token in vault_tailscale_api_token
# (Settings, Keys; tskey-api-..., which lasts at most 90 days). oauth: an
# OAuth client with the devices:core scope, in vault_tailscale_oauth_client_id
# and vault_tailscale_oauth_client_secret (Settings, OAuth clients; it does not
# expire, but Tailscale scopes it to the tags you give it, which may keep it
# from deleting a device without them, such as one joined by the web login).
tailscale_api_auth_method: auto
tailscale_api_token: "{{ vault_tailscale_api_token | default('', true) }}"
tailscale_oauth_client_id: "{{ vault_tailscale_oauth_client_id | default('', true) }}"
tailscale_oauth_client_secret: "{{ vault_tailscale_oauth_client_secret | default('', true) }}"
# Tailscale SSH on the tailnet address, in place of sshd there, authorised by
# your tailnet's policy, which needs an ssh rule for it (docs/guides/tailscale.md).
tailscale_ssh: false
# Use the subnet routes your other devices advertise.
tailscale_accept_routes: false
# Let your tailnet's DNS settings change how the VM looks names up. Off, the VM
# keeps the resolver DHCP gave it, and your devices still reach it by its
# tailnet name. On, a tailnet that overrides local DNS sends all the VM's
# lookups to its nameservers - and one on the tailnet is out of reach of a VM
# the policy in docs/guides/tailscale.md isolates.
tailscale_accept_dns: false
# Tags asked for at the join, such as [tag:claude-vm]. Leave empty with a tagged
# key: the VM takes the key's tags. Set it to tag a VM you sign in by the web.
tailscale_advertise_tags: []
# Another control server, such as Headscale. Empty is Tailscale's own.
tailscale_login_server: ""
# Tailscale's own default. false keeps tailscaled from uploading its logs to
# Tailscale - which also ends Tailscale's technical support for the VMs.
tailscale_upload_logs: true
# How long the web login waits for you to approve the page, in seconds. The
# page stays valid for 7 days, and a VM approved later joins by itself.
tailscale_login_timeout: 300

# ------------------------------------------------------------- VS Code -----
# Make each VM ready for VS Code's Remote - SSH extension: an sshd drop-in that
# keeps the port forward the VS Code Server is reached through enabled, a
# check that sshd really runs with it, and a higher inotify limit for the file
# watcher (docs/guides/vscode.md). Set false to remove both files.
vscode_remote: true

# Where the code lives on each VM: what github_projects clones into, where a
# Remote Control session opens, and what VS Code is pointed at. Empty means
# ~/projects of vm_user, resolved on the VM itself. One value, because three
# things read it and they must agree.
vm_projects_dir: ""

# `make code` opens a VS Code workspace file rather than the bare folder, and
# the file holds one task: once the window is connected, a terminal named
# Claude runs claude in the folder, signing in to Claude first on a VM that has
# not been. The file is the one thing make code writes on the VM, in a
# directory of its own (empty: .claude-on-proxmox in the projects directory),
# never in a repository. VS Code still asks once to trust the folder and to
# allow automatic tasks; this project answers neither for you
# (docs/guides/vscode.md). Set false to open the bare folder and write
# nothing on the VM.
vscode_claude_terminal: true
# Where those files go on the VM: an absolute path (no "~"), not the projects
# directory itself. Empty: .claude-on-proxmox in the projects directory. A
# directory that already exists keeps its mode; files written before a move
# stay where they were.
vscode_workspaces_dir: ""
# Session notes: a page about the VM - its addresses, how to reach it, what is
# signed in, the make commands - that opens as a rendered preview beside the
# Claude terminal every time the window opens. make code writes them in
# session/ under the workspaces directory, never in a repository; the window's
# "Session notes" task rewrites their "Signed in" section from the VM each
# time it opens. They need that task, so they come with vscode_claude_terminal
# (docs/guides/vscode.md). Set false for neither.
vscode_session_notes: true
# This machine's Claude Code sessions on the VM: every make code copies the ones
# of the last 30 days whose repository the VM has checked out - matched by git
# origin - into the VM's ~/.claude/projects/, so that /resume there (Ctrl+A for
# every project) lists them, and `make code VM_NAME=alpha SESSION=<id>` opens one
# in the Claude terminal. A transcript holds whatever its tools printed, secrets
# included, so a VM gets those too: set false for none. SESSION still copies
# its one session with this off (docs/guides/vscode.md).
vscode_claude_sessions: true
# The VS Code user settings make code reads, and never writes, to say whether
# that terminal will start on its own. Empty: where VS Code itself would keep
# them - $VSCODE_APPDATA or $XDG_CONFIG_HOME if set, else
# ~/Library/Application Support/Code/User/settings.json on macOS,
# ~/.config/Code/User/settings.json on Linux, then the snap's and the
# flatpak's. Set it for a VS Code that keeps them elsewhere: Insiders,
# VSCodium (~/.config/VSCodium/User/settings.json), or a VS Code on Windows
# driven from WSL (/mnt/c/Users/<you>/AppData/Roaming/Code/User/settings.json).
vscode_user_settings_file: ""

# An SSH alias per VM on this machine, kept in step with the VM's address:
# `make deploy` and `make deploy TYPE=configure` write one for each VM they configure,
# `make deploy TYPE=ssh-config` refreshes the whole fleet, `make destroy` removes it. The
# aliases live in the managed file below, as one block per VM, and
# ~/.ssh/config gets exactly one line, an Include of that file at its top.
# Nothing else in ~/.ssh is ever edited. Set false to keep this project out of
# ~/.ssh altogether (the Vagrantfile does).
claude_ssh_config: true
claude_ssh_config_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/claude-on-proxmox.conf"
claude_ssh_user_config: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/config"
# Set false to leave ~/.ssh/config untouched; the run then prints the Include
# line to add by hand.
claude_ssh_config_include: true
# When set, each alias points at <name>.<domain> instead of the address the
# guest agent reported, and a lease that moves no longer matters - for a
# network whose DNS resolves VM names (a router that registers DHCP leases,
# or avahi with "local").
claude_ssh_host_domain: ""
# Written into each alias when set. Empty lets ssh pick, which is the default
# key vm_ssh_public_keys reads.
claude_ssh_identity_file: ""
# Off on purpose: the VM user has passwordless sudo and runs Claude Code, and
# ForwardAgent hands every key in your agent to both for the life of the
# connection. Pushes go through gh, signed in on the VM itself (github_auth).
claude_ssh_forward_agent: false
# Extra "Key value" lines for each alias, verbatim. ServerAliveInterval keeps
# a VS Code connection from going stale behind a NAT or a sleeping laptop.
claude_ssh_options:
  ServerAliveInterval: "30"

# --------------------------------------------------- role variable wiring ---
# Roles are self-contained and prefix their variables; wire them to the
# project-level values above so a single change flows everywhere.
proxmox_vm_api_host: "{{ proxmox_api_host }}"
proxmox_vm_api_port: "{{ proxmox_api_port }}"
proxmox_vm_api_user: "{{ proxmox_api_user }}"
proxmox_vm_api_token_id: "{{ proxmox_api_token_id }}"
proxmox_vm_api_token_secret: "{{ proxmox_api_token_secret }}"
proxmox_vm_validate_certs: "{{ proxmox_validate_certs }}"
proxmox_vm_node: "{{ proxmox_node }}"
proxmox_vm_storage: "{{ proxmox_storage }}"
proxmox_vm_template_name: "{{ proxmox_template_name }}"
proxmox_vm_nic: "{{ proxmox_nic }}"
proxmox_vm_user: "{{ vm_user }}"
proxmox_vm_ssh_public_keys: "{{ vm_ssh_public_keys }}"
proxmox_vm_tags: ["{{ claude_vm_tag }}"]
proxmox_vm_known_hosts_domain: "{{ claude_ssh_host_domain }}"

proxmox_template_bridge: "{{ proxmox_bridge }}"
proxmox_template_storage: "{{ proxmox_storage }}"

common_user: "{{ vm_user }}"
common_user_ssh_public_keys: "{{ vm_ssh_public_keys }}"

vscode_server_enabled: "{{ vscode_remote }}"
vscode_server_user: "{{ vm_user }}"

dev_tools_user: "{{ vm_user }}"

claude_code_user: "{{ vm_user }}"
claude_code_anthropic_api_key: "{{ anthropic_api_key }}"
claude_code_remote_control: "{{ claude_remote_control }}"
claude_code_remote_control_dir: "{{ vm_projects_dir }}"
claude_code_login_desktop: "{{ login_desktop }}"
claude_code_login_args: "{{ claude_login_args }}"
claude_code_login_timeout: "{{ claude_login_timeout }}"
claude_code_login_approval_timeout: "{{ claude_login_approval_timeout }}"

github_projects_user: "{{ vm_user }}"
github_projects_username: "{{ github_username }}"
github_projects_token: "{{ github_token }}"
github_projects_include: "{{ github_projects }}"
github_projects_dir: "{{ vm_projects_dir }}"
github_projects_auth: "{{ github_auth }}"
github_projects_auth_method: "{{ github_auth_method }}"
github_projects_login_scopes: "{{ github_login_scopes }}"
github_projects_login_desktop: "{{ login_desktop }}"
github_projects_git_user_name: "{{ git_user_name }}"
github_projects_git_user_email: "{{ git_user_email }}"

tailscale_login_desktop: "{{ login_desktop }}"
