[defaults]
# A directory: controller.yml plus your own hosts.yml. VMs are not listed;
# playbooks/discover.yml adds them at runtime.
inventory = inventory
# Setting this key REPLACES Ansible's default ignore list rather than adding to
# it, so this value re-lists the defaults worth keeping and adds .example. Drop
# one - .bak, say - and a stray hosts.yml.bak would be parsed as inventory.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry, .example
roles_path = roles
filter_plugins = filter_plugins
interpreter_python = auto_silent
retry_files_enabled = false
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# No fact cache: only dev_tools reads a gathered fact, the one gather per configure run
# costs seconds in a run that takes minutes, and a cached entry outlived the VM
# it described, handing a VM rebuilt under the same name the old one's facts.
#
# Every proxmox_vm task is an API call delegated to localhost and configure is
# SSH to the fleet, so forks is the number of VMs that are cloned, booted or
# configured at once; above it the fleet proceeds in waves. The hypervisor is
# the real limit. For a larger fleet: make provision ANSIBLE_ARGS="-f 30".
forks = 20

[ssh_connection]
pipelining = true
# accept-new: trust a freshly provisioned VM's host key on first contact but
# still refuse if a known host's key changes later.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
