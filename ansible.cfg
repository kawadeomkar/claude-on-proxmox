[defaults]
# A directory: controller.yml plus your own hosts.yml. VMs are not listed;
# playbooks/discover.yml adds them at runtime.
inventory = inventory
# Setting this key REPLACES Ansible's default ignore list rather than adding to
# it, so this value re-lists the defaults worth keeping and adds .example. Drop
# one - .bak, say - and a stray hosts.yml.bak would be parsed as inventory.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .cfg, .retry, .example
roles_path = roles
filter_plugins = filter_plugins
interpreter_python = auto_silent
retry_files_enabled = false
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
# The default output, with the moments a run waits for you in the browser set
# apart and NEXT STEPS after the recap (callback_plugins/claude_on_proxmox.py).
# Only runs that read this file load it: the unit tests run with an ansible.cfg
# of their own that holds only inject_facts_as_vars (below) and the JSON
# callback, and Molecule with its own settings.
stdout_callback = claude_on_proxmox
callback_plugins = callback_plugins
# No fact cache: the roles read only a few gathered facts, the one gather per
# configure run costs seconds in a run that takes minutes, and a cached entry
# outlived the VM it described, handing a VM rebuilt under the same name the old
# one's facts.
#
# A gathered fact is read as ansible_facts['architecture'], never as a top-level
# ansible_architecture: ansible-core 2.24 stops making those, and off here a read
# of one fails now rather than on that upgrade. Molecule's shared config
# (.config/molecule/config.yml) says the same; tests/unit/test_gathered_facts.py
# holds both, and scans for a read on a path no scenario takes.
inject_facts_as_vars = false
# Every proxmox_vm task is an API call delegated to localhost and configure is
# SSH to the fleet, so forks is the number of VMs that are cloned, booted or
# configured at once; above it the fleet proceeds in waves. The hypervisor is
# the real limit. For a larger fleet: ANSIBLE_ARGS='-f 30' just deploy --only provision.
forks = 20

[ssh_connection]
pipelining = true
# accept-new: trust a freshly provisioned VM's host key on first contact but
# still refuse if a known host's key changes later.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
