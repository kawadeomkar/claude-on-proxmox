---
# Ansible Galaxy collections required by this project.
# Install with:  make deps   (or: ansible-galaxy collection install -r requirements.yml)
#
# Pinned to exact versions, not ranges. A range means every user and every CI
# run silently picks up whatever was published most recently, and the weekly
# canary catches breakage but not a malicious release - which CI would then
# execute in a privileged container. It also made the CI cache key useless:
# it hashes this file, so it never changed when the resolved version did.
# Bump these deliberately; the canary job tells you when a bump is due.
collections:
  - name: community.proxmox
    version: "2.0.0"
  - name: community.general
    version: "12.4.0"
  - name: community.docker
    version: "5.3.0"
  - name: ansible.posix
    version: "2.1.0"
