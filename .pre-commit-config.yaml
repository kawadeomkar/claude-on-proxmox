---
# Install once with:  just init   (or: pre-commit install, from the project's environment)
# The linters run from the project's Python environment, through tools/env-run,
# which finds it the way the justfile does - never by name from PATH - so their
# versions are pinned in exactly one place (pyproject.toml, locked in uv.lock),
# whatever shell or editor makes the commit.
repos:
  # Pinned to commit SHAs, not tags: a tag can be moved to point at different
  # code, and pre-commit executes whatever it resolves to, in CI included.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: tools/env-run yamllint --strict
        language: system
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        entry: tools/env-run ansible-lint
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: tools/env-run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: tools/env-run ruff format
        language: system
        types: [python]
      # The wiki's reference pages are generated from these files; a commit
      # that changes one rewrites the pages, and the hook fails until they
      # are added too, as a formatter does.
      - id: docs
        name: wiki reference pages (just docs)
        entry: tools/env-run python tools/docs.py
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            justfile|
            roles/[^/]+/(meta/argument_specs|defaults/main|vars/main)\.yml|
            roles/[^/]+/tasks/.*|
            inventory/group_vars/all/(defaults\.yml|[^/]+\.example)|
            tools/.*|
            docs/reference/.*
          )$
