---
# Install once with:  make init   (or: .venv/bin/pre-commit install)
# The linters run from the project virtualenv so their versions are pinned in
# exactly one place (requirements.txt).
repos:
  # Pinned to commit SHAs, not tags: a tag can be moved to point at different
  # code, and pre-commit executes whatever it resolves to, in CI included.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: .venv/bin/yamllint --strict
        language: system
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        entry: .venv/bin/ansible-lint
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
