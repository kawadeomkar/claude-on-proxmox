---
version: 2
updates:
  # Bumps the pins in pyproject.toml, uv included, and re-locks uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before Dependabot proposes it: a malicious
    # release is usually found and yanked within days.
    cooldown:
      default-days: 7
    # Without this only the packages pyproject.toml names move, and the ones
    # the lock pins for them stay put unless an advisory names them.
    allow:
      - dependency-type: all
    # One pull request a week for the tooling; ansible-core on its own, since
    # its releases change what the playbooks may do.
    groups:
      tooling:
        patterns: ["*"]
        exclude-patterns: ["ansible-core"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Actions used inside the composite action are only picked up when the
  # directory points at it.
  - package-ecosystem: github-actions
    directory: /.github/actions/setup
    schedule:
      interval: weekly
