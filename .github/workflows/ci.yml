---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  # Weekly canary. Most of what this project installs lives outside the
  # repository - the Ubuntu cloud image, the Docker/NodeSource/GitHub CLI apt
  # repositories, the Claude Code installer and the uv release. Those break
  # without a commit here, so the suite runs on a schedule as well as on
  # changes. (The Galaxy collections are pinned to exact versions and cannot.)
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; pushes and the weekly run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # v8.30.0, the same release .pre-commit-config.yaml pins.
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of it: the commit scan at the end of this job reads every
          # commit a push or pull request brings in, and the one it starts from.
          fetch-depth: 0

      # .gitignore stops the accident; this stops `git add -f`. The patterns
      # live in a script so tests/unit/test_tracked_files.py can assert both
      # that every ignored path trips it and that test fixtures do not.
      - name: Check that no environment-specific file is tracked
        run: bash tests/check_no_local_files.sh

      - uses: ./.github/actions/setup

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Every linter, the playbooks' syntax check and the pre-commit hooks
      # those do not cover: detect-private-key, the large-file check and the
      # whitespace hooks, which would otherwise only ever run for a developer
      # who installed the git hook.
      #
      # gitleaks is among the hooks just lint skips, and is run by the two
      # steps below. Its hook is `gitleaks git --pre-commit --staged`, which
      # scans the git index - and in a CI checkout the index equals HEAD, so it
      # scans an empty diff and always passes.
      - name: Lint
        run: just lint

      # The files as the change leaves them. On its own this misses a token
      # committed in one commit and deleted in the next, which is gone from
      # the tree but still in the history GitHub publishes.
      - name: Secret scan (working tree)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      # So this reads the patch of every commit the push or pull request brings
      # in. A scheduled or manual run brings in none, and the tree scan covers it.
      - name: Secret scan (new commits)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE head=$PR_HEAD
          else
            base=$PUSH_BEFORE head=$PUSH_AFTER
          fi
          # A push that creates the branch has an all-zero "before", and after a
          # force push "before" can be reachable from no ref, so it was never
          # fetched. With nothing to compare against, scan all of head's history.
          if git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..$head
          else
            echo "::notice::Base commit '$base' is not in the clone; scanning all history behind $head"
            range=$head
          fi
          # gitleaks logs a git error but still exits 0, having scanned nothing.
          # Make the image's own git read the range first, so that fails loudly.
          echo "Commits in $range:"
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint git "$GITLEAKS_IMAGE" \
            rev-list --count "$range"
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git . --log-opts="$range" --config .gitleaks.toml --redact --no-banner --exit-code 1

  # The unit suite runs real playbooks: 44 minutes on a hosted runner one test
  # at a time, 16-22 on one runner's four vCPUs (two cores, two threads each)
  # with a worker on each, and 7.9-8.4 for the slowest of three shards. Each
  # shard keeps every module that shares a fixture whole, and the shards are
  # balanced by tests/unit/durations.json; CI result checks nothing is left out.
  unit:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: just test unit --shard ${{ matrix.shard }}/3
        env:
          # A worker per vCPU, said here: -n auto counts logical CPUs only while
          # psutil is not installed, and physical cores once it is - two here.
          PYTEST_XDIST_AUTO_NUM_WORKERS: "4"

  # Public repository: pull requests can add dependencies. This flags any new
  # one that carries a known advisory before it is merged. It reads the
  # dependency graph, which is enabled by default on public repositories.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Not behind lint and the unit tests: nothing here waits for their results,
  # and behind them a run took the unit suite's time plus the slowest
  # scenario's. A lint failure still fails the run through CI result.
  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [common, vscode_server, dev_tools, claude_code, github_projects, tailscale, proxmox_template, proxmox_vm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Molecule test
        run: just test --role ${{ matrix.role }}

  # Not part of the gate: this runs only on the weekly schedule (or on demand)
  # and tests the roles against the *unpinned* image, so an upstream Ubuntu
  # change surfaces on a Monday instead of at the next digest bump. It is
  # allowed to fail the scheduled run - that failure is the notification.
  canary:
    name: Canary (unpinned Ubuntu image)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOLECULE_IMAGE: geerlingguy/docker-ubuntu2404-ansible:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Molecule scenarios never fetch the real cloud image: the template
      # scenario serves a random file from 127.0.0.1. So the image URL and the
      # SHA256SUMS the role verifies it against are checked here, as the role
      # has them - a moved image or a renamed checksum file fails this run
      # instead of a user's first `just deploy`. Nothing is downloaded: a HEAD
      # on the image and a GET of the (small) checksum list.
      - name: Check the Ubuntu cloud image is where the role expects it
        run: |
          defaults=roles/proxmox_template/defaults/main.yml
          image=$(sed -n 's/^proxmox_template_image_url: *//p' "$defaults")
          sums=$(sed -n 's/^proxmox_template_image_checksum: *sha256://p' "$defaults")
          test -n "$image" && test -n "$sums" || { echo "::error::could not read the image URL and checksum URL from $defaults"; exit 1; }
          echo "image:    $image"
          echo "checksum: $sums"
          curl -fsSIL --retry 3 "$image" > /dev/null
          curl -fsSL --retry 3 "$sums" | grep -F "$(basename "$image")"

      - uses: ./.github/actions/setup
      - name: Molecule test (full configure playbook)
        run: just test integration

  playbooks:
    name: Molecule (${{ matrix.scenario }} playbook)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The job keeps the scenario's name; just test calls the configure
      # scenario's part integration.
      matrix:
        include:
          - scenario: configure
            type: integration
          - scenario: provision
            type: provision
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Molecule test
        run: just test ${{ matrix.type }}

  # The one check branch protection is to require: every job of the gate passed
  # or was skipped (dependency review is, on a push). Required alone, in place of
  # each job by name, it holds every job to the gate - a matrix entry added later
  # included - and lets jobs be split or renamed without a settings change. Not
  # the canary, which may fail on purpose. A cancelled or failed job fails it.
  result:
    name: CI result
    needs: [lint, unit, dependency-review, molecule, playbooks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job of the gate passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
