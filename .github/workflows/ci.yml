---
name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
  # Weekly canary. Most of what this project installs lives outside the
  # repository - the Ubuntu cloud image, the Docker/NodeSource/GitHub CLI apt
  # repositories, the Claude Code installer, the uv release and the Galaxy
  # collections (pinned as ranges). Those break without a commit here, so the
  # suite runs on a schedule as well as on changes.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; pushes and the weekly run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # .gitignore stops the accident; this stops `git add -f`.
      - name: Check that no environment-specific file is tracked
        run: |
          leaked=$(git ls-files \
            | grep -Ev '\.example$' \
            | grep -E '(^|/)(hosts\.ya?ml|local[^/]*\.ya?ml|vault[^/]*\.ya?ml)$|^\.vault_pass|^\.env' \
            || true)
          if [ -n "$leaked" ]; then
            echo "$leaked"
            echo "::error::These files hold environment-specific or secret data and must not be committed."
            exit 1
          fi

      - uses: ./.github/actions/setup

      - name: Lint
        run: make lint

      - name: Syntax check playbooks
        run: make syntax

      - name: Unit tests
        run: make unit

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # `make lint` already ran yamllint, ansible-lint and ruff, so skip those
      # and run the rest: gitleaks, detect-private-key, the large-file check and
      # the whitespace hooks. Without this they only ever run for a developer
      # who installed the git hook.
      - name: Secret scan and file hygiene
        env:
          SKIP: yamllint,ansible-lint,ruff-check,ruff-format
        run: make pre-commit

  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [common, dev_tools, claude_code, github_projects, proxmox_template, proxmox_vm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Molecule test
        run: make molecule MOLECULE_ROLES=${{ matrix.role }}

  # Not part of the gate: this runs only on the weekly schedule (or on demand)
  # and tests the roles against the *unpinned* image, so an upstream Ubuntu
  # change surfaces on a Monday instead of at the next digest bump. It is
  # allowed to fail the scheduled run - that failure is the notification.
  canary:
    name: Canary (unpinned Ubuntu image)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOLECULE_IMAGE: geerlingguy/docker-ubuntu2404-ansible:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Molecule test (full configure playbook)
        run: make molecule-integration

  integration:
    name: Molecule (full configure playbook)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Molecule test
        run: make molecule-integration
