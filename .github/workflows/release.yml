---
name: Release

# A release is a tag: an annotated vMAJOR.MINOR.PATCH tag (Semantic Versioning; v1.0.0-rc.1 and the like for a
# prerelease) on a commit of main, which CI gated on its way there. Pushing one publishes a GitHub release: the tag's
# message first, then the pull requests merged since the previous release, grouped as .github/release.yml says.
# CONTRIBUTING.md says how to cut one.
"on":
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history, to check the tag is on it.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, then publish its release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Semantic Versioning 2.0.0's version after a v, without build metadata, which orders nothing.
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ $TAG =~ $semver ]]; then
            echo "::error::$TAG is not vMAJOR.MINOR.PATCH (v0.2.0, v1.0.0-rc.1): delete the tag and tag again"
            exit 1
          fi
          # The tag as it was pushed: checkout fetched it by its commit, which leaves an annotated tag lightweight.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != tag ]; then
            echo "::error::$TAG is a lightweight tag: a release is an annotated one (git tag -a), its message the release's summary"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$(git rev-parse "refs/tags/$TAG^{commit}")" origin/main; then
            echo "::error::$TAG is on a commit main does not have: tag a commit of main, which CI gated"
            exit 1
          fi
          # The tag's message, without its signature if it is signed, then the generated notes after it.
          git tag --list --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > "$RUNNER_TEMP/notes.md"
          # A version with a hyphen is a prerelease (SemVer), which GitHub never marks the latest release.
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes ${prerelease:+"$prerelease"}
