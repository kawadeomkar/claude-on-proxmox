---
name: CI speed bench

# Temporary, for the CI speed-up plan: measures the unit suite under pytest-xdist
# on hosted runners, whole and sharded, and tries the "CI result" check the plan
# proposes. Runs only on its own branch, which is deleted afterwards.
"on":
  push:
    branches: [bench/ci-speed]

permissions:
  contents: read

jobs:
  whole:
    name: Whole suite, 4 workers (${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The runner's CPUs
        run: lscpu | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
      - name: Install pytest-xdist
        run: uv pip install pytest-xdist==3.8.0
      - name: Unit tests, 4 workers
        run: |
          start=$(date +%s)
          rc=0
          pytest tests/unit -n 4 --dist loadgroup --junitxml=junit.xml -o junit_family=xunit1 || rc=$?
          echo "wall $(( $(date +%s) - start )) s, exit $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-whole-${{ matrix.rep }}
          path: junit.xml

  shards:
    name: Shard ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.rep }})
    needs: whole
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {of: 3, shard: 1, rep: a}
          - {of: 3, shard: 2, rep: a}
          - {of: 3, shard: 3, rep: a}
          - {of: 3, shard: 1, rep: b}
          - {of: 3, shard: 2, rep: b}
          - {of: 3, shard: 3, rep: b}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The runner's CPUs
        run: lscpu | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
      - name: Install pytest-xdist
        run: uv pip install pytest-xdist==3.8.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: junit-whole-1
          # Outside the checkout: test_docs.py reads every file in it.
          path: ${{ runner.temp }}/whole
      # Each test's time in the whole-suite run, by node ID: inflated by the
      # four workers' contention, but in proportion, which is all the split uses.
      - name: Durations from the whole-suite run
        run: |
          python3 - <<'EOF'
          import json, os, re, xml.etree.ElementTree as ET
          durations = {}
          for case in ET.parse(os.environ["RUNNER_TEMP"] + "/whole/junit.xml").getroot().iter("testcase"):
              path = case.get("file")
              module = path[:-3].replace("/", ".")
              classname = case.get("classname", "")
              owner = classname[len(module) + 1 :] if classname.startswith(module + ".") else ""
              name = re.sub(r"@\w+$", "", case.get("name"))
              node = "::".join(part for part in (path, owner, name) if part)
              durations[node] = round(float(case.get("time")), 2)
          json.dump(durations, open("tests/unit/durations.json", "w"), indent=0, sort_keys=True)
          print(len(durations), "durations")
          EOF
      - name: Unit tests, one shard, 4 workers
        run: |
          start=$(date +%s)
          rc=0
          pytest tests/unit -n 4 --dist loadgroup --shard ${{ matrix.shard }}/${{ matrix.of }} \
            --junitxml=junit.xml -o junit_family=xunit1 || rc=$?
          echo "wall $(( $(date +%s) - start )) s, exit $rc" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-shard-${{ matrix.of }}-${{ matrix.shard }}-${{ matrix.rep }}
          path: junit.xml

  # The single required check the plan proposes, as it would be written: every
  # needed job succeeded or was skipped, and each set of shards ran every test once.
  result:
    name: CI result
    needs: [whole, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
      - name: Each set of shards ran every test exactly once
        run: |
          python3 - <<'EOF'
          import collections, pathlib, re, xml.etree.ElementTree as ET
          def ids(path):
              cases = ET.parse(path).getroot().iter("testcase")
              return [c.get("classname") + "::" + re.sub(r"@\w+$", "", c.get("name")) for c in cases]
          whole = collections.Counter(ids("junit/junit-whole-1/junit.xml"))
          sets = collections.defaultdict(collections.Counter)
          for path in pathlib.Path("junit").glob("junit-shard-*/junit.xml"):
              of, _, rep = path.parent.name.split("-")[2:]
              sets[f"{of} shards, rep {rep}"].update(ids(path))
          bad = False
          for name, ran in sorted(sets.items()):
              twice = sorted(k for k, n in ran.items() if n > 1)
              missing = sorted(set(whole) - set(ran))
              print(f"{name}: {sum(ran.values())} tests, whole run {sum(whole.values())}; twice {len(twice)}, missing {len(missing)}")
              bad |= bool(twice or missing)
          raise SystemExit(bad)
          EOF
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
