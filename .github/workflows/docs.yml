---
name: Docs

# Publishes the wiki in docs/ to GitHub Pages, at the site_url zensical.toml
# names, whenever main changes what it is built from. Pull requests need no
# job here: `just test unit` already builds the site strictly and compares it with
# how GitHub renders the pages (tests/unit/test_docs.py).
#
# Needs Settings -> Pages -> Source set to "GitHub Actions" once; until then
# the deploy job fails and says so.
"on":
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never one cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python and uv as .github/actions/setup installs them: the runner's
      # 3.12, which uv uses rather than downloading one, and the uv uv.lock pins.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: uv.lock
          python-version: "3.12"

      # Only pyproject.toml's docs group, at the versions uv.lock locks, so the
      # published site is the one `just docs build` and the tests build;
      # --locked refuses a lock that no longer matches pyproject.toml.
      - name: Install Zensical
        run: uv sync --locked --only-group docs
        env:
          UV_PYTHON_DOWNLOADS: never

      - name: Build
        run: .venv/bin/zensical build --strict --clean

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
