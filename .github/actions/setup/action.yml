---
name: Set up the Ansible toolchain
description: >-
  Install Python, restore the pip and Galaxy caches, then run `make deps` so the
  job uses exactly the versions pinned in requirements.txt and requirements.yml.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    # ansible-galaxy skips collections that are already installed, so a cache
    # hit turns `make deps` into a no-op for the Galaxy half.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ansible/collections
        key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}

    - name: Install tooling
      run: make deps
      shell: bash
