<defs><text id="l0"><tspan x="0.0" textLength="7.2" class="d">$</tspan><tspan x="14.4" textLength="180.0" class="b">just settings claude_code</tspan></text><text id="l1"><tspan x="0.0" textLength="79.2" class="h">claude_code</tspan></text><text id="l2"><tspan x="14.4" textLength="115.2">claude_code_user</tspan><tspan x="331.2" textLength="21.6">dev</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l3"><tspan x="14.4" textLength="187.2">claude_code_install_method</tspan><tspan x="331.2" textLength="43.2">native</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l4"><tspan x="14.4" textLength="136.8">claude_code_version</tspan><tspan x="331.2" textLength="43.2">latest</tspan><tspan x="532.8" textLength="64.8" class="y">local.yml</tspan></text><text id="l5"><tspan x="14.4" textLength="180.0">claude_code_installer_url</tspan><tspan x="331.2" textLength="180.0">https://claude.ai/install</tspan><tspan x="511.2" textLength="7.2" class="d">…</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l6"><tspan x="14.4" textLength="208.8">claude_code_anthropic_api_key</tspan><tspan x="331.2" textLength="50.4" class="m">not set</tspan></text><text id="l7"><tspan x="43.2" textLength="259.2" class="m">vault_anthropic_api_key in vault.yml</tspan></text><text id="l8"><tspan x="14.4" textLength="144.0">claude_code_settings</tspan><tspan x="331.2" textLength="50.4" class="m">not set</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l9"><tspan x="14.4" textLength="223.2">claude_code_global_instructions</tspan><tspan x="331.2" textLength="14.4">""</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l10"><tspan x="14.4" textLength="187.2">claude_code_remote_control</tspan><tspan x="331.2" textLength="28.8">true</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l11"><tspan x="14.4" textLength="223.2">claude_code_remote_control_name</tspan><tspan x="331.2" textLength="93.6">the VM's name</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l12"><tspan x="14.4" textLength="216.0">claude_code_remote_control_dir</tspan><tspan x="331.2" textLength="14.4">""</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l13"><tspan x="14.4" textLength="302.4">claude_code_remote_control_permission_mode</tspan><tspan x="331.2" textLength="79.2">acceptEdits</tspan><tspan x="532.8" textLength="64.8" class="y">local.yml</tspan></text><text id="l14"><tspan x="14.4" textLength="230.4">claude_code_remote_control_spawn</tspan><tspan x="331.2" textLength="57.6">same-dir</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l15"><tspan x="14.4" textLength="244.8">claude_code_remote_control_service</tspan><tspan x="331.2" textLength="151.2">claude-remote-control</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l16"><tspan x="14.4" textLength="194.4">claude_code_sign_in_follows</tspan><tspan x="331.2" textLength="36.0">false</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l17"><tspan x="43.2" textLength="7.2">·</tspan><tspan x="57.6" textLength="280.8" class="c">just deploy sets it from deploy_sign_in</tspan></text><text id="l18"><tspan x="0.0" textLength="136.8" class="h">claude_code · login</tspan></text><text id="l19"><tspan x="14.4" textLength="208.8">claude_code_login_interactive</tspan><tspan x="331.2" textLength="36.0">false</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l20"><tspan x="43.2" textLength="7.2">·</tspan><tspan x="57.6" textLength="345.6" class="c">just deploy sets it from claude_vm_login_prompts</tspan></text><text id="l21"><tspan x="43.2" textLength="7.2">·</tspan><tspan x="57.6" textLength="338.4" class="c">just login sets it from claude_vm_login_prompts</tspan></text><text id="l22"><tspan x="14.4" textLength="180.0">claude_code_login_desktop</tspan><tspan x="331.2" textLength="28.8">true</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l23"><tspan x="14.4" textLength="187.2">claude_code_login_redirect</tspan><tspan x="331.2" textLength="28.8">true</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l24"><tspan x="14.4" textLength="244.8">claude_code_login_approval_timeout</tspan><tspan x="331.2" textLength="21.6">600</tspan></text><text id="l25"><tspan x="43.2" textLength="302.4" class="y">claude_login_approval_timeout in local.yml</tspan></text><text id="l26"><tspan x="14.4" textLength="158.4">claude_code_login_args</tspan><tspan x="331.2" textLength="14.4">[]</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l27"><tspan x="14.4" textLength="180.0">claude_code_login_timeout</tspan><tspan x="331.2" textLength="21.6">120</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l28"><tspan x="14.4" textLength="158.4">claude_code_login_code</tspan><tspan x="331.2" textLength="50.4" class="m">not set</tspan><tspan x="532.8" textLength="50.4" class="d">default</tspan></text><text id="l29"><tspan x="0.0" textLength="720.0" class="d">3 settings set in your files, 0 secrets set in vault.yml. Change a setting with just settings &lt;name&gt;</tspan></text><text id="l30"><tspan x="0.0" textLength="302.4" class="d">--value &lt;value&gt;, a secret with just vault.</tspan></text><text id="l31"><tspan x="0.0" textLength="7.2" class="d">$</tspan></text></defs>
