---
argument_specs:
  main:
    short_description: Build a cloud-init enabled VM template on a Proxmox VE host
    description:
      - Runs on the PVE node over SSH. Downloads a cloud image, creates a VM with
        `qm`, imports the image as its root disk, adds a cloud-init drive and
        converts the VM to a template, recording in its notes what went into the
        disk. Skipped if the VMID already holds the finished template and it is
        what these settings would build; rebuilt at the same VMID when it differs
        (proxmox_template_rebuild); refused if the VMID holds anything else, on
        this node or another.
    options:
      proxmox_template_vmid:
        type: int
        default: 9000
        description: VMID the template is built under. Anything but the finished template there, on this node or another, fails the run.
      proxmox_template_name:
        type: str
        default: ubuntu-24.04-cloudinit
        description: Template name. VMs are cloned from it by name, and a finished template at the VMID is recognised by it.
      proxmox_template_image_url:
        type: str
        default: https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img
        description: Cloud image downloaded and imported as the template's root disk.
      proxmox_template_image_checksum:
        type: str
        default: sha256:https://cloud-images.ubuntu.com/minimal/releases/noble/release/SHA256SUMS
        description: get_url checksum spec. Set to an empty string to skip verification.
      proxmox_template_image_dir:
        type: path
        default: /var/lib/vz/claude-on-proxmox
        description:
          - Directory on the node that keeps the pristine download. Created if missing.
          - Keep it outside the content directories of a storage, or Proxmox lists the
            image in the UI (under template/iso it appeared as an ISO).
      proxmox_template_storage:
        type: str
        default: local-lvm
        description: Proxmox storage the root disk and the cloud-init drive are created on. Set through proxmox_storage in local.yml.
      proxmox_template_bridge:
        type: str
        default: vmbr0
        description: Bridge the template's net0 is attached to, and so every clone's. Set through proxmox_bridge in local.yml.
      proxmox_template_cores:
        type: int
        default: 2
        description: CPU cores of the template itself. proxmox_vm sets each VM's own.
      proxmox_template_memory_mb:
        type: int
        default: 2048
        description: Memory of the template itself, in MB. proxmox_vm sets each VM's own.
      proxmox_template_cpu_type:
        type: str
        default: host
        description: CPU type (qm --cpu), which every VM cloned from the template keeps.
      proxmox_template_ostype:
        type: str
        default: l26
        description: Guest OS type (qm --ostype). l26 is Linux 2.6 or later.
      proxmox_template_qm:
        type: path
        default: /usr/sbin/qm
        description: Path of qm on the node. Tests point it at a stand-in.
      proxmox_template_install_guest_agent:
        description:
          - Bake qemu-guest-agent into the image with virt-customize.
          - Required for Proxmox to report a DHCP-assigned address.
        type: bool
        default: true
      proxmox_template_customize_packages:
        description: Packages installed into the image by virt-customize.
        type: list
        elements: str
        default: [qemu-guest-agent]
      proxmox_template_manage_libguestfs:
        description: Install libguestfs-tools on the node. Disable where it is already present or faked.
        type: bool
        default: true
      proxmox_template_virt_customize:
        type: path
        default: /usr/bin/virt-customize
        description: Path of virt-customize on the node. Tests point it at a stand-in.
      proxmox_template_rebuild:
        type: bool
        default: true
        description:
          - Rebuild the template at the same VMID when it differs from what these settings would build - its CPU
            type, OS type, bridge, storage, image, packages or this version's build - or keeps no record of its
            build, as one an earlier version built does. VMs are full clones, which do not depend on it.
          - Off, it is kept as it is and the differences are said, for a template a linked clone still uses, which
            Proxmox will not remove, or one changed by hand on purpose.

  # tasks_from: drift, which deploy.yml runs to decide through the API whether to build the template.
  drift:
    short_description: Say how the template differs from what this role would build, changing nothing
    description:
      - Compares the template's config, as the caller read it from Proxmox, with what this role would build - the qm
        settings every clone inherits and, from the record in its notes, the image, packages and build version - and
        records the differences in proxmox_template_drift, empty when there are none. Proxmox is asked nothing, and
        nothing is changed.
    options:
      proxmox_template_drift_config:
        type: dict
        required: true
        description:
          - The template's config, as /nodes/<node>/qemu/<vmid>/config gives it.
