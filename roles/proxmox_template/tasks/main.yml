---
- name: Check for existing VM {{ proxmox_template_vmid }}
  ansible.builtin.command:
    argv:
      - "{{ proxmox_template_qm }}"
      - config
      - "{{ proxmox_template_vmid }}"
  register: proxmox_template_existing
  changed_when: false
  failed_when: false
  check_mode: false

# A VMID that exists but is not our finished template (a half-built earlier
# run, or an unrelated VM) is an error rather than something to skip silently.
- name: Refuse to reuse VMID {{ proxmox_template_vmid }}
  ansible.builtin.assert:
    that:
      - "'template: 1' in proxmox_template_existing.stdout_lines"
      - "'name: ' ~ proxmox_template_name in proxmox_template_existing.stdout_lines"
    fail_msg: >-
      VMID {{ proxmox_template_vmid }} exists but is not the finished template
      "{{ proxmox_template_name }}". Remove it (qm destroy {{ proxmox_template_vmid }})
      or choose another proxmox_template_vmid.
    quiet: true
  when: proxmox_template_existing.rc == 0

# `qm config` reads this node's configs only, so a VMID held by a sibling node
# looks free to the probe: the build would download the image, run
# virt-customize, and only then be refused by `qm create` with "VM 9000 already
# exists on node 'pve2'". pmxcfs lists every guest in the cluster in .vmlist,
# with its node, so a VMID the probe cannot see is checked there first.
- name: Read the cluster-wide VM list
  ansible.builtin.slurp:
    src: /etc/pve/.vmlist
  register: proxmox_template_vmlist
  when: proxmox_template_existing.rc != 0

- name: Refuse a VMID another node holds, {{ proxmox_template_vmid }}
  vars:
    # Empty when no node holds the VMID. fail_msg is rendered even when the
    # assertion holds, so this cannot index into a missing entry.
    proxmox_template_vmlist_node: >-
      {{ ((proxmox_template_vmlist.content | b64decode | from_json).ids
          [proxmox_template_vmid | string] | default({})).node | default('') }}
  ansible.builtin.assert:
    that:
      - proxmox_template_vmlist_node | length == 0
    fail_msg: >-
      VMID {{ proxmox_template_vmid }} exists on node {{ proxmox_template_vmlist_node }},
      not on {{ inventory_hostname }}, where qm cannot see it. Build the template on that
      node (point inventory/hosts.yml at it) or choose another proxmox_template_vmid.
    quiet: true
  when: proxmox_template_existing.rc != 0

# The finished template is compared with what this build would make (proxmox_template_differences, vars/main.yml):
# the same, it is left as it is; different, it is rebuilt at the same VMID, the old one removed only once the new
# one's image is ready, and said here first, with each difference.
- name: Say how the template differs from its settings
  ansible.builtin.debug:
    msg: >-
      Template "{{ proxmox_template_name }}" ({{ proxmox_template_vmid }}) differs from its settings:
      {{ proxmox_template_differences | join('; ') }}.
      {{ 'Rebuilding it, at the same VMID.' if proxmox_template_rebuilding | bool
         else 'Kept as it is, since proxmox_template_rebuild is false.' }}
  when: proxmox_template_differences | length > 0

- name: Build the template
  when: proxmox_template_existing.rc != 0 or proxmox_template_rebuilding | bool
  block:
    - name: Ensure image directory exists
      ansible.builtin.file:
        path: "{{ proxmox_template_image_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download cloud image
      ansible.builtin.get_url:
        url: "{{ proxmox_template_image_url }}"
        dest: "{{ proxmox_template_image_dir }}/{{ proxmox_template_image_url | basename }}"
        checksum: "{{ proxmox_template_image_checksum | default(omit, true) }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 300
      register: proxmox_template_image

    # Kept in the template's record, to say which image it was built from.
    - name: Read the image's SHA-256
      ansible.builtin.stat:
        path: "{{ proxmox_template_image.dest }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: proxmox_template_image_digest

    # The pristine download is left untouched so get_url stays idempotent;
    # virt-customize edits a copy, which is what gets imported and is removed
    # once the template is finished.
    - name: Decide which image to import
      ansible.builtin.set_fact:
        proxmox_template_import_path: >-
          {{ proxmox_template_image_dir ~ '/claude-on-proxmox-' ~ proxmox_template_vmid ~ '.img'
             if proxmox_template_install_guest_agent | bool
             else proxmox_template_image.dest }}

    - name: Prepare the image for customization
      when: proxmox_template_install_guest_agent | bool
      block:
        # dhcpcd-base is not pulled in on Proxmox 9, and without it the
        # libguestfs appliance cannot DHCP, so --install fails with
        # "Temporary failure resolving 'deb.debian.org'".
        - name: Install libguestfs-tools
          ansible.builtin.apt:
            name:
              - libguestfs-tools
              - dhcpcd-base
            state: present
            update_cache: true
            cache_valid_time: 3600
            lock_timeout: 600
          when: proxmox_template_manage_libguestfs | bool

        - name: Copy the cloud image for customization
          ansible.builtin.copy:
            src: "{{ proxmox_template_image.dest }}"
            dest: "{{ proxmox_template_import_path }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"

        # --truncate /etc/machine-id: clones that share a machine-id send the
        # same DHCP client identifier and can be handed the same lease.
        - name: Install packages into the image with virt-customize
          ansible.builtin.command:
            argv:
              - "{{ proxmox_template_virt_customize }}"
              - --add
              - "{{ proxmox_template_import_path }}"
              - --install
              - "{{ proxmox_template_customize_packages | join(',') }}"
              - --truncate
              - /etc/machine-id
          environment:
            LIBGUESTFS_BACKEND: direct
          changed_when: true

    # The template that differs goes only now, with the new image ready, so a download or virt-customize that
    # fails leaves it as it was. Proxmox keeps a template a linked clone still uses (proxmox_vm_full_clone: false),
    # and says so: that is a refusal, and the template stays.
    - name: Remove the template that differs from its settings
      ansible.builtin.command:
        argv:
          - "{{ proxmox_template_qm }}"
          - destroy
          - "{{ proxmox_template_vmid }}"
      register: proxmox_template_removed
      changed_when: proxmox_template_removed.rc == 0
      failed_when: false
      when: proxmox_template_existing.rc == 0

    - name: Fail when Proxmox kept the template
      ansible.builtin.assert:
        that:
          - proxmox_template_removed.rc == 0
        fail_msg: >-
          Template "{{ proxmox_template_name }}" ({{ proxmox_template_vmid }}) differs from its settings, but Proxmox
          would not remove it to rebuild it: {{ proxmox_template_removed.stderr | default('') | trim }}. A linked
          clone (proxmox_vm_full_clone: false) keeps its template: set proxmox_template_rebuild to false in
          local.yml to keep this one as it is until no VM is one.
        quiet: true
      when: proxmox_template_existing.rc == 0

    - name: Create VM {{ proxmox_template_vmid }}
      vars:
        proxmox_template_record:
          build: "{{ proxmox_template_build }}"
          image: "{{ proxmox_template_image_url }}"
          packages: "{{ proxmox_template_packages }}"
          sha256: "{{ proxmox_template_image_digest.stat.checksum }}"
      ansible.builtin.command:
        argv:
          - "{{ proxmox_template_qm }}"
          - create
          - "{{ proxmox_template_vmid }}"
          - --name
          - "{{ proxmox_template_name }}"
          - --ostype
          - "{{ proxmox_template_ostype }}"
          - --cpu
          - "{{ proxmox_template_cpu_type }}"
          - --cores
          - "{{ proxmox_template_cores }}"
          - --memory
          - "{{ proxmox_template_memory_mb }}"
          - --net0
          - "virtio,bridge={{ proxmox_template_bridge }}"
          - --scsihw
          - "{{ proxmox_template_scsihw }}"
          - --agent
          - enabled=1
          - --serial0
          - "{{ proxmox_template_serial0 }}"
          - --vga
          - "{{ proxmox_template_vga }}"
          - --description
          - "{{ proxmox_template_record | proxmox_template_record }}"
      changed_when: true

    - name: Import the cloud image as the root disk
      ansible.builtin.command:
        argv:
          - "{{ proxmox_template_qm }}"
          - set
          - "{{ proxmox_template_vmid }}"
          - --scsi0
          - "{{ proxmox_template_storage }}:0,import-from={{ proxmox_template_import_path }},discard=on"
      changed_when: true

    - name: Add cloud-init drive and set boot order
      ansible.builtin.command:
        argv:
          - "{{ proxmox_template_qm }}"
          - set
          - "{{ proxmox_template_vmid }}"
          - --ide2
          - "{{ proxmox_template_storage }}:cloudinit"
          - --boot
          - order=scsi0
          - --ipconfig0
          - ip=dhcp
      changed_when: true

    - name: Convert VM to template
      ansible.builtin.command:
        argv:
          - "{{ proxmox_template_qm }}"
          - template
          - "{{ proxmox_template_vmid }}"
      changed_when: true

    # Read back as the next run will read it: a template that still differs would be rebuilt by every run, so that
    # is a failure here, said, rather than a rebuild each deploy.
    - name: Read the template as it was built
      ansible.builtin.command:
        argv:
          - "{{ proxmox_template_qm }}"
          - config
          - "{{ proxmox_template_vmid }}"
      register: proxmox_template_built
      changed_when: false

    - name: Fail when the template differs from its settings as built
      vars:
        proxmox_template_built_differences: >-
          {{ (proxmox_template_built.stdout | qm_config) | proxmox_template_drift(proxmox_template_wanted) }}
      ansible.builtin.assert:
        that:
          - proxmox_template_built_differences | length == 0
        fail_msg: >-
          Template "{{ proxmox_template_name }}" ({{ proxmox_template_vmid }}) was built but reads back as different
          from its settings - {{ proxmox_template_built_differences | join('; ') }} - so every run would rebuild it.
        quiet: true

  # Once import-from has copied the disk into the storage, the customised image is derived data: a rebuild makes it
  # again from the download. Left behind, it was ~600 MB per node, forever, and a build that fails after making it -
  # a rebuild Proxmox refuses, say - would leave it too, so it goes either way. Only the copy: without the guest agent
  # the import path is the download itself, which stays.
  always:
    - name: Remove the customised image
      ansible.builtin.file:
        path: "{{ proxmox_template_import_path }}"
        state: absent
      when:
        - proxmox_template_import_path is defined
        - proxmox_template_image.dest is defined
        - proxmox_template_import_path != proxmox_template_image.dest
