---
github_projects_user: dev

# GitHub account whose repositories are cloned. Required.
github_projects_username: ""
# Optional token. It lists private repositories when it belongs to
# github_projects_username, raises the API rate limit, and with
# github_projects_auth signs gh in on the VM - where gh is signed out, or
# signed in by this role - so the same token clones them and pushes. A login
# made by hand stays, and the token then only lists. Without one, gh is signed
# in once by the device flow (make github-login) and the listing uses the token
# gh stored from then on. The permissions it needs are in the README, "Private
# repositories, and pushing from the VM".
github_projects_token: ""
github_projects_api_url: https://api.github.com

# Home directory of github_projects_user, where gh keeps its login and this
# role its marker (below). Empty: looked up on the VM.
github_projects_home: ""
# Destination; defaults to ~/projects of github_projects_user.
github_projects_dir: ""

# Selection
github_projects_include_forks: false
github_projects_include_archived: false
# Only clone these repository names. Empty = every repository of
# github_projects_username that passes the fork/archived filters.
github_projects_include: []
# Never clone these repository names.
github_projects_exclude: []

# https (works out of the box for public repos) or ssh (needs a key on the VM).
github_projects_clone_protocol: https
# Pull existing checkouts on every run. Off so local work is never disturbed.
github_projects_update_existing: false
# Shallow clone depth; leave empty for full history.
github_projects_depth: ""

# Sign gh in on the VM as github_projects_user and make it git's credential
# helper for github.com, so private repositories clone, `git push` works, and
# `gh pr create` works for Claude Code. false leaves gh, ~/.gitconfig and the
# identity below alone.
github_projects_auth: true
# How gh is signed in. auto: with github_projects_token when there is one,
# else by GitHub's device flow, which `make github-login` and `make deploy` run
# one VM at a time (a page opens on the controller, the code is copied there,
# the user approves); `make configure` never prompts. web: the device flow
# always; a token then only lists. token: the token only, put over any login
# gh holds, and an empty one is a named failure rather than a fallback.
github_projects_auth_method: auto
# Scopes the device flow asks for on top of gh's own (repo, read:org, gist).
# workflow, so that a push which changes .github/workflows/ is not refused.
github_projects_login_scopes: [workflow]
# During the device flow, open the page and copy the code on the controller.
# Off, the run only prints them. Every test turns this off: the controller is
# the developer's machine.
github_projects_login_desktop: true
# Read by the login entry point (playbooks/github_login.yml sets them). Run
# GitHub's device flow for a VM that is signed out: make github-login with
# names, or make deploy for a VM whose Claude code was entered in this run.
github_projects_login_interactive: false
# Ask at a prompt first: make deploy, for every VM but one whose Claude prompt
# got Enter. Enter goes for an interactive VM and "n" skips it; any other goes
# on "y" only. With no terminal the answer is nothing.
github_projects_login_ask: false
# Read by the login entry point: true when the whole role runs for this VM
# next, in the same run, so a vault token not yet signed in is said to be
# signed in by it rather than by a command to run.
github_projects_login_role_follows: false
# Read by make configure's message for a signed-out VM: true under make
# deploy, whose sign-ins come next in the same run, so it says so rather than
# naming make github-login.
github_projects_sign_in_follows: false
# The git identity of github_projects_user. Set, it is written to ~/.gitconfig.
# Empty, it is derived where ~/.gitconfig has none yet, so one set by hand on
# the VM stays: the display name (or login) of the GitHub account - the
# token's own, else github_projects_username's - and GitHub's noreply address
# for it, so no private email lands in commits by default.
github_projects_git_user_name: ""
github_projects_git_user_email: ""
