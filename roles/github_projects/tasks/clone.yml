---
# Read before anything is written, each key on its own: an identity set by
# hand on the VM is never replaced by a derived one (vars/main.yml,
# github_projects_git_identity_wanted), and the account is asked of GitHub
# only when something is left to derive.
- name: clone | Read the git identity of {{ github_projects_user }}
  ansible.builtin.command:
    argv: [git, config, --global, --get, "{{ item }}"]
  become: true
  become_user: "{{ github_projects_user }}"
  loop: [user.name, user.email]
  register: github_projects_git_identity
  changed_when: false
  # 1 is "not set", which includes no ~/.gitconfig at all.
  failed_when: github_projects_git_identity.rc not in [0, 1]
  check_mode: false
  when: github_projects_auth | bool

# no_log: the token is an argument. The module's own spec masks it too, and
# so its failure message is safe to say, which the task below does.
- name: clone | List repositories of {{ github_projects_username }}
  github_repos:
    username: "{{ github_projects_username }}"
    token: "{{ github_projects_listing_token | default(omit, true) }}"
    api_url: "{{ github_projects_api_url }}"
    include_forks: "{{ github_projects_include_forks }}"
    include_archived: "{{ github_projects_include_archived }}"
    account: "{{ github_projects_git_identity_needed }}"
  register: github_projects_listing
  no_log: true
  failed_when: false

- name: clone | Fail when GitHub did not list the repositories
  ansible.builtin.fail:
    msg: >-
      The repositories of {{ github_projects_username }} could not be listed on {{ inventory_hostname }}:
      {{ github_projects_listing.msg | default('github_repos gave no reason', true) }}
  when: github_projects_listing.repos is not defined

# One line of Jinja per line of text: a more-indented line in a folded scalar
# keeps its line break.
- name: clone | Report selection
  vars:
    github_projects_skipped_empty: "{{ github_projects_listing.repos | selectattr('empty') | map(attribute='name') | list }}"
    github_projects_skipped_private: >-
      {{ '; ' ~ github_projects_private_skip_reason ~ ': ' ~ github_projects_private_skipped if github_projects_private_skipped | length > 0 else '' }}
    github_projects_unlisted_private: >-
      {{ ' Private repositories are not listed until gh is signed in.' if not github_projects_listing_token_set | bool else '' }}
  ansible.builtin.debug:
    msg: >-
      {{ github_projects_selected | length }} of {{ github_projects_listing.repos | length }}
      repositories selected for {{ github_projects_target_dir }}
      (skipped as empty: {{ github_projects_skipped_empty }}{{ github_projects_skipped_private }}).{{ github_projects_unlisted_private }}

# Before the helper: both write ~/.gitconfig, and each checks before writing.
- name: clone | Set the git identity of {{ github_projects_user }}
  community.general.git_config:
    scope: global
    name: "{{ item.key }}"
    value: "{{ item.value }}"
  become: true
  become_user: "{{ github_projects_user }}"
  loop: "{{ github_projects_git_identity_wanted | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: github_projects_auth | bool

# An organisation as github_username, no token, and gh signed out: nobody
# commits as the organisation, so nothing is derived, and without an identity
# git refuses a commit. A login of the user's own - the device flow - gives
# the next run their account to derive it from.
- name: clone | Say that an organisation gives no git identity
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ github_projects_listing.user.login }} is an organisation, so no git identity is
      derived from it, and a commit on the VM fails until one is set. Set git_user_name and git_user_email, or sign
      gh in to your own account, whose identity that run derives: {{ github_projects_login_command }}
  register: github_projects_identity_reported
  when:
    - github_projects_git_identity_needed | bool
    - (github_projects_listing.user.type | default('')) == 'Organization'

- name: clone | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      github_projects_next: >-
        {{ {inventory_hostname: {'github_identity': github_projects_identity_reported.msg}} }}
    aggregate: true
    per_host: false
  when:
    - github_projects_git_identity_needed | bool
    - (github_projects_listing.user.type | default('')) == 'Organization'

- name: clone | Fetch GitHub's published SSH host keys
  ansible.builtin.uri:
    url: "{{ github_projects_api_url }}/meta"
    return_content: true
  register: github_projects_github_meta
  when: github_projects_clone_protocol == 'ssh'

# Pre-seeding the published keys avoids trust-on-first-use for github.com.
- name: clone | Trust GitHub's SSH host keys
  ansible.builtin.known_hosts:
    name: github.com
    key: "github.com {{ item }}"
    state: present
  become: true
  become_user: "{{ github_projects_user }}"
  loop: "{{ github_projects_github_meta.json.ssh_keys | default([]) }}"
  loop_control:
    label: "{{ item.split(' ')[0] }}"
  when: github_projects_clone_protocol == 'ssh'

# As github_projects_user, whose ~/.gitconfig names gh as the credential
# helper for github.com (sudo -H, so HOME is that user's). GIT_TERMINAL_PROMPT
# off: a repository the credential cannot reach then fails with "terminal
# prompts disabled" and the repository's name, instead of git's attempt to ask
# for a password that no terminal can answer.
- name: clone | Clone repositories
  ansible.builtin.git:
    repo: "{{ item.ssh_url if github_projects_clone_protocol == 'ssh' else item.clone_url }}"
    dest: "{{ github_projects_target_dir }}/{{ item.name }}"
    version: "{{ item.default_branch }}"
    update: "{{ github_projects_update_existing }}"
    depth: "{{ github_projects_depth | default(omit, true) }}"
  become: true
  become_user: "{{ github_projects_user }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  loop: "{{ github_projects_selected }}"
  loop_control:
    label: "{{ item.full_name }}"
