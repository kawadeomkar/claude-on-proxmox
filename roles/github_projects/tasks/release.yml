---
# Entry point for playbooks/destroy.yml: before the VM is deleted, gh signs out
# there. Its token is never revoked at GitHub. A token this role's device flow
# made - told by the digest it left beside gh's config - is GitHub CLI's, and
# revoking one through GitHub's credential revocation endpoint ended every
# GitHub CLI sign-in of the account, this machine's too (seen live): the report
# says where to revoke it, and what that does. The vault's token is every VM's,
# and one pasted by hand may be in use elsewhere.
- name: release | Look up home directory of {{ github_projects_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_projects_user }}"
  when: github_projects_home | length == 0

# no_log: the output is the token.
- name: release | Read the token gh stored
  ansible.builtin.command:
    argv: [gh, auth, token, --hostname, github.com]
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_release_token_raw
  changed_when: false
  failed_when: false
  no_log: true

- name: release | Read the marker of the login this role's device flow made
  ansible.builtin.slurp:
    src: "{{ github_projects_device_marker_file }}"
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_device_marker_raw
  failed_when: false

- name: release | Sign gh out
  ansible.builtin.command:
    argv: [gh, auth, logout, --hostname, github.com]
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_release_logout
  changed_when: true
  failed_when: false
  when: github_projects_release_token | length > 0

# What became of the login, for destroy's last play to say per VM: a fact,
# since that play reads it through hostvars, and set on every run of this file
# so it can never be an earlier run's.
- name: release | Record what became of the login
  ansible.builtin.set_fact:
    github_projects_release_said: "{{ github_projects_release_summary }}"
    github_projects_release_left: "{{ github_projects_release_unrevoked | bool }}"
