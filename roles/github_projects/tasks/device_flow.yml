---
# GitHub's device flow, driven by Ansible rather than copied from its output:
# gh runs on the VM in the background with no terminal, which makes it print
# the one-time code and the page at once and poll until the code is approved;
# the code is read out of its output, shown, and - on the controller - the page
# opened and the code copied; then the approval is waited for, quietly. The
# one step that stays the user's is entering the code and authorising, which
# GitHub insists on: its device flow pre-fills nothing. One VM at a time: the
# browser would otherwise open one page per host before any waiting began.
- name: device_flow | Refuse to prompt for more than one VM at a time
  ansible.builtin.assert:
    that: ansible_play_hosts | length == 1
    fail_msg: >-
      The GitHub device flow signs in one VM at a time, and this play has
      {{ ansible_play_hosts | length }}: {{ ansible_play_hosts | join(', ') }}. Run
      make github-login VM_NAME=<one name>, or set github_login_prompt: false.
    quiet: true

- name: device_flow | Make the directory for gh's output
  ansible.builtin.file:
    path: "{{ github_projects_login_output | dirname }}"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ github_projects_user }}"

# A run that failed after starting gh leaves gh polling for up to fifteen
# minutes, writing to this file. Truncating it would share it with that gh,
# whose expiry line would end the wait below early; unlinked, the stale gh
# keeps its own inode and exits on its own when its code expires.
- name: device_flow | Remove the output of an earlier run
  ansible.builtin.file:
    path: "{{ github_projects_login_output }}"
    state: absent
  become: true
  become_user: "{{ github_projects_user }}"
  changed_when: false

# A shell, because the output has to be captured while gh still runs: a
# command's output only comes back when it exits, and the code is needed now.
# stdin closed and stdout a file is what tells gh to print the code and poll
# without asking anything. 900 s: the code lives fifteen minutes.
- name: device_flow | Start gh's device flow in the background
  ansible.builtin.shell:
    cmd: >-
      umask 077 && exec {{ github_projects_login_args | map('quote') | join(' ') }}
      </dev/null >{{ github_projects_login_output | quote }} 2>&1
  become: true
  become_user: "{{ github_projects_user }}"
  async: 900
  poll: 0
  register: github_projects_login_job
  changed_when: false

- name: device_flow | Wait for gh to show the code
  ansible.builtin.wait_for:
    path: "{{ github_projects_login_output }}"
    search_regex: "[A-Z0-9]{4}-[A-Z0-9]{4}|failed to authenticate|error"
    timeout: 30
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login_started
  failed_when: false

- name: device_flow | Read what gh printed
  ansible.builtin.slurp:
    src: "{{ github_projects_login_output }}"
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login_out
  failed_when: false

- name: device_flow | Fail when gh did not start the device flow
  ansible.builtin.fail:
    msg: >-
      gh on {{ inventory_hostname }} did not start the device flow:
      {{ github_projects_login_text | trim or 'no output in 30 seconds' }}
  when: github_projects_login_code | length == 0

- name: device_flow | Say the code and the page
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: enter this code at {{ github_projects_login_page }} and authorise
      GitHub CLI, within fifteen minutes: {{ github_projects_login_code }}
      {{ '(the page opens in your browser and the code is on your clipboard, if this machine allows it)'
         if github_projects_login_desktop | bool else '' }}
      This run waits here until you have.

# The two steps on the controller, both best effort: a headless controller
# still has the line above. Never in a test (github_projects_login_desktop).
# become off: the play's become is the VM's passwordless sudo, and on the
# controller it would be the developer's, which asks for a password - and the
# browser and clipboard are the developer's login session, not root's.
- name: device_flow | Look for a browser opener and a clipboard on this machine
  ansible.builtin.command:
    argv: [which, open, xdg-open, pbcopy, wl-copy, xclip]
  delegate_to: localhost
  become: false
  register: github_projects_login_tools
  changed_when: false
  failed_when: false
  when: github_projects_login_desktop | bool

- name: device_flow | Open the page in your browser
  vars:
    github_projects_login_browser: "{{ lookup('ansible.builtin.env', 'BROWSER') }}"
    github_projects_login_found: "{{ github_projects_login_tools.stdout_lines | default([]) | map('basename') | list }}"
  ansible.builtin.command:
    argv: >-
      {{ (github_projects_login_browser | split(' ') | map('replace', '%s', github_projects_login_page) | list)
         + ([] if '%s' in github_projects_login_browser else [github_projects_login_page])
         if github_projects_login_browser | length > 0
         else ['open', github_projects_login_page] if 'open' in github_projects_login_found
         else ['xdg-open', github_projects_login_page] }}
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  when:
    - github_projects_login_desktop | bool
    - github_projects_login_browser | length > 0 or 'open' in github_projects_login_found or 'xdg-open' in github_projects_login_found

- name: device_flow | Copy the code to your clipboard
  vars:
    github_projects_login_found: "{{ github_projects_login_tools.stdout_lines | default([]) | map('basename') | list }}"
  ansible.builtin.command:
    argv: >-
      {{ ['pbcopy'] if 'pbcopy' in github_projects_login_found
         else ['wl-copy'] if 'wl-copy' in github_projects_login_found
         else ['xclip', '-selection', 'clipboard'] }}
    stdin: "{{ github_projects_login_code }}"
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  when:
    - github_projects_login_desktop | bool
    - github_projects_login_found | intersect(['pbcopy', 'wl-copy', 'xclip']) | length > 0

# One quiet task, up to the fifteen minutes the code lives, rather than a loop
# that prints a retry line every few seconds.
- name: device_flow | Wait for the approval
  ansible.builtin.wait_for:
    path: "{{ github_projects_login_output }}"
    search_regex: "Logged in as|failed to authenticate"
    timeout: 900
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login_waited
  failed_when: false

- name: device_flow | Collect gh's result
  ansible.builtin.async_status:
    jid: "{{ github_projects_login_job.ansible_job_id }}"
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login_result
  failed_when: false

# Only this mode removes the job file, and gh's "Logged in as" line with it.
- name: device_flow | Clean up gh's job
  ansible.builtin.async_status:
    jid: "{{ github_projects_login_job.ansible_job_id }}"
    mode: cleanup
  become: true
  become_user: "{{ github_projects_user }}"
  changed_when: false
  failed_when: false

- name: device_flow | Fail when gh's job could not be collected
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: gh's background job could not be collected
      ({{ github_projects_login_result.msg | default('no detail') }}); its output is read below all the same.
  when:
    - github_projects_login_result.finished | default(0) | int != 1
    - github_projects_login_waited is succeeded

- name: device_flow | Read what gh printed, now it has finished
  ansible.builtin.slurp:
    src: "{{ github_projects_login_output }}"
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login_out
  failed_when: false

- name: device_flow | Remove gh's output
  ansible.builtin.file:
    path: "{{ github_projects_login_output }}"
    state: absent
  become: true
  become_user: "{{ github_projects_user }}"
  changed_when: false

- name: device_flow | Fail when the code was not approved
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: the GitHub sign-in did not complete.
      {{ (github_projects_login_text | trim).splitlines() | last | default('gh gave no reason', true) }}
      Run make github-login VM_NAME={{ inventory_hostname }} again for a fresh code.
  when: "'Logged in as' not in github_projects_login_text"

- name: device_flow | Record that this run signed the VM in
  ansible.builtin.set_fact:
    github_projects_login_done: true

- name: device_flow | Read gh's login state again
  ansible.builtin.include_tasks: auth_status.yml
