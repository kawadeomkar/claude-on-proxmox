---
# What login.yml says of gh's login, and records for NEXT STEPS; just status (status.yml) shows the
# same line. Reads only what login_read.yml and the sign-in left.
# Advice only for what can run: the device flow when it would (web), the
# token sign-in when a vault token waits for it - which the whole role does
# next in this run under just login x --only github - and nothing with
# github_auth: false, which leaves gh alone. A command that ends the line has
# no full stop after it: one would be pasted along with it.
- name: login_report | Report the login state and what to do about it
  vars:
    github_projects_login_how:
      pat: >-
        {{ 'with the personal access token this project put there'
           if github_projects_login_is_ours | bool else 'with a personal access token of your own' }}
      oauth: through a device-flow login
      env: through a GH_TOKEN or GITHUB_TOKEN in its environment, which this role leaves alone
      other: in a way this role does not manage
    github_projects_account_scopes: "{{ github_projects_auth_account.scopes | default('') }}"
    github_projects_login_unreadable: >-
      {{ 'gh could not report its login state (' ~ (github_projects_status_said or 'no output')
         ~ '); `gh auth status --json` needs gh 2.81.0 or newer.'
         ~ (' Install gh from GitHub\'s apt repository (dev_tools_install_gh: true), or set github_auth: false to leave gh alone.'
            if github_projects_auth | bool else ' This project leaves gh alone there (github_auth: false).') }}
    github_projects_login_signed_in: >-
      {{ ('signed in' if github_projects_login_done | default(false) | bool else 'already signed in')
         ~ ' to GitHub as ' ~ (github_projects_auth_account.login | default('?', true))
         ~ ' ' ~ github_projects_login_how[github_projects_login_kind] ~ '.'
         ~ (' Its token lacks the workflow scope, so a push that changes .github/workflows/ is'
            ~ ' refused; add it with: ssh -t ' ~ github_projects_user ~ '@'
            ~ ansible_host | default(inventory_hostname) ~ ' gh auth refresh -h github.com -s workflow'
            if github_projects_login_kind == 'oauth' and 'workflow' not in github_projects_account_scopes
            else '') }}
    github_projects_login_signed_out: >-
      {{ 'not signed in to GitHub, and this project leaves gh alone there (github_auth: false).'
         if not github_projects_auth | bool
         else 'not signed in to GitHub, so only public repositories are cloned and git push fails there.'
              ~ (' vault_github_token is set, and the role signs gh in with it next, in this run.'
                 if github_projects_login_role_follows | bool
                 else ' vault_github_token is set, so configuration signs gh in with it, or says what stops it: '
                      ~ github_projects_configure_command)
         if github_projects_token_wanted | bool and github_projects_token_set | bool
         else 'not signed in to GitHub, so only public repositories are cloned and git push fails there.'
              ~ ' github_auth_method is token, so set vault_github_token, then run ' ~ github_projects_configure_command
         if github_projects_auth_method == 'token'
         else 'not signed in to GitHub, so only public repositories are cloned and git push fails there.'
              ~ ' Run ' ~ github_projects_login_command ~ ' to sign in by the device flow;'
              ~ ' that run clones the private repositories too.' }}
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      {{ 'gh is not installed (dev_tools_install_gh), so there is nothing to sign in.'
         if not github_projects_gh_found | bool
         else github_projects_login_unreadable if github_projects_auth_status.rc | default(0) != 0
         else github_projects_login_signed_in if github_projects_signed_in | bool
         else github_projects_login_signed_out }}
  register: github_projects_login_reported

# NEXT STEPS (callback_plugins/claude_on_proxmox.py): the line above while
# there is something left to do - a gh too old to say where gh is the role's
# business, a device-flow login without the workflow scope, a sign-out that nothing in this run ends - and
# nothing otherwise: signed in, gh left alone (github_auth: false), gh not
# installed by choice. A later record of the same VM replaces this one.
- name: login_report | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      github_projects_next: >-
        {{ {inventory_hostname: {'github': github_projects_login_reported.msg if github_projects_login_left | bool else ''}} }}
    aggregate: true
    per_host: false
