---
# gh on this VM and its login state, read for login.yml and for just status (status.yml): the home the
# marker sits under, whether gh is there, and what it says of its login (auth_status.yml).
# The marker auth_status.yml reads sits under the user's home, which main.yml
# resolves for the clone and these entry points have to resolve for themselves.
- name: login_read | Look up home directory of {{ github_projects_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_projects_user }}"
  when: github_projects_home | length == 0

- name: login_read | Look for gh
  ansible.builtin.command:
    argv: [which, gh]
  register: github_projects_gh_which
  changed_when: false
  failed_when: false
  check_mode: false

- name: login_read | Read gh's login state
  ansible.builtin.include_tasks: auth_status.yml
  when: github_projects_gh_found | bool
