---
# gh on the VM, as github_projects_user: signed in from the vault token when
# there is one, otherwise left for the one device-flow login the user makes
# (make github-login, or the terminal make code opens), and either way made
# git's credential helper for github.com. The state is read first, and again
# after a change, so that the listing which follows can use whatever token the
# VM then holds (vars/main.yml, github_projects_listing_token). Nothing here
# fails a VM that is merely signed out: public repositories still clone, and
# the run says what is missing.
- name: auth | Look for gh
  ansible.builtin.command:
    argv: [which, gh]
  register: github_projects_gh_which
  changed_when: false
  failed_when: false
  check_mode: false

- name: auth | Read gh's login state
  ansible.builtin.include_tasks: auth_status.yml
  when: github_projects_gh_found | bool

# --json came to `gh auth status` in gh 2.81.0 (2025-10-01), and the role
# depends on it. The JSON form exits 0 signed in or out, so a non-zero exit is
# gh refusing the command - an older gh and its "unknown flag" - not a state;
# read as "signed out" it would print the sign-in command on every run and
# never configure the helper, however often the user signed in.
- name: auth | Fail when gh could not report its login state
  ansible.builtin.fail:
    msg: >-
      gh on {{ inventory_hostname }} could not report its login state:
      {{ github_projects_auth_status.stderr | default('') | trim or 'no output' }}.
      `gh auth status --json` needs gh 2.81.0 or newer. Install gh from GitHub's apt repository
      (dev_tools_install_gh: true), or set github_auth: false to leave gh alone.
  when:
    - github_projects_auth | bool
    - github_projects_gh_found | bool
    - github_projects_auth_status.rc | default(0) != 0

- name: auth | Fail when the token method has no token
  ansible.builtin.fail:
    msg: >-
      github_auth_method is token, but github_token is empty on {{ inventory_hostname }}: set
      vault_github_token, or choose auto or web to sign in by the device flow.
  when:
    - github_projects_auth | bool
    - github_projects_auth_method == 'token'
    - github_projects_token | length == 0

- name: auth | Say that gh is missing
  ansible.builtin.debug:
    msg: >-
      gh is not installed on {{ inventory_hostname }} (dev_tools_install_gh), so it cannot be signed
      in to GitHub: only public repositories are cloned, and git push there needs a credential of
      your own. Set github_auth: false to turn this off.
  when:
    - github_projects_auth | bool
    - not github_projects_gh_found | bool

# Only when the stored token differs from the vault's, so a second run changes
# nothing. --insecure-storage: a headless VM has no credential store, and gh
# would fall back to the same plain-text hosts.yml anyway; asking for it keeps
# a future gh that finds one from storing the token somewhere this role cannot
# read or remove. no_log: the token is on stdin, and the result would show it.
- name: auth | Sign gh in with the token
  ansible.builtin.command:
    argv: [gh, auth, login, --hostname, github.com, --git-protocol, https, --with-token, --insecure-storage]
    stdin: "{{ github_projects_token }}"
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login
  changed_when: github_projects_login.rc == 0
  failed_when: false
  no_log: true
  when:
    - github_projects_auth_wanted | bool
    - github_projects_token_wanted | bool
    - github_projects_stored_token != github_projects_token

# Failed under no_log, which hides everything; gh's own line names the cause
# (a refused token, no route to api.github.com) and never the token.
- name: auth | Fail when GitHub refused the token
  ansible.builtin.fail:
    msg: >-
      gh auth login on {{ inventory_hostname }} with vault_github_token failed:
      {{ github_projects_login.stderr | default('') | trim or 'no output' }}.
      GitHub refused the token or the VM cannot reach it. Check the token and its permissions
      (README, "Pushing from the VM"), or clear it to sign in by hand with make github-login.
  when:
    - github_projects_login is not skipped
    - github_projects_login.rc | default(0) != 0

# The other direction, like the API key in roles/claude_code: the login this
# role made is removed once no token is configured. Only that one, told by
# the marker below - a token the user pasted by hand looks the same to gh -
# and by account, so a second account the user keeps on github.com stays.
- name: auth | Sign gh out of the login this role made, now that no token is configured
  ansible.builtin.command:
    argv: >-
      {{ ['gh', 'auth', 'logout', '--hostname', 'github.com']
         + (['--user', github_projects_auth_account.login]
            if github_projects_auth_account.login | default('') | length > 0 else []) }}
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_logout
  changed_when: true
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_token_wanted | bool
    - github_projects_login_is_ours | bool

- name: auth | Read gh's login state again
  ansible.builtin.include_tasks: auth_status.yml
  when: github_projects_login is changed or github_projects_logout is changed

# A marker with no login behind it is stale, whether the logout above removed
# the login or the user did: with no token configured and gh signed out, it
# describes nothing and goes. Stated as a state, not as "after the logout",
# so a second run has nothing left to do.
- name: auth | Forget the login this role made
  ansible.builtin.file:
    path: "{{ github_projects_marker_file }}"
    state: absent
  become: true
  become_user: "{{ github_projects_user }}"
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_token_wanted | bool
    - not github_projects_signed_in | bool
    - github_projects_marker_digest | length > 0

# The device flow, here rather than from make github-login, when asked for:
# the run then waits for the browser (github_projects_login_prompt).
- name: auth | Sign gh in by the device flow
  ansible.builtin.include_tasks: device_flow.yml
  when:
    - github_projects_auth_wanted | bool
    - github_projects_login_prompt | bool
    - github_projects_web_wanted | bool
    - not github_projects_signed_in | bool

# Written whenever the login is the vault token's, not only right after a
# sign-in, so a marker that went missing comes back; the digest of the token,
# never the token. Rewritten only when its content differs.
- name: auth | Make the directory for the marker of this role's login
  ansible.builtin.file:
    path: "{{ github_projects_marker_file | dirname }}"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ github_projects_user }}"
  when:
    - github_projects_auth_wanted | bool
    - github_projects_token_wanted | bool
    - github_projects_signed_in | bool
    - github_projects_stored_token == github_projects_token

- name: auth | Remember that the login is this role's
  ansible.builtin.copy:
    content: "{{ github_projects_token | hash('sha256') }}\n"
    dest: "{{ github_projects_marker_file }}"
    mode: "0600"
  become: true
  become_user: "{{ github_projects_user }}"
  when:
    - github_projects_auth_wanted | bool
    - github_projects_token_wanted | bool
    - github_projects_signed_in | bool
    - github_projects_stored_token == github_projects_token

- name: auth | Read git's credential helpers for github.com
  ansible.builtin.command:
    argv: [git, config, --global, --get-all, credential.https://github.com.helper]
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_helpers
  changed_when: false
  # 1 is "no such key", which includes no ~/.gitconfig at all.
  failed_when: github_projects_helpers.rc not in [0, 1]
  check_mode: false
  when:
    - github_projects_auth_wanted | bool
    - github_projects_signed_in | bool

# gh writes two entries: an empty one, which stops git from also asking any
# helper configured more generally, then its own. Its own is recognised the
# way gh recognises it, by the gh after the "!", so one installed elsewhere
# than /usr/bin counts too.
- name: auth | Make gh git's credential helper for github.com
  ansible.builtin.command:
    argv: [gh, auth, setup-git, --hostname, github.com]
  become: true
  become_user: "{{ github_projects_user }}"
  changed_when: true
  when:
    - github_projects_auth_wanted | bool
    - github_projects_signed_in | bool
    - github_projects_helpers.stdout_lines | default([]) | select('search', '^!([^ ]*/)?gh( |$)') | list | length == 0

- name: auth | Say how to sign gh in
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: gh is not signed in to GitHub, so only public repositories are
      listed and cloned, and git push on the VM will fail. Run {{ github_projects_login_command }}
      on your machine: a page opens in your browser, the code is on your clipboard, you paste it
      and authorise, and that run clones the private repositories too.
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_signed_in | bool
