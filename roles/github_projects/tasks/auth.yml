---
# gh on the VM, as github_projects_user: signed in from the vault token when
# there is one and gh holds no login of the user's own, otherwise left for the
# one device-flow login the user makes (make github-login, or the terminal
# make code opens), and either way made git's credential helper for
# github.com. The state is read first, and again after a change, so that the
# listing which follows can use whatever token the VM then holds
# (vars/main.yml, github_projects_listing_token). Nothing here fails a VM that
# is merely signed out: public repositories still clone, and the run says what
# is missing.
- name: auth | Look for gh
  ansible.builtin.command:
    argv: [which, gh]
  register: github_projects_gh_which
  changed_when: false
  failed_when: false
  check_mode: false

- name: auth | Read gh's login state
  ansible.builtin.include_tasks: auth_status.yml
  when: github_projects_gh_found | bool

# --json came to `gh auth status` in gh 2.81.0 (2025-10-01), and the role
# depends on it. The JSON form exits 0 signed in or out, so a non-zero exit is
# gh refusing the command - an older gh and its "unknown flag" - not a state;
# read as "signed out" it would print the sign-in command on every run and
# never configure the helper, however often the user signed in.
- name: auth | Fail when gh could not report its login state
  ansible.builtin.fail:
    msg: >-
      gh on {{ inventory_hostname }} could not report its login state:
      {{ github_projects_status_said or 'no output' }}.
      `gh auth status --json` needs gh 2.81.0 or newer. Install gh from GitHub's apt repository
      (dev_tools_install_gh: true), or set github_auth: false to leave gh alone.
  when:
    - github_projects_auth | bool
    - github_projects_gh_found | bool
    - github_projects_auth_status.rc | default(0) != 0

- name: auth | Fail when the token method has no token
  ansible.builtin.fail:
    msg: >-
      github_auth_method is token, but github_token is empty on {{ inventory_hostname }}: set
      vault_github_token, or choose auto or web to sign in by the device flow.
  when:
    - github_projects_auth | bool
    - github_projects_auth_method == 'token'
    - github_projects_token | length == 0

- name: auth | Say that gh is missing
  ansible.builtin.debug:
    msg: >-
      gh is not installed on {{ inventory_hostname }} (dev_tools_install_gh), so it cannot be signed
      in to GitHub: only public repositories are cloned, and git push there needs a credential of
      your own. Set github_auth: false to turn this off.
  when:
    - github_projects_auth | bool
    - not github_projects_gh_found | bool

# Only over a login that is not the user's own, and only when the stored token
# differs from the vault's, so a second run changes nothing
# (vars/main.yml, github_projects_token_sign_in). --insecure-storage: a
# headless VM has no credential store, and gh would fall back to the same
# plain-text hosts.yml anyway; asking for it keeps a future gh that finds one
# from storing the token somewhere this role cannot read or remove. no_log:
# the token is on stdin, and the result would show it.
- name: auth | Sign gh in with the token
  ansible.builtin.command:
    argv: [gh, auth, login, --hostname, github.com, --git-protocol, https, --with-token, --insecure-storage]
    stdin: "{{ github_projects_token }}"
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_login
  changed_when: github_projects_login.rc == 0
  failed_when: false
  no_log: true
  when: github_projects_token_sign_in | bool

# Failed under no_log, which hides everything; gh's own line names the cause
# (a refused token, no route to api.github.com) and never the token.
- name: auth | Fail when GitHub refused the token
  ansible.builtin.fail:
    msg: >-
      gh auth login on {{ inventory_hostname }} with vault_github_token failed:
      {{ github_projects_token_said or 'no output' }}.
      GitHub refused the token or the VM cannot reach it. Check the token and its permissions
      (README, "Private repositories, and pushing from the VM"), or clear it to sign in by the device flow
      with {{ github_projects_login_command }}
  when:
    - github_projects_login is not skipped
    - github_projects_login.rc | default(0) != 0
    - not github_projects_token_short | bool

# A token that lists but that gh will not sign in with: under auto it lists
# as before and gh stays signed out, rather than every VM failing on upgrade.
# github_auth_method: token still fails above, as it asked for the token path.
- name: auth | Say that the token only lists
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: gh did not sign in with vault_github_token
      ({{ github_projects_token_said }}), so the token only lists the repositories,
      and git push on the VM will fail. Add read:org (and workflow, for pushes that change
      .github/workflows/) to the token and run {{ github_projects_configure_command }}; or set
      github_auth_method: web and sign gh in by the device flow with {{ github_projects_login_command }}
  register: github_projects_token_short_reported
  when: github_projects_token_short | bool

- name: auth | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      github_projects_next: >-
        {{ {inventory_hostname: {'github': github_projects_token_short_reported.msg}} }}
    aggregate: true
    per_host: false
  when: github_projects_token_short | bool

# The login the user made by hand - for pushing, say, beside a token that
# only lists, as earlier versions advised - is theirs: the vault token is not
# put over it, and only lists. Said on every run it holds, with the switch
# that hands gh to the token instead.
- name: auth | Say that the token only lists beside a login of your own
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: gh is signed in to GitHub as {{ github_projects_auth_account.login | default('?', true) }}
      by a login of your own, which this role leaves as it is, so vault_github_token only lists the
      repositories there. To sign gh in with the token instead, set github_auth_method: token and run
      {{ github_projects_configure_command }}
  when: github_projects_token_beside | bool

# A login the user made, said with how to change it: nothing left to do (NEXT
# STEPS), which also clears an earlier record of this VM.
- name: auth | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      github_projects_next: >-
        {{ {inventory_hostname: {'github': ''}} }}
    aggregate: true
    per_host: false
  when: github_projects_token_beside | bool

# The other direction, like the API key in roles/claude_code: the login this
# role made is removed once no token is configured. Only that one, told by
# the marker below - a token the user pasted by hand looks the same to gh -
# and by account, so a second account the user keeps on github.com stays.
- name: auth | Sign gh out of the login this role made, now that no token is configured
  ansible.builtin.command:
    argv: >-
      {{ ['gh', 'auth', 'logout', '--hostname', 'github.com']
         + (['--user', github_projects_auth_account.login]
            if github_projects_auth_account.login | default('') | length > 0 else []) }}
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_logout
  changed_when: true
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_token_wanted | bool
    - github_projects_login_is_ours | bool

- name: auth | Read gh's login state again
  ansible.builtin.include_tasks: auth_status.yml
  when: github_projects_login is changed or github_projects_logout is changed

# A marker with no login behind it is stale, whether the logout above removed
# the login or the user did: with no token configured and gh signed out, it
# describes nothing and goes. Stated as a state, not as "after the logout",
# so a second run has nothing left to do.
- name: auth | Forget the login this role made
  ansible.builtin.file:
    path: "{{ github_projects_marker_file }}"
    state: absent
  become: true
  become_user: "{{ github_projects_user }}"
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_token_wanted | bool
    - not github_projects_signed_in | bool
    - github_projects_marker_digest | length > 0

# Written whenever the login is the vault token's, not only right after a
# sign-in, so a marker that went missing comes back; the digest of the token,
# never the token. Rewritten only when its content differs.
- name: auth | Make the directory for the marker of this role's login
  ansible.builtin.file:
    path: "{{ github_projects_marker_file | dirname }}"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ github_projects_user }}"
  when:
    - github_projects_auth_wanted | bool
    - github_projects_token_wanted | bool
    - github_projects_signed_in | bool
    - github_projects_stored_token == github_projects_token

- name: auth | Remember that the login is this role's
  ansible.builtin.copy:
    content: "{{ github_projects_token_digest }}\n"
    dest: "{{ github_projects_marker_file }}"
    mode: "0600"
  become: true
  become_user: "{{ github_projects_user }}"
  when:
    - github_projects_auth_wanted | bool
    - github_projects_token_wanted | bool
    - github_projects_signed_in | bool
    - github_projects_stored_token == github_projects_token

# Whenever gh is signed in, github_auth or not: clone.yml clones a private
# repository over https only when git will ask gh for it, and a login made by
# hand with github_auth off may have made gh the helper too.
- name: auth | Read git's credential helpers for github.com
  ansible.builtin.command:
    argv: [git, config, --global, --get-all, credential.https://github.com.helper]
  become: true
  become_user: "{{ github_projects_user }}"
  register: github_projects_helpers
  changed_when: false
  # 1 is "no such key", which includes no ~/.gitconfig at all.
  failed_when: github_projects_helpers.rc not in [0, 1]
  check_mode: false
  when: github_projects_signed_in | bool

# gh writes two entries: an empty one, which stops git from also asking any
# helper configured more generally, then its own (github_projects_gh_helper).
- name: auth | Make gh git's credential helper for github.com
  ansible.builtin.command:
    argv: [gh, auth, setup-git, --hostname, github.com]
  become: true
  become_user: "{{ github_projects_user }}"
  changed_when: true
  when:
    - github_projects_auth_wanted | bool
    - github_projects_signed_in | bool
    - not github_projects_gh_helper | bool

# Under make deploy the sign-in comes next in the same run, which says so
# rather than send the user off to run it (github_projects_sign_in_follows).
- name: auth | Say how to sign gh in
  vars:
    github_projects_sign_in_next: >-
      {{ 'make deploy signs it in next, in this run, and the private repositories follow.' if github_projects_sign_in_follows | bool
         else 'Run ' ~ github_projects_login_command ~ ' on your machine: a page opens in your browser, the code is on your'
              ~ ' clipboard, you paste it and authorise, and that run clones the private repositories too.' }}
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: gh is not signed in to GitHub, so only public repositories are
      listed and cloned, and git push on the VM will fail. {{ github_projects_sign_in_next }}
  register: github_projects_sign_in_reported
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_signed_in | bool
    - not github_projects_token_short | bool

# NEXT STEPS: the line above, unless the sign-in follows in this run, whose
# own report then says what is left.
- name: auth | Keep what is left to do for the end of the run
  ansible.builtin.set_stats:
    data:
      github_projects_next: >-
        {{ {inventory_hostname: {'github': '' if github_projects_sign_in_follows | bool
                                           else github_projects_sign_in_reported.msg}} }}
    aggregate: true
    per_host: false
  when:
    - github_projects_auth_wanted | bool
    - not github_projects_signed_in | bool
    - not github_projects_token_short | bool
