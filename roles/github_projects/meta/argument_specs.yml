---
argument_specs:
  main:
    short_description: Clone every GitHub repository of a user
    options:
      github_projects_user: &gp_user
        type: str
        description: Local user that owns the checkouts.
      github_projects_username:
        type: str
        required: true
        description: GitHub account to list repositories for.
      github_projects_token:
        type: str
        no_log: true
        description:
          - Lists private repositories and, with github_projects_auth, signs gh in on the VM where gh is signed out or
            signed in by this role. A login made by hand stays, and the token then only lists.
      github_projects_api_url:
        type: str
        description: Base URL of the GitHub REST API that lists the repositories and, for ssh clones, GitHub's host keys. Tests point it at a stand-in.
      github_projects_home: &gp_home
        type: path
        description: Home directory of github_projects_user. Empty looks it up on the VM.
      github_projects_dir:
        type: path
        description: Destination directory. Defaults to ~/projects.
      github_projects_include_forks:
        type: bool
        description: Also clone repositories that are forks.
      github_projects_include_archived:
        type: bool
        description: Also clone archived repositories.
      github_projects_include:
        type: list
        elements: str
        description: Repository names to clone. Empty means every repository of the user.
      github_projects_exclude:
        type: list
        elements: str
        description: Repository names never cloned, even when github_projects_include names them.
      github_projects_vm_repos:
        type: dict
        description:
          - This VM's own list of repositories, when it has one - own (true) and names - in place of
            github_projects_include. A fork or an archived repository named on it is cloned.
          - Published with the VM from its notes in Proxmox (just deploy --repos), never read from the VM.
      github_projects_clone_protocol:
        type: str
        choices: [https, ssh]
        description: https clones private repositories through gh; ssh needs a key of the user's own on the VM, and trusts GitHub's published host keys.
      github_projects_update_existing:
        type: bool
        description: Pull checkouts that already exist on every run. Off, a re-run never disturbs local work.
      github_projects_depth:
        type: str
        description: Shallow clone depth. Empty clones the full history.
      github_projects_clone_jobs:
        type: int
        description: >-
          How many repositories are cloned at once, each into a partial folder renamed into place once whole. 1 clones
          them one at a time.
      github_projects_auth:
        type: bool
        description:
          - Sign gh in (from the token, or by a device-flow login the user makes once) and make it git's credential
            helper.
      github_projects_auth_method:
        type: str
        choices: [auto, web, token]
        description:
          - auto takes the token when set, else the device flow; web is the device flow always; token is the token only,
            put over any login gh holds.
      github_projects_login_scopes:
        type: list
        elements: str
        description: Scopes the device flow asks for on top of gh's own (repo, read:org, gist).
      github_projects_login_desktop:
        type: bool
        description: During the device flow, open the page and copy the code on the controller. Off in every test.
      github_projects_sign_in_follows:
        type: bool
        description:
          - The sign-ins come next in this run (just deploy), so the message for a signed-out VM says so rather
            than naming just login --only github.
      github_projects_git_user_name:
        type: str
        description:
          - git user.name for github_projects_user, written always. Empty derives it from the GitHub account, and only
            where ~/.gitconfig has none yet.
      github_projects_git_user_email:
        type: str
        description:
          - git user.email for github_projects_user, written always. Empty uses GitHub's noreply address for the account,
            and only where ~/.gitconfig has none yet.
      github_projects_host_flag:
        type: str
        description:
          - What ends each just line naming this VM, in NEXT STEPS, a retry or a message - " --host <name>" where
            the checkout has more than one Proxmox host (claude_host_flag), so a line pasted later reaches the
            VM's host. Empty with one host.
  login:
    short_description: Say whether gh is signed in to GitHub, and how, and sign it in by the device flow when asked
    description:
      - Reads gh's login state on the VM and prints it, with the one command to run when it is signed out. With
        github_projects_login_interactive, or the answer to the question github_projects_login_ask puts, signs a
        signed-out VM in by GitHub's device flow; playbooks/github_login.yml then runs the whole role.
    options:
      github_projects_login_interactive:
        type: bool
        description:
          - Run the device flow for a signed-out VM. Set by
            playbooks/github_login.yml when names were given, and by just
            deploy for a VM whose Claude code was entered in the same run.
      github_projects_login_ask:
        type: bool
        description:
          - Ask at a prompt first. just deploy sets it for every VM but one whose
            Claude prompt got Enter. For a VM with github_projects_login_interactive,
            Enter runs the device flow and "n" skips it; for any other, "y" runs it
            and Enter skips it. With no terminal the answer would be nothing, which
            is Enter, so playbooks/github_login.yml never sets it in a run without
            one.
      github_projects_login_role_follows:
        type: bool
        description:
          - The whole role runs for this VM next, in the same run, so a vault token
            gh is not yet signed in with is said to be signed in by it rather than
            by a command to run.
      github_projects_host_flag:
        type: str
        description: What ends each just line for this VM, as main has it.


  # tasks_from: release, which playbooks/destroy.yml runs on each VM before it
  # is deleted.
  release:
    short_description: Sign gh out before the VM is destroyed
    description:
      - Signs gh out, and records what became of the login in github_projects_release_said, for destroy's report. No
        token is revoked at GitHub - revoking one gh sign-in there ends every gh sign-in of the account - so the report
        says where to revoke it, and what that does.
    options:
      github_projects_user: *gp_user
      github_projects_home: *gp_home
      github_projects_token:
        type: str
        no_log: true
        description: The vault token, only to say that a login with it is every VM's.
