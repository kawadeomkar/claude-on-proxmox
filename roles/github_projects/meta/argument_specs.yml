---
argument_specs:
  main:
    short_description: Clone every GitHub repository of a user
    options:
      github_projects_user:
        type: str
        default: dev
        description: Local user that owns the checkouts.
      github_projects_username:
        type: str
        required: true
        description: GitHub account to list repositories for.
      github_projects_token:
        type: str
        default: ""
        no_log: true
        description:
          - Lists private repositories and, with github_projects_auth, signs gh in on the VM where gh is signed
            out or signed in by this role. A login made by hand stays, and the token then only lists.
      github_projects_api_url:
        type: str
        default: https://api.github.com
      github_projects_home:
        type: path
        default: ""
        description: Home directory of github_projects_user. Empty looks it up on the VM.
      github_projects_dir:
        type: path
        description: Destination directory. Defaults to ~/projects.
      github_projects_include_forks:
        type: bool
        default: false
      github_projects_include_archived:
        type: bool
        default: false
      github_projects_include:
        type: list
        elements: str
        default: []
        description: Repository names to clone. Empty means every repository of the user.
      github_projects_exclude:
        type: list
        elements: str
        default: []
      github_projects_clone_protocol:
        type: str
        choices: [https, ssh]
        default: https
      github_projects_update_existing:
        type: bool
        default: false
      github_projects_depth:
        type: str
        default: ""
      github_projects_auth:
        type: bool
        default: true
        description: Sign gh in (from the token, or by a device-flow login the user makes once) and make it git's credential helper.
      github_projects_auth_method:
        type: str
        choices: [auto, web, token]
        default: auto
        description:
          - auto takes the token when set, else the device flow; web is the device flow always; token is the
            token only, put over any login gh holds.
      github_projects_login_scopes:
        type: list
        elements: str
        default: [workflow]
        description: Scopes the device flow asks for on top of gh's own (repo, read:org, gist).
      github_projects_login_desktop:
        type: bool
        default: true
        description: During the device flow, open the page and copy the code on the controller. Off in every test.
      github_projects_sign_in_follows:
        type: bool
        default: false
        description:
          - The sign-ins come next in this run (make deploy), so the message for a signed-out VM says so rather
            than naming make github-login.
      github_projects_git_user_name:
        type: str
        default: ""
        description:
          - git user.name for github_projects_user, written always. Empty derives it from the GitHub account,
            and only where ~/.gitconfig has none yet.
      github_projects_git_user_email:
        type: str
        default: ""
        description:
          - git user.email for github_projects_user, written always. Empty uses GitHub's noreply address for the
            account, and only where ~/.gitconfig has none yet.
  login:
    short_description: Say whether gh is signed in to GitHub, and how, and sign it in by the device flow when asked
    description:
      - Reads gh's login state on the VM and prints it, with the one command
        to run when it is signed out.
      - With github_projects_login_interactive, or the answer to the question
        github_projects_login_ask puts, signs a signed-out VM in by GitHub's
        device flow; playbooks/github_login.yml then runs the whole role.
    options:
      github_projects_login_interactive:
        type: bool
        default: false
        description:
          - Run the device flow for a signed-out VM. Set by
            playbooks/github_login.yml when names were given, and by make
            deploy for a VM whose Claude code was entered in the same run.
      github_projects_login_ask:
        type: bool
        default: false
        description:
          - Ask at a prompt first. make deploy sets it for every VM but one whose
            Claude prompt got Enter. For a VM with github_projects_login_interactive,
            Enter runs the device flow and "n" skips it; for any other, "y" runs it
            and Enter skips it. With no terminal the answer is nothing.
      github_projects_login_role_follows:
        type: bool
        default: false
        description:
          - The whole role runs for this VM next, in the same run, so a vault token
            gh is not yet signed in with is said to be signed in by it rather than
            by a command to run.

  # tasks_from: release, which playbooks/destroy.yml runs on each VM before it
  # is deleted.
  release:
    short_description: Sign gh out, and revoke the token this role's sign-in made, before the VM is destroyed
    description:
      - Revokes at GitHub, through its credential revocation endpoint, a token this role's device flow made for the
        VM - told by the digest it left - then signs gh out. A personal access token is never revoked. Records what
        became of the login in github_projects_release_said, for destroy's report.
    options:
      github_projects_user:
        type: str
        default: dev
      github_projects_home:
        type: path
        default: ""
      github_projects_token:
        type: str
        default: ""
        no_log: true
        description: The vault token, only to say that a login with it is not revoked.
      github_projects_api_url:
        type: str
        default: https://api.github.com
