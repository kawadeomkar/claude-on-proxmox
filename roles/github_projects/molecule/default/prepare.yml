---
- name: Wait for the containers to boot
  ansible.builtin.import_playbook: ../../../../tests/molecule/boot_wait.yml

- name: Prepare
  hosts: all
  become: true
  vars:
    prepare_github_username: molecule
    prepare_github_owner: dev
    prepare_github_helper_dir: "{{ playbook_dir }}/../../../../tests/molecule"
    prepare_github_repos:
      - alpha
      - beta
      - gamma:fork
      - delta:archived
      - excluded-one
      - epsilon:empty
      # Created and given no commit: a push time like any other, no branch.
      - zeta:fresh
      - secret:private
  tasks:
    - name: Create the target user
      ansible.builtin.user:
        name: dev
        shell: /bin/bash

    - name: Set up fake GitHub
      ansible.builtin.include_tasks: "{{ prepare_github_helper_dir }}/prepare_github.yml"
