---
- name: Converge
  hosts: all
  become: true
  roles:
    # Default: empty include list clones every non-fork, non-archived repository
    # - the private one included, because the token signs the stand-in gh in
    # and lists through /user/repos (tests/molecule/fake_github_api.py).
    - role: github_projects
      vars:
        github_projects_username: molecule
        github_projects_token: ghp_molecule0000
        github_projects_api_url: http://127.0.0.1:8000
        github_projects_exclude: [excluded-one]
        github_projects_login_desktop: false

    # Explicit list: only the named repositories, into a separate directory.
    # Same token, so gh is already signed in and nothing is signed in again.
    - role: github_projects
      vars:
        github_projects_username: molecule
        github_projects_token: ghp_molecule0000
        github_projects_api_url: http://127.0.0.1:8000
        github_projects_include: [beta]
        github_projects_dir: /home/dev/selected
        github_projects_login_desktop: false
