---
# Internal, not meant to be overridden. Vars rather than facts, as in
# roles/proxmox_vm/vars/main.yml: each follows the register it reads, and the
# role can run more than once in one play (its own Molecule scenario does).

# Whether gh is on the VM at all. Without it there is nothing to sign in, and
# the role says so rather than failing a VM built with dev_tools_install_gh off.
github_projects_gh_found: "{{ github_projects_gh_which.rc | default(1) == 0 }}"

# What `gh auth status --hostname github.com --json hosts` printed, parsed:
# {"hosts": {}} when signed out, otherwise one entry per account under
# "github.com". The command exits 0 either way and keeps its human-readable
# line on stderr. Anything else - gh missing, or too old for --json - reads
# as signed out.
github_projects_auth_hosts: >-
  {{ (github_projects_auth_status.stdout | from_json).hosts | default({})
     if github_projects_auth_status.rc | default(1) == 0
        and (github_projects_auth_status.stdout | default('') | trim).startswith('{')
     else {} }}

# The active github.com account, or {}.
github_projects_auth_account: >-
  {{ github_projects_auth_hosts['github.com'] | default([])
     | selectattr('active', 'defined') | selectattr('active') | list | first | default({}) }}

github_projects_signed_in: "{{ (github_projects_auth_account.state | default('')) == 'success' }}"
# Whether gh could not check its login with GitHub - no network, GitHub down - rather than GitHub refusing the token:
# `gh auth status --json` says both as state "error", and only a refusal carries GitHub's own "HTTP 401" or
# "HTTP 403". just status says it was not checked, never "not signed in".
github_projects_auth_unchecked: >-
  {{ (github_projects_auth_account.state | default('')) == 'error'
     and not ((github_projects_auth_account.error | default('')) is match('HTTP 40[13]')) }}

# What gh wrote to stderr - when it could not report its state, and when it
# would not sign in with the vault token - for the messages that quote it,
# without escape sequences or control characters (the plain_text filter,
# filter_plugins/text.py). The VM's user controls what gh prints there, and an
# escape sequence quoted in a failure would reach this terminal and the run log
# raw: ansible-core 2.21 prints a failure's [ERROR] line unescaped.
github_projects_status_said: >-
  {{ github_projects_auth_status.stderr | default('') | plain_text | trim }}
# What follows gh's own words when it could not report its state - a non-zero
# exit from `gh auth status --json`, which only a gh too old for --json gives -
# in auth.yml's failure and in login_report.yml's line alike.
github_projects_gh_too_old_said: "{{ github_projects_auth | bool | github_too_old_said }}"
github_projects_token_said: >-
  {{ github_projects_login.stderr | default('') | plain_text | trim }}

# How gh came to be signed in: `env` for a GH_TOKEN or GITHUB_TOKEN in gh's
# environment (which the reset environment of sudo -H rarely carries), and
# otherwise from the prefix of the token gh holds, read under no_log below:
# `pat` for a token like the one this role writes (ghp_ classic, github_pat_
# fine-grained), `oauth` for the gho_ token of a device-flow login the user
# made, `none` signed out. Not from the status JSON: its token field is empty
# without --show-token, and omitted.
github_projects_login_kind: >-
  {{ 'none' if not github_projects_signed_in | bool
     else 'env' if (github_projects_auth_account.tokenSource | default('')) is match('.*_TOKEN$')
     else 'pat' if github_projects_stored_token is match('(ghp_|github_pat_)')
     else 'oauth' if github_projects_stored_token is match('gho_')
     else 'other' }}

# Whether this run manages gh's login and the credential helper at all.
github_projects_auth_wanted: "{{ github_projects_auth | bool and github_projects_gh_found | bool }}"

# Which credential signs gh in, from github_projects_auth_method: the token
# path takes the vault token (auto only when there is one), the web path is
# the device flow (auto only when there is none). With web and a token, the
# token lists and nothing more.
github_projects_token_wanted: >-
  {{ github_projects_auth_method == 'token'
     or (github_projects_auth_method == 'auto' and github_projects_token | length > 0) }}
github_projects_web_wanted: >-
  {{ github_projects_auth_method == 'web'
     or (github_projects_auth_method == 'auto' and github_projects_token | length == 0) }}
# Internal: whether gh would not sign in with the vault token for want of a scope - a
# classic token with repo alone, as earlier versions asked for, lacks the
# read:org gh requires. Under auto that token goes on listing, as it did then.
github_projects_token_short: >-
  {{ github_projects_auth_method == 'auto'
     and 'missing required scope' in (github_projects_login.stderr | default('')) }}

# Internal: whether auth.yml signs gh in with the vault token - when the
# token gh holds differs from it, so a second run changes nothing, and only
# over a login that is not the user's own: gh signed out, signed in by this
# role (the marker below), or github_auth_method: token, which asks for the
# token whatever gh holds. A login made by hand - for pushing, beside a token
# that only lists, as earlier versions advised - stays, and the token then
# only lists (github_projects_token_beside).
github_projects_token_sign_in: >-
  {{ github_projects_auth_wanted | bool
     and github_projects_token_wanted | bool
     and github_projects_stored_token != github_projects_token
     and (not github_projects_signed_in | bool
          or github_projects_login_is_ours | bool
          or github_projects_auth_method == 'token') }}
github_projects_token_beside: >-
  {{ github_projects_auth_wanted | bool
     and github_projects_token_wanted | bool
     and github_projects_signed_in | bool
     and github_projects_stored_token != github_projects_token
     and not github_projects_login_is_ours | bool
     and github_projects_auth_method != 'token' }}

# The device flow as gh runs it with no terminal: it prints the code and the
# page at once and polls until the code is approved or expires. The git
# protocol is the clone protocol, so `gh repo clone` matches.
github_projects_login_args: >-
  {{ ['gh', 'auth', 'login', '--hostname', 'github.com', '--git-protocol', github_projects_clone_protocol,
      '--web', '--skip-ssh-key']
     + (['--scopes', github_projects_login_scopes | join(',')] if github_projects_login_scopes | length > 0 else []) }}
# Where gh's output lands while it runs - a code that is public by design and
# expires, never a token - and gh's pid, which ends a gh nobody waits for any
# more. Both removed when the flow ends.
github_projects_login_output: "{{ github_projects_state_dir }}/gh-login.out"
github_projects_login_pidfile: "{{ github_projects_state_dir }}/gh-login.pid"
# Internal: both, unlinked before the flow starts and again once it ends - one
# list, so the two cannot drift.
github_projects_login_files:
  - "{{ github_projects_login_output }}"
  - "{{ github_projects_login_pidfile }}"
# Internal: how long gh may take to show the code; how long the approval is
# waited for, a little longer than the fifteen minutes GitHub's code lives and
# gh polls, so that gh's own word on an expired code is what ends the wait;
# and Ansible's async limit, longer again, so that its watchdog never kills gh
# before gh has said why it stopped.
github_projects_login_start_seconds: 30
github_projects_login_wait_seconds: 930
github_projects_login_async_seconds: 960
# What gh printed there, without escape sequences or control characters (see
# github_projects_status_said), and the code read out of it: a word of its own
# in GitHub's shape, XXXX-XXXX.
github_projects_login_text: >-
  {{ ((github_projects_login_out.content | b64decode) if github_projects_login_out.content is defined else '')
     | plain_text }}
github_projects_login_code: >-
  {{ github_projects_login_text | regex_search('(?<![A-Za-z0-9-])[A-Z0-9]{4}-[A-Z0-9]{4}(?![A-Za-z0-9-])') or '' }}
# Internal: the page the code is entered at, opened on this machine. GitHub's
# own, never a URL out of gh's output: the VM chooses what gh prints there, and
# a page of its choosing would open in your browser just as the run asks you to
# sign in to GitHub. gh signs in to github.com alone (github_projects_login_args),
# so this is the one page the pattern matches.
github_projects_login_page: https://github.com/login/device
github_projects_login_page_pattern: '^https://github[.]com/login/device$'
# Internal: every page gh printed that the pattern does not match, each once,
# and whether there is one, which the message showing the code says: never
# shown or opened, and quoted only as the placeholder below. gh on a VM you made
# names GitHub's own alone; one that names another may not be gh, or the VM yours.
github_projects_login_pages_foreign: >-
  {{ github_projects_login_text | regex_findall('https?://[^ \t\n]+')
     | reject('match', github_projects_login_page_pattern) | unique | list }}
github_projects_login_page_foreign: "{{ github_projects_login_pages_foreign | length > 0 }}"
github_projects_login_page_withheld: "<a page that is not GitHub's own>"
# Internal: the lines gh printed, without the closing line the start task writes
# after it ("gh exited: N"), for the messages that quote what gh said - a
# failure's among them - with each of those pages replaced, whole, by the
# placeholder: a page of the VM's choosing is never printed for you to follow.
github_projects_login_said: >-
  {{ (github_projects_login_text
      | regex_replace('(?:' ~ github_projects_login_pages_foreign | map('regex_escape') | join('|') ~ ')(?![^ \t\n])',
                      github_projects_login_page_withheld)
      if github_projects_login_pages_foreign | length > 0 else github_projects_login_text).splitlines()
     | map('trim') | select | reject('match', 'gh exited: ') | list }}
# Internal: whether the code ran out: Ansible's async limit ended the job, or
# the run had to end gh itself once the wait for the approval was over.
github_projects_login_expired: >-
  {{ (github_projects_login_result.msg | default('')) is search('Timeout exceeded')
     or (github_projects_login_finished.finished | default(1) | int) != 1 }}

# Internal: what was typed at login.yml's question, if it was asked. Enter
# alone is nothing - and so would be a question asked with no terminal, which
# pause answers at once.
github_projects_login_answer: >-
  {{ (github_projects_login_asked | default({})).user_input | default('', true) | trim | lower }}
# Internal: whether login.yml runs the device flow. Asked about a VM someone
# is here for (github_projects_login_interactive: just deploy, for a VM whose
# Claude code was entered), Enter or "y" goes and anything else - "n" - stays;
# asked about any other, only "y" goes. Since nothing is Enter, the question is
# put only where someone can answer it: playbooks/github_login.yml sets
# neither switch for such a VM in a run with no terminal
# (claude_vm_login_unasked). Not asked, the switch alone decides.
github_projects_login_go: >-
  {{ github_projects_login_answer in (['', 'y', 'yes'] if github_projects_login_interactive | bool else ['y', 'yes'])
     if github_projects_login_ask | bool
     else github_projects_login_interactive | bool }}

# The token gh stored, read with `gh auth token` under no_log; '' when signed
# out. Every task that renders this, or the listing token below, is no_log.
github_projects_stored_token: >-
  {{ github_projects_stored_token_raw.stdout | default('') | trim
     if github_projects_stored_token_raw.rc | default(1) == 0 else '' }}

# The user's home, absolute, from the one main.yml resolved: a "~" in a copy
# task's dest is expanded through the connection's shell, not the module's
# environment.
github_projects_home_dir: >-
  {{ github_projects_home if github_projects_home | length > 0
     else ansible_facts.getent_passwd[github_projects_user][4] }}
# The marker that tells a login this role made. The role cannot tell its token
# from one the user pasted by hand, so it leaves a marker when it signs in - the
# digest of the token, beside the user's own config - and only a stored token
# with that digest is ever signed out. No marker, no logout: a login the user
# made, a token of their own included, stays.
github_projects_marker_file: "{{ github_projects_state_dir }}/gh-login"
# The same, for a login this role's device flow made: the digest of the token
# it left gh, apart from the marker above, whose logout rules are the vault
# token's. just destroy's report tells a token with this digest - GitHub CLI's,
# from this role's sign-in - from one pasted by hand, and from the vault's,
# which every VM shares. None is revoked (release.yml).
github_projects_device_marker_file: "{{ github_projects_state_dir }}/gh-device-login"
# The directory the role keeps these in, which claude_code shares: agent-warehouse
# from 2.0, claude-on-proxmox through 1.x, which names.yml moves it from before
# anything reads or writes it (2.x); just status and the release read the 1.x one
# while it is the one there, never moving it.
github_projects_state_dir: "{{ github_projects_home_dir }}/.config/agent-warehouse"
github_projects_state_dir_1x: "{{ github_projects_home_dir }}/.config/claude-on-proxmox"
# The digest the first marker holds, by its name from 2.0 or through 1.x, or ''.
github_projects_marker_digest: >-
  {{ (github_projects_marker_raw.content | b64decode | trim) if github_projects_marker_raw.content is defined
     else (github_projects_marker_raw_1x.content | b64decode | trim) if github_projects_marker_raw_1x.content is defined
     else '' }}
# What the marker holds for the vault token: its digest, never the token.
github_projects_token_digest: "{{ github_projects_token | hash('sha256') }}"
# Whether the login gh holds is one this role made: the stored token's digest is
# the marker's.
github_projects_login_is_ours: >-
  {{ github_projects_signed_in | bool
     and github_projects_stored_token | length > 0
     and github_projects_marker_digest | length > 0
     and github_projects_marker_digest == github_projects_stored_token | hash('sha256') }}
# Whether the marker is due: the login is the vault token's, so auth.yml
# writes it (and its directory) whenever it is, not only straight after a
# sign-in, and a marker that went missing comes back.
github_projects_marker_due: >-
  {{ github_projects_auth_wanted | bool
     and github_projects_token_wanted | bool
     and github_projects_signed_in | bool
     and github_projects_stored_token == github_projects_token }}

# What the listing is made with: the vault token when there is one, else
# whatever gh holds. A device-flow login therefore lists private repositories
# from the run after it, with nothing in the vault.
github_projects_listing_token: >-
  {{ github_projects_token if github_projects_token | length > 0 else github_projects_stored_token }}
# Whether there is a vault token, and a token to list with: what a message or
# a task var asks of them, so that only a task that hands a token on names one
# (tests/unit/test_github_auth.py holds every such task to no_log).
github_projects_token_set: "{{ github_projects_token | length > 0 }}"
github_projects_listing_token_set: "{{ github_projects_listing_token | length > 0 }}"

# A repository whose name starts with a dot would land in the projects
# folder as a folder of settings: .claude for every Claude Code session
# started there, whose trust Remote Control accepts in advance, an editor's
# settings folder (.vscode) for the window just code opens, .agent-warehouse
# for just code's own folder.
# Never cloned, whatever the lists say, and named in the report.
github_projects_dotted: >-
  {{ github_projects_listing.repos | map(attribute='name') | select('match', '[.]') | list }}

# A VM's own list, when it has one (just deploy --repos): read from its notes in
# Proxmox by the play that publishes the VM, never from the VM, whose root could
# otherwise choose what is cloned onto it. A name is only ever compared with the
# listing, so it reaches no URL and no path. A list with no valid name left on it
# is still the VM's list, and clones nothing rather than the fleet's.
github_projects_own_list: "{{ github_projects_vm_repos.own | default(false) | bool }}"
github_projects_own_names: "{{ github_projects_vm_repos.names | default([]) }}"
github_projects_own_missing: >-
  {{ github_projects_own_names | reject('in', github_projects_listing.repos | map(attribute='name') | list) | list }}

# The repositories after the role's own filters: empty ones out (no branch to
# check out), the exclude list out, and in, the VM's own list when it has one,
# else the include list when there is one.
github_projects_wanted: >-
  {{ github_projects_own_names if github_projects_own_list | bool
     else github_projects_include if github_projects_include
     else github_projects_listing.repos | map(attribute='name') | list }}
github_projects_candidates: >-
  {{ github_projects_listing.repos
     | rejectattr('empty')
     | rejectattr('name', 'in', github_projects_dotted)
     | rejectattr('name', 'in', github_projects_exclude)
     | selectattr('name', 'in', github_projects_wanted)
     | list }}

# Whether gh is git's credential helper for github.com already, recognised the
# way gh recognises it, by the gh after the "!", so one installed elsewhere
# than /usr/bin counts too. Read whenever gh is signed in: a login made by
# hand under github_auth: false may have set it up.
github_projects_gh_helper: >-
  {{ github_projects_helpers.stdout_lines | default([]) | select('search', '^!([^ ]*/)?gh( |$)') | list | length > 0 }}

# A private repository the listing shows but git has no credential for would
# fail to clone, so it is skipped and named instead. Over ssh, a key of the
# user's own clones it, so nothing is skipped. Over https the credential is
# gh's: it takes gh signed in, and git asking gh - made so by this run
# (github_projects_auth), or so already.
github_projects_private_cloneable: >-
  {{ github_projects_clone_protocol == 'ssh'
     or (github_projects_signed_in | bool
         and (github_projects_auth_wanted | bool or github_projects_gh_helper | bool)) }}
github_projects_private_skipped: >-
  {{ [] if github_projects_private_cloneable | bool
     else github_projects_candidates | selectattr('private') | map(attribute='name') | list }}
github_projects_private_skip_reason: >-
  {{ 'private, skipped as git has no credential for them (gh is not installed)' if not github_projects_gh_found | bool
     else 'private, skipped until gh is signed in' if not github_projects_signed_in | bool
     else 'private, skipped as git has no credential for them (github_auth is false, and gh is not its credential helper)' }}
github_projects_selected: >-
  {{ github_projects_candidates | rejectattr('name', 'in', github_projects_private_skipped) | list }}

# The git identity, key by key: a value set here is written always; otherwise
# the account's, and only where ~/.gitconfig has none yet, so an identity set
# by hand on the VM stays. The account is the token's own when there is a
# token (who pushes with it), else github_projects_username's, and never an
# organisation, which nobody commits as. The noreply address is the one GitHub
# itself offers for commits that should not carry a real email.
github_projects_git_identity_set: >-
  {{ github_projects_git_identity.results | default([]) | selectattr('stdout', 'defined')
     | selectattr('stdout') | map(attribute='item') | list }}
github_projects_git_identity_needed: >-
  {{ github_projects_auth | bool
     and ((github_projects_git_user_name | length == 0 and 'user.name' not in github_projects_git_identity_set)
          or (github_projects_git_user_email | length == 0 and 'user.email' not in github_projects_git_identity_set)) }}
github_projects_git_person: >-
  {{ (github_projects_listing.user | default({})).login | default('', true) | length > 0
     and (github_projects_listing.user.type | default('User', true)) != 'Organization' }}
github_projects_git_name: >-
  {{ ((github_projects_listing.user.name | default('', true)) or github_projects_listing.user.login)
     if github_projects_git_person | bool else '' }}
github_projects_git_email: >-
  {{ (github_projects_listing.user.id ~ '+' ~ github_projects_listing.user.login ~ '@users.noreply.github.com')
     if github_projects_git_person | bool else '' }}
github_projects_git_identity_wanted: >-
  {{ {'user.name': github_projects_git_user_name if github_projects_git_user_name | length > 0
                   else '' if 'user.name' in github_projects_git_identity_set
                   else github_projects_git_name,
      'user.email': github_projects_git_user_email if github_projects_git_user_email | length > 0
                    else '' if 'user.email' in github_projects_git_identity_set
                    else github_projects_git_email}
     | dict2items | selectattr('value') | items2dict }}

# The command that signs gh in by the device flow, run on the controller: it
# opens the page there, copies the code, waits for the approval, and then
# runs this role so the private repositories arrive in the same run.
github_projects_login_command: just login {{ inventory_hostname }} --only github{{ github_projects_host_flag }}
# The command that runs this role alone: the token sign-in, the listing and the
# clones, with nothing else of just deploy --only configure.
github_projects_configure_command: just deploy {{ inventory_hostname }} --tags github_projects{{ github_projects_host_flag }}

# --- releasing the VM before it is destroyed (release.yml) ---
# release.yml reads the token gh held into github_projects_stored_token, as
# auth_status.yml does, but whether gh can reach GitHub or not: a release signs
# out offline too.

# The digest the device flow's marker holds, or ''.
github_projects_device_marker_digest: >-
  {{ (github_projects_device_marker_raw.content | b64decode | trim)
     if github_projects_device_marker_raw.content is defined
     else (github_projects_device_marker_raw_1x.content | b64decode | trim)
     if github_projects_device_marker_raw_1x.content is defined else '' }}
# Whether that token is the one this role's device flow made for the VM. The
# VM writes the marker, so the vault token, every VM's, is never taken for it
# whatever the marker says.
github_projects_release_ours: >-
  {{ github_projects_stored_token | length > 0 and github_projects_device_marker_digest | length > 0
     and github_projects_device_marker_digest == github_projects_stored_token | hash('sha256')
     and github_projects_stored_token != github_projects_token }}
# Whether `gh auth logout` ended the login, said as the summary below says it:
# a logout gh refused - two accounts, say, where it asks which - is named.
github_projects_release_signed_out: >-
  {{ 'gh signed out' if (github_projects_release_logout.rc | default(1)) == 0
     else ('gh could not sign out ('
           ~ (github_projects_release_logout.stderr | default('') | one_line(none) or 'no reason given') ~ ')') }}
# Whether the summary says the token stays valid until the user revokes it - any
# but the vault's, which is every VM's: something left to do, for destroy's NEXT
# STEPS.
github_projects_release_unrevoked: >-
  {{ github_projects_stored_token | length > 0
     and (github_projects_release_ours | bool
          or not (github_projects_token | length > 0 and github_projects_stored_token == github_projects_token)) }}
# One clause for destroy's report on the VM; empty where gh held no login.
github_projects_release_summary: >-
  {{ '' if github_projects_stored_token | length == 0
     else (github_projects_release_signed_out ~ '; the token this project signed it in with stays valid until revoked at'
           ~ ' https://github.com/settings/applications, under GitHub CLI - which signs out every gh you have, so'
           ~ ' destroy does not')
     if github_projects_release_ours | bool
     else (github_projects_release_signed_out ~ " (vault_github_token is every VM's, so it is not revoked)")
     if github_projects_token | length > 0 and github_projects_stored_token == github_projects_token
     else (github_projects_release_signed_out ~ '; its token is not one this project recorded making (a sign-in by'
           ~ ' hand, or one before this version), and stays valid until revoked - at https://github.com/settings/tokens'
           ~ ' if it is a personal access token, or under GitHub CLI at https://github.com/settings/applications,'
           ~ ' which signs out every gh you have') }}

# Whether gh's login is a device-flow one without the workflow scope, which
# GitHub refuses a push that changes .github/workflows/ for: said by
# login_report.yml, with the gh auth refresh that adds it, and left to do.
github_projects_login_lacks_workflow: >-
  {{ github_projects_login_kind == 'oauth' and 'workflow' not in (github_projects_auth_account.scopes | default('')) }}

# What login_report.yml says of gh's login, and whether it is something left to do, which NEXT STEPS records and just
# status says: the core's words (lib/claude_vm/status/lines.py), one definition for both, from what the registers
# hold. Never the token: only whether one is set.
github_projects_login_report: >-
  {{ {'gh_found': github_projects_gh_found | bool,
      'status_rc': github_projects_auth_status.rc | default(0),
      'status_said': github_projects_status_said,
      'signed_in': github_projects_signed_in | bool,
      'login_done': github_projects_login_done | default(false) | bool,
      'account': github_projects_auth_account.login | default('', true),
      'kind': github_projects_login_kind,
      'is_ours': github_projects_login_is_ours | bool,
      'lacks_workflow': github_projects_login_lacks_workflow | bool,
      'user': github_projects_user,
      'host': ansible_host | default(inventory_hostname),
      'auth': github_projects_auth | bool,
      'auth_method': github_projects_auth_method,
      'token_wanted': github_projects_token_wanted | bool,
      'token_set': github_projects_token_set | bool,
      'role_follows': github_projects_login_role_follows | bool,
      'configure_command': github_projects_configure_command,
      'login_command': github_projects_login_command} | github_login_report }}
github_projects_login_left: "{{ github_projects_login_report.left }}"
