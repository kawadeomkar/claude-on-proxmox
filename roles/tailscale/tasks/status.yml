---
# Entry point for `just status` (playbooks/status.yml): how this VM is on Tailscale, read as configure reads it and
# said as configure says it, changing nothing. What is installed and whose (ownership.yml), the state read once
# rather than waited on (state.yml), and the report's own line (report.yml), which status shows where something is
# left to do. Never the install, the join, the settings, the web login or the removal: status is read-only.
- name: status | Read what is installed, and who installed it
  ansible.builtin.include_tasks: ownership.yml

# Once, with no waiting for a state that has not settled: status says "connecting" instead.
- name: status | Read Tailscale's state
  ansible.builtin.include_tasks: state.yml
  vars:
    tailscale_settle_seconds: 0
  when: tailscale_enabled | bool

- name: status | Say how this VM is on Tailscale
  ansible.builtin.include_tasks: report.yml
  when: tailscale_enabled | bool

# What the report shows, and nothing else: no key, no login link.
- name: status | Keep how this VM is on Tailscale
  ansible.builtin.set_fact:
    tailscale_status_found:
      enabled: "{{ tailscale_enabled | bool }}"
      installed: "{{ tailscale_installed | bool }}"
      ours: "{{ tailscale_ours | bool }}"
      daemon_up: "{{ tailscale_daemon_up | bool if tailscale_enabled | bool else false }}"
      backend: "{{ tailscale_backend if tailscale_enabled | bool else '' }}"
      case: "{{ tailscale_report_case if tailscale_enabled | bool else 'off' }}"
      dns_name: "{{ tailscale_dns_name if tailscale_enabled | bool else '' }}"
      ipv4: "{{ tailscale_ipv4 if tailscale_enabled | bool else '' }}"
      key_expiry: "{{ tailscale_self.KeyExpiry | default('') if tailscale_enabled | bool else '' }}"
      line: >-
        {{ (tailscale_report_reported.msg | default('') | regex_replace('^' ~ (inventory_hostname | regex_escape) ~ ': ', ''))
           if tailscale_enabled | bool else '' }}
      left: "{{ tailscale_report_left | bool if tailscale_enabled | bool else false }}"
