---
# Shared settings live in .config/molecule/config.yml at the project root.
#
# Two VMs: one that has never had Tailscale, and one where it was installed and
# signed in by hand, which the role must leave exactly as it is, on and off.
# Nothing here reaches Tailscale: the real package and daemon are installed,
# the daemon with log upload off from its first start, and every `tailscale`
# the role runs is tests/molecule/fake_tailscale.sh, installed by prepare.yml
# ahead of the package's binary - tests/unit/test_tailscale.py checks both.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
platforms:
  - name: claude-on-proxmox-tailscale
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:18bf80157ea24b3210eb25ca89a5460912271b0ee61f238f36d2b115c89e39e6}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: claude-on-proxmox-tailscale-byhand
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:18bf80157ea24b3210eb25ca89a5460912271b0ee61f238f36d2b115c89e39e6}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    # Resolve roles from this repository's roles/ directory (not Galaxy).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    # The report quotes what the VM says through plain_text, and the address
    # through tailnet_ipv4.
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins
scenario:
  # check before converge: converge in check mode on a VM that has never had
  # Tailscale, as every VM is at the first `just deploy --check` after the upgrade.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
