---
claude_code_user: dev

# native: official installer script (self-updating binary in ~/.local/bin)
# npm:    @anthropic-ai/claude-code via npm (requires Node.js)
claude_code_install_method: native

# stable, latest, or an exact version such as 2.1.41 - the oldest with
# `claude auth`, which the Claude terminal `make code` opens relies on.
claude_code_version: stable
claude_code_installer_url: https://claude.ai/install.sh

# Optional API key. Written to the `env` block of ~/.claude/settings.json so
# every session picks it up. Leave empty to log in interactively on the VM;
# clearing it removes the key an earlier run wrote there.
claude_code_anthropic_api_key: ""

# Extra user settings merged (recursively) into ~/.claude/settings.json.
# Existing keys the user changed on the VM are preserved.
# See https://docs.anthropic.com/en/docs/claude-code/settings
claude_code_settings: {}

# Optional content for ~/.claude/CLAUDE.md (instructions applied to every project).
claude_code_global_instructions: ""

# ------------------------------------------------------- Remote Control -----
# Put this VM's Claude Code session in the session list at claude.ai/code and
# in the Claude mobile app, while the session keeps running here with this
# filesystem and these tools.
#
# On by default, but it means "when this VM can" rather than "always". Nothing
# here can create the credential: Anthropic supports one for Remote Control, an
# interactive claude.ai login on a Pro, Max, Team or Enterprise plan. API keys
# are not supported, and neither is the long-lived token from
# `claude setup-token`.
#
# So the role derives what to do from the credentials it finds:
#   an API key is set      -> off, because a key outranks the login
#   no key, no login yet   -> everything installed and the service left stopped,
#                             with a path unit that starts it the moment a login
#                             lands; make login TYPE=claude and make deploy sign in
#                             and start it in the same run
#   no key, logged in      -> the session is started and appears in the app
# Set false to turn it off. "Off" is enforced, not just skipped: a server an
# earlier run installed is stopped, disabled and its unit removed.
claude_code_remote_control: true
# Session title shown in the list at claude.ai/code. Defaults to the VM name.
claude_code_remote_control_name: "{{ inventory_hostname }}"
# Where sessions open. Empty resolves to ~/projects of claude_code_user, the
# directory github_projects clones into. It must not be the home directory:
# Claude Code never saves workspace trust for one.
#
# Left empty rather than templated from claude_code_home, because Ansible
# validates a role's defaults against meta/argument_specs.yml at role entry -
# before the task that resolves the home directory has run.
claude_code_remote_control_dir: ""
# Starting permission mode for the sessions the server creates. Passed as
# --permission-mode, which outranks permissions.defaultMode in
# claude_code_settings: that one only reaches `claude` started on the VM itself.
claude_code_remote_control_permission_mode: default
# same-dir: every session shares the directory above.
# worktree: each on-demand session gets its own git worktree (needs a repo).
# session: serve exactly one session and reject further connections.
claude_code_remote_control_spawn: same-dir
claude_code_remote_control_service: claude-remote-control

# ------------------------------------------------------------- Sign-in -----
# The browser sign-in (tasks/browser_login.yml) that `make login TYPE=claude` and
# `make deploy` run on a VM with no Claude login and no API key: claude auth
# login starts on the VM with no terminal, its sign-in page opens in the browser
# on this machine, and once you authorise, the browser comes back to claude on
# the VM by itself - or, where it cannot, the page shows a code to paste at a
# prompt in the terminal running make. Set by the playbooks.
claude_code_login_interactive: false
# Open the sign-in page in this machine's browser. Off in every test.
claude_code_login_desktop: true
# Bring the browser back to the VM by itself once you authorise, as a browser on
# the VM would, with nothing to paste: claude's callback port is forwarded from
# this machine over SSH for the length of the sign-in. Only a browser on this
# machine reaches that forward, so it follows claude_code_login_desktop; where
# the port cannot be forwarded, the page shows a code to paste instead.
claude_code_login_redirect: "{{ claude_code_login_desktop }}"
# Seconds the run waits for you to authorise in the browser, when the browser
# comes back by itself. Ctrl-C ends the run sooner.
claude_code_login_approval_timeout: 300
# Extra arguments for `claude auth login`, such as [--sso] or [--email, you@example.com].
claude_code_login_args: []
# Seconds to wait, once the code is pasted, for claude to accept it.
claude_code_login_timeout: 120
# The code, given instead of the prompt: for tests and scripts. Pass it from a
# vars file (-e @file), never -e key=value, which ps and -vvvv show.
claude_code_login_code: ""
# Set by make deploy's configure step: the sign-in comes next in the same run,
# so the role says so rather than naming make login TYPE=claude.
claude_code_sign_in_follows: false
