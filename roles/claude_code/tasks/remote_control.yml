---
# Remote Control puts this VM's Claude Code session in the session list at
# claude.ai/code and in the Claude mobile app, while the session itself keeps
# running here, with this filesystem and these tools.
#
# It is the one part of this role that cannot be fully automated. Anthropic
# supports exactly one credential for it - an interactive claude.ai login on a
# Pro, Max, Team or Enterprise plan. API keys are not supported, and neither is
# the long-lived token from `claude setup-token`, which can make model requests
# but explicitly cannot establish a Remote Control session. So this file
# prepares everything around the login, starts the service when the login is
# already there, and otherwise says exactly what to run.
#
# main.yml has already established that no API key is configured, and
# settings.yml has removed any key an earlier run wrote: a key outranks the
# login, so the two paths are mutually exclusive.

# Read from the settings.json settings.yml just wrote, because that is what
# Claude Code reads at startup - not claude_code_settings, which misses a
# blocker left on the VM by an earlier run. no_log: the file can hold a token.
# vars/main.yml turns it into claude_code_remote_control_settings_blockers,
# which is part of eligibility: a setting that disables Remote Control (a
# telemetry opt-out, apiKeyHelper, a foreign ANTHROPIC_BASE_URL) leaves the
# service stopped and is named below, like a credential it cannot use. It is
# not a failure - a privacy setting is a legitimate choice, and failing the
# host here kept github_projects from running.
#
# Every file under the user's home is read and written as that user, never as
# root: the user controls the paths, and root following a symlink there would
# read, or overwrite, a file the user cannot.
- name: remote_control | Read the settings Claude Code will start with
  ansible.builtin.slurp:
    src: "{{ claude_code_home }}/.claude/settings.json"
  become: true
  become_user: "{{ claude_code_user }}"
  register: claude_code_remote_control_settings_raw
  failed_when: false
  no_log: true

# As the user under the home, like the files above; a directory set
# elsewhere (claude_code_remote_control_dir) may need root to create.
- name: remote_control | Ensure the session's working directory exists
  ansible.builtin.file:
    path: "{{ claude_code_remote_control_target_dir }}"
    state: directory
    owner: "{{ claude_code_user }}"
    group: "{{ claude_code_user }}"
    mode: "0755"
  become: true
  become_user: >-
    {{ claude_code_user if claude_code_remote_control_target_dir.startswith(claude_code_home ~ '/') else 'root' }}

# Resolved rather than assumed: the native installer puts the binary in
# ~/.local/bin, npm puts it on the global prefix, and the unit file needs an
# absolute path either way because systemd does not read a login shell.
- name: remote_control | Resolve the claude binary
  ansible.builtin.command:
    argv: [bash, -lc, "command -v claude"]
  become: true
  become_user: "{{ claude_code_user }}"
  register: claude_code_remote_control_which
  changed_when: false
  check_mode: false
  # command -v exits 1 when claude is not found. Without this the task fails
  # with a bare exit code, and the friendly assert below never runs.
  failed_when: false

- name: remote_control | Record the binary path
  ansible.builtin.set_fact:
    claude_code_remote_control_bin: "{{ claude_code_remote_control_which.stdout | trim }}"

- name: remote_control | Fail when claude is not on the user's PATH
  ansible.builtin.assert:
    that: claude_code_remote_control_bin | length > 0
    fail_msg: >-
      `claude` is not on {{ claude_code_user }}'s PATH, so no systemd unit can
      start it. The common role installs /etc/profile.d/local-bin-path.sh for
      exactly this; check that it ran.
    quiet: true

# The server stops for three prompts nothing can answer under systemd: the
# first-run onboarding, a trust dialog on an unseen directory, and Remote
# Control's own one-time "Enable Remote Control? (y/n)". That last one reads
# stdin, which systemd points at /dev/null, and anything but "y" exits 0 - so
# the unit would start, print the question to the journal and quietly stop.
# All three answers live in ~/.claude.json. Enabling claude_remote_control is
# the user's answer to the confirmation; seeding it records that.
- name: remote_control | Read the Claude Code config
  ansible.builtin.slurp:
    src: "{{ claude_code_home }}/.claude.json"
  become: true
  become_user: "{{ claude_code_user }}"
  register: claude_code_remote_control_cfg_raw
  failed_when: false
  no_log: true

- name: remote_control | Record the current config
  ansible.builtin.set_fact:
    claude_code_remote_control_cfg: >-
      {{ (claude_code_remote_control_cfg_raw.content | b64decode | from_json)
         if claude_code_remote_control_cfg_raw.content is defined else {} }}
  no_log: true

# Written only when one of the flags is actually missing. Claude Code owns
# this file and rewrites it constantly - start counters, cached flags, per
# project metadata - so a copy that reasserted the whole document every run
# would report changed forever and fight the application for it. Guarding on
# the keys also keeps the write to the first run, which is the only moment
# nothing else is holding the file.
- name: remote_control | Pre-accept onboarding, workspace trust and the Remote Control prompt
  vars:
    claude_code_remote_control_seed:
      hasCompletedOnboarding: true
      remoteDialogSeen: true
      projects: "{{ {claude_code_remote_control_target_dir: {'hasTrustDialogAccepted': true}} }}"
  ansible.builtin.copy:
    content: >-
      {{ claude_code_remote_control_cfg
         | combine(claude_code_remote_control_seed, recursive=True)
         | to_nice_json(indent=2) }}
    dest: "{{ claude_code_home }}/.claude.json"
    owner: "{{ claude_code_user }}"
    group: "{{ claude_code_user }}"
    mode: "0600"
  become: true
  become_user: "{{ claude_code_user }}"
  when: not (claude_code_remote_control_dialogs_seeded | bool)
  no_log: true

# Read before the unit is installed, so the "what do I run next" message below
# reflects the state the user is actually in. vars/main.yml reads the result,
# as it does for login.yml, which `make claude-login` runs.
- name: remote_control | Check whether this VM is logged in
  ansible.builtin.command:
    argv: ["{{ claude_code_remote_control_bin }}", auth, status]
  become: true
  become_user: "{{ claude_code_user }}"
  environment:
    HOME: "{{ claude_code_home }}"
  register: claude_code_remote_control_auth
  failed_when: false
  changed_when: false
  check_mode: false

- name: remote_control | Install the systemd unit
  ansible.builtin.template:
    src: claude-remote-control.service.j2
    dest: /etc/systemd/system/{{ claude_code_remote_control_service }}.service
    owner: root
    group: root
    mode: "0644"
  register: claude_code_remote_control_unit

# In a real run the unit is always there by now. In check mode on a VM that
# never had it, it is not: the template above writes nothing, and
# systemd_service fails on a unit that does not exist - check mode included,
# since ansible-core's missing-unit check does not look at it. So `make check`
# failed on every VM without Remote Control yet. There, the tasks that enable,
# start or stop the service are skipped, and the template reporting "changed"
# is what says the unit would be installed.
- name: remote_control | Look for the unit the service needs
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ claude_code_remote_control_service }}.service
  register: claude_code_remote_control_unit_file

# --spawn worktree makes each session a fresh git worktree, so the server
# needs a git repository at its working directory before the first session,
# or it exits within seconds. The directory this role created is not one,
# and github_projects (which could clone into it) runs after this role - so
# a repo has to be there already. Caught here with a clear message instead
# of the generic "session did not stay up" the start check would print.
#
# Before the start block rather than in it, and not gated on the unit file:
# in check mode on a VM that has no unit yet nothing below would run, and
# `make check` would pass a configuration whose real run fails here.
- name: remote_control | Require a git repository for worktree spawn
  when:
    - claude_code_remote_control_eligible | bool
    - claude_code_remote_control_spawn == 'worktree'
  block:
    - name: remote_control | Look for a git repository in the session directory
      ansible.builtin.stat:
        path: "{{ claude_code_remote_control_target_dir }}/.git"
      register: claude_code_remote_control_git

    - name: remote_control | Fail when worktree spawn has no git repository
      ansible.builtin.assert:
        that: claude_code_remote_control_git.stat.exists
        fail_msg: >-
          claude_code_remote_control_spawn is "worktree", which creates each
          session as a git worktree, but {{ claude_code_remote_control_target_dir }}
          on {{ inventory_hostname }} is not a git repository, so the server
          would exit at once. Put a repository there first (github_projects
          can clone one into it), or set claude_code_remote_control_spawn to
          same-dir or session.
        quiet: true

# Retired before the start, not after: when the server is refused at start-up
# (an organisation that disabled Remote Control, an ineligible plan), the
# stay-up check fails the host, and a path unit left behind would start a
# service the user then stops on the next token refresh or logout - PathChanged
# fires on any change to the file, removal and chmod included.
- name: remote_control | Look for the unit that starts Remote Control when a login lands
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ claude_code_remote_control_service }}.path
  register: claude_code_remote_control_bridge

- name: remote_control | Remove the unit that waited for the login
  ansible.builtin.include_tasks: path_unit_absent.yml
  when:
    - not (claude_code_remote_control_bridge_wanted | bool)
    - claude_code_remote_control_bridge.stat.exists

- name: remote_control | Start Remote Control
  when:
    - claude_code_remote_control_eligible | bool
    - claude_code_remote_control_unit_file.stat.exists
  block:
    # With no state requested, systemd_service only reads the unit.
    - name: remote_control | Read the service state
      ansible.builtin.systemd_service:
        name: "{{ claude_code_remote_control_service }}"
      register: claude_code_remote_control_before

    # Restarted unless this exact unit is already running. A changed unit only
    # takes effect on a restart. And a server that exited and is waiting out
    # its restart delay reports "activating", which `started` counts as
    # running - so after a fresh login it would sit there for minutes instead
    # of starting now.
    - name: remote_control | Enable and start the service
      ansible.builtin.systemd_service:
        name: "{{ claude_code_remote_control_service }}"
        enabled: true
        state: >-
          {{ 'started'
             if not claude_code_remote_control_unit.changed
                and (claude_code_remote_control_before.status.ActiveState | default('')) == 'active'
             else 'restarted' }}
        daemon_reload: true
      register: claude_code_remote_control_start

    # A credential it cannot use, an ineligible plan or an organisation that
    # has not enabled Remote Control all make the server exit within seconds -
    # and should fail here, not an hour later when someone reaches for their
    # phone. One "active" reading proves nothing: Type=simple is active the
    # moment the process forks, before the server has tried anything. So the
    # process is recorded right after the start and read again once it has had
    # time to fail. An exit shows up as a state other than active/running
    # (systemd waiting to restart it) or, if it was already restarted, as a new
    # PID and a higher NRestarts. What systemd cannot see is the server
    # registering with claude.ai, which is why this waits rather than polls.
    #
    # Only after a start or restart. `started` on a server that was already
    # running changes nothing, and that server has had far longer than this
    # wait to fail - so a fleet that is already live used to pay it per batch
    # of forks on every configure run for a check that could not find
    # anything. Skipped in check mode too, where nothing was started. A sign-in
    # needs no clause of its own: the service waited disabled for the login,
    # so enabling it for boot reports a change even when the path unit has
    # started it moments ago.
    - name: remote_control | Confirm the session stayed up
      when:
        - not ansible_check_mode
        - claude_code_remote_control_start is changed
      block:
        - name: remote_control | Record the server process just started
          ansible.builtin.systemd_service:
            name: "{{ claude_code_remote_control_service }}"
          register: claude_code_remote_control_started

        - name: remote_control | Give the server time to fail
          ansible.builtin.wait_for:
            timeout: "{{ claude_code_remote_control_stay_up_seconds }}"

        - name: remote_control | Read the server process again
          ansible.builtin.systemd_service:
            name: "{{ claude_code_remote_control_service }}"
          register: claude_code_remote_control_after

        - name: remote_control | Fail when the session did not stay up
          ansible.builtin.assert:
            that: claude_code_remote_control_stayed_up | bool
            fail_msg: >-
              {{ claude_code_remote_control_service }} did not stay running on
              {{ inventory_hostname }}: {{ claude_code_remote_control_stay_up_seconds }} seconds after starting it is
              {{ claude_code_remote_control_after.status.ActiveState | default('unknown') }}/{{
                 claude_code_remote_control_after.status.SubState | default('unknown') }},
              with main PID {{ claude_code_remote_control_after.status.ExecMainPID | default('?') }}
              (was {{ claude_code_remote_control_started.status.ExecMainPID | default('?') }}) and
              {{ claude_code_remote_control_after.status.NRestarts | default('?') }} restarts
              (was {{ claude_code_remote_control_started.status.NRestarts | default('?') }}).
              Read the reason with
              "ssh {{ claude_code_user }}@{{ ansible_host | default(inventory_hostname) }}
              sudo journalctl -u {{ claude_code_remote_control_service }} -n 40".
            quiet: true

    # Outside the block above: a server this run found running and left alone
    # is live too. Not in check mode, where nothing was started.
    - name: remote_control | Report where to reach the session
      when: not ansible_check_mode
      ansible.builtin.debug:
        msg: >-
          Remote Control is live for {{ inventory_hostname }} as
          "{{ claude_code_remote_control_name }}"
          ({{ claude_code_remote_control_status.subscriptionType | default('unknown') }} plan).
          Open claude.ai/code or the Claude mobile app, signed in as the same
          account, and it appears in the session list.

    # Nothing left to do for Remote Control (NEXT STEPS).
    - name: remote_control | Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          claude_code_next: >-
            {{ {inventory_hostname: {'remote_control': ''}} }}
        aggregate: true
        per_host: false
      when: not ansible_check_mode

# The path unit that starts the service the moment a login lands, however it
# is made (templates/claude-remote-control.path.j2): there only while the login
# is the one thing missing, and gone once the service runs, which this role
# then enables for boot. Kept until then, it would also restart a service the
# user stopped whenever a token refresh rewrote the file.
- name: remote_control | Install the unit that starts Remote Control when a login lands
  ansible.builtin.template:
    src: claude-remote-control.path.j2
    dest: /etc/systemd/system/{{ claude_code_remote_control_service }}.path
    owner: root
    group: root
    mode: "0644"
  register: claude_code_remote_control_bridge_unit
  when: claude_code_remote_control_bridge_wanted | bool

- name: remote_control | Look again for the unit that starts Remote Control when a login lands
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ claude_code_remote_control_service }}.path
  register: claude_code_remote_control_bridge_now
  when: claude_code_remote_control_bridge_wanted | bool

# Not in check mode on a VM that never had it: systemd_service fails on a unit
# that does not exist, check mode included. systemd rereads its units only when
# this one changed: a VM waiting for its login otherwise paid a reload on every
# configure.
- name: remote_control | Watch for the login
  ansible.builtin.systemd_service:
    name: "{{ claude_code_remote_control_service }}.path"
    enabled: true
    state: started
    daemon_reload: "{{ claude_code_remote_control_bridge_unit is changed }}"
  when:
    - claude_code_remote_control_bridge_wanted | bool
    - claude_code_remote_control_bridge_now.stat.exists

# Not eligible covers a missing or unusable login and a settings.json that
# disables the feature. Each ends the same way: the unit is installed, the
# service is stopped, and the message says what is in the way.
- name: remote_control | Explain the one step that cannot be automated
  when: not (claude_code_remote_control_eligible | bool)
  block:
    - name: remote_control | Leave the service stopped until the login exists
      ansible.builtin.systemd_service:
        name: "{{ claude_code_remote_control_service }}"
        enabled: false
        state: stopped
        daemon_reload: true
      when: claude_code_remote_control_unit_file.stat.exists

    # `make claude-login` decides from the same vars, so what it says next
    # agrees with this. A settings blocker on a VM that is signed in needs no
    # login step, so none is suggested for it; with one, a sign-in does not
    # start the service either. Inside make deploy the sign-in comes next in
    # the same run (claude_code_sign_in_follows). Built in vars, one line.
    - name: remote_control | Say exactly what to run
      vars:
        claude_code_remote_control_next: >-
          {{ ('make deploy signs it in next, in this run.'
              if claude_code_sign_in_follows | bool
              else 'Sign in once: "' ~ claude_code_login_command ~ '" opens the sign-in page'
                   ~ ' on your machine and asks for the code the page shows'
                   ~ (', and starts it.' if claude_code_remote_control_settings_blockers | length == 0 else '.'))
             ~ (' A sign-in made any other way, such as in the Claude terminal of make code, starts it'
                ~ ' by itself too; "make configure VM_NAME=' ~ inventory_hostname ~ '" then confirms it.'
                if claude_code_remote_control_bridge_wanted | bool else '')
             if not (claude_code_remote_control_status.loggedIn | default(false)) | bool
             else ''
             if claude_code_remote_control_settings_blockers | length > 0
             else '"' ~ claude_code_login_command ~ '" checks again and signs it in if a login'
                  ~ ' is still needed; then re-run "make configure VM_NAME=' ~ inventory_hostname ~ '" and the service'
                  ~ ' starts.' }}
      ansible.builtin.debug:
        msg: >-
          Remote Control is configured on {{ inventory_hostname }} but not started:
          {{ claude_code_remote_control_blocker }} {{ claude_code_remote_control_next }}
      register: claude_code_remote_control_reported

    # NEXT STEPS: the line above only while Claude is signed in. Signed out,
    # the sign-in is the one thing to do, and login.yml's line says it.
    - name: remote_control | Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          claude_code_next: >-
            {{ {inventory_hostname: {'remote_control': claude_code_remote_control_reported.msg
                 if (claude_code_remote_control_status.loggedIn | default(false)) | bool else ''}} }}
        aggregate: true
        per_host: false
