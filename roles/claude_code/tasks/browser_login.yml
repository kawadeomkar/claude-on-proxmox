---
# Claude Code's browser sign-in, driven by Ansible the way github_projects'
# device_flow.yml drives gh: `claude auth login` runs on the VM in the
# background with no terminal. It prints a sign-in page whose code you would
# paste back, and hands its browser another page, which redirects back to its
# own callback on the VM's 127.0.0.1 - the way it signs in where a browser runs
# beside it. Both are the same attempt. The VM has no browser, so a stand-in
# records that page; claude's callback port is forwarded from this machine
# over SSH (claude_code_login_redirect) and the page opens here, so once you
# authorise, the browser comes back to claude by itself and the run waits for
# that, with nothing to paste. Where the browser could not come back - no
# browser on this machine to open the page, make itself run over SSH (a page
# opened on another machine redirects to that machine's localhost), a port
# taken here - the printed page opens instead, the code it shows is pasted at a
# prompt in the terminal running make, and it reaches claude through a named
# pipe. Authorising is the person's part, and the only part.
#
# What it rests on, probed against Claude Code 2.1.296 (docs/architecture/roles.md §5.5):
# - With no terminal, claude prints the page as a plain URL and reads the code
#   as one line from stdin, "<code>#<state>". A pipe is enough.
# - Given BROWSER, it runs it with the page that redirects to
#   http://localhost:<port>/callback, listens on 127.0.0.1:<port>, and takes a
#   code from there or from stdin, whichever comes first: the two pages share
#   their state and challenge. A code through the callback ends it as a pasted
#   one does: exit 0 signed in, exit 1 refused.
# - A wrong code makes it print "Login failed: ..." and exit 1; a right one, write
#   ~/.claude/.credentials.json, print "Login successful." and exit 0. A line
#   without its "#" makes it print "Invalid code. ..." and wait for another, so
#   nothing but the code is ever written to it.
# - The pipe is opened read-write on claude's own stdin before it starts, so it
#   never sees the end of its input while it waits; the price is that it never
#   stops by itself either, so an attempt nobody completes is ended by its pid,
#   recorded for that. `$$` is claude's pid only because nothing runs in a
#   subshell: the shell exec's into it.
# One VM at a time: one terminal answers the prompt, and the playbooks run their
# sign-in play serially.
- name: browser_login | Refuse to prompt for more than one VM at a time
  ansible.builtin.assert:
    that: ansible_play_batch | length == 1
    fail_msg: >-
      The Claude sign-in asks for one code at a time, and this batch has
      {{ ansible_play_batch | length }} VMs: {{ ansible_play_batch | join(', ') }}. Run the play
      with serial: 1, as playbooks/claude_login.yml does.
    quiet: true

- name: browser_login | Find claude
  ansible.builtin.command:
    argv: [bash, -lc, command -v claude]
  become: true
  become_user: "{{ claude_code_user }}"
  register: claude_code_login_which
  changed_when: false
  failed_when: false

- name: browser_login | Fail when claude is not on the user's PATH
  ansible.builtin.assert:
    that: claude_code_login_which.stdout | trim | length > 0
    fail_msg: >-
      `claude` is not on {{ claude_code_user }}'s PATH on {{ inventory_hostname }}, so there is
      nothing to sign in yet: make deploy VM_NAME={{ inventory_hostname }} TYPE=configure installs it.
    quiet: true

- name: browser_login | Make the directory for the sign-in's files
  ansible.builtin.file:
    path: "{{ claude_code_login_dir }}"
    state: directory
    mode: "0700"
  become: true
  become_user: "{{ claude_code_user }}"

# A sign-in of this VM still waiting - a run left at its prompt, or a second
# make login TYPE=claude started meanwhile - owns the pipe and the pidfile below;
# taking them over would hand one run's code to the other's claude and end the
# other's process. Told by the recorded pid's command line, so a pid reused by
# something else since is no reason to refuse; with no ps to ask, nothing is.
- name: browser_login | Look for a sign-in of this VM still waiting
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'pid=$(cat "$1" 2>/dev/null) && ps -o args= -p "$pid" 2>/dev/null | grep -q "auth login" && echo "$pid"; exit 0'
      - sh
      - "{{ claude_code_login_pidfile }}"
  become: true
  become_user: "{{ claude_code_user }}"
  register: claude_code_login_other
  changed_when: false

- name: browser_login | Refuse to start over a sign-in still waiting
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: another sign-in of this VM is still waiting for its code (claude, pid
      {{ claude_code_login_other.stdout | trim }}), from a run still at its prompt. Finish or stop that run, then
      run {{ claude_code_login_command }} again.
  when: claude_code_login_other.stdout | trim | length > 0

# Unlinked, never truncated, as in device_flow.yml: an attempt a failed run
# left behind would otherwise share the output file with this one.
- name: browser_login | Remove the files of an earlier attempt
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ claude_code_login_output }}"
    - "{{ claude_code_login_pipe }}"
    - "{{ claude_code_login_pidfile }}"
    - "{{ claude_code_login_page_file }}"
    - "{{ claude_code_login_forward_pidfile }}"
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: false

# The browser claude opens its page with, on a VM that has none: it only
# records the page, which opens on this machine instead. Fixed text: the page
# reaches it as an argument, never as part of a command.
- name: browser_login | Give claude a browser that hands its page over
  ansible.builtin.copy:
    dest: "{{ claude_code_login_browser }}"
    mode: "0700"
    content: |
      #!/bin/sh
      # The browser claude opens its sign-in page with on this VM: it records
      # the page, which make login TYPE=claude opens on your machine instead.
      printf '%s\n' "$*" > {{ claude_code_login_page_file | quote }}
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: false

- name: browser_login | Make the pipe claude reads the code from
  ansible.builtin.command:
    argv: [mkfifo, -m, "0600", "{{ claude_code_login_pipe }}"]
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: false

# A shell for the redirections, and async because claude waits for the code.
# Generous: the person may read the page for a while before pasting, and an
# attempt still running past this is ended by Ansible's async timeout.
- name: browser_login | Start the sign-in in the background
  ansible.builtin.shell:
    cmd: >-
      umask 077 && exec 0<>{{ claude_code_login_pipe | quote }}
      && echo $$ >{{ claude_code_login_pidfile | quote }}
      && export BROWSER={{ claude_code_login_browser | quote }}
      && exec {{ ([claude_code_login_which.stdout | trim, 'auth', 'login'] + claude_code_login_args) | map('quote') | join(' ') }}
      >{{ claude_code_login_output | quote }} 2>&1
  become: true
  become_user: "{{ claude_code_user }}"
  async: "{{ claude_code_login_timeout | int + claude_code_login_attempt_seconds | int }}"
  poll: 0
  register: claude_code_login_job
  changed_when: false

- name: browser_login | Sign in, then clean up whatever happened
  block:
    - name: browser_login | Wait for claude to show the sign-in page
      ansible.builtin.wait_for:
        path: "{{ claude_code_login_output }}"
        search_regex: "https://|rror"
        timeout: "{{ claude_code_login_start_seconds }}"
      become: true
      become_user: "{{ claude_code_user }}"
      failed_when: false

    - name: browser_login | Read what claude printed
      ansible.builtin.slurp:
        src: "{{ claude_code_login_output }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_out
      failed_when: false

    # What claude printed, on one line and ending its sentence once: it can
    # print several lines before an error, and an error ends with its own stop.
    - name: browser_login | Fail when claude did not start the sign-in
      vars:
        claude_code_login_start_why: >-
          {{ claude_code_login_said | regex_replace('\s+', ' ') | trim
             or 'no output in ' ~ claude_code_login_start_seconds ~ ' seconds' }}
      ansible.builtin.fail:
        msg: >-
          claude on {{ inventory_hostname }} did not start the sign-in:
          {{ claude_code_login_start_why ~ ('' if claude_code_login_start_why is search('[.!?]$') else '.') }}
          Run {{ claude_code_login_command }} again.
      when: claude_code_login_url | length == 0

    # The page claude handed its browser: recorded by the stand-in before
    # claude printed its own, or within moments of it.
    - name: browser_login | Wait for the page claude handed its browser
      ansible.builtin.wait_for:
        path: "{{ claude_code_login_page_file }}"
        timeout: 5
      become: true
      become_user: "{{ claude_code_user }}"
      failed_when: false
      when: claude_code_login_redirect | bool

    - name: browser_login | Read the page claude handed its browser
      ansible.builtin.slurp:
        src: "{{ claude_code_login_page_file }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_page_read
      failed_when: false
      when: claude_code_login_redirect | bool

    # Before the forward: the browser comes back by itself only where a
    # browser on this machine opens the page (claude_code_login_redirect_ready).
    # Best effort, as in device_flow.yml, and never in a test
    # (claude_code_login_desktop).
    - name: browser_login | Look for a browser opener on this machine
      ansible.builtin.command:
        argv: [which, open, xdg-open]
      delegate_to: localhost
      become: false
      register: claude_code_login_tools
      changed_when: false
      failed_when: false
      when: claude_code_login_desktop | bool

    # claude's callback listens on the VM's own 127.0.0.1, and the page sends
    # your browser to localhost: that one port is forwarded from this machine
    # for the length of the sign-in, by ssh on a connection of its own, bound
    # to this machine's loopback. ExitOnForwardFailure fails it when the port
    # is taken here, and the code is then pasted instead; -f returns once it is
    # up. Its far end is a sleep whose pid the VM records, so the forward ends
    # with the sign-in, or by itself a minute after the wait.
    - name: browser_login | Forward the sign-in's callback from this machine to the VM
      ansible.builtin.command:
        argv: "{{ claude_code_login_forward_argv }}"
      delegate_to: localhost
      become: false
      register: claude_code_login_forward
      changed_when: false
      failed_when: false
      when: claude_code_login_redirect_ready | bool

    # One line of Jinja per line of text: a more-indented line in a folded
    # scalar keeps its line break. The page is what the VM's claude printed or
    # handed its browser, so the VM chooses it: it opens here only when it is
    # Claude's own sign-in page, and is said otherwise with a warning.
    - name: browser_login | Say the page and what happens next
      vars:
        claude_code_login_shown: "{{ claude_code_login_auto_url if claude_code_login_redirecting | bool else claude_code_login_url }}"
        claude_code_login_opens: >-
          {{ ('(the page opens in your browser, if this machine allows it). ' if claude_code_login_desktop | bool else '')
             if claude_code_login_redirecting | bool or claude_code_login_page_trusted | bool
             else "- not Claude's sign-in page, so it is not opened here: check where it leads before you follow it. " }}
        claude_code_login_next: >-
          {{ ('Authorise there, and this run carries on by itself once your browser comes back, waiting up to '
              ~ ((claude_code_login_approval_timeout | int // 60) ~ ' minutes'
                 if claude_code_login_approval_timeout | int >= 120 else claude_code_login_approval_timeout ~ ' seconds')
              ~ '; Ctrl-C ends the whole run.')
             if claude_code_login_redirecting | bool
             else 'Authorise there, then paste the code the page shows at the prompt below. Enter alone skips this VM.' }}
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: sign Claude Code in at {{ claude_code_login_shown | plain_text }}
          {{ claude_code_login_opens }}{{ claude_code_login_next }}
      # Drawn as a block by the stdout callback (callback_plugins/claude_on_proxmox.py).
      tags: [attention_browser]

    # Best effort, and never in a test (claude_code_login_desktop). The opener
    # is the page_opener filter's (filter_plugins/desktop.py), shared with
    # device_flow.yml: the first command BROWSER names, split as a shell would,
    # else open, else xdg-open.
    - name: browser_login | Open the sign-in page in your browser
      vars:
        claude_code_login_opener: >-
          {{ (claude_code_login_auto_url if claude_code_login_redirecting | bool else claude_code_login_url)
             | page_opener(lookup('ansible.builtin.env', 'BROWSER'), claude_code_login_tools.stdout_lines | default([])) }}
      ansible.builtin.command:
        argv: "{{ claude_code_login_opener }}"
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      when:
        - claude_code_login_desktop | bool
        - claude_code_login_redirecting | bool or claude_code_login_page_trusted | bool
        - claude_code_login_opener | length > 0

    # The one place the run waits for the person. pause reads this terminal
    # through the main ansible-playbook process; with no terminal it returns at
    # once with nothing, which is the skip. no_log keeps the code out of the
    # run log; the prompt itself is still shown, under a block that sets it
    # apart from the task output around it, and still ends in "Code:".
    - name: "browser_login | Paste the code the browser shows for {{ inventory_hostname }}"
      ansible.builtin.pause:
        prompt: >-
          {{ 'Paste the code the sign-in page shows, then press Enter. Enter alone skips this VM.'
             | banner('USER INPUT REQUIRED', host=inventory_hostname, topic='Claude Code sign-in') ~ 'Code' }}
      register: claude_code_login_prompt
      no_log: true
      when:
        - claude_code_login_code | length == 0
        - not (claude_code_login_redirecting | bool)

    # No prompt here: the person's part is in the browser, and claude ends the
    # attempt itself once the callback brings the code - status 0 signed in,
    # 1 refused. Every few seconds, so a minute's wait is not sixty round
    # trips to the VM.
    - name: browser_login | Wait for your browser to come back
      ansible.builtin.async_status:
        jid: "{{ claude_code_login_job.ansible_job_id }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_landed
      until: claude_code_login_landed.finished | default(0) | int == 1
      retries: "{{ ((claude_code_login_approval_timeout | int) / 3) | round(0, 'ceil') | int }}"
      delay: 3
      failed_when: false
      when: claude_code_login_redirecting | bool
      # One waiting line from the stdout callback, not a line per retry.
      tags: [attention_browser]

    # For make deploy's GitHub and Tailscale steps, VM by VM: a code entered,
    # or the browser come back, says someone is here for this VM; Enter, a
    # browser that never came back, or no terminal to ask at, skips it there
    # too. A VM that never needs this sign-in (signed in already, or on an API
    # key) has neither fact.
    - name: browser_login | Remember whether someone answered for this VM
      ansible.builtin.set_fact:
        claude_code_login_answered: "{{ claude_code_login_responded | bool }}"
        claude_code_login_skipped: "{{ not (claude_code_login_responded | bool) }}"

    - name: browser_login | Say that no code was entered
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: no code was entered (Enter, or no terminal to ask at), so Claude Code is left
          signed out there.
          {{ claude_code_login_command }} signs it in later.
      register: claude_code_login_no_code_reported
      when:
        - not (claude_code_login_redirecting | bool)
        - claude_code_login_entered | length == 0

    - name: browser_login | Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          claude_code_next: >-
            {{ {inventory_hostname: {'claude': claude_code_login_no_code_reported.msg}} }}
        aggregate: true
        per_host: false
      when:
        - not (claude_code_login_redirecting | bool)
        - claude_code_login_entered | length == 0

    - name: browser_login | Say that the browser did not come back
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: the browser did not come back within {{ claude_code_login_approval_timeout }} seconds,
          so Claude Code is left signed out there. {{ claude_code_login_command }} signs it in later.
      register: claude_code_login_no_return_reported
      when:
        - claude_code_login_redirecting | bool
        - not (claude_code_login_responded | bool)

    - name: browser_login | Keep what is left to do for the end of the run
      ansible.builtin.set_stats:
        data:
          claude_code_next: >-
            {{ {inventory_hostname: {'claude': claude_code_login_no_return_reported.msg}} }}
        aggregate: true
        per_host: false
      when:
        - claude_code_login_redirecting | bool
        - not (claude_code_login_responded | bool)

    # An attempt lasts claude_code_login_attempt_seconds on top of the wait
    # below; past it Ansible's async limit has ended claude, and a code handed
    # over then would go into a pipe nobody reads. Said at once instead.
    - name: browser_login | Check that the sign-in is still waiting
      ansible.builtin.async_status:
        jid: "{{ claude_code_login_job.ansible_job_id }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_still
      failed_when: false
      when: claude_code_login_entered | length > 0

    - name: browser_login | Fail when the sign-in ended before the code came
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: the sign-in had ended before the code was pasted
          ({{ 'its page expired: an attempt lasts ' ~ ((claude_code_login_timeout | int
              + claude_code_login_attempt_seconds | int) / 60) | int ~ ' minutes'
              if claude_code_login_still.msg | default('') is search('Timeout exceeded')
              else 'claude had exited' }}). Run {{ claude_code_login_command }} again for a fresh sign-in page.
      when:
        - claude_code_login_entered | length > 0
        - claude_code_login_still.finished | default(0) | int == 1

    # Opened read-write, which never blocks: written to a pipe nobody reads any
    # more, the line is dropped, where opening it write-only would wait forever.
    # The code travels on stdin, never on a command line. Only into the pipe:
    # if another run has replaced it, `<>` would create a plain file and write
    # the code into that.
    - name: browser_login | Hand the code to claude
      ansible.builtin.command:
        argv: [sh, -c, '[ -p "$1" ] && exec 3<>"$1" && cat >&3', sh, "{{ claude_code_login_pipe }}"]
        stdin: "{{ claude_code_login_entered }}"
        stdin_add_newline: true
      become: true
      become_user: "{{ claude_code_user }}"
      changed_when: false
      no_log: true
      when: claude_code_login_entered | length > 0

    # Any answer, not three: claude writes it straight after its prompt, which
    # has no newline, so this matches success, failure, "Invalid code", a
    # policy refusal or an account on hold alike. Its status decides below.
    - name: browser_login | Wait for claude's answer
      ansible.builtin.wait_for:
        path: "{{ claude_code_login_output }}"
        search_regex: 'prompted > \s*\S'
        timeout: "{{ claude_code_login_timeout | int }}"
      become: true
      become_user: "{{ claude_code_user }}"
      failed_when: false
      when: claude_code_login_entered | length > 0

    - name: browser_login | Read claude's answer
      ansible.builtin.slurp:
        src: "{{ claude_code_login_output }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_out
      failed_when: false
      when: claude_code_login_entered | length > 0

    # A code copied only in part - a double-click selects up to the "#" - is
    # "Invalid code", and claude goes on waiting on the same page: asked once
    # more, rather than the attempt thrown away with its page.
    - name: "browser_login | Paste the whole code the browser shows, what follows # included, for {{ inventory_hostname }}"
      ansible.builtin.pause:
        prompt: >-
          {{ 'That was part of the code only: paste all of it, what follows # included.'
             | banner('USER INPUT REQUIRED', host=inventory_hostname, topic='Claude Code sign-in') ~ 'Code' }}
      register: claude_code_login_prompt_again
      no_log: true
      when:
        - claude_code_login_code | length == 0
        - claude_code_login_answer is search('Invalid code')

    - name: browser_login | Hand the whole code to claude
      ansible.builtin.command:
        argv: [sh, -c, '[ -p "$1" ] && exec 3<>"$1" && cat >&3', sh, "{{ claude_code_login_pipe }}"]
        stdin: "{{ claude_code_login_entered_again }}"
        stdin_add_newline: true
      become: true
      become_user: "{{ claude_code_user }}"
      changed_when: false
      no_log: true
      when:
        - claude_code_login_answer is search('Invalid code')
        - claude_code_login_entered_again | length > 0

    # claude prints the second answer on the line after the first, so the end
    # of the attempt is what is waited for here: claude exits on any answer
    # but another "Invalid code", which the always section then ends.
    - name: browser_login | Wait for claude to finish with the whole code
      ansible.builtin.async_status:
        jid: "{{ claude_code_login_job.ansible_job_id }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_second
      until: claude_code_login_second.finished | default(0) | int == 1
      retries: "{{ claude_code_login_timeout | int }}"
      delay: 1
      failed_when: false
      when:
        - claude_code_login_answer is search('Invalid code')
        - claude_code_login_entered_again | length > 0

  # Whatever happened above - an answer, no answer, or a failure - claude is
  # ended if it still waits, its job is collected, and its files go.
  always:
    - name: browser_login | Give claude a moment to finish
      ansible.builtin.async_status:
        jid: "{{ claude_code_login_job.ansible_job_id }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_finished
      until: claude_code_login_finished.finished | default(0) | int == 1
      retries: 3
      delay: 1
      failed_when: false
      when: claude_code_login_entered | length > 0

    # Only while the job still runs is the recorded pid claude's own: one the
    # browser's answer ended already is never killed.
    - name: browser_login | End the sign-in if claude still waits
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'pid=$(cat "$1") && kill "$pid" && sleep 1 && kill -9 "$pid"; exit 0'
          - sh
          - "{{ claude_code_login_pidfile }}"
      become: true
      become_user: "{{ claude_code_user }}"
      changed_when: false
      failed_when: false
      when:
        - claude_code_login_finished.finished | default(0) | int != 1
        - claude_code_login_landed.finished | default(0) | int != 1

    # The far end of the forward is the sleep whose pid the VM recorded; its
    # end closes the ssh on this machine. Only a sleep is ended: the pid may be
    # another process's by now. Without a pid yet, the forward ends by itself
    # a minute after the wait.
    - name: browser_login | Close the forward
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - 'pid=$(cat "$1" 2>/dev/null) && ps -o comm= -p "$pid" 2>/dev/null | grep -qx sleep && kill "$pid"; exit 0'
          - sh
          - "{{ claude_code_login_forward_pidfile }}"
      become: true
      become_user: "{{ claude_code_user }}"
      changed_when: false
      failed_when: false
      when: (claude_code_login_forward.rc | default(1)) == 0

    - name: browser_login | Collect claude's result
      ansible.builtin.async_status:
        jid: "{{ claude_code_login_job.ansible_job_id }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_result
      until: claude_code_login_result.finished | default(0) | int == 1
      retries: 10
      delay: 1
      failed_when: false

    # Only this mode removes the job file.
    - name: browser_login | Clean up claude's job
      ansible.builtin.async_status:
        jid: "{{ claude_code_login_job.ansible_job_id }}"
        mode: cleanup
      become: true
      become_user: "{{ claude_code_user }}"
      changed_when: false
      failed_when: false

    - name: browser_login | Read what claude printed, now it has finished
      ansible.builtin.slurp:
        src: "{{ claude_code_login_output }}"
      become: true
      become_user: "{{ claude_code_user }}"
      register: claude_code_login_out
      failed_when: false

    - name: browser_login | Remove the sign-in's files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ claude_code_login_output }}"
        - "{{ claude_code_login_pipe }}"
        - "{{ claude_code_login_pidfile }}"
        - "{{ claude_code_login_page_file }}"
        - "{{ claude_code_login_forward_pidfile }}"
        - "{{ claude_code_login_browser }}"
      become: true
      become_user: "{{ claude_code_user }}"
      changed_when: false

# What decides the outcome: claude's own status, read as everywhere else, not
# what it printed. Always, never under a condition: a skipped task would
# replace the status login.yml read with nothing.
- name: browser_login | Check the login again
  ansible.builtin.command:
    argv: [bash, -lc, claude auth status]
  become: true
  become_user: "{{ claude_code_user }}"
  register: claude_code_remote_control_auth
  changed_when: false
  failed_when: false

- name: browser_login | Fail when the sign-in did not complete
  vars:
    claude_code_login_why: "{{ claude_code_login_answer or 'claude gave no answer within ' ~ claude_code_login_timeout ~ ' seconds' }}"
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}: the Claude sign-in did not complete.
      {{ claude_code_login_why ~ ('' if claude_code_login_why is search('[.!?]$') else '.') }}
      Run {{ claude_code_login_command }} again for a fresh sign-in page.
  when:
    - claude_code_login_responded | bool
    - not (claude_code_remote_control_status.loggedIn | default(false)) | bool

- name: browser_login | Record that this run signed the VM in
  ansible.builtin.set_fact:
    claude_code_login_done: true
  when: claude_code_login_responded | bool
