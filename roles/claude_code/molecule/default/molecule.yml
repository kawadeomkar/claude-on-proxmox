---
# Shared settings live in .config/molecule/config.yml at the project root.
platforms:
  - name: claude-on-proxmox-claude_code
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:29e6f9d736c3401815d98f626a41c55a54a4ef1edb9d1d1223018746d3acba14}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  # Every playbook here waits 5 s, not the role's 20, for a Remote Control server it started to fail: the stand-in
  # server that fails exits 2 s after it starts (side_effect.yml, step 3). An extra var, since the wait is an internal
  # in the role's vars/main.yml, which outranks every inventory variable.
  options:
    extra-vars: '{"claude_code_remote_control_stay_up_seconds": 5}'
  env:
    # Resolve roles from this repository's roles/ directory (not Galaxy).
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
    # The sign-in quotes what claude printed through the repository's
    # plain_text filter and opens its page through page_opener.
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/../../filter_plugins
