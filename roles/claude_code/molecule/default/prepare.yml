---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create the target user
      ansible.builtin.user:
        name: dev
        shell: /bin/bash

    - name: Install prerequisites normally provided by the common role
      ansible.builtin.apt:
        name: [ca-certificates, curl, zstd]
        state: present
        update_cache: true

    # Also from the common role. Remote Control resolves `claude` through a
    # login shell, and the side effect sets Remote Control up.
    - name: Put ~/.local/bin on PATH for login shells, as the common role does
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../../common/templates/local-bin-path.sh.j2"
        dest: /etc/profile.d/local-bin-path.sh
        owner: root
        group: root
        mode: "0644"

    - name: Create ~/.claude
      ansible.builtin.file:
        path: /home/dev/.claude
        state: directory
        owner: dev
        group: dev
        mode: "0700"

    - name: Seed existing settings
      ansible.builtin.copy:
        dest: /home/dev/.claude/settings.json
        content: '{"theme": "dark", "env": {"KEEP_ME": "1"}}'
        owner: dev
        group: dev
        mode: "0600"
