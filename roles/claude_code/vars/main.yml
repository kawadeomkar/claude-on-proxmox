---
# Internal, not meant to be overridden.

# Environment keys in settings.json that each disable Remote Control. The first
# four switch off the feature-flag evaluation its availability depends on, so a
# session starts and then never appears in the app. The rest route the client
# to a different credential or provider than the claude.ai login it needs:
# ANTHROPIC_AUTH_TOKEN and CLAUDE_CODE_OAUTH_TOKEN (a `claude setup-token`
# token) both outrank the login, and the Bedrock and Vertex switches send
# requests elsewhere. ANTHROPIC_BASE_URL and apiKeyHelper also block, but are
# checked separately: a base URL only when its host is not api.anthropic.com,
# and apiKeyHelper as a top-level settings key rather than an env one.
claude_code_remote_control_blocking_env:
  - DISABLE_TELEMETRY
  - DO_NOT_TRACK
  - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
  - DISABLE_GROWTHBOOK
  - ANTHROPIC_AUTH_TOKEN
  - CLAUDE_CODE_OAUTH_TOKEN
  - CLAUDE_CODE_USE_BEDROCK
  - CLAUDE_CODE_USE_VERTEX

# Internal: what settings.yml read from ~/.claude/settings.json, as text, or
# '' when the file is not there. settings.yml searches it before deciding
# whether to parse it, so a file it has no business with is never parsed.
claude_code_settings_existing_text: >-
  {{ (claude_code_settings_existing.content | b64decode)
     if claude_code_settings_existing.content is defined else '' }}

# Internal: the settings.json Claude Code will actually start with, read back
# from disk after settings.yml has written it. The preflight checks this rather
# than the claude_code_settings variable, because settings.yml preserves keys
# already on the VM: a blocker the user has since dropped from the variable is
# still on disk, still blocks, and is what the server would see. Reads the
# register remote_control.yml and login.yml both set; {} when the file is not
# there yet.
claude_code_remote_control_settings_on_disk: >-
  {{ (claude_code_remote_control_settings_raw.content | b64decode | from_json)
     if claude_code_remote_control_settings_raw.content is defined
        and (claude_code_remote_control_settings_raw.content | b64decode | trim | length > 0)
     else {} }}

claude_code_remote_control_settings_env: >-
  {{ claude_code_remote_control_settings_on_disk.env | default({}, true) }}

# Internal: ANTHROPIC_BASE_URL is allowed only when it points at
# api.anthropic.com; any other host disables Remote Control. Absent is fine.
claude_code_remote_control_base_url_ok: >-
  {{ 'ANTHROPIC_BASE_URL' not in claude_code_remote_control_settings_env
     or (claude_code_remote_control_settings_env.ANTHROPIC_BASE_URL
         | urlsplit('hostname')) == 'api.anthropic.com' }}

# Internal: the names of the settings on disk that disable Remote Control -
# names only, never values, because this list ends up in a message. Empty when
# nothing does. A blocker here is handled like a credential Remote Control
# cannot use (below): the unit is installed and left stopped, and the message
# names the keys and the off switch. It used to fail the host, which stopped
# github_projects behind it for a telemetry opt-out the user set on purpose.
claude_code_remote_control_settings_blockers: >-
  {{ (claude_code_remote_control_settings_env.keys() | list
      | intersect(claude_code_remote_control_blocking_env))
     + (['apiKeyHelper'] if 'apiKeyHelper' in claude_code_remote_control_settings_on_disk else [])
     + (['ANTHROPIC_BASE_URL'] if not (claude_code_remote_control_base_url_ok | bool) else []) }}

# Internal: whether this run should have a Remote Control server on the VM at
# all. main.yml sets it up when this is true and removes it when it is false,
# so the two branches cannot drift apart. An API key rules it out because it
# outranks the claude.ai login Remote Control needs.
claude_code_remote_control_wanted: >-
  {{ claude_code_remote_control | bool
     and claude_code_anthropic_api_key | length == 0 }}

# Internal: the output of `claude auth status`, read from the result both
# remote_control.yml and login.yml register as claude_code_remote_control_auth.
# This and the two below are the one definition of whether a VM can run Remote
# Control. `make claude-login` used to decide from `loggedIn` alone, so a VM
# signed in any other way was told by it to run `make configure`, and by
# `make configure` to run it. A var rather than a fact for the same reason as
# roles/proxmox_vm/vars/main.yml: it follows the register it reads.
#
# Exit status 1 means not logged in, and anything else unreadable counts as the
# same, which is what points the user at the login.
claude_code_remote_control_status: >-
  {{ (claude_code_remote_control_auth.stdout | from_json)
     if claude_code_remote_control_auth.rc == 0
        and (claude_code_remote_control_auth.stdout | trim | length > 0)
     else {} }}

# Internal: whether this VM holds a credential Remote Control can actually use.
# Only a claude.ai login qualifies. An API key, a Console login and the
# long-lived token from `claude setup-token` can all make model requests, and
# none of them can establish a Remote Control session.
#
# `authMethod` alone cannot see a key: `claude auth status` reports
# "claude.ai" whenever that login exists, even while ANTHROPIC_API_KEY
# outranks it, and also for a Console login. The key in use is reported
# separately, as `apiKeySource` - ANTHROPIC_API_KEY (the environment or a
# settings file's env block), apiKeyHelper, or a Console login's
# "/login managed key". So both are checked.
#
# The plan itself is deliberately not checked here: Pro, Max, Team and
# Enterprise are all eligible, and hard-coding the strings `claude auth status`
# reports for them would turn a new plan name into a false refusal. An
# ineligible plan fails when the service starts, where the message comes from
# Claude Code rather than from a guess made here.
#
# The settings on disk are part of the same answer: a login the server cannot
# use because settings.json switches the feature off is no more eligible than
# an API key, and takes the same stopped-with-a-message path.
claude_code_remote_control_eligible: >-
  {{ (claude_code_remote_control_status.loggedIn | default(false)) | bool
     and (claude_code_remote_control_status.authMethod | default('')) == 'claude.ai'
     and (claude_code_remote_control_status.apiKeySource | default('', true)) | length == 0
     and claude_code_remote_control_settings_blockers | length == 0 }}

# Internal: why it is not eligible and, when a login is there but the wrong
# kind, what to change - phrased for the person reading the output. Each way of
# signing in that is not claude.ai needs its own fix, and `claude auth logout`
# alone does not undo one that comes from the environment.
#
# A settings blocker comes first, whatever the login state: it has to be dealt
# with regardless, and someone who set a telemetry opt-out on purpose should
# learn about the off switch before being sent to log in.
claude_code_remote_control_blocker: >-
  {{ '~/.claude/settings.json for ' ~ claude_code_user ~ ' on it disables Remote Control through '
     ~ (claude_code_remote_control_settings_blockers | join(', ')) ~ '. Each switches off the'
     ~ ' feature-flag evaluation Remote Control depends on, or routes the client away from the'
     ~ ' claude.ai login it needs. Remove it from claude_code_settings and from the file on the'
     ~ ' VM, or set claude_remote_control: false to leave Remote Control off.'
     if claude_code_remote_control_settings_blockers | length > 0
     else 'no Claude Code login is stored for ' ~ claude_code_user ~ ' on it.'
     if not (claude_code_remote_control_status.loggedIn | default(false)) | bool
     else 'Claude Code on it uses an API key from "'
          ~ claude_code_remote_control_status.apiKeySource
          ~ '", which outranks the claude.ai login Remote Control needs.'
          ~ ' Remove it wherever it is set (the shell environment, an env block'
          ~ ' in a settings file, apiKeyHelper), or run "claude auth logout" if'
          ~ ' it came from a Console login.'
     if (claude_code_remote_control_status.apiKeySource | default('', true)) | length > 0
     else 'it is signed in through "'
          ~ (claude_code_remote_control_status.authMethod | default('unknown'))
          ~ '", but Remote Control needs a claude.ai login on a Pro, Max, Team'
          ~ ' or Enterprise plan. Remove what selects that method wherever it is'
          ~ ' set - CLAUDE_CODE_OAUTH_TOKEN for a token from "claude setup-token",'
          ~ ' or a CLAUDE_CODE_USE_* setting that routes it to Bedrock, Vertex AI'
          ~ ' or another provider - or run "claude auth logout" for a stored login.' }}

# Internal: the command that logs claude_code_user in, printed for the user to
# run. Through a login shell, because only a login shell reads
# /etc/profile.d/local-bin-path.sh, which puts ~/.local/bin - where the native
# installer puts claude - on PATH. ssh runs a command in a non-login,
# non-interactive shell, and Ubuntu's .bashrc returns before doing anything for
# one, so a bare "claude auth login" is "command not found".
claude_code_remote_control_login_command: >-
  ssh -t {{ claude_code_user }}@{{ ansible_host | default(inventory_hostname) }} "bash -lc 'claude auth login'"

# Internal: whether the server started by this run is still the same, running
# process. Compares the state read right after the start with one read after
# the startup window. NRestarts is compared rather than required to be 0,
# because systemd keeps counting for as long as the unit is not fully stopped:
# a server that already restarted its way through an outage, and that this run
# found running and left alone, has a non-zero count and is perfectly healthy.
claude_code_remote_control_stayed_up: >-
  {{ (claude_code_remote_control_after.status.ActiveState | default('')) == 'active'
     and (claude_code_remote_control_after.status.SubState | default('')) == 'running'
     and (claude_code_remote_control_after.status.ExecMainPID | default('0')) != '0'
     and (claude_code_remote_control_after.status.ExecMainPID | default('0'))
         == (claude_code_remote_control_started.status.ExecMainPID | default(''))
     and (claude_code_remote_control_after.status.NRestarts | default(''))
         == (claude_code_remote_control_started.status.NRestarts | default('')) }}

# Internal: the directory Remote Control sessions actually open in, resolved
# from the (possibly empty) option once claude_code_home is known.
claude_code_remote_control_target_dir: >-
  {{ claude_code_remote_control_dir if claude_code_remote_control_dir | length > 0
     else claude_code_home ~ '/projects' }}

# Internal: whether the prompts that would stall a headless Remote Control
# server are already answered in ~/.claude.json - first-run onboarding, Remote
# Control's one-time confirmation, and workspace trust for the directory
# sessions open in.
claude_code_remote_control_dialogs_seeded: >-
  {{ (claude_code_remote_control_cfg.hasCompletedOnboarding | default(false)) | bool
     and (claude_code_remote_control_cfg.remoteDialogSeen | default(false)) | bool
     and ((claude_code_remote_control_cfg.projects | default({}, true))
          .get(claude_code_remote_control_target_dir, {})
          .get('hasTrustDialogAccepted', false)) | bool }}

# Internal: whether the path unit that starts the service when a login lands
# (templates/claude-remote-control.path.j2) belongs on the VM: only while the
# login is the one thing missing. A settings blocker would stop the server it
# started, and a login of any kind means the role decides from here on.
claude_code_remote_control_bridge_wanted: >-
  {{ not (claude_code_remote_control_status.loggedIn | default(false)) | bool
     and claude_code_remote_control_settings_blockers | length == 0 }}

# ------------------------------------------------- the browser sign-in -----
# Internal: where tasks/browser_login.yml keeps its files on the VM, beside the
# GitHub device flow's: claude's output, the named pipe its input comes
# through, and the pid that ends an attempt nobody completes. 0700, the user's.
claude_code_login_dir: "{{ claude_code_home }}/.config/claude-on-proxmox"
claude_code_login_output: "{{ claude_code_login_dir }}/claude-login.out"
claude_code_login_pipe: "{{ claude_code_login_dir }}/claude-login.in"
claude_code_login_pidfile: "{{ claude_code_login_dir }}/claude-login.pid"

# Internal: what claude printed, and the sign-in page in it. Without a terminal
# it prints the page as a plain URL; under one it wraps it in an OSC 8
# hyperlink, whose escape bytes are not part of it.
claude_code_login_text: >-
  {{ (claude_code_login_out.content | b64decode) if claude_code_login_out.content is defined else '' }}
claude_code_login_url: >-
  {{ claude_code_login_text | regex_search('https://[^\s\x07\x1b]+') or '' }}
# Internal: the same text without escape sequences or control characters
# (the plain_text filter, filter_plugins/text.py), for every message that
# quotes it: the VM's user controls what claude prints, and an escape sequence
# in a failure would reach this terminal and the run log raw (2.21 prints a
# failure's [ERROR] line unescaped). The URL above is read from the raw text,
# where an OSC 8 link's bytes still separate it.
claude_code_login_said: "{{ claude_code_login_text | plain_text }}"
# Internal: claude's answer to the code - what it printed after its prompt,
# "Login successful.", "Login failed: ..." or "Invalid code. ..." - for the
# message when the sign-in did not complete.
claude_code_login_answer: >-
  {{ ((claude_code_login_said | regex_replace('(?s)^.*prompted >', '') | trim).splitlines() or [''])[-1] }}
# Internal: how long one attempt may last, on top of claude_code_login_timeout:
# the person reads the page and pastes in between, and past it Ansible's async
# limit has ended claude, so a code pasted later is said to be too late. And
# how long claude may take to show the page.
claude_code_login_attempt_seconds: 1800
claude_code_login_start_seconds: 30

# Internal: the code to hand claude - the one given instead of the prompt, or
# what was pasted at it. Empty means nobody answered: Enter alone, or a run
# with no terminal, whose prompt returns at once with nothing.
claude_code_login_entered: >-
  {{ claude_code_login_code if claude_code_login_code | length > 0
     else ((claude_code_login_prompt | default({})).user_input | default('', true) | trim) }}
# Internal: the code pasted when asked again, after an "Invalid code".
claude_code_login_entered_again: >-
  {{ (claude_code_login_prompt_again | default({})).user_input | default('', true) | trim }}

claude_code_login_command: make claude-login VM_NAME={{ inventory_hostname }}

# --- the browser coming back by itself (claude_code_login_redirect) ---
# Internal: the browser claude gets on the VM (BROWSER), which only records the
# page claude would open - the one that redirects back to claude's own callback
# on the VM - and the file it records it in; and the pid of the far end of the
# forward to that callback, which ends it.
claude_code_login_browser: "{{ claude_code_login_dir }}/claude-login.browser"
claude_code_login_page_file: "{{ claude_code_login_dir }}/claude-login.page"
claude_code_login_forward_pidfile: "{{ claude_code_login_dir }}/claude-login.forward.pid"
# Internal: what makes a page Claude's own sign-in page. The VM chooses both
# the page claude prints and the one its browser is handed, so only a page
# like this opens here, and only its callback is forwarded.
claude_code_login_page_pattern: '^https://(claude[.]com/cai|claude[.]ai)/oauth/authorize[?]'
claude_code_login_page_trusted: "{{ claude_code_login_url is match(claude_code_login_page_pattern) }}"
# Internal: the page claude handed its browser, and the port of the callback it
# redirects to, http://localhost:<port>/callback - claude's listener on the
# VM's 127.0.0.1, which only a forward makes reachable from your browser.
claude_code_login_auto_url: >-
  {{ (claude_code_login_page_read.content | b64decode | trim) if claude_code_login_page_read.content is defined else '' }}
claude_code_login_callback: >-
  {{ claude_code_login_auto_url | regex_search('[?&]redirect_uri=http%3A%2F%2Flocalhost%3A[0-9]+%2Fcallback(&|$)') or '' }}
claude_code_login_callback_port: >-
  {{ (claude_code_login_callback | regex_replace('^.*localhost%3A', '') | regex_replace('%2Fcallback.*$', '') | int)
     if claude_code_login_callback | length > 0 else 0 }}
# Internal: whether a browser on this machine can take the page there: one
# BROWSER names, or open / xdg-open where login_desktop let the run look for
# them - and make not run over SSH, where the person is at another machine,
# whose browser the page would send to its own localhost.
claude_code_login_controller_remote: "{{ lookup('ansible.builtin.env', 'SSH_CONNECTION') | length > 0 }}"
claude_code_login_browser_here: >-
  {{ not (claude_code_login_controller_remote | bool)
     and claude_code_login_auto_url | page_opener(lookup('ansible.builtin.env', 'BROWSER'),
                                                  claude_code_login_tools.stdout_lines | default([])) | length > 0 }}
# Internal: whether this attempt comes back by itself - wanted, no code given
# instead, a browser here, Claude's own page with a port that can be forwarded
# - and, once the forward was tried, whether it is up.
claude_code_login_redirect_ready: >-
  {{ claude_code_login_redirect | bool and claude_code_login_code | length == 0
     and claude_code_login_browser_here | bool
     and claude_code_login_auto_url is match(claude_code_login_page_pattern)
     and (claude_code_login_callback_port | int) >= 1024 and (claude_code_login_callback_port | int) <= 65535 }}
claude_code_login_redirecting: >-
  {{ claude_code_login_redirect_ready | bool and (claude_code_login_forward.rc | default(1)) == 0 }}
# Internal: the ssh that makes the forward, on its own connection to the VM as
# Ansible reaches it, and how long its far end lasts: the wait, and a minute.
# Bound to this machine's loopback; ExitOnForwardFailure fails it when the port
# is taken here, and -f returns once it is up. A stand-in replaces ssh in tests.
claude_code_login_ssh: ssh
claude_code_login_forward_argv: >-
  {{ ['sh', '-c', 'exec "$@" >/dev/null 2>&1', 'sh', claude_code_login_ssh, '-f', '-n', '-T',
      '-o', 'BatchMode=yes', '-o', 'ExitOnForwardFailure=yes', '-o', 'ConnectTimeout=15',
      '-o', 'StrictHostKeyChecking=accept-new', '-o', 'ControlMaster=no', '-o', 'ControlPath=none',
      '-p', (hostvars[inventory_hostname].ansible_port | default(22)) | string,
      '-L', 'localhost:' ~ claude_code_login_callback_port ~ ':127.0.0.1:' ~ claude_code_login_callback_port]
     + (['-i', hostvars[inventory_hostname].ansible_ssh_private_key_file]
        if hostvars[inventory_hostname].ansible_ssh_private_key_file is defined else [])
     + [(hostvars[inventory_hostname].ansible_user | default(claude_code_user)) ~ '@'
        ~ hostvars[inventory_hostname].ansible_host | default(inventory_hostname),
        'echo $$ > ' ~ (claude_code_login_forward_pidfile | quote) ~ ' && exec sleep '
        ~ (claude_code_login_approval_timeout | int + 60)] }}
# Internal: whether someone answered this attempt - a code entered, or the
# browser come back - for make deploy's later sign-ins, and for the outcome.
claude_code_login_responded: >-
  {{ claude_code_login_entered | length > 0
     or (claude_code_login_redirecting | bool and (claude_code_login_landed.finished | default(0) | int) == 1) }}

# Internal: how long the server gets to fail after a start before it counts as
# up (remote_control.yml). One "active" reading proves nothing: Type=simple is
# active the moment the process forks.
claude_code_remote_control_stay_up_seconds: 20

# --- releasing the VM before it is destroyed (release.yml) ---
claude_code_release_state: >-
  {{ (claude_code_release_status.stdout | from_json) if (claude_code_release_status.stdout | default('') | trim)[:1] == '{' else {} }}
claude_code_release_signed_in: "{{ claude_code_release_state.loggedIn | default(false) | bool }}"
# The service, not the path unit that waits for a login: only a running
# server had a session to take offline.
claude_code_release_rc_stopped: >-
  {{ claude_code_release_stopped.results | default([]) | selectattr('changed', 'defined') | selectattr('changed')
     | selectattr('item.item', 'equalto', 'service') | list | length > 0 }}
# One clause for destroy's report on the VM; empty where Claude Code had no
# login and no Remote Control to end.
claude_code_release_why: >-
  {{ (claude_code_release_logout.stderr | default('') | plain_text | regex_replace('\s+', ' ') | trim) or 'no reason given' }}
claude_code_release_summary: >-
  {{ ((['Remote Control stopped (its session stays in the Claude app, offline)']
       if claude_code_release_rc_stopped | bool else [])
      + ([('signed out' if (claude_code_release_logout.rc | default(1)) == 0
           else 'could not sign out (' ~ claude_code_release_why ~ ')')]
         if claude_code_release_signed_in | bool else []))
     | join('; ') }}
