---
# Internal, not meant to be overridden: the config of the VM this run is
# acting on. For a VM that already exists it is the one the name lookup in
# main.yml fetched (config: current), so nothing reads it a second time. For
# a VM this run has just cloned there is no lookup to read, so present.yml
# reads it by VMID, with retries, into proxmox_vm_config - and only then.
# Keyed off proxmox_vm_exists rather than off whether proxmox_vm_config holds
# anything: the role can run more than once in a play, and a register a run
# never reaches keeps the previous run's answer for another VM.
proxmox_vm_found_config: >-
  {{ ((proxmox_vm_lookup.proxmox_vms if proxmox_vm_exists | bool else proxmox_vm_config.proxmox_vms)
      | default([], true) | first | default({}, true)).get('config', {}) }}

# Internal: the MAC of the VM's own NIC, or "" when it cannot be read - an
# empty config, or a template whose NIC is not proxmox_vm_nic. The callers
# assert on it rather than letting net_mac raise mid-play.
#
# Computed here rather than copied into a fact so it cannot go stale. The
# role can run more than once for the same host in one play - the role
# scenario's side_effect.yml includes it back to back - and a set_fact
# survives a run that skips it, so a fact would hand VM #1's MAC to VM #2. A
# lazy var is re-evaluated against whatever the registers hold right now, and
# a skipped register is overwritten rather than kept.
proxmox_vm_found_mac: >-
  {{ proxmox_vm_found_config.get(proxmox_vm_nic, '') | net_mac('') }}

# Internal: the node that holds the VM the name lookup found, which is where
# every call about an existing VM has to go - a VM migrated since it was
# created is no longer on proxmox_vm_node, and proxmox_kvm's update sends a
# settings call to the node it is given rather than looking the VM up. A VM
# that does not exist yet is about to be cloned on proxmox_vm_node, so that
# is the default; the clone itself always goes there.
proxmox_vm_found_node: >-
  {{ proxmox_vm_lookup.proxmox_vms[0].node | default(proxmox_vm_node, true) }}

# Internal: the address the guest agent reports for the VM's own NIC, or ""
# while the agent has not answered yet. Jinja is lazy, so this is only
# evaluated once proxmox_vm_net has been registered.
proxmox_vm_reported_address: >-
  {{ proxmox_vm_net.proxmox_vms
     | default([], true) | map(attribute='network') | first | default([], true)
     | guest_ipv4(proxmox_vm_found_mac)
     | default('', true) }}

# Internal: the tags of the VM the name lookup found, as a list. Proxmox joins
# tags with ";" on the wire, so split on that; the "," is only there because
# proxmox_kvm sends them comma-joined and some versions echo that back.
# Matching whole elements, not a substring, is what keeps "claude-on-proxmox"
# from matching "claude-on-proxmox-staging". Lowercased, because Proxmox
# stores tags lowercased by default: a tag configured as "Claude-On-Proxmox"
# comes back as "claude-on-proxmox", and main.yml lowercases its side of the
# comparison to match.
proxmox_vm_found_tags: >-
  {{ proxmox_vm_lookup.proxmox_vms[0].tags
     | default('', true) | replace(',', ';') | split(';')
     | map('trim') | select | map('lower') | list }}

# Internal: the tags this role writes - proxmox_vm_tags, lowercased the way
# Proxmox stores them, so that what is sent is what the lookup finds again
# even on a datacenter whose tag style keeps case.
proxmox_vm_sent_tags: "{{ proxmox_vm_tags | map('lower') | list }}"

# Internal: the tag a VM carries from the settings call until the start that
# follows it has succeeded. See proxmox_vm_needs_configuration.
proxmox_vm_unfinished_tag: "{{ proxmox_vm_sent_tags[0] }}-unfinished"

# Internal: whether the VM is still on its first run: it needs its settings
# applied, its disk resized and a start. Existence alone is not convergence -
# if a run died between the clone and the settings call, the VM exists but has
# no cloud-init user, no SSH keys and no agent, and keying off existence would
# skip the repair forever and then wait out the whole agent poll budget for an
# agent that was never enabled.
#
# Two markers, because the settings call is not the last step. The cloud-init
# user says the settings call never ran: only that call writes it, and the
# template has none. proxmox_vm_unfinished_tag says it ran but the resize or
# the start after it did not - a disk size Proxmox refused, a start the host
# had no memory for, Ctrl-C. Nothing else in the lookup tells that VM apart
# from a finished one someone shut down, and it must not be left stopped.
# The settings call adds the tag and present.yml removes it only once the start
# has succeeded, so a VM without it is one this project finished (or one made
# before the tag existed) and a stopped one stays stopped.
#
# Neither marker is the ownership tag. present.yml tags a VM the moment it is
# cloned, so that a half-built VM is still recognisably this project's - and
# main.yml refuses to touch an existing VM without the tag, so "untagged" can
# no longer mean "ours, but unfinished".
proxmox_vm_first_run: >-
  {{ (not proxmox_vm_exists)
     or ((proxmox_vm_lookup.proxmox_vms[0].config | default({}, true)).ciuser
         | default('', true) | length == 0)
     or (proxmox_vm_unfinished_tag in proxmox_vm_found_tags) }}

# Internal: the first run, or proxmox_vm_force_update, which re-applies the
# settings to a finished VM too.
proxmox_vm_needs_configuration: >-
  {{ (proxmox_vm_first_run | bool) or (proxmox_vm_force_update | bool) }}

# Internal: the GPU. Every decision about it - the settings call's hostpci0,
# taking it off again, how the VM starts - is made before present.yml reads
# a new VM's config after its start, so it reads this run's lookup alone: the
# config of the VM the name found, or none for a VM about to be cloned. Never
# proxmox_vm_found_config, which for a new VM falls back to proxmox_vm_config,
# a register the previous run of the role (another VM, on the same host)
# leaves behind until this run reads it.
proxmox_vm_gpu_config: >-
  {{ (proxmox_vm_lookup.proxmox_vms[0].config | default({}, true)) if proxmox_vm_exists | bool else {} }}

# Internal: {slot: mapping id} for each hostpciN of that config, "" for a
# device that is no mapping's (host=, which only root may set).
proxmox_vm_gpu_mappings: "{{ proxmox_vm_gpu_config | hostpci_mappings }}"

# Internal: whether the VM already has the mapping proxmox_vm_gpu_mapping names.
proxmox_vm_gpu_attached: >-
  {{ proxmox_vm_gpu_mapping | lower in (proxmox_vm_gpu_mappings.values() | map('lower') | list) }}

# Internal: whether this run may add or remove the GPU: on the VM's first run
# only, and only while it is stopped. A change to a running VM's config stays
# pending, and the lookup never sees it, so a VM on its first run that has
# started already is treated as finished. proxmox_vm_force_update is no first run.
proxmox_vm_gpu_changeable: >-
  {{ (proxmox_vm_first_run | bool)
     and (not (proxmox_vm_exists | bool) or proxmox_vm_lookup.proxmox_vms[0].status | default('') == 'stopped') }}

# Internal: the settings call sends hostpci0, or a call of its own takes the
# mapping off hostpci0 again (proxmox_vm_gpu turned off on a VM whose first run
# attached it and then failed to start, say on a GPU another VM holds). Only
# proxmox_vm_gpu_mapping, the one this role attaches: another mapping there is
# not the role's to take off.
proxmox_vm_gpu_set: "{{ (proxmox_vm_gpu_changeable | bool) and (proxmox_vm_gpu | bool) }}"
proxmox_vm_gpu_unset: >-
  {{ (proxmox_vm_gpu_changeable | bool) and not (proxmox_vm_gpu | bool)
     and proxmox_vm_gpu_mapping | length > 0
     and proxmox_vm_gpu_mappings.hostpci0 | default('') | lower == proxmox_vm_gpu_mapping | lower }}

# Internal: proxmox_vm_gpu asks for a GPU this run may not attach, and the VM
# does not have: present.yml says so.
proxmox_vm_gpu_mismatch: >-
  {{ not (proxmox_vm_gpu_changeable | bool) and (proxmox_vm_gpu | bool) and not (proxmox_vm_gpu_attached | bool) }}

# Internal: whether the VM has a PCI device once this run's settings are
# written - the one it is given, or one it has (a mapping, or a device root
# attached by hand) and keeps. Such a VM starts through the API, whose task
# says at once why a start failed where proxmox_kvm waits out its timeout,
# and keeps all of its memory: VFIO pins it, so a balloon below it does nothing.
proxmox_vm_has_gpu: >-
  {{ (proxmox_vm_gpu_set | bool)
     or (proxmox_vm_gpu_mappings | dict2items
         | rejectattr('key', 'equalto', 'hostpci0' if proxmox_vm_gpu_unset | bool else '') | list | length > 0) }}

# Internal: this run starts the VM through the API, as a VM with a GPU is
# started (present.yml): a VM this run created or repaired, or one
# proxmox_vm_start_existing asks to start, unless it runs already.
proxmox_vm_gpu_starts: >-
  {{ ((proxmox_vm_needs_configuration | bool) or (proxmox_vm_start_existing | bool))
     and (proxmox_vm_has_gpu | bool)
     and proxmox_vm_lookup.proxmox_vms[0].status | default('') != 'running' }}

# Internal: the one request no proxmox_kvm call makes for this role, a VM's
# start whose task it reads itself: the base URL, an IPv6 address bracketed as
# proxmoxer brackets it, and the header, which carries the token, so every
# task that sends it is no_log.
proxmox_vm_api_url: >-
  https://{{ '[' ~ proxmox_vm_api_host ~ ']' if proxmox_vm_api_host is search(':.*:')
  and proxmox_vm_api_host is not match('[[]') else proxmox_vm_api_host }}:{{ proxmox_vm_api_port }}/api2/json
proxmox_vm_api_headers:
  Authorization: >-
    PVEAPIToken={{ proxmox_vm_api_user }}!{{ proxmox_vm_api_token_id }}={{ proxmox_vm_api_token_secret }}

# Internal: the address whose host key should be forgotten when the VM is
# deleted, as the guest agent reports it while the VM still exists. A VM that is
# stopped, hung or agent-less reports nothing, and destroy.yml runs no discovery
# that could supply an address instead - so such a VM gets the "could not
# determine its address" warning, and its stale key is left for ssh-keygen -R.
# There are no cached facts to evict: the project gathers facts afresh on every
# configure run (ansible.cfg says why there is no fact cache).
proxmox_vm_forget_address: >-
  {{ proxmox_vm_reported_address }}

# Internal: every name this machine may hold the VM's host key under - the
# address, and <name>.<domain> when the SSH aliases and make code connect by
# name (proxmox_vm_known_hosts_domain). A VM created again under the same name
# would otherwise fail its first connection by name on the old key.
proxmox_vm_forget_names: >-
  {{ ([proxmox_vm_forget_address] if proxmox_vm_forget_address | length > 0 else [])
     + ([proxmox_vm_name ~ '.' ~ proxmox_vm_known_hosts_domain]
        if proxmox_vm_known_hosts_domain | length > 0 else []) }}
