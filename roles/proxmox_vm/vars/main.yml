---
# Internal, not meant to be overridden: the address the guest agent reports for
# the VM's own NIC, or "" while the agent has not answered yet. Jinja is lazy,
# so this is only evaluated once proxmox_vm_net and proxmox_vm_mac are set.
proxmox_vm_reported_address: >-
  {{ proxmox_vm_net.proxmox_vms
     | default([], true) | map(attribute='network') | first | default([], true)
     | guest_ipv4(proxmox_vm_mac | default(''))
     | default('', true) }}

# Internal: the tags of the VM the name lookup found, as a list. Proxmox joins
# tags with ";" on the wire, so split on that; the "," is only there because
# proxmox_kvm sends them comma-joined and some versions echo that back.
# Matching whole elements, not a substring, is what keeps "claude-on-proxmox"
# from matching "claude-on-proxmox-staging".
proxmox_vm_found_tags: >-
  {{ proxmox_vm_lookup.proxmox_vms[0].tags
     | default('', true) | replace(',', ';') | split(';')
     | map('trim') | select | list }}

# Internal: whether the VM still needs its settings applied. Existence alone is
# not convergence - if a run died between the clone and the settings call, the
# VM exists but has no cloud-init user, no SSH keys, no agent and no tag, and
# keying off existence would skip the repair forever and then wait five minutes
# for an agent that was never enabled. The tag is written by that same call, so
# its absence is the marker that the call did not complete.
proxmox_vm_needs_configuration: >-
  {{ (not proxmox_vm_exists)
     or (proxmox_vm_force_update | bool)
     or (proxmox_vm_tags[0] not in proxmox_vm_found_tags) }}
