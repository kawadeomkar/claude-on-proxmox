---
- name: Converge
  hosts: all
  gather_facts: false
  roles:
    - role: proxmox_vm

  post_tasks:
    # These assertions live here rather than in verify.yml because they check
    # facts the role sets, which do not survive into a separate Molecule stage.
    - name: Assert the VMID was allocated by Proxmox
      ansible.builtin.assert:
        that: proxmox_vm_resolved_id | int == 9001
        fail_msg: "expected the next free VMID 9001, got {{ proxmox_vm_resolved_id }}"
        quiet: true

    - name: Assert the address came from the VM's own NIC
      ansible.builtin.assert:
        that: proxmox_vm_address == '192.0.2.51'
        fail_msg: >-
          expected 192.0.2.51 from eth0, got "{{ proxmox_vm_address }}"
          (172.17.0.1 would mean the docker bridge was picked up)
        quiet: true

    # Publishing to claude_vms is the playbook's job, not the role's; the
    # provision scenario covers it for a whole fleet.

    # A boundary in the fake's request log. Molecule re-runs this play for its
    # idempotence stage and side_effect.yml runs the role again, so the log ends
    # up spanning runs that each poll 9001's agent - and a cumulative count could
    # not tell converge's polls from one poll per stage. verify.yml counts only
    # the agent polls before the first marker. It is shaped like a logged request
    # with a path no assertion's pattern matches, so the `selectattr('path', ...)`
    # filters across verify.yml and side_effect.yml skip it rather than fail on a
    # missing key. changed_when: false, so writing it each run leaves the
    # idempotence check green.
    - name: Mark the end of this converge run in the request log
      ansible.builtin.shell: >-
        printf '%s\n' '{"method": "MARKER", "path": "/converge-end", "params": {}}' >> /var/lib/fake-pve/calls.log
      become: true
      changed_when: false
