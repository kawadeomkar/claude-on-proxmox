---
# The role talks to the Proxmox API from the controller (delegate_to: localhost),
# so the container only hosts a fake Proxmox API (tests/molecule/fake_pve_api.py)
# published on 127.0.0.1:18006.
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yml
platforms:
  - name: claude-on-proxmox-proxmox_vm
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:18bf80157ea24b3210eb25ca89a5460912271b0ee61f238f36d2b115c89e39e6}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    published_ports:
      - 127.0.0.1:18006:8006/tcp
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    side_effect: side_effect.yml
  inventory:
    host_vars:
      # The role delegates to localhost; make sure that uses the controller's
      # Python (with proxmoxer) rather than a discovered system interpreter.
      localhost:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      claude-on-proxmox-proxmox_vm:
        proxmox_vm_api_host: 127.0.0.1
        proxmox_vm_api_port: 18006
        proxmox_vm_api_user: ansible@pve
        proxmox_vm_api_token_id: ansible
        proxmox_vm_api_token_secret: molecule-test-secret
        proxmox_vm_name: claude-dev
        proxmox_vm_cores: 4
        proxmox_vm_memory_mb: 8192
        proxmox_vm_disk_size: 64G
        # No VMID and no address: Proxmox assigns 9001 (next after the fake
        # template) and the fake guest agent reports 192.0.2.51 for that VMID.
        proxmox_vm_agent_delay: 1
        proxmox_vm_nameservers: [1.1.1.1, 8.8.8.8]
        proxmox_vm_searchdomain: lan
        proxmox_vm_ssh_public_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMoleculeTestKeyDoNotUse0000000000000000000 molecule@test
