---
- name: Wait for the containers to boot
  ansible.builtin.import_playbook: ../../../../tests/molecule/boot_wait.yml

- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Set up the fake Proxmox API
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../tests/molecule/prepare_pve.yml"
      vars:
        prepare_pve_source: "{{ playbook_dir }}/../../../../tests/molecule/fake_pve_api.py"
        prepare_pve_port: "{{ proxmox_vm_api_port }}"
