---
# API connection parameters come from module_defaults in main.yml.
# The address is read while the VM still exists so its stale host key can be
# dropped afterwards; a re-provisioned VM often reuses the same lease.
- name: absent | Read the VM's network configuration
  community.proxmox.proxmox_vm_info: # noqa: args[module] - api_* come from module_defaults
    type: qemu
    vmid: "{{ proxmox_vm_resolved_id }}"
    config: current
  register: proxmox_vm_config
  failed_when: false
  changed_when: false
  when: proxmox_vm_exists

- name: absent | Ask the guest agent for the VM's address
  community.proxmox.proxmox_vm_info: # noqa: args[module] - api_* come from module_defaults
    type: qemu
    vmid: "{{ proxmox_vm_resolved_id }}"
    network: true
  register: proxmox_vm_net
  failed_when: false
  changed_when: false
  when: proxmox_vm_exists

- name: absent | Stop the VM
  community.proxmox.proxmox_kvm: # noqa: args[module] - api_* come from module_defaults
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_resolved_id }}"
    state: stopped
    force: true
    timeout: "{{ proxmox_vm_timeout }}"
  when: proxmox_vm_exists

- name: absent | Delete the VM and its disks
  community.proxmox.proxmox_kvm: # noqa: args[module] - api_* come from module_defaults
    node: "{{ proxmox_vm_node }}"
    vmid: "{{ proxmox_vm_resolved_id }}"
    state: absent
    # force also covers a VM that was (re)started between the two tasks;
    # without it the module reports ok and leaves the VM in place.
    force: true
    timeout: "{{ proxmox_vm_timeout }}"
  when: proxmox_vm_exists

# Leaving a stale key behind is not harmless: the address goes back in the
# DHCP pool, and the next VM to get it fails with HOST KEY VERIFICATION FAILED
# and no hint as to why.
- name: absent | Forget the VM's SSH host key
  ansible.builtin.known_hosts:
    name: "{{ proxmox_vm_forget_address }}"
    state: absent
  delegate_to: localhost
  when:
    - proxmox_vm_exists
    - proxmox_vm_forget_address | length > 0

# VM names are cheap and reusable now, so a name can come back pointing at a
# different machine. A cached fact set from the old one would be reused for up
# to fact_caching_timeout, describing hardware that no longer exists.
- name: absent | Drop the VM's cached facts
  ansible.builtin.file:
    path: "{{ proxmox_vm_fact_cache }}"
    state: absent
  delegate_to: localhost
  when:
    - proxmox_vm_exists
    - proxmox_vm_fact_cache | length > 0

- name: absent | Warn when the address could not be determined
  ansible.builtin.debug:
    msg: >-
      Deleted "{{ proxmox_vm_name }}" but could not determine its address, so its
      SSH host key is still in known_hosts. If a later VM picks up that lease you
      will see HOST KEY VERIFICATION FAILED; remove the entry with
      "ssh-keygen -R <address>".
  when:
    - proxmox_vm_exists
    - proxmox_vm_forget_address | length == 0
