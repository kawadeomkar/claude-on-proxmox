---
# Split by condition on purpose: a single catch-all message sent someone with
# a mistyped VM name off to check their API token.
- name: Validate the Proxmox connection settings
  ansible.builtin.assert:
    that:
      - proxmox_vm_api_host | length > 0
      - proxmox_vm_api_token_secret | length > 0
    fail_msg: >-
      Set proxmox_api_host in inventory/hosts.yml and vault_proxmox_api_token_secret
      in inventory/group_vars/all/vault.yml. See "Creating the Proxmox API token"
      in the README.
    quiet: true

- name: Validate the VM name
  ansible.builtin.assert:
    that:
      - proxmox_vm_name | length > 0
      - proxmox_vm_name | length <= 63
      - proxmox_vm_name is match('^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$')
    fail_msg: >-
      "{{ proxmox_vm_name }}" is not usable as a VM name. Use 1-63 characters,
      letters, digits, dots and hyphens only, starting and ending with a letter
      or digit - no spaces and no underscores. For example: VM_NAME=alpha
    quiet: true

- name: Validate the login credentials for the VM
  ansible.builtin.assert:
    that: proxmox_vm_ssh_public_keys | length > 0 or proxmox_vm_password | length > 0
    fail_msg: >-
      The VM would be unreachable: set vm_ssh_public_keys (it defaults to
      ~/.ssh/id_ed25519.pub) or vm_password for the cloud-init user.
    quiet: true

- name: Validate the remaining role arguments
  ansible.builtin.assert:
    that:
      - proxmox_vm_state in ['present', 'absent']
      - proxmox_vm_id | string | length == 0 or proxmox_vm_id | string is match('^[1-9][0-9]{2,}$')
    fail_msg: >-
      proxmox_vm_state must be present or absent (got "{{ proxmox_vm_state }}"), and
      proxmox_vm_id, when set at all, must be a number >= 100
      (got "{{ proxmox_vm_id }}").
    quiet: true

- name: Manage the VM
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_vm_api_host }}"
      api_port: "{{ proxmox_vm_api_port }}"
      api_user: "{{ proxmox_vm_api_user }}"
      api_token_id: "{{ proxmox_vm_api_token_id }}"
      api_token_secret: "{{ proxmox_vm_api_token_secret }}"
      validate_certs: "{{ proxmox_vm_validate_certs }}"
  delegate_to: localhost
  block:
    - name: Look up Proxmox VM {{ proxmox_vm_name }}
      community.proxmox.proxmox_vm_info: # noqa: args[module] - api_* come from module_defaults
        type: qemu
        name: "{{ proxmox_vm_name }}"
      register: proxmox_vm_lookup

    # Proxmox permits duplicate names; this role cannot tell which one is meant.
    - name: Refuse to act on a duplicated VM name
      ansible.builtin.assert:
        that: proxmox_vm_lookup.proxmox_vms | length <= 1
        fail_msg: >-
          {{ proxmox_vm_lookup.proxmox_vms | length }} VMs are named "{{ proxmox_vm_name }}"
          (VMIDs {{ proxmox_vm_lookup.proxmox_vms | map(attribute='vmid') | join(', ') }}).
          Rename or remove the duplicates.
        quiet: true

    - name: Record whether the VM already exists
      ansible.builtin.set_fact:
        proxmox_vm_exists: "{{ proxmox_vm_lookup.proxmox_vms | length > 0 }}"
        proxmox_vm_resolved_id: "{{ proxmox_vm_lookup.proxmox_vms[0].vmid | default('') }}"

    - name: Create the VM
      ansible.builtin.include_tasks: present.yml
      when: proxmox_vm_state == 'present'

    # Deleting is irreversible and the name alone does not prove ownership:
    # Proxmox lets any VM carry any name, so `make destroy VM_NAME=nas` would
    # otherwise match an unrelated VM. The tag is what this project stamps on
    # everything it creates, and a template is never one of them.
    - name: Refuse to delete a VM this project does not own
      ansible.builtin.assert:
        that:
          - not (proxmox_vm_lookup.proxmox_vms[0].template | default(false) | bool)
          - proxmox_vm_tags[0] in proxmox_vm_found_tags
        fail_msg: >-
          "{{ proxmox_vm_name }}" (VMID {{ proxmox_vm_resolved_id }}) is a template or is
          not tagged "{{ proxmox_vm_tags[0] }}", so this project did not create it.
          Refusing to delete. Its tags are: {{ proxmox_vm_found_tags | join(', ') | default('(none)', true) }}.
          Set proxmox_vm_allow_untagged_delete=true to delete it anyway.
        quiet: true
      when:
        - proxmox_vm_state == 'absent'
        - proxmox_vm_exists
        - not (proxmox_vm_allow_untagged_delete | bool)

    - name: Delete the VM
      ansible.builtin.include_tasks: absent.yml
      when: proxmox_vm_state == 'absent'
