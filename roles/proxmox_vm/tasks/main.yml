---
- name: Validate VM definition
  ansible.builtin.assert:
    that:
      - proxmox_vm_api_host | length > 0
      - proxmox_vm_api_token_secret | length > 0
      - proxmox_vm_id | string is match('^[0-9]+$')
      - proxmox_vm_id | int >= 100
      - proxmox_vm_state in ['present', 'absent']
      - proxmox_vm_ssh_public_keys | length > 0 or proxmox_vm_password | length > 0
    fail_msg: >-
      proxmox_vm needs proxmox_vm_api_host, proxmox_vm_api_token_secret, a numeric
      proxmox_vm_id (set vm_id on the host in inventory) and at least one SSH public
      key (vm_ssh_public_keys) or a password (vm_password) for the cloud-init user.
    quiet: true

- name: Manage the VM
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_vm_api_host }}"
      api_port: "{{ proxmox_vm_api_port }}"
      api_user: "{{ proxmox_vm_api_user }}"
      api_token_id: "{{ proxmox_vm_api_token_id }}"
      api_token_secret: "{{ proxmox_vm_api_token_secret }}"
      validate_certs: "{{ proxmox_vm_validate_certs }}"
  delegate_to: localhost
  block:
    - name: Look up Proxmox VM {{ proxmox_vm_id }}
      community.proxmox.proxmox_vm_info: # noqa: args[module] - api_* come from module_defaults
        type: qemu
        vmid: "{{ proxmox_vm_id }}"
      register: proxmox_vm_lookup

    - name: Record whether the VM already exists
      ansible.builtin.set_fact:
        proxmox_vm_exists: "{{ proxmox_vm_lookup.proxmox_vms | length > 0 }}"

    - name: Refuse to touch a VMID that belongs to a different VM
      ansible.builtin.assert:
        that: proxmox_vm_lookup.proxmox_vms[0].name == proxmox_vm_name
        fail_msg: >-
          VMID {{ proxmox_vm_id }} is used by "{{ proxmox_vm_lookup.proxmox_vms[0].name }}",
          not "{{ proxmox_vm_name }}". Pick another vm_id.
        quiet: true
      when: proxmox_vm_exists

    - name: Create the VM
      ansible.builtin.include_tasks: present.yml
      when: proxmox_vm_state == 'present'

    - name: Delete the VM
      ansible.builtin.include_tasks: absent.yml
      when: proxmox_vm_state == 'absent'
