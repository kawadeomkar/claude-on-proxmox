---
argument_specs:
  main:
    short_description: Clone, configure and start (or delete) a VM on Proxmox VE
    description:
      - Looks the VM up by name, clones it from a cloud-init template if missing,
        applies hardware and cloud-init settings, resizes the root disk, starts it
        and waits for the guest agent to report an address.
      - An existing VM that is stopped is left stopped unless
        proxmox_vm_start_existing is set. It is not waited on; the role sets
        proxmox_vm_stopped and an empty proxmox_vm_address instead.
      - A VM an earlier run did not finish is finished instead - configured,
        resized and started - whatever its status. The settings call tags it
        "<first tag>-unfinished", and only a successful start removes that tag.
      - Deleting refuses any VM that does not carry the ownership tag, and
        creating refuses an existing VM that lacks it or is a template.
      - All API calls are delegated to the controller.
    options:
      proxmox_vm_api_host:
        type: str
        description:
          - Proxmox VE API host (IP or DNS name).
          - Not marked required. The role defaults it to "" and asserts on it
            instead, so an unset host is reported with the name of the file to
            put it in rather than as "missing required arguments".
      proxmox_vm_api_port:
        type: int
        description: Port of the Proxmox VE API.
      proxmox_vm_api_user:
        type: str
        description: Proxmox user the API token belongs to, realm included.
      proxmox_vm_api_token_id:
        type: str
        description: Name of the API token, the part after the ! in user!token.
      proxmox_vm_api_token_secret:
        type: str
        no_log: true
        description:
          - API token secret. Keep it in an ansible-vault file. Asserted by the role rather than marked required, for the
            same reason as proxmox_vm_api_host.
      proxmox_vm_validate_certs:
        type: bool
        description: Verify the API's TLS certificate. Turn it on once the controller trusts the Proxmox CA.
      proxmox_vm_api_timeout:
        type: int
        default: 30
        description:
          - Seconds each API request waits for Proxmox's answer. Not the modules' own 5, which a host busy copying a disk
            outlasts in the middle of a clone, failing a run whose clone was made.
      proxmox_vm_node:
        type: str
        description: Node that holds the template, where new VMs are cloned.
      proxmox_vm_storage:
        type: str
        description: Storage a full clone's disks are created on.
      proxmox_vm_template_name:
        type: str
        description: Name of the template VMs are cloned from.
      proxmox_vm_template_vmid:
        type: str
        description: >-
          The VMID of a golden template to clone, always as a full clone, in place of proxmox_vm_template_name.
          Empty, as when provision.yml runs on its own, clones the template by its name.
      proxmox_vm_full_clone:
        type: bool
        description: Make a full clone, independent of the template. false makes a linked clone, which keeps depending on the template's disk.
      proxmox_vm_timeout:
        type: int
        description: Seconds the clone, start, stop and delete calls may each take.
      proxmox_vm_state:
        type: str
        choices: [present, absent]
        description:
          - present clones and configures the VM where it is missing or unfinished, and starts it; an existing, finished
            VM is left as it is, a stopped one stopped. absent stops and deletes it.
      proxmox_vm_start_existing:
        type: bool
        description:
          - Start an already-configured VM that is stopped. Off by default so a
            re-run does not boot a VM that was shut down deliberately.
          - When off, such a VM is reported as stopped (proxmox_vm_stopped) with an
            empty proxmox_vm_address, without waiting for its guest agent.
      proxmox_vm_nic:
        type: str
        description:
          - Which NIC of the template carries the LAN address; its MAC is what the guest agent's reply is matched against.
      proxmox_vm_lookup_retries:
        type: int
        description:
          - How many more times a just-cloned VM's configuration is read, after the first, before giving up, since the
            cluster listing can lag behind a clone.
      proxmox_vm_lookup_delay:
        type: int
        description: Seconds between reads of a just-cloned VM's configuration.
      proxmox_vm_allow_untagged_delete:
        type: bool
        description:
          - Allow state=absent to delete a VM that does not carry the ownership
            tag. Off by default so a name collision cannot destroy a VM this
            project never created.
      proxmox_vm_known_hosts_domain:
        type: str
        description:
          - The DNS domain SSH reaches the VMs by on this machine, when not their address (claude_ssh_host_domain).
            state=absent forgets the host key recorded under <name>.<domain> too, besides the one under the address. Set
            through claude_ssh_host_domain in local.yml.
      proxmox_vm_known_hosts_kept:
        type: list
        elements: str
        description:
          - Addresses whose host key state=absent never forgets, whatever address the VM's guest agent reported, or
            <name>.<domain> it is reached by - the inventory's other hosts'. The Proxmox host's (proxmox_vm_api_host)
            is never forgotten either way. Wired from the inventory's hosts in group_vars/all.
      proxmox_vm_name:
        type: str
        description: VM name in Proxmox. Defaults to the inventory hostname.
      proxmox_vm_id:
        type: raw
        description:
          - Pin the VM to a specific VMID. Left empty, Proxmox assigns the next free one.
          - The VM is identified by name, not by ID, so this is rarely needed.
          - Run across several hosts at once, the role clones one VM at a time
            unless each has a distinct VMID here, because concurrent clones that
            ask Proxmox for one are handed the same. provision.yml sets one for
            every new VM of a fleet.
          - Declared raw so the role can validate it and report a helpful message.
      proxmox_vm_size:
        type: dict
        default: {}
        description:
          - This run's size for a VM it creates, each part optional - cores, memory_mb, disk (as 64G) - in place of
            proxmox_vm_cores, proxmox_vm_memory_mb and proxmox_vm_disk_size. Set by provision.yml from just deploy's
            --cores, --memory and --disk.
          - A VM created with one is tagged <ownership tag>-sized, its size its own from then on - just status calls no
            difference from the size settings drift, and proxmox_vm_force_update keeps it. A VM that exists is refused
            when it has another size, but under proxmox_vm_force_update, which applies it.
      proxmox_vm_repos:
        type: list
        elements: str
        description:
          - This run's list of repositories for the VM, in place of the github_projects setting. Set by provision.yml
            from just deploy's --repos. Written as one line of the VM's notes, added to what is there; empty leaves the
            notes alone.
          - Refused for a finished VM with no list of its own, which follows the setting, but under
            proxmox_vm_force_update.
      proxmox_vm_cores:
        type: int
        default: 2
        description: Defaults to the vm_cores host var, else 2. proxmox_vm_size's takes its place for a VM this run creates.
      proxmox_vm_memory_mb:
        type: int
        default: 4096
        description:
          - Defaults to the vm_memory_mb host var, else 4096. proxmox_vm_size's memory_mb takes its place for a VM this
            run creates.
      proxmox_vm_memory_min_mb:
        type: int
        description:
          - The least memory the host may leave the VM (Proxmox's minimum memory, ballooning), from 1 to
            proxmox_vm_memory_mb. Below it, the host takes the difference back once its memory use passes the node's
            ballooning target. Defaults to the vm_memory_min_mb host var, else proxmox_vm_memory_mb, a fixed
            allocation. Under proxmox_vm_size's memory_mb, it stays where it is below proxmox_vm_memory_mb - and below
            the size's memory - and is the size's memory where it is a fixed allocation. Applied when the VM is created.
      proxmox_vm_disk:
        type: str
        description: The root disk, as the template names it, resized to proxmox_vm_disk_size.
      proxmox_vm_disk_size:
        type: str
        default: 32G
        description:
          - Absolute root disk size with unit suffix (K, M, G, T). Applied when the VM is created or an unfinished one is
            repaired, and with proxmox_vm_force_update. Proxmox cannot shrink a disk, so a size below the current one
            fails. Defaults to the vm_disk_size host var, else 32G. proxmox_vm_size's disk takes its place for a VM this
            run creates.
      proxmox_vm_onboot:
        type: bool
        description: Start the VM when its Proxmox node boots.
      proxmox_vm_tags:
        type: list
        elements: str
        description:
          - Tags stamped on every VM this role creates. The first one is the
            ownership marker - discovery finds VMs by it, and both deleting and
            provisioning refuse to touch an existing VM that does not carry it.
      proxmox_vm_tags_1x:
        type: list
        elements: str
        description:
          - The ownership tag through 1.x. A VM that carries it, or a mark or the
            unfinished tag under it, is the role's as if it carried the first of
            proxmox_vm_tags, and the role writes each under that tag instead.
            Empty for a tag of one's own.
      proxmox_vm_user:
        type: str
        description: Cloud-init user created on the VM. The playbooks also log in as it.
      proxmox_vm_password:
        type: str
        default: ""
        no_log: true
        description:
          - Optional cloud-init password for the user (vault_vm_password in vault.yml). Key-based login is the default. Either this
            or proxmox_vm_ssh_public_keys must be set.
      proxmox_vm_ssh_public_keys:
        type: list
        elements: str
        description:
          - Public keys cloud-init authorises for proxmox_vm_user. These or proxmox_vm_password must be set.
      proxmox_vm_ipconfig:
        type: str
        default: ip=dhcp
        description:
          - Proxmox ipconfig0 string. DHCP by default, with the address read back
            from the guest agent.
          - Set to something like "ip=192.0.2.50/24,gw=192.0.2.1" to assign a fixed address.
          - One value for every VM it applies to. Set fleet-wide (local.yml, -e), every VM a
            run provisions is given that same address, so use it only for a single VM.
      proxmox_vm_nameservers:
        type: list
        elements: str
        default: []
        description: Defaults to the vm_nameservers host var.
      proxmox_vm_searchdomain:
        type: str
        default: ""
        description: Defaults to the vm_searchdomain host var.
      proxmox_vm_agent_retries:
        type: int
        description:
          - How many times to poll the guest agent for an address.
          - A count, not a wall-clock budget. With the defaults the wait is five
            minutes of delay plus the time each poll takes; a running VM with no
            agent answers each poll only after Proxmox's own ~3 s agent ping, so
            the role gives up on it after about nine minutes.
      proxmox_vm_agent_delay:
        type: int
        description: Seconds between guest agent polls.
      proxmox_vm_force_update:
        type: bool
        description:
          - Re-apply the hardware and cloud-init settings to a VM that exists.
            Off by default because Proxmox reports every update as a change.
          - On, every VM the run covers has its settings re-applied, its tag list
            replaced with proxmox_vm_tags (tags added by hand are dropped; the
            record that it joined Tailscale is kept), and is started, whether or
            not it was shut down on purpose.
