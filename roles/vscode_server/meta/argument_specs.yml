---
argument_specs:
  main:
    short_description: Make a VM ready for VS Code's Remote - SSH extension
    description:
      - Writes an sshd drop-in that keeps the port forwarding VS Code Server is reached through
        enabled and adds keepalives, asserts the values sshd actually runs with, and raises the
        inotify watch limit VS Code's file watcher needs. Disabled, it removes both files.
    options:
      vscode_server_enabled:
        type: bool
        default: true
        description: Write the sshd drop-in and the inotify limit, and check what sshd applies. false removes both files. Set as vscode_remote.
      vscode_server_user:
        type: str
        default: dev
        description: The user VS Code connects as, whose connection the sshd check evaluates Match blocks for. Set as vm_user.
      vscode_server_client_alive_interval:
        type: int
        default: 60
        description: Seconds of silence after which sshd checks that the editor's connection is alive (ClientAliveInterval).
      vscode_server_client_alive_count_max:
        type: int
        default: 3
        description:
          - Unanswered checks after which sshd drops the connection (ClientAliveCountMax), so a client that went to
            sleep is reaped after interval times count seconds.
      vscode_server_inotify_watches:
        type: int
        default: 524288
        description: fs.inotify.max_user_watches, raised for VS Code's file watcher on a large workspace.
      vscode_server_container_virt_types:
        type: list
        elements: str
        default: [docker, container, containerd, podman, lxc]
        description: Virtualisation types under which /proc/sys is read-only, so the sysctl file is written but not applied.
