---
# Two things converge.yml cannot show: that the role refuses an sshd that
# something else has turned forwarding off on, naming the file, and that
# vscode_server_enabled: false removes what an earlier run wrote. The
# container is left as converge.yml made it, so verify.yml checks that state.
- name: Side effect
  hosts: all
  become: true
  tasks:
    # sshd keeps the first value it reads, and 05- sorts before 20-.
    - name: Turn forwarding off in a drop-in sorted before the role's
      ansible.builtin.copy:
        content: "AllowTcpForwarding no\n"
        dest: /etc/ssh/sshd_config.d/05-molecule-hardening.conf
        owner: root
        group: root
        mode: "0644"

    - name: Run the role against the competing drop-in
      block:
        - name: Include the role
          ansible.builtin.include_role:
            name: vscode_server

        - name: Fail because the role did not notice
          ansible.builtin.fail:
            msg: The role accepted an sshd with AllowTcpForwarding no.
      rescue:
        - name: Assert the role named the file that turns forwarding off
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('allowtcpforwarding no')
              - ansible_failed_result.msg is search('05-molecule-hardening\.conf')
              - ansible_failed_result.msg is not search('did not notice')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"
            quiet: true

    - name: Remove the competing drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/05-molecule-hardening.conf
        state: absent

    - name: Run the role switched off
      ansible.builtin.include_role:
        name: vscode_server
      vars:
        vscode_server_enabled: false

    - name: Stat what the role should have removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: vscode_server_side_effect_removed
      loop:
        - /etc/ssh/sshd_config.d/20-vscode-server.conf
        - /etc/sysctl.d/60-vscode-server.conf

    - name: Assert both files are gone
      ansible.builtin.assert:
        that: vscode_server_side_effect_removed.results | map(attribute='stat.exists') | select | list | length == 0
        quiet: true

    # Back to the converged state, with converge.yml's values, for verify.yml.
    - name: Run the role switched on again
      ansible.builtin.include_role:
        name: vscode_server
      vars:
        vscode_server_client_alive_interval: 45
        vscode_server_client_alive_count_max: 4
        vscode_server_inotify_watches: 262144
