---
# What converge.yml cannot show: that the role refuses an sshd on which
# something else has taken VS Code's forwarding away, naming the file, and
# that vscode_server_enabled: false removes what an earlier run wrote. The
# container is left as converge.yml made it, so verify.yml checks that state.
- name: Side effect
  hosts: all
  become: true
  tasks:
    # A drop-in sorted before the role's own: sshd keeps the first value it reads.
    - name: Write 05-molecule-hardening.conf
      ansible.builtin.copy:
        content: "AllowTcpForwarding no\n"
        dest: /etc/ssh/sshd_config.d/05-molecule-hardening.conf
        owner: root
        group: root
        mode: "0644"

    - name: Run the role against 05-molecule-hardening.conf
      block:
        - name: Include the role with 05-molecule-hardening.conf in place
          ansible.builtin.include_role:
            name: vscode_server

        - name: Fail because the role accepted 05-molecule-hardening.conf
          ansible.builtin.fail:
            msg: The role accepted 05-molecule-hardening.conf.
      rescue:
        - name: Assert the role named the setting and 05-molecule-hardening.conf
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('allowtcpforwarding no')
              - ansible_failed_result.msg is search('05-molecule-hardening\\.conf')
              - ansible_failed_result.msg is not search('The role accepted')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"
            quiet: true

    - name: Remove 05-molecule-hardening.conf
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/05-molecule-hardening.conf
        state: absent

    # DisableForwarding, which overrides both forwarding keywords whatever they say.
    - name: Write 05-molecule-disable.conf
      ansible.builtin.copy:
        content: "DisableForwarding yes\n"
        dest: /etc/ssh/sshd_config.d/05-molecule-disable.conf
        owner: root
        group: root
        mode: "0644"

    - name: Run the role against 05-molecule-disable.conf
      block:
        - name: Include the role with 05-molecule-disable.conf in place
          ansible.builtin.include_role:
            name: vscode_server

        - name: Fail because the role accepted 05-molecule-disable.conf
          ansible.builtin.fail:
            msg: The role accepted 05-molecule-disable.conf.
      rescue:
        - name: Assert the role named the setting and 05-molecule-disable.conf
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('disableforwarding yes')
              - ansible_failed_result.msg is search('05-molecule-disable\\.conf')
              - ansible_failed_result.msg is not search('The role accepted')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"
            quiet: true

    - name: Remove 05-molecule-disable.conf
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/05-molecule-disable.conf
        state: absent

    # A Match block for the VM user, sorted last. A global `sshd -T` does not apply
    # Match blocks, so this is only caught because the role reads the
    # configuration for dev's own connection.
    - name: Write 99-molecule-match.conf
      ansible.builtin.copy:
        content: "Match User dev\n    AllowTcpForwarding remote\n"
        dest: /etc/ssh/sshd_config.d/99-molecule-match.conf
        owner: root
        group: root
        mode: "0644"

    - name: Run the role against 99-molecule-match.conf
      block:
        - name: Include the role with 99-molecule-match.conf in place
          ansible.builtin.include_role:
            name: vscode_server

        - name: Fail because the role accepted 99-molecule-match.conf
          ansible.builtin.fail:
            msg: The role accepted 99-molecule-match.conf.
      rescue:
        - name: Assert the role named the setting and 99-molecule-match.conf
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('allowtcpforwarding remote')
              - ansible_failed_result.msg is search('99-molecule-match\\.conf')
              - ansible_failed_result.msg is not search('The role accepted')
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg }}"
            quiet: true

    - name: Remove 99-molecule-match.conf
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-molecule-match.conf
        state: absent

    - name: Run the role switched off
      ansible.builtin.include_role:
        name: vscode_server
      vars:
        vscode_server_enabled: false

    - name: Stat what the role should have removed
      ansible.builtin.stat:
        path: "{{ item }}"
      register: vscode_server_side_effect_removed
      loop:
        - /etc/ssh/sshd_config.d/20-vscode-server.conf
        - /etc/sysctl.d/60-vscode-server.conf

    - name: Assert both files are gone
      ansible.builtin.assert:
        that: vscode_server_side_effect_removed.results | map(attribute='stat.exists') | select | list | length == 0
        quiet: true

    # Back to the converged state, with converge.yml's values, for verify.yml.
    - name: Run the role switched on again
      ansible.builtin.include_role:
        name: vscode_server
      vars:
        vscode_server_client_alive_interval: 45
        vscode_server_client_alive_count_max: 4
        vscode_server_inotify_watches: 262144
