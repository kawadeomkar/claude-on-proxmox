---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather user facts
      ansible.builtin.getent:
        database: passwd
        key: dev

    - name: Read sudoers drop-in
      ansible.builtin.slurp:
        src: /etc/sudoers.d/90-dev
      register: common_verify_sudoers

    - name: Read authorized_keys
      ansible.builtin.slurp:
        src: "{{ ansible_facts.getent_passwd.dev[4] }}/.ssh/authorized_keys"
      register: common_verify_keys

    - name: Check packages are installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Check timezone link
      ansible.builtin.stat:
        path: /etc/localtime
      register: common_verify_tz

    - name: Assert baseline
      ansible.builtin.assert:
        that:
          - ansible_facts.getent_passwd.dev[5] == '/bin/bash'
          - "'dev ALL=(ALL) NOPASSWD:ALL' in (common_verify_sudoers.content | b64decode)"
          - "'molecule@test' in (common_verify_keys.content | b64decode)"
          - "'git' in ansible_facts.packages"
          - "'ripgrep' in ansible_facts.packages"
          - "'sl' in ansible_facts.packages"
          - "'qemu-guest-agent' in ansible_facts.packages"
          - common_verify_tz.stat.lnk_source == '/usr/share/zoneinfo/Europe/Amsterdam'
        quiet: true

    # In one login shell that starts before ~/.local/bin exists, as on a VM
    # whose first tool lands there after the user logged in.
    - name: Check a tool installed into ~/.local/bin after login runs at once
      ansible.builtin.command:
        argv:
          - bash
          - -lc
          - >-
            test ! -e ~/.local/bin
            && mkdir -p ~/.local/bin
            && printf '#!/bin/sh\necho installed\n' > ~/.local/bin/common-verify-probe
            && chmod +x ~/.local/bin/common-verify-probe
            && common-verify-probe
        # let the login shell expand ~ and $PATH, not the command module
        expand_argument_vars: false
      become: true
      become_user: dev
      register: common_verify_path
      changed_when: false
      failed_when: common_verify_path.stdout != 'installed'

    # common_ssh_path_dirs: what sshd gives dev's sessions, ssh commands
    # included, is dev's two directories, then /etc/environment's PATH; root's
    # sessions get no SetEnv at all.
    - name: Read the PATH /etc/environment sets
      ansible.builtin.slurp:
        src: /etc/environment
      register: common_verify_environment

    - name: Read what sshd gives dev's and root's sessions
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -T, -C, "user={{ item }},host=127.0.0.1,addr=127.0.0.1"]
      loop: [dev, root]
      register: common_verify_sshd_users
      changed_when: false

    - name: Assert only dev's sessions get the directories
      vars:
        common_verify_system_path: >-
          {{ common_verify_environment.content | b64decode
             | regex_findall('^PATH="?([^"\n]*)"?', multiline=True) | first }}
        common_verify_home: "{{ ansible_facts.getent_passwd.dev[4] }}"
      ansible.builtin.assert:
        that:
          - common_verify_sshd_users.results[0].stdout_lines | select('match', '^setenv ') | list
            == ['setenv PATH=' ~ common_verify_home ~ '/.local/bin:' ~ common_verify_home ~ '/.cargo/bin:' ~ common_verify_system_path]
          - common_verify_sshd_users.results[1].stdout_lines | select('match', '^setenv ') | list == []
        fail_msg: >-
          dev: {{ common_verify_sshd_users.results[0].stdout_lines | select('match', '^setenv ') | list }},
          root: {{ common_verify_sshd_users.results[1].stdout_lines | select('match', '^setenv ') | list }}

    - name: Check sshd accepts the hardening drop-in
      ansible.builtin.command:
        argv: [/usr/sbin/sshd, -T]
      register: common_verify_sshd
      changed_when: false
      # sshd -T prints the canonical spelling "without-password" for prohibit-password
      failed_when: >-
        'passwordauthentication no' not in common_verify_sshd.stdout
        or common_verify_sshd.stdout is not search('permitrootlogin (without-password|prohibit-password)')

    - name: Check dev is in sudo group
      ansible.builtin.command:
        argv: [id, -nG, dev]
      register: common_verify_groups
      changed_when: false
      failed_when: "'sudo' not in common_verify_groups.stdout.split()"

    # common_masked_units: the stand-ins prepare.yml installed are masked and
    # stopped, none of them failed (fwupd's timer, which side_effect.yml left
    # failed, included), the two units the container never had are left
    # without a mask, and snapd, given a snap in side_effect.yml, runs.
    # common_enabled_services: the service a user adds is enabled and runs,
    # and the guest agent runs, since side_effect.yml gave it a port.
    - name: Read the state of each unit
      ansible.builtin.command:
        argv: [systemctl, show, --property=UnitFileState, --property=ActiveState, "{{ item }}"]
      loop:
        - fwupd.service
        - fwupd-refresh.timer
        - multipathd.service
        - multipathd.socket
        - snapd.service
        - snapd.socket
        - claude-on-proxmox-stand-in.service
        - qemu-guest-agent.service
      register: common_verify_units
      changed_when: false

    - name: Look for a mask on the units the container never had
      ansible.builtin.stat:
        path: /etc/systemd/system/{{ item }}
      loop: [ModemManager.service, udisks2.service]
      register: common_verify_absent_units

    - name: Assert what is masked and what runs
      vars:
        common_verify_state: >-
          {{ dict(common_verify_units.results | map(attribute='item')
                  | zip(common_verify_units.results | map(attribute='stdout'))) }}
      ansible.builtin.assert:
        that:
          - common_verify_state['fwupd.service'] is search('UnitFileState=masked')
          - common_verify_state['fwupd.service'] is search('ActiveState=inactive')
          - common_verify_state['fwupd-refresh.timer'] is search('UnitFileState=masked')
          - common_verify_state['fwupd-refresh.timer'] is search('ActiveState=inactive')
          - common_verify_state['multipathd.service'] is search('UnitFileState=masked')
          - common_verify_state['multipathd.socket'] is search('UnitFileState=masked')
          - common_verify_state['multipathd.socket'] is search('ActiveState=inactive')
          - common_verify_state['snapd.service'] is search('UnitFileState=enabled')
          - common_verify_state['snapd.service'] is search('ActiveState=active')
          - common_verify_state['claude-on-proxmox-stand-in.service'] is search('UnitFileState=enabled')
          - common_verify_state['claude-on-proxmox-stand-in.service'] is search('ActiveState=active')
          - common_verify_state['qemu-guest-agent.service'] is search('ActiveState=active')
          - common_verify_absent_units.results | map(attribute='stat.exists') | select | list == []
        quiet: true

    # common_apt_keep_downloads: false - apt deletes what it installed (sl and
    # the baseline came through it), and what was left before is gone too.
    - name: Read apt's settings
      ansible.builtin.command:
        argv: [apt-config, dump]
      register: common_verify_apt_config
      changed_when: false

    - name: Look for packages in apt's download cache
      ansible.builtin.find:
        paths: /var/cache/apt/archives
        patterns: "*.deb"
      register: common_verify_downloads

    - name: Assert apt keeps no package it downloads
      ansible.builtin.assert:
        that:
          - common_verify_apt_config.stdout is search('^APT::Keep-Downloaded-Packages "false";$', multiline=True)
          - common_verify_apt_config.stdout is search('^APT::Periodic::CleanInterval "1";$', multiline=True)
          - common_verify_downloads.matched == 0
        fail_msg: "left in /var/cache/apt/archives: {{ common_verify_downloads.files | map(attribute='path') | list }}"
        quiet: true
