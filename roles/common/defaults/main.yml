---
# Login user. cloud-init normally creates it; the role makes sure it exists
# with the right shell, groups and keys regardless.
common_user: dev
common_user_shell: /bin/bash
common_user_groups: [sudo]
common_user_passwordless_sudo: true
common_user_ssh_public_keys: []

common_timezone: Etc/UTC
common_manage_hostname: true
common_hostname: "{{ inventory_hostname }}"

# SSH daemon hardening drop-in: key-only logins, no root password login.
# Keeps password authentication off even if cloud-init was given a password.
common_harden_ssh: true

# Directories in common_user's home put first on PATH for everything sshd
# starts for that user, `ssh vm <command>` included: that runs a shell that
# reads no profile, and Ubuntu's ~/.bashrc returns at once for it. Set through
# an sshd drop-in (Match User + SetEnv), so no file of the user's is touched.
# ~/.local/bin holds Claude Code, pipx and uv tools; ~/.cargo/bin what
# `cargo install` builds (dev_tools installs Rust when dev_tools_install_rust
# is on). A directory that does not exist costs nothing. [] removes the drop-in.
common_ssh_path_dirs:
  - .local/bin
  - .cargo/bin

common_apt_upgrade: true
common_apt_cache_valid_time: 3600
# Fresh cloud images run unattended-upgrades right after first boot; wait for
# the apt lock rather than failing after the 60 s module default.
common_apt_lock_timeout: 600
# apt-get keeps every package it downloads - only the interactive apt command
# deletes them - so a first boot's upgrade and each configure left hundreds of
# MB in /var/cache/apt/archives, on disk and in the VM's memory as cache. false
# deletes each package once it is installed and empties that cache daily;
# true leaves apt as it was.
common_apt_keep_downloads: false

# Virtualisation types under which the hostname is left alone: a container's
# belongs to its runtime. (Services are started on a KVM guest only.)
common_container_virt_types: [docker, container, containerd, podman, lxc]

# Baseline packages every VM gets.
common_packages:
  - apt-transport-https
  - bash-completion
  - build-essential
  - ca-certificates
  - curl
  - fd-find
  - git
  - gnupg
  - htop
  - jq
  - less
  - openssh-server
  - python3
  - python3-pip
  - python3-debian
  - python3-venv
  - qemu-guest-agent
  - ripgrep
  - rsync
  - tmux
  - tree
  - unzip
  - vim
  - wget
  - zip
  - zstd
# Add your own without replacing the baseline.
common_extra_packages: "{{ vm_extra_packages | default([]) }}"

# Services enabled at boot and started, where systemd runs. qemu-guest-agent
# is started only on a VM that has its port: a Proxmox VM with its agent on.
common_enabled_services:
  - qemu-guest-agent

# Units masked where systemd runs: what Ubuntu's server image starts that a
# headless VM has no use for - firmware updates, multipath storage, modems,
# removable disks and snaps, about 110 MB between them. Only the units a VM
# has are masked, and snapd's only while no snap is installed. [] masks none;
# a unit taken off the list stays masked until `sudo systemctl unmask <unit>`.
common_masked_units:
  - fwupd.service
  - fwupd-refresh.timer
  - multipathd.service
  - multipathd.socket
  - ModemManager.service
  - udisks2.service
  - snapd.service
  - snapd.socket
  - snapd.seeded.service
