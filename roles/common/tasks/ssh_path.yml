---
# common_ssh_path_dirs on PATH for what sshd starts without a login shell:
# `ssh vm <command>`, which reads no profile and runs a ~/.bashrc that returns
# at once. sshd applies SetEnv after PAM's /etc/environment, so the drop-in's PATH
# wins, and under Match User it is this user's alone. It takes no variables,
# so the value is written out in full (common_ssh_path, vars/main.yml).
- name: ssh_path | Look up the home directory of {{ common_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ common_user }}"
  when: common_ssh_path_dirs | length > 0

- name: ssh_path | Read the PATH /etc/environment sets
  ansible.builtin.slurp:
    src: /etc/environment
  register: common_environment
  failed_when: false
  when: common_ssh_path_dirs | length > 0

# A space, a quote or a # would split or end the value in sshd's
# configuration; the VM's own files decide it, so it is checked, not trusted.
- name: ssh_path | Fail when that PATH cannot be written into sshd's configuration
  ansible.builtin.assert:
    that: common_ssh_path is match('^[A-Za-z0-9_.,+@/:-]+$')
    fail_msg: >-
      The PATH for {{ common_user }}'s ssh sessions, "{{ common_ssh_path | plain_text }}", has a character
      sshd's configuration cannot take as it is (a space, a quote, a #). It is built from {{ common_user }}'s
      home directory and the PATH line in /etc/environment; fix whichever has it, or set
      common_ssh_path_dirs: [] to leave sshd's PATH alone.
    quiet: true
  when: common_ssh_path_dirs | length > 0

- name: ssh_path | Put the same directories on PATH for ssh commands
  ansible.builtin.template:
    src: sshd_path.conf.j2
    dest: "{{ common_ssh_path_dropin }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: common_ssh_path_dirs | length > 0
  notify: Restart ssh

- name: ssh_path | Remove the PATH for ssh commands
  ansible.builtin.file:
    path: "{{ common_ssh_path_dropin }}"
    state: absent
  when: common_ssh_path_dirs | length == 0
  notify: Restart ssh

# Where the user's connections come from, as vscode_server reads it: Ansible's
# own SSH connection, without become, which drops SSH_CONNECTION. A container
# or a local run has none, and the loopback address stands in.
- name: ssh_path | Find where the connections come from, for {{ common_user }}
  ansible.builtin.command:
    argv: [printenv, SSH_CONNECTION]
  become: false
  register: common_ssh_connection
  changed_when: false
  check_mode: false
  failed_when: false
  when: common_ssh_path_dirs | length > 0

# What sshd will give those sessions. It keeps the first SetEnv that applies,
# a Match block's replacing the global one, so a drop-in sorted before this
# one or sshd_config itself can override it silently. `sshd -T -C` evaluates
# the Match blocks from the files on disk, so nothing is restarted first.
- name: ssh_path | Read the PATH sshd gives the sessions of {{ common_user }}
  vars:
    common_ssh_conn: "{{ (common_ssh_connection.stdout | default('')).split() }}"
    common_ssh_spec: >-
      {{ 'user=' ~ common_user ~ ',host=' ~ common_ssh_conn[0] ~ ',addr=' ~ common_ssh_conn[0]
         ~ ',laddr=' ~ common_ssh_conn[2] ~ ',lport=' ~ common_ssh_conn[3]
         if common_ssh_conn | length == 4
         else 'user=' ~ common_user ~ ',host=127.0.0.1,addr=127.0.0.1' }}
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -T, -C, "{{ common_ssh_spec }}"]
  register: common_sshd
  changed_when: false
  check_mode: false
  when: common_ssh_path_dirs | length > 0

# Only to name the culprit when the check below fails. Indented lines count,
# since that is how a setting under a Match block is written.
- name: ssh_path | Find what else sets sshd's environment, if anything does
  ansible.builtin.find:
    paths: [/etc/ssh, /etc/ssh/sshd_config.d]
    patterns: [sshd_config, "*.conf"]
    excludes: ["{{ common_ssh_path_dropin | basename }}"]
    contains: '(?i)^\s*SetEnv\s'
  register: common_ssh_setenv_elsewhere
  check_mode: false
  when: common_ssh_path_dirs | length > 0

# Not in check mode, where the drop-in is not on disk for sshd to read.
- name: ssh_path | Fail when sshd does not give that PATH to the sessions of {{ common_user }}
  vars:
    common_sshd_setenv: "{{ common_sshd.stdout_lines | select('match', '(?i)^setenv ') | list }}"
    common_ssh_culprits: "{{ common_ssh_setenv_elsewhere.files | default([]) | map(attribute='path') | sort | list }}"
  ansible.builtin.assert:
    that: common_sshd_setenv == ['setenv PATH=' ~ common_ssh_path]
    fail_msg: >-
      sshd on {{ inventory_hostname }} gives {{ common_user }}'s sessions
      "{{ common_sshd_setenv | join('", "') | plain_text }}" rather than the PATH in {{ common_ssh_path_dropin }},
      so `ssh {{ inventory_hostname }} <command>` will not find what is in
      {{ common_ssh_path_dirs | map('regex_replace', '^', '~/') | join(' or ') }}. sshd keeps the first SetEnv
      that applies, so something else decides it{{
        ': ' ~ (common_ssh_culprits | join(', ')) if common_ssh_culprits | length > 0
        else ' - a drop-in sorted before it, /etc/ssh/sshd_config itself, or a Match block' }}.
      Remove that SetEnv, or set common_ssh_path_dirs: [] to leave sshd's PATH alone.
    quiet: true
  when:
    - common_ssh_path_dirs | length > 0
    - not ansible_check_mode
