---
- name: Converge
  hosts: all
  become: true
  # As configure.yml does: with pipelining (.config/molecule/config.yml) the
  # NodeSource repository's deb822_repository is the first module run as root
  # that needs root's remote_tmp, and warned that it made it.
  pre_tasks:
    - name: Make root's Ansible temporary directory
      ansible.builtin.import_tasks: ../../../../playbooks/tasks/remote_tmp.yml
  roles:
    - role: dev_tools
      vars:
        dev_tools_npm_global_packages: [cowsay]
        # Off by default; on here, where the toolchain is installed and checked.
        dev_tools_install_rust: true
        # rust-src is listed without a target, the others with one: the
        # idempotence run fails if either reads as missing.
        dev_tools_rust_components: [clippy, rustfmt, rust-src]
