---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Load role defaults so pinned versions are asserted from one place
      ansible.builtin.include_vars:
        file: ../../defaults/main.yml
        name: dev_tools_verify_defaults

    - name: Check tool versions
      ansible.builtin.command:
        argv: "{{ item.value }}"
      loop: "{{ dev_tools_verify_tools | dict2items }}"
      vars:
        dev_tools_verify_tools:
          node: [node, --version]
          npm: [npm, --version]
          gh: [gh, --version]
          uv: [uv, --version]
          uvx: [uvx, --version]
          docker: [docker, --version]
          pipx: [pipx, --version]
          shellcheck: [shellcheck, --version]
          cowsay: [cowsay, molecule]
      register: dev_tools_verify_run
      changed_when: false
      loop_control:
        label: "{{ item.key }}"

    - name: Index results by tool name
      ansible.builtin.set_fact:
        dev_tools_verify_out: >-
          {{ dict(dev_tools_verify_run.results | map(attribute='item.key')
                  | zip(dev_tools_verify_run.results | map(attribute='stdout'))) }}

    - name: Check Node major and uv version match the role defaults
      ansible.builtin.assert:
        that:
          - dev_tools_verify_out.node is match('^v' ~ dev_tools_verify_defaults.dev_tools_node_major ~ '\\.')
          - dev_tools_verify_out.uv is match('^uv ' ~ dev_tools_verify_defaults.dev_tools_uv_version)
        quiet: true

    - name: Check the Rust toolchain runs for dev
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [rustup, --version]
        - [cargo, --version]
        - [rustc, --version]
        - [cargo, clippy, --version]
        - [rustfmt, --version]
      become: true
      become_user: dev
      changed_when: false

    - name: Check the default toolchain is the role's
      ansible.builtin.command:
        argv: [rustup, default]
      become: true
      become_user: dev
      register: dev_tools_verify_rust_default
      changed_when: false
      failed_when: >-
        dev_tools_verify_rust_default.stdout
        is not match(dev_tools_verify_defaults.dev_tools_rust_toolchain ~ '-')

    # In one login shell that starts before ~/.cargo/bin exists - rustup from
    # Ubuntu's archive does not create it - as when the user runs
    # `cargo install` after logging in.
    - name: Check a program cargo installs after login runs at once
      ansible.builtin.command:
        argv:
          - bash
          - -lc
          - >-
            test ! -e ~/.cargo/bin
            && mkdir -p ~/.cargo/bin
            && printf '#!/bin/sh\necho installed\n' > ~/.cargo/bin/dev-tools-verify-probe
            && chmod +x ~/.cargo/bin/dev-tools-verify-probe
            && dev-tools-verify-probe
        # let the login shell expand ~ and $PATH, not the command module
        expand_argument_vars: false
      become: true
      become_user: dev
      register: dev_tools_verify_cargo_path
      changed_when: false
      failed_when: dev_tools_verify_cargo_path.stdout != 'installed'

    - name: Check dev is in the docker group
      ansible.builtin.command:
        argv: [id, -nG, dev]
      register: dev_tools_verify_groups
      changed_when: false
      failed_when: "'docker' not in dev_tools_verify_groups.stdout.split()"
