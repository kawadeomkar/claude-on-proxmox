---
- name: Wait for the containers to boot
  ansible.builtin.import_playbook: ../../../../tests/molecule/boot_wait.yml

- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create the target user
      ansible.builtin.user:
        name: dev
        shell: /bin/bash

    - name: Install prerequisites normally provided by the common role
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
