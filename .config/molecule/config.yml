---
# Molecule base configuration shared by every scenario (roles/*/molecule/* and
# molecule/*). Scenario molecule.yml files only add what differs.
dependency:
  name: galaxy
  options:
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/requirements.yml"
driver:
  name: docker
platforms:
  - name: instance
    # geerlingguy/docker-ubuntu2404-ansible:latest, pinned by digest.
    image: "${MOLECULE_IMAGE:-geerlingguy/docker-ubuntu2404-ansible@sha256:18bf80157ea24b3210eb25ca89a5460912271b0ee61f238f36d2b115c89e39e6}"
    pre_build_image: true
    command: ""
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: auto_silent
verifier:
  name: ansible
