---
# Everything, in order: build the template if it is missing, create the VMs,
# configure them, sign them in to Claude and GitHub, and open the VM in VS
# Code - so one command ends at a window on the VM with a Claude session
# running and gh signed in.
#
#   just deploy                       -> claude-on-proxmox-default, and only it
#   just deploy alpha,beta    -> alpha and beta, and only them
#
# Each stage is a playbook of its own, imported as is, so deploy is the sum of
# just deploy --only template, --only provision and --only configure, just login and
# just code by construction, and cannot drift from them.
#
# Configuration is limited to the VMs this run provisioned. Other VMs this
# project created are left alone; `just deploy --only configure` with no names
# is the command that reaches the whole fleet.
#
# The sign-ins are the steps only the person can take, each a page in the
# browser: they run one VM at a time, after configuration, and the run waits
# for them - Claude, then GitHub, then Tailscale where no auth key joined the
# VM already - with no question in between (github_login_auto_start,
# tailscale_login_auto_start). A VM whose Claude sign-in nobody answered is
# left out of the other two; a run with no terminal skips them all, as the
# justfile then passes deploy_sign_in: false, which also skips them on purpose.
# Either way the VM is deployed: just login finishes the job later. What a
# sign-in leads to - Remote Control's start, the private repositories - failing
# is raised at the end, after VS Code, and so is a Tailscale failure during
# configuration.
#
# Every stage is idempotent, so this is also the command to re-run after
# changing a variable - not only the one to run first. A second run rebuilds
# nothing: the template play is skipped, the VMs are found by name rather than
# created again, and configuration re-applies only what has drifted.
#
# The template check is made through the Proxmox API rather than on the node,
# and playbooks/template.yml gathers no facts, so a run that does not need to
# build the template opens no SSH connection to the Proxmox host at all. Only
# the first run - the one that actually builds it - needs root SSH.
- name: Check whether the cloud-init template already exists
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox: "{{ proxmox_api_module_defaults }}"

  tasks:
    # By name, so that only the node holding the template is asked for its VM
    # list. Unfiltered, proxmox_vm_info asks every node that owns any VM, and
    # one node that is down failed the run before anything was built.
    - name: Look up the template by name
      community.proxmox.proxmox_vm_info: # noqa: args[module] - api_* come from module_defaults
        type: qemu
        name: "{{ proxmox_template_name }}"
      register: claude_deploy_template
      changed_when: false

    # `template` is 1 on a template and absent or 0 otherwise, so map it with a
    # default rather than assuming the key is there - a VM that merely shares
    # the template's name is not a built template.
    - name: Record whether the template is already built
      ansible.builtin.set_fact:
        claude_template_exists: >-
          {{ (claude_deploy_template.proxmox_vms
              | selectattr('name', 'equalto', proxmox_template_name)
              | map(attribute='template', default=0)
              | select | list | length) > 0 }}

    # The clone is sent to proxmox_node, and Proxmox reads the template's
    # configuration on the node it is sent to, so a template on any other
    # node fails every clone with "configuration file does not exist" - right
    # after this play said the template was built. Said here instead, with
    # both nodes named (docs/getting-started/requirements.md).
    - name: Fail when the template is on another node
      vars:
        claude_template_node: >-
          {{ claude_deploy_template.proxmox_vms
             | selectattr('name', 'equalto', proxmox_template_name)
             | selectattr('template', 'defined') | selectattr('template', 'truthy')
             | map(attribute='node') | first | default(proxmox_node) }}
      ansible.builtin.assert:
        that: claude_template_node == proxmox_node
        fail_msg: >-
          Template "{{ proxmox_template_name }}" is on node {{ claude_template_node }}, but
          proxmox_node is {{ proxmox_node }}, and a VM can only be cloned on the node that
          holds its template. Set proxmox_node to {{ claude_template_node }} in local.yml, or
          build a template on {{ proxmox_node }} with its own proxmox_template_vmid and
          proxmox_template_name.
        quiet: true
      when: claude_template_exists | bool

    # Said up front, because the run stops for the person after the minutes of
    # configuration, and a prompt left waiting long enough has a sign-in page
    # behind it that expires. Built in vars, so the message is one line; named
    # apart from the lookup's register, which would outrank a task var.
    - name: Report what this run will do
      vars:
        claude_deploy_template_said: >-
          {{ 'Template "' ~ proxmox_template_name ~ '" is already built, so this run needs no SSH to the Proxmox host.'
             if claude_template_exists | bool
             else 'Template "' ~ proxmox_template_name ~ '" does not exist yet; building it first, over SSH as root@'
                  ~ (groups['proxmox'][0] | default('the proxmox host')) ~ '.' }}
        claude_deploy_vms: >-
          {{ (claude_vm_names[:-1] | join(', ') ~ ' and ' ~ claude_vm_names[-1]) if claude_vm_names | length > 1
             else claude_vm_names | join }}
        # The sign-ins that open a page in the browser, by the rules each role
        # decides by: Claude's where no API key takes the place of a login
        # (claude_code's login.yml), GitHub's where gh is signed in by the device
        # flow (github_projects_web_wanted), Tailscale's where no auth key joins
        # the VM during configuration (tailscale_auth_method).
        claude_deploy_pages: >-
          {{ (['Claude'] if (anthropic_api_key | default('', true) | length) == 0 else [])
             + (['GitHub'] if github_auth | default(true) | bool
                             and (github_auth_method | default('auto') == 'web'
                                  or github_auth_method | default('auto') == 'auto'
                                     and (github_token | default('', true) | length) == 0) else [])
             + (['Tailscale'] if tailscale_enabled | default(true) | bool
                                and (tailscale_auth_method | default('auto') == 'web'
                                     or tailscale_auth_method | default('auto') == 'auto'
                                        and (tailscale_auth_key | default('', true) | length) == 0) else [])
             if deploy_sign_in | bool else [] }}
        claude_deploy_sign_ins: >-
          {{ (', then signing in to '
              ~ ((claude_deploy_pages[:-1] | join(', ') ~ ' and ' ~ claude_deploy_pages[-1]) if claude_deploy_pages | length > 1
                 else claude_deploy_pages | join))
             if claude_deploy_pages | length > 0 else '' }}
        claude_deploy_window: >-
          {{ (', and opening VS Code on ' ~ claude_vm_names[0]) if deploy_code | bool and claude_vm_names | length == 1 else '' }}
        claude_deploy_wait: >-
          {{ ('' if claude_deploy_pages | length == 0
              else ' Each sign-in' if (claude_deploy_pages | length) * (claude_vm_names | length) > 1
              else ' The sign-in')
             ~ (' opens a page in your browser, and the run waits for you there.' if claude_deploy_pages | length > 0 else '') }}
      ansible.builtin.debug:
        msg: >-
          {{ claude_deploy_template_said }} Then provisioning and configuring {{ claude_deploy_vms }}, which takes
          several minutes{{ claude_deploy_sign_ins }}{{ claude_deploy_window }}.{{ claude_deploy_wait }}

- name: Build the cloud-init VM template
  ansible.builtin.import_playbook: playbooks/template.yml
  when: not (hostvars['localhost'].claude_template_exists | default(false)) | bool

- name: Provision VMs on Proxmox
  ansible.builtin.import_playbook: playbooks/provision.yml

# Provisioning has just put every requested VM that came up into claude_vms,
# with its address, so discovery would only repeat that work - one API call
# per VM, in sequence. Worse, discovery without vm_name means the whole fleet,
# so a bare `just deploy` would configure every tagged VM rather than the
# default one it was asked for. Turning it off here configures exactly what
# was provisioned, and a VM left stopped or failed is simply not in the group.
- name: Configure VMs
  ansible.builtin.import_playbook: playbooks/configure.yml
  vars:
    claude_vm_discovery: false
    # The sign-ins come next in this run, so configuration says so rather than
    # name just login.
    claude_code_sign_in_follows: "{{ deploy_sign_in }}"
    github_projects_sign_in_follows: "{{ deploy_sign_in }}"
    tailscale_sign_in_follows: "{{ deploy_sign_in }}"
    # A Tailscale failure is raised by this playbook's last play, after the
    # sign-ins and VS Code, rather than by configure's own.
    claude_vm_configure_in_deploy: true

# The VMs configuration reached, as for configure: a VM left stopped or whose
# configuration failed is not in the group. A sign-in that fails is said and
# left for just login, rather than ending the run.
- name: Sign Claude Code in on each VM, and start Remote Control
  ansible.builtin.import_playbook: playbooks/claude_login.yml
  vars:
    claude_vm_discovery: false
    claude_vm_login_interactive: true
    claude_vm_login_in_deploy: true
  when: deploy_sign_in | bool

# VM by VM, since this flow waits up to fifteen minutes for a browser. With
# github_login_auto_start, the default, it starts by itself for every VM but
# one whose Claude sign-in was skipped, which nobody was there to answer. Off,
# every VM but that one is asked first, as GitHub can then be left for later:
# Enter signs in one whose Claude sign-in was answered, and "y" any other (a VM
# already signed in to Claude, or on an API key). A run with no terminal gets
# here with deploy_sign_in false: the justfile passes it, as nobody can approve
# a page then. A token in the vault signed gh in during configuration already.
- name: Sign gh in on each VM, and clone its private repositories
  ansible.builtin.import_playbook: playbooks/github_login.yml
  vars:
    claude_vm_discovery: false
    claude_vm_login_interactive: >-
      {{ not (claude_code_login_skipped | default(false)) if github_login_auto_start | default(true) | bool
         else claude_code_login_answered | default(false) }}
    claude_vm_login_ask: >-
      {{ not (github_login_auto_start | default(true) | bool) and not (claude_code_login_skipped | default(false)) }}
    claude_vm_login_in_deploy: true
  when: deploy_sign_in | bool

# VM by VM, after GitHub's: Tailscale's web login waits up to
# tailscale_login_timeout for a browser, and starts by itself or is asked about
# as GitHub's sign-in is, by tailscale_login_auto_start. Where an auth key
# joined the VM during configuration, this only reports. Off with
# tailscale_enabled: false.
- name: Sign each VM in to Tailscale
  ansible.builtin.import_playbook: playbooks/tailscale_login.yml
  vars:
    claude_vm_discovery: false
    claude_vm_login_interactive: >-
      {{ not (claude_code_login_skipped | default(false)) if tailscale_login_auto_start | default(true) | bool
         else claude_code_login_answered | default(false) }}
    claude_vm_login_ask: >-
      {{ not (tailscale_login_auto_start | default(true) | bool) and not (claude_code_login_skipped | default(false)) }}
    claude_vm_login_in_deploy: true
  when: deploy_sign_in | bool and tailscale_enabled | default(true) | bool

# just code, for the one VM this run was for: an alias that follows the VM,
# then a VS Code window whose terminal starts claude. A fleet is not opened
# window by window: code.yml ends at once with each VM's just code line.
- name: Open the VM in VS Code
  ansible.builtin.import_playbook: playbooks/code.yml
  vars:
    code_in_deploy: true
  when: deploy_code | bool

# What a sign-in leads to - Remote Control's start, the private repositories'
# clones - is not a sign-in: when it failed, the deploy is not done, and says
# so here, at its end, after VS Code has opened, with the command that retries
# it. Tailscale, configured last and optional, fails the same way. A sign-in
# that failed or was skipped was said where it happened.
- name: Fail each VM whose work after a sign-in failed
  hosts: claude_vms
  gather_facts: false

  tasks:
    - name: Fail where the work after a sign-in failed
      ansible.builtin.fail:
        msg: "{{ claude_vm_configure_failures | join(' ') }}"
      when: claude_vm_configure_failures | default([]) | length > 0
