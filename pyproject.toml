# The Python tooling for developing and testing this project, managed with uv. Edit the pins here,
# never uv.lock, then run `make install TYPE=lock`: the lock pins every package these pull in as well, with
# hashes, and `make install` installs exactly what it lists into your virtualenv for the project.

[project]
name = "claude-on-proxmox"
# The [project] table requires one; nothing is built or published, so it never changes.
version = "0"
description = "The controller's Python for the playbooks, and the linters and tests that check them."
# The pinned ansible-core's controller range.
requires-python = ">=3.12"
# What the playbooks need on the controller.
dependencies = [
    "ansible-core==2.21.5",
    # Required on the controller by the community.proxmox collection
    "proxmoxer==2.3.0",
    "requests==2.34.2",
]

[dependency-groups]
# The linters, the tests and the git hooks: make lint, unit, molecule and init. uv installs this
# group by default.
dev = [
    "ansible-lint==26.9.0",
    "molecule==26.9.0",
    "molecule-plugins[docker]==26.9.28",
    # Required by the Docker driver for Molecule
    "docker==7.2.0",
    "yamllint==1.38.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.17.0",
    # The uv CI runs: .github/actions/setup installs the version uv.lock pins, so Dependabot
    # bumps it with everything else.
    "uv==0.13.4",
]
# The wiki in docs/: docsible renders each role's reference page - its variables, tasks and a
# flowchart of each task file - with tools/templates/role.md.j2 (make docs), and Zensical builds the
# pages into a site (make docs TYPE=serve; the docs tests build it strictly, failing on a broken link).
# Zensical 0.0.70 is the first with exclude_docs, which zensical.toml uses. Markdown and
# pymdown-extensions render the site and make its heading anchors, which must stay the ones GitHub
# makes; markdown-it-py renders the pages as GitHub does for the test that compares the two.
# Dependabot groups all five.
docs = [
    "docsible==0.8.0",
    "zensical==0.0.70",
    "Markdown==3.11",
    "pymdown-extensions==12.2",
    "markdown-it-py==4.2.0",
]

[tool.uv]
# Not a Python package: uv installs the dependencies and never builds this project.
package = false
# make install installs the docs group too: make docs and the unit tests use it.
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# The test modules share tests/unit/harness.py, imported by name in any import mode.
pythonpath = ["tests/unit"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
# Module code runs on the managed VM's Python (Ubuntu jammy ships 3.10), not
# the controller's (3.12+ for the pinned ansible-core).
target-version = "py310"
extend-exclude = [".venv", ".ansible", ".cache", ".vagrant"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Ansible modules must keep the module-level DOCUMENTATION/EXAMPLES/RETURN strings
# and import AnsibleModule after them.
ignore = ["E402"]
